model:
  block: single_stream
  dual_depth: 8
  final_block_text: keep
  hidden_size: 2560
  depth: 24
  num_heads: 20
  num_kv_heads: 5
  gated_attention: true
  sandwich_norm: true
  patch_size: 16
  in_channels: 3
  mlp_ratio: 4.0
  qkv_bias: false
  qk_norm: true
  norm_eps: 1.0e-06
  attn_backend: sdpa
  modulation: shared_bias
  modulation_rank: 64
  timestep_max_period: 10.0
  adaln_zero_init: true
  rope_theta: 10000.0
  rope_scale: 16.0
  rope_aspect: isotropic
  rope_frame_pairs: 0
  rope_frame_theta: 10.0
  text_rope: true
  text_rope_theta: 10000.0
  text_abs_pos_embed: true
  text_dim: 2560
  text_len: 300
  text_adapter: lap_blocks2
  text_lap_num_layers: 12
  text_lap_num_heads: 32
  text_lap_mlp_ratio: 1.3
  repa_layer: 10
  pixel:
    enabled: true
    depth: 4
    hidden_size: 16
    attn_hidden_size: 1280
    num_heads: 10
    mlp_ratio: 4.0
    modulation: post
    abs_pos_embed: true
text_encoder:
  name: qwen3_vl
  pretrained: Qwen/Qwen3-VL-4B-Instruct
  dim: 2560
  max_length: 300
  dtype: bfloat16
  attn_implementation: sdpa
  hidden_layers:
  - 2
  - 5
  - 8
  - 11
  - 14
  - 17
  - 20
  - 23
  - 26
  - 29
  - 32
  - 35
  compile: false
  on_caption_overflow: warn
flow:
  num_train_timesteps: 1000
  shift: 4.0
  timestep_sampler: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  prediction: v
  x_pred_sigma_min: 0.05
  shift_law: none
  shift_base_tokens: 256
task:
  name: depth
