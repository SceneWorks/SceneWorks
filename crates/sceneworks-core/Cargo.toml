[package]
name = "sceneworks-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
directories = "5"
fs2 = "0.4"
# sc-19708: exact-file requirement selection matches receipt files against the manifest's
# declared download patterns with the same glob semantics the API install path uses.
glob = "0.3"
getrandom = "0.3"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
mime_guess = "2.0"
url = "2.5"
# sc-6531 (Dataset Doctor): read image dimensions from the header without a full decode.
# `imagesize` reads dataset dimensions without decoding.
imagesize = "0.13"
# Indexed video posters are served as image/jpeg, so indexing fully decodes the
# bounded payload instead of trusting the sibling `.poster.jpg` filename. Only the
# pure-Rust JPEG codec is used here; the feature set is the workspace union (sc-15052)
# because Cargo unifies it anyway — this crate never got a jpeg-only `image` in a real
# build. The union's `default-features = false` also keeps `avif` off, and with it the
# nasm-dependent encoder chain that would break the Windows candle lane.
image = { workspace = true }
# sc-15947: the PNG iTXt workflow chunk. `image` has no text-chunk API, so `workflow_png` encodes
# through `png` directly and reads back through its bounded text decompressor. Same crate `image`
# already uses for PNG — inherited from the workspace so it cannot resolve to a second copy.
png = { workspace = true }
# sc-6531: SHA-256 of stored bytes = exact-duplicate key + the cache key for Tier-1
# embeddings (epic 6529 §6.3). Pinned to the workspace's existing 0.10 line (worker + desktop)
# so no new locked version appears.
sha2 = "0.10"
subtle = "2.6"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Purge sends asset media/sidecars to the OS trash (recoverable) instead of unlinking.
trash = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Safe NtCreateFile-backed relative operations prevent Windows junction/reparse TOCTOU escapes.
fs_at = "0.2.1"
# Deletes children through already-open Windows handles rather than a racy recursive path walk.
remove_dir_all = "=0.8.4"
# Safe wrapper around GetFileInformationByHandle. The recent-project registry
# cache uses volume + file index to distinguish atomic replacement.
winapi-util = "0.1"

[target.'cfg(all(target_arch = "aarch64", target_vendor = "apple"))'.dependencies]
# ARMv8 SHA-2 instructions for the resolved-cache closure verify (sc-21534's load boundary).
# Without `asm`, sha2 0.10's aarch64 backend is not compiled in at all and every hash runs the
# portable software compressor. Measured on one 6.0 GB Krea shard on an Apple Silicon host:
# 0.54 GB/s soft vs 2.97 GB/s with `asm` — same digest, 5.2x. On a 33 GB bundle that is the
# difference between a ~60 s verify and a ~11 s one.
#
# Target-gated, and deliberately narrow. The feature pulls in `sha2-asm`, whose build script
# hands GNU-syntax `.S` files to `cc` with `-c`; under MSVC that is `cl.exe`, which assembles
# neither, so enabling this workspace-wide would break the Windows candle lane at link time
# rather than in review. `aarch64-apple` is exactly where the hot path runs (the MLX worker's
# resolved cache) and exactly where the in-crate intrinsics backend is selected.
#
# Cargo unifies features across the graph per target, so this single declaration is what every
# member that hashes (worker, desktop, api, memory-adapter) compiles against on this target —
# the same union hazard `image` is hoisted to `[workspace.dependencies]` for. It cannot be
# hoisted the same way because `[workspace.dependencies]` entries carry no target cfg.
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Descriptor-relative filesystem operations keep resolved-cache staging publication and cleanup
# confined even when a managed path is concurrently replaced.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# sc-20635: the checkpoint plan store's cross-process lock is an `fs2` advisory file lock, and the
# integration test stands in for the other process by taking the SAME lock on its own descriptor.
fs2 = "0.4"
jsonschema = "0.28"
# sc-11043: the managed-variant suite pins a fixture checkpoint's own SHA-256 into a variant so the
# pinned-checksum verification path runs for real. Same 0.10 line the crate already depends on, so
# no new locked version appears.
sha2 = "0.10"
tempfile = "3.13"

[lints]
workspace = true
