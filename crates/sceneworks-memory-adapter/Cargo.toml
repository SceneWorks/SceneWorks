[package]
name = "sceneworks-memory-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
mlx-gen = { git = "https://github.com/SceneWorks/inference", rev = "da57f59cf10f8d95f90d67dcfa2e0d6dc76789e3", optional = true }
mlx-rs = { package = "pmetal-mlx-rs", git = "https://github.com/michaeltrefry/mlx-rs", rev = "932beb4e60db44d378ffa1fe648defea59b5cbd0", optional = true }
runtime-macos = { git = "https://github.com/SceneWorks/inference", rev = "da57f59cf10f8d95f90d67dcfa2e0d6dc76789e3", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-gen = { git = "https://github.com/SceneWorks/inference", rev = "da57f59cf10f8d95f90d67dcfa2e0d6dc76789e3", features = ["cuda", "testkit"], optional = true }
runtime-cuda = { git = "https://github.com/SceneWorks/inference", rev = "da57f59cf10f8d95f90d67dcfa2e0d6dc76789e3", optional = true }

[features]
default = []
mlx = ["dep:mlx-gen", "dep:mlx-rs", "dep:runtime-macos"]
candle = ["dep:candle-gen", "dep:runtime-cuda"]

[[bin]]
name = "memory-mlx-adapter"
path = "src/bin/mlx.rs"
required-features = ["mlx"]

[[bin]]
name = "memory-candle-adapter"
path = "src/bin/candle.rs"
required-features = ["candle"]

[lints]
workspace = true
