[package]
name = "sceneworks-memory-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
# SC-18218 development-only pin to inference PR #531. Repin these four MLX dependencies to the
# merged inference revision before the first capture; keeping one revision avoids cross-revision
# gen-core types inside the adapter binary.
mlx-gen = { git = "https://github.com/SceneWorks/inference", rev = "10831e4ca5b8bf780319a8ee7f21427175075448", optional = true }
mlx-gen-flux2 = { git = "https://github.com/SceneWorks/inference", rev = "10831e4ca5b8bf780319a8ee7f21427175075448", optional = true }
mlx-gen-krea = { git = "https://github.com/SceneWorks/inference", rev = "10831e4ca5b8bf780319a8ee7f21427175075448", optional = true }
mlx-rs = { package = "pmetal-mlx-rs", git = "https://github.com/michaeltrefry/mlx-rs", rev = "932beb4e60db44d378ffa1fe648defea59b5cbd0", optional = true }
runtime-macos = { git = "https://github.com/SceneWorks/inference", rev = "10831e4ca5b8bf780319a8ee7f21427175075448", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-gen = { git = "https://github.com/SceneWorks/inference", rev = "10831e4ca5b8bf780319a8ee7f21427175075448", features = ["cuda", "testkit"], optional = true }
runtime-cuda = { git = "https://github.com/SceneWorks/inference", rev = "10831e4ca5b8bf780319a8ee7f21427175075448", optional = true }

[features]
default = []
mlx = ["dep:mlx-gen", "dep:mlx-gen-flux2", "dep:mlx-gen-krea", "dep:mlx-rs", "dep:runtime-macos"]
candle = ["dep:candle-gen", "dep:runtime-cuda"]

[[bin]]
name = "memory-mlx-adapter"
path = "src/bin/mlx.rs"
required-features = ["mlx"]

[[bin]]
name = "memory-candle-adapter"
path = "src/bin/candle.rs"
required-features = ["candle"]

[lints]
workspace = true
