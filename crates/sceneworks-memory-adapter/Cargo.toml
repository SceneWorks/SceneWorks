[package]
name = "sceneworks-memory-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false

[dependencies]
serde_json = "1.0"
# Shared by both lanes: the PuLID identity bundle is named by content digest in every record, and
# sc-22729's InstantID artifact digest is the worker's own sha256 over the ordered artifact paths,
# which BOTH adapters compute. Neither is macOS-only.
sha2 = "0.10"
# sc-22738: the MLX LTX-2.3 arm admits through the worker's OWN projection — the shared floor
# weights arithmetic, the generic activation allowance and the unified-memory reserve are declared
# once in `sceneworks_core::memory_anchor` and read by both the worker's fit gate and this adapter,
# never restated here. (Previously a dev-dependency for the sc-19115 corpus mutation test.)
sceneworks-core = { path = "../sceneworks-core" }
# sc-24217: the Supra2-IMG arms convert the pinned upstream checkpoint into the native bundle the
# engine loads, in a separate adapter process BEFORE the measured one loads anything. The convert
# and its pin contract are gen-core's own backend-neutral `supra2` module (the same code the
# worker's install-time converter calls), so both lanes share one call path in `lib.rs`.
sceneworks-gen-core = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5" }
sceneworks-gen-core-checkpoint = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5" }
sceneworks-gen-core-iris = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5" }
sceneworks-gen-core-flux3 = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5" }
sceneworks-gen-core-memory-wan = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5" }

[target.'cfg(target_os = "macos")'.dependencies]
# Keep every first-party adapter crate on the exact pinned inference revision.
mlx-gen = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }
mlx-gen-flux2 = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }
mlx-gen-krea = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }
mlx-gen-krea-realtime = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }
mlx-gen-ltx = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }
# sc-22738: the Mage arm reads the pinned provider's OWN fit model
# (`mlx_gen_mage::memory::generation_peak_gb`) to build the admission budget that provider requires
# a caller to present, rather than restating the engine's measured anchors in the adapter — the
# same reason sc-22736 added the Wan/SCAIL-2 crates to the candle lane.
mlx-gen-mage = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }
mlx-gen-minimax-h3 = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }
mlx-gen-instantid = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }
mlx-gen-scail2 = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }
mlx-gen-sdxl = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }
mlx-gen-wan = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }
mlx-rs = { package = "pmetal-mlx-rs", git = "https://github.com/michaeltrefry/mlx-rs", rev = "11d0ff7c81e628beaa548e1872db974c10529efe", optional = true }
runtime-macos = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { workspace = true, optional = true }
candle-gen = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", features = ["cuda", "testkit"], optional = true }
# sc-22736: the Wan 2.2 and SCAIL-2 capture arms read these crates' OWN public envelopes
# (`PUBLIC_BUCKETS` / `PUBLIC_FRAMES`) and mint the request receipt admission demands through their
# own `request_evidence_revision`, rather than restating either in the adapter.
candle-gen-scail2 = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", features = ["cuda"], optional = true }
candle-gen-wan = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", features = ["cuda"], optional = true }
# sc-22738: the SDXL family's route revisions are READ from the engine's own `SDXL_ROUTES` rather
# than transcribed into the adapter. The transcription is what broke CUDA run 34272596969 -- the
# sc-22729 repair moved both Illustrious routes and the copies here did not follow, so six cells
# were refused for a drift that did not exist at the pin. Same reasoning as the two crates above.
candle-gen-sdxl = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", features = ["cuda"], optional = true }
runtime-cuda = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
sceneworks-gen-core-testkit = { git = "https://github.com/SceneWorks/inference", rev = "3c52eef46c902d296ce84d77a65e32fe126b32d5" }

[features]
default = []
mlx = ["dep:mlx-gen", "dep:mlx-gen-flux2", "dep:mlx-gen-instantid", "dep:mlx-gen-krea", "dep:mlx-gen-krea-realtime", "dep:mlx-gen-ltx", "dep:mlx-gen-mage", "dep:mlx-gen-minimax-h3", "dep:mlx-gen-scail2", "dep:mlx-gen-sdxl", "dep:mlx-gen-wan", "dep:mlx-rs", "dep:runtime-macos"]
candle = ["dep:candle-gen", "dep:candle-gen-scail2", "dep:candle-gen-sdxl", "dep:candle-gen-wan", "dep:runtime-cuda", "dep:image"]

[[bin]]
name = "memory-mlx-adapter"
path = "src/bin/mlx.rs"
required-features = ["mlx"]

[[bin]]
name = "memory-candle-adapter"
path = "src/bin/candle.rs"
required-features = ["candle"]

[lints]
workspace = true
