[package]
name = "sceneworks-memory-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Keep every first-party adapter crate on the exact pinned inference revision.
mlx-gen = { git = "https://github.com/SceneWorks/inference", rev = "3775a5f80a07a38071c7859f6ac565bcab5d1c7b", optional = true }
mlx-gen-flux2 = { git = "https://github.com/SceneWorks/inference", rev = "3775a5f80a07a38071c7859f6ac565bcab5d1c7b", optional = true }
mlx-gen-krea = { git = "https://github.com/SceneWorks/inference", rev = "3775a5f80a07a38071c7859f6ac565bcab5d1c7b", optional = true }
mlx-gen-ltx = { git = "https://github.com/SceneWorks/inference", rev = "3775a5f80a07a38071c7859f6ac565bcab5d1c7b", optional = true }
mlx-gen-minimax-h3 = { git = "https://github.com/SceneWorks/inference", rev = "3775a5f80a07a38071c7859f6ac565bcab5d1c7b", optional = true }
mlx-gen-sdxl = { git = "https://github.com/SceneWorks/inference", rev = "3775a5f80a07a38071c7859f6ac565bcab5d1c7b", optional = true }
mlx-rs = { package = "pmetal-mlx-rs", git = "https://github.com/michaeltrefry/mlx-rs", rev = "bd8f0e3c757195b17b2c34fae3073ab826fb7bc1", optional = true }
runtime-macos = { git = "https://github.com/SceneWorks/inference", rev = "3775a5f80a07a38071c7859f6ac565bcab5d1c7b", optional = true }
sha2 = "0.10"

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-gen = { git = "https://github.com/SceneWorks/inference", rev = "3775a5f80a07a38071c7859f6ac565bcab5d1c7b", features = ["cuda", "testkit"], optional = true }
runtime-cuda = { git = "https://github.com/SceneWorks/inference", rev = "3775a5f80a07a38071c7859f6ac565bcab5d1c7b", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
sceneworks-gen-core-testkit = { git = "https://github.com/SceneWorks/inference", rev = "3775a5f80a07a38071c7859f6ac565bcab5d1c7b" }

[dev-dependencies]
# The SC-19115 corpus mutation test intentionally executes the production MLX admission-envelope
# currency instead of carrying a test-local copy of its foreign-reserve policy.
sceneworks-core = { path = "../sceneworks-core" }

[features]
default = []
mlx = ["dep:mlx-gen", "dep:mlx-gen-flux2", "dep:mlx-gen-krea", "dep:mlx-gen-ltx", "dep:mlx-gen-minimax-h3", "dep:mlx-gen-sdxl", "dep:mlx-rs", "dep:runtime-macos"]
candle = ["dep:candle-gen", "dep:runtime-cuda"]

[[bin]]
name = "memory-mlx-adapter"
path = "src/bin/mlx.rs"
required-features = ["mlx"]

[[bin]]
name = "memory-candle-adapter"
path = "src/bin/candle.rs"
required-features = ["candle"]

[lints]
workspace = true
