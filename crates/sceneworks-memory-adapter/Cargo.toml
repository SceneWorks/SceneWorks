[package]
name = "sceneworks-memory-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false

[dependencies]
serde_json = { workspace = true }
# Shared by both lanes: the PuLID identity bundle is named by content digest in every record, and
# sc-22729's InstantID artifact digest is the worker's own sha256 over the ordered artifact paths,
# which BOTH adapters compute. Neither is macOS-only.
sha2 = { workspace = true }
# sc-22738: the MLX LTX-2.3 arm admits through the worker's OWN projection — the shared floor
# weights arithmetic, the generic activation allowance and the unified-memory reserve are declared
# once in `sceneworks_core::memory_anchor` and read by both the worker's fit gate and this adapter,
# never restated here. (Previously a dev-dependency for the sc-19115 corpus mutation test.)
sceneworks-core = { path = "../sceneworks-core" }
# sc-24217: the Supra2-IMG arms convert the pinned upstream checkpoint into the native bundle the
# engine loads, in a separate adapter process BEFORE the measured one loads anything. The convert
# and its pin contract are gen-core's own backend-neutral `supra2` module (the same code the
# worker's install-time converter calls), so both lanes share one call path in `lib.rs`.
sceneworks-gen-core = { git = "https://github.com/SceneWorks/inference", rev = "8b7d0b3d1f1acda6f4c087d6faef5a63496769a0" }
sceneworks-gen-core-checkpoint = { git = "https://github.com/SceneWorks/inference", rev = "8b7d0b3d1f1acda6f4c087d6faef5a63496769a0" }
sceneworks-gen-core-iris = { git = "https://github.com/SceneWorks/inference", rev = "8b7d0b3d1f1acda6f4c087d6faef5a63496769a0" }
sceneworks-gen-core-flux3 = { git = "https://github.com/SceneWorks/inference", rev = "8b7d0b3d1f1acda6f4c087d6faef5a63496769a0" }
sceneworks-gen-core-memory-wan = { git = "https://github.com/SceneWorks/inference", rev = "8b7d0b3d1f1acda6f4c087d6faef5a63496769a0" }

[target.'cfg(target_os = "macos")'.dependencies]
# Keep every first-party bundle dependency on the exact pinned inference revision (REG-5).
mlx-rs = { package = "pmetal-mlx-rs", git = "https://github.com/michaeltrefry/mlx-rs", rev = "11d0ff7c81e628beaa548e1872db974c10529efe", optional = true }
runtime-macos = { git = "https://github.com/SceneWorks/inference", rev = "8b7d0b3d1f1acda6f4c087d6faef5a63496769a0", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { workspace = true, optional = true }
runtime-cuda = { git = "https://github.com/SceneWorks/inference", rev = "8b7d0b3d1f1acda6f4c087d6faef5a63496769a0", features = ["testkit"], optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
sceneworks-gen-core-testkit = { git = "https://github.com/SceneWorks/inference", rev = "8b7d0b3d1f1acda6f4c087d6faef5a63496769a0" }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
mlx = ["dep:mlx-rs", "dep:runtime-macos"]
candle = ["dep:runtime-cuda", "dep:image"]

[[bin]]
name = "memory-mlx-adapter"
path = "src/bin/mlx.rs"
required-features = ["mlx"]

[[bin]]
name = "memory-candle-adapter"
path = "src/bin/candle.rs"
required-features = ["candle"]

[lints]
workspace = true
