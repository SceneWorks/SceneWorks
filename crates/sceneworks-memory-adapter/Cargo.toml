[package]
name = "sceneworks-memory-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Keep every first-party adapter crate on the exact pinned inference revision.
mlx-gen = { git = "https://github.com/SceneWorks/inference", rev = "908d05298f2e8d6bd1ad6dcff4358e32994b9d4a", optional = true }
mlx-gen-flux2 = { git = "https://github.com/SceneWorks/inference", rev = "908d05298f2e8d6bd1ad6dcff4358e32994b9d4a", optional = true }
mlx-gen-krea = { git = "https://github.com/SceneWorks/inference", rev = "908d05298f2e8d6bd1ad6dcff4358e32994b9d4a", optional = true }
mlx-gen-sdxl = { git = "https://github.com/SceneWorks/inference", rev = "908d05298f2e8d6bd1ad6dcff4358e32994b9d4a", optional = true }
mlx-rs = { package = "pmetal-mlx-rs", git = "https://github.com/michaeltrefry/mlx-rs", rev = "932beb4e60db44d378ffa1fe648defea59b5cbd0", optional = true }
runtime-macos = { git = "https://github.com/SceneWorks/inference", rev = "908d05298f2e8d6bd1ad6dcff4358e32994b9d4a", optional = true }
sha2 = "0.10"

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-gen = { git = "https://github.com/SceneWorks/inference", rev = "908d05298f2e8d6bd1ad6dcff4358e32994b9d4a", features = ["cuda", "testkit"], optional = true }
runtime-cuda = { git = "https://github.com/SceneWorks/inference", rev = "908d05298f2e8d6bd1ad6dcff4358e32994b9d4a", optional = true }

[features]
default = []
mlx = ["dep:mlx-gen", "dep:mlx-gen-flux2", "dep:mlx-gen-krea", "dep:mlx-gen-sdxl", "dep:mlx-rs", "dep:runtime-macos"]
candle = ["dep:candle-gen", "dep:runtime-cuda"]

[[bin]]
name = "memory-mlx-adapter"
path = "src/bin/mlx.rs"
required-features = ["mlx"]

[[bin]]
name = "memory-candle-adapter"
path = "src/bin/candle.rs"
required-features = ["candle"]

[lints]
workspace = true
