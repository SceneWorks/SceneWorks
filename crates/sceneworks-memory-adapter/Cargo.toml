[package]
name = "sceneworks-memory-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Keep every first-party adapter crate on the exact pinned inference revision.
mlx-gen = { git = "https://github.com/SceneWorks/inference", rev = "8e6497f2f8f915ffe24b104c1b4f1b4dfe9a6b8d", optional = true }
mlx-gen-flux2 = { git = "https://github.com/SceneWorks/inference", rev = "8e6497f2f8f915ffe24b104c1b4f1b4dfe9a6b8d", optional = true }
mlx-gen-krea = { git = "https://github.com/SceneWorks/inference", rev = "8e6497f2f8f915ffe24b104c1b4f1b4dfe9a6b8d", optional = true }
mlx-gen-sdxl = { git = "https://github.com/SceneWorks/inference", rev = "8e6497f2f8f915ffe24b104c1b4f1b4dfe9a6b8d", optional = true }
mlx-rs = { package = "pmetal-mlx-rs", git = "https://github.com/michaeltrefry/mlx-rs", rev = "7151a9b27921c6198fd8dfb493dee21db4dcdfcc", optional = true }
runtime-macos = { git = "https://github.com/SceneWorks/inference", rev = "8e6497f2f8f915ffe24b104c1b4f1b4dfe9a6b8d", optional = true }
sha2 = "0.10"

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-gen = { git = "https://github.com/SceneWorks/inference", rev = "8e6497f2f8f915ffe24b104c1b4f1b4dfe9a6b8d", features = ["cuda", "testkit"], optional = true }
runtime-cuda = { git = "https://github.com/SceneWorks/inference", rev = "8e6497f2f8f915ffe24b104c1b4f1b4dfe9a6b8d", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
sceneworks-gen-core-testkit = { git = "https://github.com/SceneWorks/inference", rev = "8e6497f2f8f915ffe24b104c1b4f1b4dfe9a6b8d" }

[features]
default = []
mlx = ["dep:mlx-gen", "dep:mlx-gen-flux2", "dep:mlx-gen-krea", "dep:mlx-gen-sdxl", "dep:mlx-rs", "dep:runtime-macos"]
candle = ["dep:candle-gen", "dep:runtime-cuda"]

[[bin]]
name = "memory-mlx-adapter"
path = "src/bin/mlx.rs"
required-features = ["mlx"]

[[bin]]
name = "memory-candle-adapter"
path = "src/bin/candle.rs"
required-features = ["candle"]

[lints]
workspace = true
