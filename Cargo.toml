[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "apps/rust-api",
    "apps/rust-worker",
    "crates/sceneworks-core",
    "crates/sceneworks-image-quality",
    "crates/sceneworks-mcp",
    "crates/sceneworks-memory-adapter",
    "crates/sceneworks-worker",
]
# apps/desktop (Tauri) needs platform GUI libs (WebKit/GTK on Linux) and is built
# per-platform via `tauri build` on macOS/Windows — it is NOT shipped on Linux
# (Docker covers Linux). Excluding it from default-members keeps bare cargo and
# the Linux/server CI checks from trying to compile the GUI stack.
default-members = [
    "apps/rust-api",
    "apps/rust-worker",
    "crates/sceneworks-core",
    "crates/sceneworks-image-quality",
    "crates/sceneworks-mcp",
    "crates/sceneworks-worker",
]

[workspace.package]
version = "0.8.7"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"

# Shared logging backbone (observability foundations). `tracing` is the single
# logging facade for every Rust crate; `tracing-subscriber` installs the
# format-adaptive subscriber from `sceneworks_core::observability::init_logging`.
# Pinned once here so all crates resolve the same version and the JSON envelope
# stays consistent across the api / worker / desktop sidecars.
[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Cross-platform "send to the OS trash" (Windows Recycle Bin / macOS Trash / Linux
# XDG trash). Used so deleting a LoRA/model or purging an asset is recoverable from
# the operating system's trash instead of an irreversible unlink. Pinned once here so
# the api (sync helper) and core (project store purge) resolve the same version.
trash = "5"
# Image decode/encode, declared once for the whole workspace (sc-15052). Cargo unifies
# features for a shared dependency across members, so a member's own feature list never
# describes what it compiles with — every member builds against the union below. Unlike
# a version skew this is SILENT: `image` features decide which formats decode, so a crate
# quietly gains a capability it never declared and `cargo test -p <member>` exercises a
# configuration that never ships. sc-15028 was that gap — two transcode tests asserted BMP
# could not decode, green under `-p`, red in the workspace. Declaring it here makes the
# declaration and the union the same object, so the two cannot drift apart.
#
# Keep `default-features = false`: the list below is meant to be exhaustive, and the
# defaults would pull in codecs (and rayon) nobody asked for. Adding a format here adds it
# for every member — that is the point. crates/sceneworks-worker/tests/image_workspace_dep_guard.rs
# fails the build if a member goes back to declaring `image` on its own.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
# PNG text chunks (sc-15947, epic 15945). `image` 0.25's `PngEncoder` exposes no text-chunk API and
# `save_with_format` emits IHDR/IDAT/IEND only, so writing the sanitized workflow envelope INTO a
# generated PNG has to go through `png` directly (`ITXtChunk` + `Writer::write_text_chunk`), and
# reading it back needs the same crate's bounded `ITXtChunk::decompress_text_with_limit` — the one
# decompressor in the graph that refuses a zip bomb instead of allocating it.
#
# This is version ALIGNMENT, not a new dependency tree: `png` is already in the graph as `image`'s
# own PNG codec. Declaring it here once is what keeps it that way. A member pinning its own `png`
# would resolve a SECOND copy, and then the crate that writes the text chunk is not the crate that
# encodes the pixels — a skew that shows up as neither a compile error nor a feature difference,
# only as two encoders in one file format. Keep the requirement in lockstep with whatever `image`
# resolves to; `crates/sceneworks-worker/tests/image_workspace_dep_guard.rs` reads Cargo.lock and
# fails the build when the two diverge or when a member re-declares it.
png = "0.18"
# onnxruntime bindings for the ort-backed CV jobs (pose/person/upscale). Declared once here
# because `sceneworks-worker` needs it under BOTH target cfgs — CoreML on macOS, CUDA off-Mac
# on the candle lane — and that is two declaration sites for one version requirement. Cargo
# resolves `ort` as a single package across the whole graph, so an exact pin updated in one
# site and not the other is not a skew, it is an unsatisfiable resolve: #2092 bumped the macOS
# site to rc.13, left the off-Mac site at rc.12, and every Rust lane died at `cargo fetch
# --locked` before compiling a line. Dependabot handles duplicates in
# `[dependencies]`/`[dev-dependencies]` fine (it did exactly that for `rmcp` in the same PR) —
# it is the target-gated pair it half-applies. One version string here makes that impossible.
#
# Unlike `image` above there is no feature union to pin: the EP features stay at the call sites
# because they are mutually exclusive (a build gets `coreml` xor `cuda`, never both), so they
# cannot silently widen each other. Keep the `=` pin — `ort` is a pre-release and upstream
# treats rc-to-rc as freely breaking; rc.13 removed the deprecated `*ExecutionProvider`
# aliases, a source break that a patch-shaped version bump gives no warning about.
#
# `default-features = false` exists for ONE reason: to hold `api-26` instead of the `api-27` that
# rc.13's defaults carry. `ort`'s api-N features are ADDITIVE, so the default cannot be lowered by
# adding anything — dropping the default set and re-listing it is the only way to select a version.
# Every other default is re-enabled verbatim below, so this is a pure API-version pin, not a
# feature diet. Re-check the upstream `default = [...]` on any rc bump.
#
# Why 26 and not "the newest": `MINOR_VERSION` (= `ort_sys::ORT_API_VERSION`) is the ONNX Runtime
# API version the `load-dynamic` loader demands of the dylib it dlopens — it hard-errors with
# `BadVersion` when the runtime's minor is LOWER. We ship onnxruntime 1.26.0 (the desktop
# provisioners + `stage-onnxruntime.py`, bound to this pin by the `const _: () = assert!(…)` beside
# `PROVISIONED_ONNXRUNTIME_MINOR` in `pose_jobs.rs`), so the ceiling is 26 and matching it exactly
# is the only value that neither rejects our own runtime nor logs a forward-compat warning.
#
# rc.13 arrived via a dependabot group bump (#2092) and silently raised this floor 24 -> 27, which
# is not a compile error anywhere: it fails at RUNTIME, in the user's pose/upscale/person job, as
# "Failed to load ONNX Runtime dylib: BadVersion". Bumping the runtime instead is NOT the escape
# hatch it looks like — onnxruntime-gpu 1.27 moved its CUDA EP to CUDA 13 (`nvidia-*-cu13`), and
# every other DLL the provisioners stage, plus cudarc/candle, is CUDA 12.9. Lifting the floor above
# 26 therefore means migrating the whole GPU runtime to CUDA 13, not swapping one wheel.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    # rc.13's default set, verbatim, EXCEPT `api-27` -> `api-26`.
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-native",
    "copy-dylibs",
    "api-26",
    # …plus the one non-default feature both call sites need.
    "load-dynamic",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Vendored multi-arch CUDA kernel override (sc-7544 / sc-13510). candle-kernels compiles the
# GGUF quant/moe kernels into a static `libmoe.a` of SASS with ONE `-gencode` derived from
# CUDA_COMPUTE_CAP — at the cap=80 packaging baseline that is an Ampere-only cubin with no PTX,
# so on Blackwell (sm_120) every quantized matmul silently returns zeros. The inference repo
# vendors candle-kernels with a multi-arch fatbin build.rs (sm_80 + sm_90 + sm_120 SASS +
# compute_120 PTX; see crates/media/candle-gen/vendor/candle-kernels/VENDORED.md there), but a
# Cargo `[patch]` only takes effect in the TOP-LEVEL workspace — inference's own patch does not
# apply when SceneWorks builds the graph, which is how the sc-7544 fix silently dropped out at
# the candle-gen -> inference cutover. This patch re-applies it for every SceneWorks build.
#
# The rev MUST stay in lockstep with the inference pins in crates/sceneworks-worker/Cargo.toml
# (scripts/bump-inference.mjs rewrites both; crates/sceneworks-worker/tests/
# candle_kernels_patch_guard.rs fails the build if they skew or the patch is dropped).
[patch."https://github.com/huggingface/candle"]
candle-kernels = { git = "https://github.com/SceneWorks/inference", rev = "26f172e7113025c87097350ae181c5c386036edf" }
