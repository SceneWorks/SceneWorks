name: Prepare Rust toolchain on self-hosted runner
description: >
  Make the self-hosted Windows/CUDA runner build against the REAL rustup toolchain
  bin for the repo's PINNED channel (the actual cargo/rustc/clippy binaries + their
  sibling DLLs) instead of the fragile %USERPROFILE%\.cargo\bin rustup proxies, and
  fail loudly with an actionable message if no usable toolchain is installed. See
  sc-13166.

# WHY THIS EXISTS (sc-13166)
# --------------------------
# rustup's Windows proxies in %USERPROFILE%\.cargo\bin (cargo.exe, rustc.exe,
# clippy-driver.exe, ... 13 of them) dispatch to rustup.exe by argv[0]; on this box
# they were observed as 0-byte SYMLINKS (rustup prefers symlinks, but falls back to
# hardlinks where symlinks are unavailable, so do not assume that shape holds
# everywhere). That indirection is a recurring single point of failure with TWO
# distinct failure modes, both of which turn the self-hosted lanes red with a
# cryptic error that reads like a PR-code failure:
#
#   1. DANGLING shim: rustup.exe goes missing; every proxy now points at nothing,
#      so `cargo` dies with the Windows ERROR_NO_ASSOCIATION ("No application is
#      associated with the specified file for this operation"). Seen with
#      rustup.exe entirely absent.
#      WHO DELETES IT — corrected. This used to say "rustup self-updates and
#      Defender (or something) deletes rustup.exe". Both halves were wrong. It is
#      `Swatinem/rust-cache`'s POST step: its cleanBin() removes every regular file
#      in $CARGO_HOME/bin that is not listed in .crates2.json, and rustup is not a
#      `cargo install` product. Harmless on ephemeral runners, destructive on
#      self-hosted ones where CARGO_HOME is a real user profile. Diagnosed on a Mac
#      (inference PR #467) — it is not a Windows or antivirus problem at all.
#      The invariant lives in scripts/lib/rust-cache-bin.mjs, enforced by
#      `npm run check`; that file is the canonical writeup.
#   2. SYMLINK-in-service-context: even when rustup.exe is present, launching a
#      *symlinked* .exe from the runner's Windows-service token throws the same
#      ERROR_NO_ASSOCIATION. An interactive Git Bash follows the symlink fine, so a
#      green interactive `cargo --version` does NOT mean the runner is healthy.
#
# The earlier sc-13166 mitigation (rewrite the proxies as real copies of rustup.exe)
# does not survive the next reinstall of rustup, which recreates the proxies — so the
# lane kept going red "after a while" and forced admin-override merges. (That reinstall
# is dtolnay/rust-toolchain's "install rustup if needed" step quietly repairing what
# rust-cache's post step deleted, which is also why the breakage looked intermittent
# and self-healing rather than like a standing misconfiguration.)
#
# The real toolchain under %USERPROFILE%\.rustup\toolchains\<tc>\bin is immune to
# both modes: those are the REAL cargo/rustc/clippy binaries (not symlinks, not
# rustup proxies), sitting next to the rustc_driver / std DLLs they load. So this
# action resolves that bin dir, verifies its cargo actually launches, and prepends
# it to PATH for the rest of the job. The lane then never dispatches through
# .cargo\bin at all, and neither failure mode can touch it. (We deliberately do NOT
# try to "heal" .cargo\bin by copying the toolchain binaries in: rustc.exe/
# clippy-driver.exe/rustdoc.exe are thin launchers that load rustc_driver-*.dll /
# std-*.dll from their OWN directory, so a copy without those DLLs would break — and
# re-symlinking is the very thing that fails in the service context.)
#
# CARGO_HOME IS NOT RUSTUP'S HOME HERE. Every path this action needs from rustup —
# rustup.exe itself, and the .cargo\bin an interactive shell resolves — hangs off the
# profile that installed rustup, NOT off $env:CARGO_HOME. The runner services pin
# CARGO_HOME to a per-runner dependency cache (D:\cargo-home-N) and windows-candle.yml
# repoints it again at $RUNNER_TEMP\cargo-home; neither has a bin\. Deriving rustup
# from CARGO_HOME silently skipped the authoritative resolution and emitted a
# permanent bogus "rustup was deleted" warning. Keep the two notions separate.
runs:
  using: composite
  steps:
    - name: Select & verify the real Rust toolchain bin (sc-13166)
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'

        # rustup's homes are overridable by env; honor them, else the rustup defaults.
        $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
        $toolchainsDir = Join-Path $rustupHome 'toolchains'

        # WHERE rustup.exe ACTUALLY LIVES — do NOT derive it from $env:CARGO_HOME.
        # rustup drops itself and its 13 proxies into whatever CARGO_HOME was in effect
        # AT INSTALL TIME, i.e. the developer profile. The JOB's CARGO_HOME is a wholly
        # different thing on these runners: each runner service pins it to a per-runner
        # dependency cache (D:\cargo-home-N — registry\, git\, config.toml, and no bin\
        # at all) so four concurrent jobs stop racing one shared checkout (os error 267),
        # and windows-candle.yml repoints it again at $RUNNER_TEMP\cargo-home a few steps
        # later. Resolving rustup under CARGO_HOME therefore probed a directory that has
        # never existed on this box: it silently disabled the authoritative resolution in
        # (1) below — every job has been falling through to the directory scan in (2) —
        # and made the closing .cargo\bin check report "rustup was deleted" on every
        # single run of a box whose rustup is present and healthy.
        $userCargoBin = Join-Path (Join-Path $env:USERPROFILE '.cargo') 'bin'
        $rustupProbe = New-Object System.Collections.Generic.List[string]
        if ($env:CARGO_HOME) { $rustupProbe.Add((Join-Path $env:CARGO_HOME 'bin\rustup.exe')) }
        $rustupProbe.Add((Join-Path $userCargoBin 'rustup.exe'))
        $onPath = Get-Command rustup.exe -CommandType Application -ErrorAction SilentlyContinue
        if ($onPath) { $rustupProbe.Add($onPath.Source) }
        # rustup.exe is a real ~12.8 MB binary. A reparse point or 0-byte file under that
        # name would be a proxy dispatching to nothing, not a usable rustup.
        $rustupExe = $rustupProbe |
          Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
          Where-Object {
            $ri = Get-Item -LiteralPath $_ -Force
            -not ($ri.Attributes -band [IO.FileAttributes]::ReparsePoint) -and $ri.Length -gt 0
          } |
          Select-Object -First 1
        Write-Host "rustup.exe: $(if ($rustupExe) { $rustupExe } else { '<none found>' })"

        # The channel this repo PINS (rust-toolchain.toml at the workspace root). CI must
        # build exactly this toolchain, not whatever the box default happens to be: this box
        # carries several toolchains (a version-pinned default, 'stable', and the repo's
        # pinned version), so resolving the box default would silently build a different
        # rustc/clippy than every other lane and could redden clippy on a lint delta that
        # has nothing to do with the PR. Since sc-17717 the channel is a concrete x.y.z,
        # which names its OWN rustup toolchain dir — a bump must pre-install it on this box
        # (see the bump recipe in rust-toolchain.toml) or the resolution below fails loudly.
        $repoChannel = $null
        if (Test-Path 'rust-toolchain.toml') {
          $cm = Select-String -Path 'rust-toolchain.toml' -Pattern '^\s*channel\s*=\s*"(.+?)"' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($cm) { $repoChannel = $cm.Matches[0].Groups[1].Value }
        }
        Write-Host "Repo-pinned toolchain channel: $repoChannel"

        $binDir = $null

        # 1) Authoritative: ask the real rustup.exe (resolved above). It is a real binary
        #    (NOT one of the fragile proxy symlinks), so it launches under the runner
        #    service token and resolves this repo's rust-toolchain.toml exactly the way an
        #    in-repo cargo would — including a pinned channel the scan in (2) cannot see,
        #    because rustup installs a toolchain-file channel on demand where the scan can
        #    only pick from what is already on disk.
        if ($rustupExe) {
          try {
            $cargoPath = (& $rustupExe which cargo | Out-String).Trim()
            if ($LASTEXITCODE -eq 0 -and $cargoPath -and (Test-Path $cargoPath)) {
              $binDir = Split-Path -Parent $cargoPath
            }
          } catch { }
        }

        # 2) Fallback for the dangling-shim state (rustup.exe itself deleted): resolve by
        #    directory, still honoring the pin — prefer the toolchain matching the pinned
        #    channel, then the recorded default, then the newest installed one. First with a
        #    real cargo.exe wins.
        if (-not $binDir -and (Test-Path $toolchainsDir)) {
          $cands = New-Object System.Collections.Generic.List[string]
          if ($repoChannel) {
            Get-ChildItem $toolchainsDir -Directory |
              Where-Object { $_.Name -eq $repoChannel -or $_.Name -like "$repoChannel-*" } |
              Sort-Object LastWriteTime -Descending |
              ForEach-Object { $cands.Add((Join-Path $_.FullName 'bin')) }
          }
          $settings = Join-Path $rustupHome 'settings.toml'
          if (Test-Path $settings) {
            $dm = Select-String -Path $settings -Pattern '^\s*default_toolchain\s*=\s*"(.+?)"' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($dm) { $cands.Add((Join-Path (Join-Path $toolchainsDir $dm.Matches[0].Groups[1].Value) 'bin')) }
          }
          Get-ChildItem $toolchainsDir -Directory |
            Sort-Object LastWriteTime -Descending |
            ForEach-Object { $cands.Add((Join-Path $_.FullName 'bin')) }
          $binDir = $cands | Where-Object { Test-Path (Join-Path $_ 'cargo.exe') } | Select-Object -First 1
        }

        if (-not $binDir -or -not (Test-Path (Join-Path $binDir 'cargo.exe'))) {
          Write-Host "::error title=Rust toolchain missing on candle runner::No installed rustup toolchain with a real cargo.exe under '$toolchainsDir' (repo pins channel '$repoChannel'). Reinstall Rust on the self-hosted cuda box: run rustup-init (https://win.rustup.rs) then 'rustup toolchain install $repoChannel' (sc-13166)."
          exit 1
        }

        $cargo = Join-Path $binDir 'cargo.exe'
        Write-Host "Real toolchain cargo: $cargo"

        # Verify it launches. This is a REAL binary (not a rustup proxy symlink), so it
        # cannot hit the dangling-shim / symlink-in-service-context ERROR_NO_ASSOCIATION
        # that kills %USERPROFILE%\.cargo\bin\cargo.exe. No `2>&1` on the native call:
        # under Stop, merging a native command's stderr wraps it in a terminating
        # NativeCommandError (PS 5.1) and would flake a healthy run.
        $out = $null
        try {
          $out = (& $cargo --version | Out-String).Trim()
        } catch {
          $why = ($_.Exception.Message -replace '\s+', ' ').Trim()
          Write-Host "::error title=Rust toolchain broken on candle runner::Could not execute '$cargo' ($why). Reinstall the pinned toolchain on the box: 'rustup toolchain install $repoChannel --no-self-update -c rustfmt -c clippy' (sc-13166 / rust-toolchain.toml)."
          exit 1
        }
        if ($LASTEXITCODE -ne 0 -or $out -notmatch '^cargo\s') {
          $outLine = ($out -replace '\s+', ' ').Trim()
          Write-Host "::error title=Rust toolchain broken on candle runner::'$cargo --version' failed (exit=$LASTEXITCODE) output='$outLine'. See sc-13166: reinstall the pinned toolchain."
          exit 1
        }
        # The pin must actually BE what got resolved (sc-17717). Fallback (2) above can
        # select the recorded default or the newest install whenever (1) returns nothing
        # (rustup missing, or a pinned version that is not installed and could not be
        # fetched) - without this check that silently builds a DIFFERENT rustc/clippy
        # than every other lane, the exact drift class the version pin exists to kill.
        if ($repoChannel -match '^\d+\.\d+\.\d+$' -and $out -notmatch [regex]::Escape($repoChannel)) {
          Write-Host "::error title=Wrong Rust toolchain on candle runner::Resolved '$cargo' reports '$out', not the pinned $repoChannel from rust-toolchain.toml. The pinned toolchain is missing on this box or resolution fell back to another install. Fix: 'rustup toolchain install $repoChannel --no-self-update -c rustfmt -c clippy' (see the bump recipe in rust-toolchain.toml)."
          exit 1
        }
        Write-Host "OK: $out"

        # RUSTC_WRAPPER is runner-global on the self-hosted boxes. Treat it as an
        # optional accelerator, not a build prerequisite: if an administrator
        # removes sccache but leaves the environment variable behind, even
        # `cargo fetch` fails before rustc can run. Clear only an unresolvable
        # wrapper and let subsequent steps invoke the verified toolchain directly.
        $rustcWrapper = $env:RUSTC_WRAPPER
        if ($rustcWrapper) {
          if ([IO.Path]::IsPathRooted($rustcWrapper)) {
            $wrapperUsable = Test-Path -LiteralPath $rustcWrapper -PathType Leaf
          } else {
            $wrapperUsable = $null -ne (
              Get-Command $rustcWrapper -CommandType Application -ErrorAction SilentlyContinue
            )
          }
          if (-not $wrapperUsable) {
            Write-Host "::warning title=Missing Rust compiler wrapper::RUSTC_WRAPPER points to '$rustcWrapper', but that executable is unavailable. Clearing it and using the verified rustc directly."
            Add-Content -Path $env:GITHUB_ENV -Value 'RUSTC_WRAPPER='
            Remove-Item Env:RUSTC_WRAPPER -ErrorAction SilentlyContinue
          }
        }

        # Prepend the real toolchain bin so every later step's cargo/rustc/clippy resolves
        # here FIRST, ahead of the fragile .cargo\bin proxies. $GITHUB_PATH prepends, and
        # the entry survives the `call vcvars64.bat` cmd steps (vcvars only appends).
        Add-Content -Path $env:GITHUB_PATH -Value $binDir

        # Informational only (never fatal): surface a GENUINELY broken .cargo\bin so the
        # box's INTERACTIVE cargo (used by dev + sibling sessions) gets repaired too. CI
        # itself is already immune via the PATH prepend above.
        #
        # "Is a 0-byte reparse point" is NOT evidence of breakage: that is rustup's NORMAL
        # Windows proxy layout wherever symlinks are available, and those proxies dispatch
        # fine interactively (`.cargo\bin\cargo.exe --version` prints cargo 1.97.1 on this
        # box, while the old check was calling it broken). Flagging that healthy shape —
        # and flagging a bin-less job CARGO_HOME as "rustup was deleted" — fired this
        # warning on 100% of runs and trained everyone to scroll past it. The one state
        # worth reporting is failure mode 1 from the header: the DANGLING shim, where the
        # rustup.exe all 13 proxies reach by argv[0] is gone and every one of them dies
        # with ERROR_NO_ASSOCIATION. Keyed off the profile .cargo\bin, which is what an
        # interactive shell resolves — never off the job's CARGO_HOME.
        $ErrorActionPreference = 'Continue'
        if (Test-Path -LiteralPath $userCargoBin -PathType Container) {
          $profileRustup = Join-Path $userCargoBin 'rustup.exe'
          $rustupIntact = $false
          if (Test-Path -LiteralPath $profileRustup -PathType Leaf) {
            $ru = Get-Item -LiteralPath $profileRustup -Force
            $rustupIntact = -not ($ru.Attributes -band [IO.FileAttributes]::ReparsePoint) -and $ru.Length -gt 0
          }
          if (-not $rustupIntact) {
            # ASCII ONLY in this string, as in every other message this action emits.
            # An em dash is UTF-8 E2 80 94; if the script is ever decoded as CP1252 the
            # trailing 0x94 becomes U+201D, which PowerShell accepts as a STRING
            # DELIMITER and the whole step dies on a parse error. Comments survive that
            # mangling (rest of line ignored); quoted message strings do not.
            Write-Host "::warning title=Dangling .cargo\bin proxies on candle runner::'$profileRustup' is missing or empty, so every rustup proxy in '$userCargoBin' dispatches to nothing and dies with ERROR_NO_ASSOCIATION. This CI lane is unaffected (it uses '$binDir'), but interactive 'cargo' on the box is broken until rustup is reinstalled (https://win.rustup.rs). First confirm no workflow runs Swatinem/rust-cache with cache-bin enabled: its post step is what deletes rustup here (scripts/lib/rust-cache-bin.mjs, sc-13166)."
          }
        }
        exit 0
