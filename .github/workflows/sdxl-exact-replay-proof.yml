name: SDXL same-device exact replay witness
# Real weights only in an explicit owner-approved window. Never push, PR or reusable CI.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Qualify two fresh jobs, or test a separately reviewed deterministic candidate
        required: true
        type: choice
        options: [qualify, replay]
      plan_path:
        description: Absolute runner-local private plan prepared and reviewed before the owner go window
        required: true
        type: string
      device_uuid:
        description: Exact owner-approved physical NVIDIA UUID; no fallback
        required: true
        type: string
      owner_go:
        description: Owner explicitly approved this Windows real-model window (plan also has an expiry)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  witness:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_go }}
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: 180
    concurrency:
      group: sdxl-exact-replay-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    env:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${{ inputs.device_uuid }}
      CUDA_COMPUTE_CAP: '120'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      SDXL_REPLAY_PLAN: ${{ inputs.plan_path }}
      SDXL_REPLAY_PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-rust-runner
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Select task-owned evidence paths
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP "sdxl-exact-replay-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $resource = Join-Path $env:RUNNER_TEMP "sceneworks-cuda-execution-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-sdxl-exact-replay\resource-receipt.json"
          Add-Content -Path $env:GITHUB_ENV -Value "SDXL_REPLAY_OUTPUT=$output"
          Add-Content -Path $env:GITHUB_ENV -Value "SDXL_REPLAY_RESOURCE_RECEIPT=$resource"
      - name: Metadata-only harness regressions
        run: node --test scripts/ci/sdxl-exact-replay-proof.test.mjs
      - name: Validate the private plan before building
        run: node scripts/ci/sdxl-exact-replay-proof.mjs preflight
      - name: Select isolated persistent Cargo cache
        shell: powershell
        run: |
          node scripts/select-windows-cargo-cache.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Cargo cache selection failed' }
          Add-Content -Path $env:GITHUB_ENV -Value 'RUSTC_WRAPPER='
      - name: Build the pinned native API and worker without executing models
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo build --locked --release -p sceneworks-rust-api --no-default-features --features backend-candle
          if errorlevel 1 exit /b 1
      - name: Run only under the existing physical UUID lease and owned Windows Job
        shell: powershell
        run: |
          $env:SDXL_REPLAY_BINARY = Join-Path $env:CARGO_TARGET_DIR 'release\sceneworks-rust-api.exe'
          python -I scripts/ci/windows_cuda_execution.py --actor sdxl-exact-replay --budget-minutes 120 --cuda-ordinals 0 -- node scripts/ci/sdxl-exact-replay-proof.mjs
          if ($LASTEXITCODE -ne 0) { throw 'SDXL witness or physical drain refused' }
      - name: Require physical cleanup before accepting evidence
        if: ${{ always() }}
        run: node scripts/ci/sdxl-exact-replay-proof.mjs finalize
      - name: Upload only bounded public hashes and identities
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdxl-exact-replay-${{ inputs.phase }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SDXL_REPLAY_OUTPUT }}/evidence.json
          if-no-files-found: error
