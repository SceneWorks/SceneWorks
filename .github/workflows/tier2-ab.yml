# SW-7033 (feature SW-F348): Tier 2 base/head A/B over the production API/worker path.
#
# Called ONLY by memory-catalog-campaign.yml (workflow_dispatch, profile `tier2-ab`). This file has
# no dispatch, push, pull_request, schedule or merge trigger, so no ordinary CI event can reach it.
# One job per backend checks out the dispatched driver plus the two exact SHAs into separate
# directories, builds the release API/worker of each into one shared scratch target, then runs
# scripts/tier2-ab.mjs: base#1, head, and (only when head differs) base#2 per route, against the
# same read-only model hub on the same runner. It writes JSON + Markdown evidence as an artifact.
# The DEC-7 stop rule, skip-with-reason for absent weights, watchdogs and decoded-content
# comparison live in the driver. The original suite uses read-only hubs. The opt-in Krea suite
# stages its fixed public assets into a separate attempt-owned hub before building. Windows Krea
# lets the dev-host post action remove build and runtime storage after evidence publication.
#
# No secrets are declared or passed: base and head are operator-chosen commits (restricted by the
# selector's trusted-ref rule), and their builds and processes receive no credential.
#
# CI_IMPACT: manual only. Ordinary CI runs only scripts/tier2-ab.test.mjs (pure functions and
# static workflow contracts) through `npm run check`.
name: Tier 2 A/B (base vs head)

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      backend:
        description: "mlx (nax-macos-2 via rw-mage) or cuda (Windows real-weights listener, physical GPU1)"
        required: true
        type: string
      suite:
        description: "Empty for the original Tier 2 A/B, or krea-scoped-acceptance for SW-F336"
        required: false
        type: string
        default: ""
      krea_performance:
        description: "Opt in to the separate six-pair Krea performance comparison"
        required: false
        type: boolean
        default: false
      krea_allocation:
        description: "Opt in to one candidate-only linked Krea allocation witness, Candle only"
        required: false
        type: boolean
        default: false
      routes:
        description: "JSON array of route ids; empty selects the backend's default routes"
        required: false
        type: string
        default: ""
      hubs:
        description: "JSON array of read-only hub roots tried in order; empty selects the backend defaults"
        required: false
        type: string
        default: ""
      inference_sha:
        description: "Optional common pin cross-check for A/B, or required exact candidate pin for Krea"
        required: false
        type: string
        default: ""
      preflight_only:
        description: "Validate inputs, checkouts, pins, tools and hub presence without building or loading a model"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  mlx:
    if: ${{ inputs.backend == 'mlx' }}
    # rw-mage isolates nax-macos-2. Never `nax`, `weights`, `real-weights` or `rw-starvector`:
    # those also match the owner's desktop Mac.
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    # Two release builds (the second reuses the first's dependency units) plus at most three cold
    # runs per route; each run has its own driver timeout. This is a wedge ceiling.
    timeout-minutes: 600
    concurrency:
      group: tier2-ab-mlx-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      TIER2_AB_BACKEND: mlx
      TIER2_AB_BASE_SHA: ${{ inputs.base_sha }}
      TIER2_AB_HEAD_SHA: ${{ inputs.head_sha }}
      TIER2_AB_BASE_DIR: ${{ github.workspace }}/tier2-ab-base
      TIER2_AB_HEAD_DIR: ${{ github.workspace }}/tier2-ab-head
      TIER2_AB_SUITE: ${{ inputs.suite }}
      TIER2_AB_KREA_PERFORMANCE: ${{ inputs.krea_performance }}
      TIER2_AB_KREA_ALLOCATION: ${{ inputs.krea_allocation }}
      TIER2_AB_ROUTES: ${{ inputs.routes }}
      TIER2_AB_HUBS: ${{ inputs.hubs }}
      TIER2_AB_INFERENCE_SHA: ${{ inputs.inference_sha }}
      # Same reason as the other release MLX producers on these Macs (iris, qwen/flux app proofs).
      CARGO_PROFILE_RELEASE_STRIP: none
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Set attempt-owned scratch directory
        run: echo "TIER2_AB_WORK=$RUNNER_TEMP/t2ab-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Check out the dispatched driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tier2-ab-driver
          fetch-depth: 1
          persist-credentials: false
      - name: Check out base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          path: tier2-ab-base
          fetch-depth: 1
          persist-credentials: false
      - name: Check out head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          path: tier2-ab-head
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the four reviewed Krea baseline repair files
        if: ${{ inputs.suite == 'krea-scoped-acceptance' && !inputs.krea_allocation }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5b2c605c9371f7ecdf11dcbd6e76ac5e3d52d957
          path: tier2-ab-krea-repair
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/rust-api/src/portable_admission.rs
            /apps/rust-api/src/portable_routes.rs
            /crates/sceneworks-core/src/model_artifacts/artifact_selection.rs
            /crates/sceneworks-worker/src/external_library_runtime.rs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Preflight (inputs, checkouts, pins, tools, hub presence; no build, no model)
        run: node tier2-ab-driver/scripts/tier2-ab.mjs --preflight-only
      - name: Stage and verify the allowlisted Krea assets into attempt-owned scratch
        if: ${{ inputs.suite == 'krea-scoped-acceptance' && !inputs.preflight_only }}
        run: node tier2-ab-driver/scripts/tier2-ab.mjs --stage-krea
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        if: ${{ !inputs.preflight_only }}
        with:
          toolchain: "1.98.0"
      - name: Fetch Release libmlx for the pinned mlx-rs (or fall back to its source build)
        if: ${{ !inputs.preflight_only }}
        working-directory: tier2-ab-head
        run: |
          set +e
          scripts/fetch-prebuilt-mlx.sh --build-type Release --github-env
          rc=$?
          set -e
          if [ "$rc" = 1 ]; then
            echo "PMETAL_MLX_PREBUILT_DIR=" >> "$GITHUB_ENV"
            echo "PMETAL_METALLIB_PATH=" >> "$GITHUB_ENV"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: Build base then head release API/worker into one shared scratch target
        if: ${{ !inputs.preflight_only }}
        run: node tier2-ab-driver/scripts/tier2-ab.mjs --build-only
      - name: Run base#1, head and (if needed) base#2 per route under the shared Metal lock
        if: ${{ !inputs.preflight_only }}
        run: |
          echo "[tier2-ab] $(date -u +%Y-%m-%dT%H:%M:%SZ) phase=waiting_for_metal_lock wait_s=7200"
          source tier2-ab-driver/scripts/ci/metal_execution_entry.sh
          metal_execution_entry 7200 node tier2-ab-driver/scripts/tier2-ab.mjs --run
      - name: Retain the A/B evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier2-ab-mlx-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TIER2_AB_WORK }}/evidence/
          if-no-files-found: warn
          retention-days: 30
      # Head writes read-only attempt bundles under the run's own state dir. The driver restores
      # owner write permission inside the scratch roots only (never following a link, never a hub
      # root) before removing them; the driver checkout goes last.
      - name: Remove every scratch directory
        if: ${{ always() }}
        run: |
          status=0
          if [ -f tier2-ab-driver/scripts/tier2-ab.mjs ]; then node tier2-ab-driver/scripts/tier2-ab.mjs --cleanup || status=$?; fi
          rm -rf -- "$GITHUB_WORKSPACE/tier2-ab-driver"
          exit "$status"

  cuda:
    if: ${{ inputs.backend == 'cuda' }}
    # Only the first two Windows listeners carry real-weights; all four share one physical box.
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: 720
    concurrency:
      # Distinct pending requests stay queued. Physical exclusion is the exact-UUID lease taken by
      # windows_cuda_execution.py around the model-running step, as in the other CUDA lanes.
      group: tier2-ab-cuda-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    env:
      TIER2_AB_BACKEND: cuda
      TIER2_AB_BASE_SHA: ${{ inputs.base_sha }}
      TIER2_AB_HEAD_SHA: ${{ inputs.head_sha }}
      TIER2_AB_BASE_DIR: ${{ github.workspace }}\tier2-ab-base
      TIER2_AB_HEAD_DIR: ${{ github.workspace }}\tier2-ab-head
      TIER2_AB_SUITE: ${{ inputs.suite }}
      TIER2_AB_KREA_PERFORMANCE: ${{ inputs.krea_performance }}
      TIER2_AB_KREA_ALLOCATION: ${{ inputs.krea_allocation }}
      TIER2_AB_ROUTES: ${{ inputs.routes }}
      TIER2_AB_HUBS: ${{ inputs.hubs }}
      TIER2_AB_INFERENCE_SHA: ${{ inputs.inference_sha }}
      # Native sm_120 and the physical GPU1 binding every real-weight CUDA acceptance lane uses.
      CUDA_COMPUTE_CAP: "120"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: "1"
      NVIDIA_VISIBLE_DEVICES: "1"
      SCENEWORKS_GPU_ID: "1"
      TIER2_AB_GPU_POLICY: shared-display
      DEV_HOST_WORK_UPLOADS_COMPLETE: "false"
      # Heavy candle lane: no sccache wrapper (windows-candle.yml / catalog walk, os error 10054).
      RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Set attempt-owned scratch directory
        if: ${{ inputs.suite != 'krea-scoped-acceptance' }}
        run: Add-Content -Path $env:GITHUB_ENV -Value "TIER2_AB_WORK=$env:RUNNER_TEMP\t2ab-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Check out the dispatched driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tier2-ab-driver
          fetch-depth: 1
          persist-credentials: false
      - name: Register disposable Windows Krea storage
        if: ${{ inputs.suite == 'krea-scoped-acceptance' }}
        uses: ./tier2-ab-driver/.github/actions/cleanup-runner-storage
        with:
          dev-host: 'true'
      - name: Set the registered Windows Krea work directory
        if: ${{ inputs.suite == 'krea-scoped-acceptance' }}
        run: |
          if (-not $env:DEV_HOST_JOB_ROOT) { throw 'Missing registered Windows Krea job storage' }
          Add-Content -Path $env:GITHUB_ENV -Value "TIER2_AB_WORK=$env:DEV_HOST_JOB_ROOT\tier2-ab"
      - name: Check out base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          path: tier2-ab-base
          fetch-depth: 1
          persist-credentials: false
      - name: Check out head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          path: tier2-ab-head
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the four reviewed Krea baseline repair files
        if: ${{ inputs.suite == 'krea-scoped-acceptance' && !inputs.krea_allocation }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5b2c605c9371f7ecdf11dcbd6e76ac5e3d52d957
          path: tier2-ab-krea-repair
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/rust-api/src/portable_admission.rs
            /apps/rust-api/src/portable_routes.rs
            /crates/sceneworks-core/src/model_artifacts/artifact_selection.rs
            /crates/sceneworks-worker/src/external_library_runtime.rs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Preflight (inputs, checkouts, pins, tools, hub presence; no build, no model)
        run: |
          node tier2-ab-driver/scripts/tier2-ab.mjs --preflight-only
          if ($LASTEXITCODE -ne 0) { throw 'tier2-ab preflight failed' }
      - name: Stage and verify the allowlisted Krea assets into attempt-owned scratch
        if: ${{ inputs.suite == 'krea-scoped-acceptance' && !inputs.preflight_only }}
        run: |
          node tier2-ab-driver/scripts/tier2-ab.mjs --stage-krea
          if ($LASTEXITCODE -ne 0) { throw 'Krea asset staging failed' }
      - name: Prepare the Rust toolchain
        if: ${{ !inputs.preflight_only }}
        uses: ./tier2-ab-driver/.github/actions/prepare-rust-runner
        with:
          workspace-directory: tier2-ab-head
      - name: Disable unstable sccache wrapper for the heavy Candle lane
        if: ${{ !inputs.preflight_only }}
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value 'RUSTC_WRAPPER='
          Remove-Item Env:RUSTC_WRAPPER -ErrorAction SilentlyContinue
      - name: Preserve listener-owned Cargo dependency and kernel build caches
        if: ${{ !inputs.preflight_only }}
        working-directory: tier2-ab-head
        run: |
          node ..\tier2-ab-driver\scripts\select-windows-cargo-cache.mjs
          if ($LASTEXITCODE -ne 0) { throw 'isolated persistent Cargo cache selection failed' }
      - name: Build base then head release API/worker into one shared scratch target
        if: ${{ !inputs.preflight_only }}
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          node tier2-ab-driver\scripts\tier2-ab.mjs --build-only
          if errorlevel 1 exit /b 1
      - name: Run base#1, head and (if needed) base#2 per route under the physical GPU1 lease
        if: ${{ !inputs.preflight_only }}
        working-directory: tier2-ab-driver
        run: |
          # Physical GPU1 (nvidia-smi index 1, PCI C1:00.0) is the host's display GPU, so it is never
          # strictly idle. The wrapper's one admission rule (every actor): after the exact-UUID lock,
          # a 10 s window must show free memory >= 75776 MiB (largest route 66 GiB, the MLX LTX-2.5 q4
          # peak of run 43287955401 rounded up, + 8 GiB margin) and stable memory.used and
          # utilization. The wrapper logs each refusal reason while it waits; the driver prints
          # "phase=driver_started" once admitted.
          if ($env:TIER2_AB_SUITE -eq 'krea-scoped-acceptance') {
            # The wrapper and its child keep the same lease and write their receipts together.
            $env:RUNNER_TEMP = Join-Path $env:TIER2_AB_WORK 'evidence'
          }
          if ($env:TIER2_AB_KREA_ALLOCATION -eq 'true') {
            Write-Host "[tier2-ab] $([DateTime]::UtcNow.ToString('o')) phase=waiting_for_gpu1_lease policy=shared-display min_free_mib=75776 budget_min=85"
            python -I scripts/ci/windows_cuda_execution.py --actor tier2-ab-cuda --min-free-mib 75776 --budget-minutes 85 --cuda-ordinals 0 --require-physical-index 1 -- node scripts/tier2-ab.mjs --run
          } else {
            Write-Host "[tier2-ab] $([DateTime]::UtcNow.ToString('o')) phase=waiting_for_gpu1_lease policy=shared-display min_free_mib=75776 budget_min=540"
            python -I scripts/ci/windows_cuda_execution.py --actor tier2-ab-cuda --min-free-mib 75776 --budget-minutes 540 --cuda-ordinals 0 --require-physical-index 1 -- node scripts/tier2-ab.mjs --run
          }
          if ($LASTEXITCODE -ne 0) { throw 'tier2-ab comparison failed; see the evidence artifact' }
      - name: Retain the A/B evidence
        if: ${{ always() && inputs.suite != 'krea-scoped-acceptance' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier2-ab-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TIER2_AB_WORK }}/evidence/
            ${{ runner.temp }}/sceneworks-cuda-execution-${{ github.run_id }}-${{ github.run_attempt }}-tier2-ab-cuda/
          if-no-files-found: warn
          retention-days: 30
      - name: Retain the Windows Krea evidence
        id: krea-evidence
        if: ${{ always() && inputs.suite == 'krea-scoped-acceptance' && env.TIER2_AB_WORK != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier2-ab-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TIER2_AB_WORK }}/evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Confirm Windows Krea evidence before dev-host cleanup
        if: ${{ always() && steps.krea-evidence.outcome == 'success' }}
        env:
          ARTIFACT_ID: ${{ steps.krea-evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.krea-evidence.outputs.artifact-digest }}
        run: |
          if ($env:ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or $env:ARTIFACT_DIGEST -notmatch '^[a-f0-9]{64}$') { throw 'Missing Windows Krea artifact receipt' }
          $preflight = Join-Path $env:TIER2_AB_WORK 'evidence\preflight.json'
          if (-not (Test-Path -LiteralPath $preflight -PathType Leaf) -or (Get-Item -LiteralPath $preflight).Length -eq 0) { throw 'Missing Windows Krea driver evidence' }
          Add-Content -Path $env:GITHUB_ENV -Value 'DEV_HOST_WORK_UPLOADS_COMPLETE=true'
      - name: Remove compared Krea source checkouts after evidence publication
        if: ${{ always() && inputs.suite == 'krea-scoped-acceptance' && env.DEV_HOST_WORK_UPLOADS_COMPLETE == 'true' }}
        run: |
          node tier2-ab-driver/scripts/tier2-ab.mjs --cleanup
          if ($LASTEXITCODE -ne 0) { throw 'Krea source checkout cleanup failed' }
      # Same read-only-bundle restore as the mlx job; multiply linked read-only files are refused
      # rather than changed, because they may share bytes with the hub.
      - name: Remove every scratch directory
        if: ${{ always() && inputs.suite != 'krea-scoped-acceptance' }}
        run: |
          $status = 0
          if (Test-Path -LiteralPath 'tier2-ab-driver\scripts\tier2-ab.mjs') { node tier2-ab-driver\scripts\tier2-ab.mjs --cleanup; $status = $LASTEXITCODE }
          $driver = "$env:GITHUB_WORKSPACE\tier2-ab-driver"
          if (Test-Path -LiteralPath $driver) { cmd /c rmdir /s /q "$driver" }
          exit $status
