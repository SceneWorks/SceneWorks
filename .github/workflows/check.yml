name: Check

on:
  pull_request:
  # RETAINED, though the merge queue was removed on 2026-08-11 (0 integration failures caught
  # in 103 groups, +21m median tax, every group size 1). No `merge_group` event fires today, so
  # this costs nothing — and it keeps re-enabling the queue a one-line ruleset change. A
  # required lane with NO `merge_group:` trigger strands the group until
  # `check_response_timeout_minutes` evicts its entries, which silently re-orders the queue
  # rather than failing loudly, so this is the expensive half to have to rediscover.
  merge_group:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  web:
    runs-on: ubuntu-latest
    # Guardrail so a wedged step fails fast instead of riding GitHub's 6-hour
    # default (sc-10420). Well above the healthy ~5-8 min of ci+lint+test+build.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Lint web sources
        run: npm --prefix apps/web run lint
      - name: Run web test suite
        run: npm --prefix apps/web run test
      - name: Build web production bundle
        run: npm --prefix apps/web run build

  # `parity` IS THE REQUIRED STATUS CHECK, and it is an aggregator — the work fans out into
  # the four `parity-*` jobs below plus the dependency-advisory gate. They are mutually
  # independent, and running them serially
  # in one job meant everything queued behind the Rust compile for no reason. Measured
  # 2026-08-11 over 12 runs: rust 6.8m, closure digests 4.0m, scaffold 1.6m, docker smoke
  # 6.8m when it fires (4/12) — a 14.2m median job whose longest single member is 6.8m.
  #
  # Keeping ONE required context (rather than promoting each split job to its own) means the
  # ruleset needs no change, and there is no window in which a split-out check has stopped
  # being covered by `parity` but is not yet required on its own.
  supply-chain:
    name: dependency policy + advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2 (v2.9.1+1)
        with:
          shared-key: cargo-deny-0.19.9
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-bin: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny --locked --version 0.19.9
      - name: Validate advisory exception governance
        run: python3 scripts/ci/check_advisory_policy.py
      - name: Audit Rust dependency advisories
        run: cargo deny --locked check advisories

  parity:
    needs: [parity-rust, parity-digests, parity-scaffold, parity-docker, supply-chain]
    # FAIL CLOSED. Without `if: always()` this job is SKIPPED whenever any `needs:` job fails
    # or is skipped — and a skipped job reports **Success** to a required status check, which
    # is exactly the false-green shape documented at the top of changed-paths.yml. So it runs
    # unconditionally and asserts the results itself.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every parity job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        # Iterates whatever is in `needs` rather than naming the upstream jobs, so adding a sixth
        # job cannot silently go ungraded. The count floor is the other half of
        # that: deleting a `needs:` entry would otherwise shrink the assertion to a green
        # no-op instead of failing.
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          count="$(jq -r 'length' <<<"$RESULTS")"
          if [ "$count" -lt 5 ]; then
            echo "::error::parity expects at least 5 upstream jobs, saw ${count} — a needs: entry was removed"
            exit 1
          fi
          if [ "$(jq -r '[to_entries[] | select(.value.result != "success")] | length' <<<"$RESULTS")" != "0" ]; then
            echo "::error::one or more parity jobs did not succeed"
            exit 1
          fi

  parity-rust:
    runs-on: ubuntu-latest
    env:
      # Fetch the pinned inference source once, then force every build and build.rs process
      # offline so nothing else can reach the network mid-build.
      CARGO_NET_OFFLINE: "true"
      # This lane installs a real ffmpeg (step below), so the measured AV-mux tests must RUN here
      # rather than soft-skip. `video_jobs::tests::ffmpeg_reachable` turns "no ffmpeg" from a skip
      # into a failure while this is set, so the install silently disappearing goes red instead of
      # quietly reporting `ok` in 0.03 s (sc-19549; convention inherited from sc-19425).
      SCENEWORKS_REQUIRE_FFMPEG: "1"
    # A stalled step otherwise rides GitHub's 6-hour default timeout, blocking the PR and
    # holding a runner for hours — this bit PR #1300 / sc-10354 for ~4 h. Cap well above the
    # healthy duration so healthy runs are unaffected but a wedge fails in minutes with a
    # clear timeout (sc-10420).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ".github/workflows/check.yml"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt
      # SAVE ONLY ON `main`. This is the canonical note; every other rust-cache step in this repo
      # carries the same input and points here.
      #
      # GitHub scopes an Actions cache to the ref that wrote it: a `refs/pull/N/merge` entry is
      # readable only from inside PR N, while a `refs/heads/main` entry is readable from every
      # branch and every PR. Left at the default (`save-if: true`) each PR job writes its own copy,
      # so the repo accumulates one cache per lane per open PR and almost nothing another PR can
      # use. Measured 2026-08-15, before this change: 12 of 12 SceneWorks caches were PR-scoped,
      # ZERO were on main, and the repo sat at 14.3 GB of its 16 GB ceiling. Every PR job started
      # cold, every time.
      #
      # The failure is a RATCHET, not a steady state. Eviction is LRU and fires on the PEAK, so a
      # burst of concurrent PRs pushes the repo over the ceiling and drops the least-recently-read
      # entries. A main baseline that PRs still read has its access time refreshed and survives; one
      # that gets dropped can never come back, because refreshing it requires a read and the entry
      # is gone. It stays dead until the next successful push to main, which is days apart here.
      # Demonstrated in the sibling inference repo: main's `candle-cpu` baseline was full-matched at
      # 2026-08-14T23:33 and gone by the next morning, after which every PR rebuilt the whole candle
      # dependency graph inside its test step — ~18 minutes of a ~20-minute step, on every run.
      #
      # Restricting saves to main keeps exactly one baseline per lane, which is the only kind a PR
      # can read anyway. A PR whose Cargo.lock differs from main's gets rust-cache's prefix restore
      # instead of a full match: partial, and far better than cold.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2 (v2.9.1+1)
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Install ffmpeg for the measured AV-mux tests (sc-19549)
        # `npm run rust:check` runs `cargo test` over the workspace default members, which include
        # `crates/sceneworks-worker`. Its AV-mux tests (sc-19425's generation mux, sc-19549's SeedVR2
        # upscale mux) decode their own output to count frames, and their arg-shape halves cannot
        # substitute: MEASURED, swapping the two `-i` inputs keeps every arg assertion green while
        # producing 50 frames instead of 48. Without a binary here those tests returned early and
        # reported `ok`, so nothing in CI had ever exercised them — the runner image was the only
        # thing deciding. `SCENEWORKS_REQUIRE_FFMPEG` (job env above) makes that state fail loudly.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Install contract test dependencies
        # pillow / numpy / opencv were only needed by the retired Python worker's
        # adapter tests, deleted in sc-8863; the surviving suite (Rust-API
        # contract/smoke, manifest audits, convert-script unit test) needs only
        # pytest + httpx + jsonschema (builtin manifest authoring contract).
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.2 httpx==0.28.1 jsonschema==4.25.1
      - name: Run worker test suite
        # Marker expression instead of a hardcoded file list so new test files
        # are picked up automatically; e2e/parity-marked tests run in their own
        # later steps against the built Rust API (sc-4180).
        run: python -m pytest -q tests/ -m "not e2e and not parity" --strict-markers
      - name: Guard against gen-core version skew (sc-4482, epic 3720) (DISABLED)
        if: false
        # Fails if more than one distinct `sceneworks-gen-core` rev resolves in the worker's
        # build graph (split contract types can invalidate explicit catalog wiring). `--target all`
        # resolves the macOS-only mlx-gen transitive gen-core even on this Linux lane. The
        # self-test proves the gate fires without a deliberately-broken pin checked in.
        #
        # Lives on THIS job because it shells out to `cargo tree`, so it needs the toolchain and
        # the fetched registry above — it is not a Node guard like its former neighbours.
        run: |
          bash scripts/check-gen-core-skew.sh --self-test
          bash scripts/check-gen-core-skew.sh
      - name: Run Rust workspace checks
        run: npm run rust:check
      - name: Export prebuilt Rust binaries for the e2e/parity harnesses
        # `npm run rust:check` ends in `cargo build`, which builds both default-member
        # binaries into target/debug. Point the pytest harnesses at them so the ~30
        # API + worker spawns across the e2e/parity steps launch the binary directly
        # and skip `cargo run`'s per-launch freshness check over the whole workspace
        # graph. This also replaces the old redundant `cargo build -p sceneworks-rust-api`
        # step (the binary is already built above). See tests/test_rust_api_worker_smoke.py
        # `_launch_command` and tests/test_rust_api_contract_snapshots.py (sc-10823).
        run: |
          echo "SCENEWORKS_RUST_API_BINARY=${{ github.workspace }}/target/debug/sceneworks-rust-api" >> "$GITHUB_ENV"
          echo "SCENEWORKS_RUST_WORKER_BINARY=${{ github.workspace }}/target/debug/sceneworks-rust-worker" >> "$GITHUB_ENV"
      - name: Run end-to-end job pipeline test
        # tests/conftest.py fails this gate (via `require_tool` + an all-skipped
        # session guard) if `CI` is set and every collected test skips -- e.g. a
        # future change dropping the cargo toolchain would otherwise turn the gate
        # into a silent green no-op. GitHub Actions sets CI=true automatically
        # (sc-8935 / F-133).
        run: python -m pytest -q -m e2e --strict-markers
      - name: Run Rust API contract snapshot tests
        # Same all-skipped guard as the e2e step: a parity run that exercised
        # nothing fails instead of reporting success (sc-8935 / F-133).
        run: python -m pytest -q -m parity --strict-markers

  # Node-only: `npm run check` and its neighbours read Cargo.toml as TEXT (the pin regex in
  # generate-memory-matrix.mjs) and never invoke cargo, so this needs no Rust toolchain and no
  # rust-cache — which is what lets it run beside the compile instead of in front of it.
  parity-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the exact public inference terminal contract
        run: |
          set -euo pipefail
          inference_root="$RUNNER_TEMP/starvector-pinned-inference"
          echo "STARVECTOR_TERMINAL_INFERENCE_TEST_ROOT=$inference_root" >> "$GITHUB_ENV"
          git init "$inference_root"
          git -C "$inference_root" remote add origin https://github.com/SceneWorks/inference.git
          git -C "$inference_root" fetch --depth=1 origin c7f10e2191cc9df221c852cb5a32605fae9e94b2
          git -C "$inference_root" checkout --detach FETCH_HEAD
          test "$(git -C "$inference_root" rev-parse HEAD)" = c7f10e2191cc9df221c852cb5a32605fae9e94b2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install pinned scaffold dependencies
        run: npm ci --ignore-scripts
      # sc-22511: `anchor-loader-closure.test.mjs` derives the memory-anchor currency key over the
      # REAL pinned inference source, because the claims it makes ("a pin bump leaves the key
      # unchanged", "a sibling model's edit does not", "an edit on the loader's own path does") are
      # claims about a repository and a synthetic fixture can agree with a broken walk. Without a
      # clone here, most of its cases skipped and CI green meant nothing ran.
      #
      # SceneWorks/inference is PUBLIC (#2164), so a shallow fetch costs seconds and needs no token.
      # Two things are fetched: the PIN, and EVERY revision the packaged anchors were measured at —
      # an anchor's recorded currency key is derived at its own measurement revision, so the suite
      # needs those trees to re-derive it. The revision list comes from `--anchor-revisions`, which
      # reads the same store the derivation walks, so CI cannot end up fetching a subset while the
      # remaining cases skip quietly. Under CI the tests FAIL rather than returning when a tree is
      # missing.
      - name: Fetch the pinned inference source for the anchor-closure suite
        run: |
          set -euo pipefail
          pin="$(node -e 'const fs=require("fs");const m=fs.readFileSync("Cargo.toml","utf8").match(/candle-kernels\s*=\s*\{[^}]*?github\.com\/SceneWorks\/inference[^}]*?rev\s*=\s*"([0-9a-f]+)"/);if(!m)throw new Error("no inference pin");process.stdout.write(m[1])')"
          git init -q "$RUNNER_TEMP/inference"
          git -C "$RUNNER_TEMP/inference" remote add origin https://github.com/SceneWorks/inference
          git -C "$RUNNER_TEMP/inference" fetch -q --depth=1 origin "$pin"
          while read -r rev; do
            [ -n "$rev" ] || continue
            git -C "$RUNNER_TEMP/inference" fetch -q --depth=1 origin "$rev"
          done < <(node scripts/anchor-loader-closure.mjs --anchor-revisions)
          git -C "$RUNNER_TEMP/inference" checkout -q "$pin"
      - name: Run scaffold and compose checks
        env:
          INFERENCE_REPO: ${{ runner.temp }}/inference
        run: |
          npm run check
      # DISABLED at PR time (sc-19758). release.yml still scans the BUILT bundle in all three of its
      # jobs, which is where redistributing NC weights would actually happen — this step only
      # re-scanned the source trees on every pull request.
      - name: Guard against NC model weights in a published artifact (DISABLED — see release.yml)
        if: false
        # SceneWorks converts weights at install and pulls them at runtime — it never
        # redistributes them. Baking a Non-Commercial family's weights (Anima /
        # CircleStone, FLUX NC, Ideogram, Krea, NVIDIA SANA, …) into an installer or
        # image layer would make us a distributor of a Derivative and attach the NC
        # obligations. The self-test proves the gate fires on a fake anima-*.safetensors
        # before the real scan runs over the Docker build context / Tauri resource trees
        # (config/, crates/, apps/). See docs/packaging-nc-weights-guard.md.
        run: |
          node scripts/check-no-nc-weights.mjs --self-test
          npm run check:nc-weights
      - name: Guard About→Licenses coverage for shipped models and embedded source (DISABLED)
        if: false
        # The licenses page records the upstream license + attribution for every model
        # whose weights SceneWorks downloads — including which ones are NON-COMMERCIAL.
        # It had drifted to cover only the bundled binaries, Wan2.2/LTX and the audio
        # models while ~30 image/video/utility primaries (SDXL, FLUX, Krea, Ideogram,
        # SANA, SD3.5, Anima, the PiD decoders, …) shipped with no entry at all, because
        # adding a catalog model had no mechanical link to the page. This fails the build
        # if a downloading model is unclaimed, a claimed id no longer exists, or a
        # document key is not wired into bundledLicenses.js (which would render an EMPTY
        # license — worse than a missing one). It also audits the ported/embedded
        # inference source inventory (Cephes, CMUDICT) against the Cargo pin, and the
        # classification of every production-Rust crate in the pinned revision.
        #
        # sc-19751: this REPORTS, it does not gate. All of the analysis above still runs
        # and every finding is printed, but the step exits 0. It used to fail closed, and
        # two of its rules fired on changes with nothing to do with licensing: the
        # revision-locked audit made EVERY inference pin bump owe a manual re-audit of
        # upstream NOTICE/LICENSE-*/include_str! sites, and a new inference crate failed
        # SceneWorks CI until someone classified it. Run with --strict to gate
        # deliberately during the compliance pass. The NC-weights guard above is
        # unaffected and still fails closed. The marker regex that finds ported
        # FILES is only a heuristic, and a whole crate already slipped it once —
        # mlx-gen-krea-realtime described its port in words the regex did not know and
        # shipped unclassified on a false green (sc-15138 → sc-15191).
        #
        # It grades CHECKED-IN audit data against the Cargo pin, so unlike the digest job
        # below it needs no inference clone.
        run: |
          node scripts/check-license-coverage.mjs --self-test
          npm run check:license-coverage

  parity-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Verify the per-lane inference closure digests against real pinned source (DISABLED)
        if: false
        # `npm run check` only asserts that config/inference-provider-closures.json is KEYED to the
        # live pin. It cannot tell a real digest from a hand-edited one, because the derivation needs
        # inference's source and the SceneWorks checkout does not contain it.
        #
        # It does not need to be checked in blind, though: SceneWorks/inference is PUBLIC (#2164
        # established this after the opposite premise had been believed for some time), so a shallow
        # fetch of the pinned revision costs seconds, needs no token, and re-derives every lane's
        # digest for real. Without this step the currency term is checked-in data nothing verifies —
        # the same fail-open shape this epic removed one level down.
        run: |
          set -euo pipefail
          pin="$(node -e 'const fs=require("fs");const m=fs.readFileSync("Cargo.toml","utf8").match(/candle-kernels\s*=\s*\{[^}]*?github\.com\/SceneWorks\/inference[^}]*?rev\s*=\s*"([0-9a-f]+)"/);if(!m)throw new Error("no inference pin");process.stdout.write(m[1])')"
          git init -q "$RUNNER_TEMP/inference"
          git -C "$RUNNER_TEMP/inference" remote add origin https://github.com/SceneWorks/inference
          git -C "$RUNNER_TEMP/inference" fetch -q --depth=1 origin "$pin"
          git -C "$RUNNER_TEMP/inference" checkout -q FETCH_HEAD
          node scripts/inference-closure-digest.mjs --repo "$RUNNER_TEMP/inference" --check
          # sc-17935: the line above grades ONE file. The CAPTURED half of the comparison — 65 record
          # digests in the evidence bundle and the calibration bindings in the shipped manifest — was
          # graded by nothing, and the class was not hypothetical: a constant carrying the comment
          # "derive it with …" had never been a real derivation and survived all of sc-17774 unnoticed.
          #
          # sc-17989 closed the last hole in the manifest half: `turboFit` and `candle.control` were
          # maintained by hand and unreachable to the locator, so it graded 31 of 33 digests. All 33
          # are covered now, and a digest that becomes unreachable again fails rather than going
          # quiet — that regression is what `--verify`'s coverage check exists to catch.
          #
          # The backfill re-derives each of those at the revision it was captured at and exits 1 on
          # any disagreement, so running it in dry mode IS the verification. It needs every captured
          # revision present, not just the pin, and `--revisions` reports exactly which — from the
          # same workload computation the check itself uses, so the two cannot drift apart.
          while read -r rev; do
            [ -n "$rev" ] || continue
            git -C "$RUNNER_TEMP/inference" fetch -q --depth=1 origin "$rev"
          done < <(node scripts/backfill-closure-digests.mjs --revisions)
          node scripts/backfill-closure-digests.mjs --repo "$RUNNER_TEMP/inference" --verify
          # sc-19542: the same posture for the rung-4 prerequisite records. `npm run check` can only
          # assert that config/rung4-contract-prerequisites.json is KEYED to the live pin; whether
          # the recorded `additional_prerequisites` edges are the ones each provider actually
          # appends needs inference's source, which a SceneWorks checkout does not contain. The
          # pinned tree is already fetched above, so re-deriving all 40 records costs seconds. The
          # memory matrix's rung-4 arm admits cells from these records, so a record nothing grades
          # is the same fail-open shape the blanket rung-1 proxy was.
          node scripts/rung4-contract-prerequisites.mjs --repo "$RUNNER_TEMP/inference" --check

  # Split out because the smoke recompiles the whole workspace inside BuildKit and shares
  # nothing with the host's rust-cache — ~7m that used to land at the END of a 14m serial job,
  # so its cost was fully additive to everything above it.
  #
  # The `if:` below is a STEP-level skip, so this job still reports success when the gate says
  # no Docker input changed. That keeps the aggregator honest: it can demand `success` from
  # every member with no skipped-counts-as-green special case to get wrong later.
  parity-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Decide whether to run the Docker runtime smoke
        id: docker_smoke_gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The Docker smoke recompiles the whole ~275-crate workspace from scratch in
        # the release profile inside BuildKit — its `--mount=type=cache` target dir is
        # empty on ephemeral runners and isn't exportable to the gha cache, so it shares
        # nothing with the host's rust-cache-warmed target/ and costs ~5 min every run.
        # The host contract + e2e steps already exercise the API binary's startup and
        # /health, so the container smoke only adds packaging coverage. Re-run it only
        # when an input that can actually regress the image changed; always run off a
        # pull request (push to main / codex/**) for full coverage (sc-10823).
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request; running the Docker runtime smoke."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr="${{ github.event.pull_request.number }}"
          changed_file_count="$(gh api "repos/${GH_REPO}/pulls/${pr}" --jq '.changed_files')"
          # The files endpoint pages at 100 and caps very large PRs at 3,000. The helper
          # compares the returned count with `changed_files`; any truncation runs the
          # smoke conservatively instead of treating an unseen Docker input as irrelevant.
          gh api --paginate "repos/${GH_REPO}/pulls/${pr}/files?per_page=100" \
            --jq '.[].filename' |
            node scripts/docker-smoke-relevance.mjs --expected-count "$changed_file_count"
      - name: Smoke default Rust API Docker runtime
        if: steps.docker_smoke_gate.outputs.run == 'true'
        run: npm run check:docker:rust-api

  # THE CANDLE TYPECHECK, ON A HOSTED BOX. The merge queue's whole job is catching semantic
  # conflicts — two PRs that are individually green and textually non-overlapping, whose MERGE does
  # not compile. `main` broke exactly that way today (e71b932f: #2134 written against a `temp_db()`
  # that #2135 had changed the return type of).
  #
  # `parity` above catches that class for code the Linux default-feature build compiles, and it is a
  # required check, so the queue already gates on it. It does NOT compile anything under
  # `all(not(target_os = "macos"), feature = "backend-candle")` — `vram_gate`, `krea_control_fit`,
  # the candle-control image modules, `generate_candle_video` and its Mochi fit gates. Until this job
  # existed the ONLY compiler of that cfg anywhere in CI was windows-candle.yml, which runs on the
  # self-hosted `cuda` pool at a ~24m median (p90 32m, measured 2026-08-05 over 85 runs) and has no
  # `merge_group:` trigger — so a candle-side semantic conflict merged green and broke `main` for
  # everyone behind it. This job is ~4m and hosted, which is what makes it affordable per merge
  # group where that lane is not.
  #
  # It does not need a GPU. `scripts/check-candle-build.mjs` (sc-12356) writes a stub `nvcc` that
  # satisfies the three build scripts that shell out to the CUDA toolkit, and `cargo clippy`/`check`
  # NEVER LINK — so the typecheck itself is entirely real on a GPU-less runner. That script has
  # shipped since sc-12356 but ran nowhere in CI; it was wired only into the pre-push hook, with
  # `--allow-skip`. This is its first gate.
  #
  # SCOPE, so a green here is not over-read: it TYPECHECKS. It cannot RUN candle tests, because
  # `cargo test` links and that needs a real libcuda. Candle-gated `#[test]` bodies still execute
  # for the first time on windows-candle.yml. What this gates is the compile class — E0599, E0277,
  # a cfg-gated symbol gone missing, dead code under `-D warnings` — which is precisely the class a
  # speculative merge introduces and the class that broke `main` today.
  candle:
    runs-on: ubuntu-latest
    env:
      # Same posture as `parity`: fetch the pinned inference source once, then force every build
      # and build.rs process offline so nothing else can reach the network mid-build.
      CARGO_NET_OFFLINE: "true"
    # The three cargo invocations are two `check`s and one `clippy`, all warm-cached after the first
    # run. Sized like `parity` so a wedge fails in minutes rather than riding the 6-hour default
    # (sc-10420).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          # Kept in lockstep with rust-toolchain.toml by the contract test in
          # scripts/platform-review-contracts.test.mjs, same as every other lane's input.
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2 (v2.9.1+1)
        with:
          # A distinct key from `parity`'s: this job compiles the same crates under a different
          # feature set, so sharing one cache would thrash both.
          key: candle
          # Save only on `main` — see the note on the `parity-rust` cache step above.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Typecheck the candle backend configuration
        # No `--allow-skip`: this host is Linux, so `not(target_os = "macos")` holds natively and
        # there is no cross target to be missing. A "cannot run here" on this runner is a real
        # failure, not a dev who never opted in.
        run: npm run rust:check:candle
