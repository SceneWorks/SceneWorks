      - name: Resolve exact Krea reference snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        shell: powershell
        env:
          KREA_REVISION: ${{ inputs.krea_revision }}
          KREA_ROOT_OVERRIDE: ${{ secrets.SCENEWORKS_KREA_ROOT }}
