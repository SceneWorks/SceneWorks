name: Windows Candle worker

# Compiles AND tests the Rust GPU worker with the native candle (Windows/NVIDIA)
# engines (candle-gen) linked in — the off-Mac counterpart to macos-mlx.yml. The
# candle-gated worker code lives under
# `#[cfg(all(not(target_os = "macos"), feature = "backend-candle"))]`, so neither
# the Linux `parity` job (check.yml, no backend-candle) nor the macOS lane (mlx
# only) ever exercises it. The hosted `build-windows` desktop job COMPILES the
# candle sidecar but runs no worker tests, and server-candle-linux.yml is
# `workflow_dispatch`-only and compile-only. So before this lane, the
# candle-gated drift guard + sampler-knob + engine-map unit tests were validated
# ONLY by hand on the dev box — which let a stale candle test rot red on main
# undetected (sc-5495 → sc-7475; PR #865). This job closes that gap by actually
# RUNNING `cargo test --features backend-candle` on every candle-touching PR.
#
# It also compile-checks the desktop candle SIDECAR here
# (`cargo check -p sceneworks-rust-api --features backend-candle`): the hosted
# desktop-windows.yml lane stopped compiling it on PRs (the full candle/CUDA build
# moved to release/main-only, to keep every PR off the ~20–50 min hosted build).
# This warm box already has CUDA + an incremental target dir, so it's the cheap
# place to catch a candle sidecar build break on the PR instead of at release-tag
# time. (embed-web is left off — it needs a built web bundle; see the step comment.)
#
# And because linking candle is what it takes to produce them, this is the only PR
# lane that can prove `config/engine-capabilities/capabilities.candle.json` is a real
# dump rather than a restamped stale one — the last step in the job (sc-17592), the
# off-Mac mirror of the MLX step in macos-mlx.yml.
#
# RUNS ON A SELF-HOSTED Windows + NVIDIA (CUDA) RUNNER (label `cuda`). GitHub's
# hosted windows runners have no GPU and only compile; a real candle build also
# needs the box's MSVC 14.44 BuildTools toolset (CUDA 12.9's nvcc rejects VS2026's
# 14.51, sc-3676). The runner reuses its `_work` target dir, so candle compiles
# once and is incremental across runs. The real-weight GPU smokes stay `#[ignore]`d
# (the ~logic tests run driver-free); add `-- --ignored` by hand for a GPU pass.
# Exception: `cuda_quant_smoke` (sc-13510) is weightless and fast, so it runs
# un-ignored here — it exercises the patched candle-kernels quant kernels on the
# real GPU every time this lane fires.
#
# Runner prerequisites: Windows 11 + NVIDIA driver, CUDA Toolkit 12.9, VS2022
# BuildTools (MSVC 14.44), a Rust toolchain, registered with the `cuda` label.
#
# SECURITY: this repo is PUBLIC, and GitHub warns against running self-hosted
# runners for public repos because a fork PR could execute arbitrary code on the
# runner. The job-level `if:` below restricts execution to same-repo branches, so
# fork PRs never run here (mirrors macos-mlx.yml). Keep "Require approval for all
# external contributors' workflows" enabled in the repo Actions settings as
# defense in depth.

on:
  push:
    branches: [main]
    paths: &candle_paths
      - "crates/**"
      # NO apps/rust-worker/** here, deliberately — do not re-symmetrise with
      # macos-mlx.yml's anchor (sc-17703). That package (`sceneworks-rust-worker`)
      # is a 4-line binary wrapper over sceneworks-worker with no [features] block
      # and no candle-gated code, nothing in the workspace depends on it, and
      # nothing this job runs builds it: every cargo invocation below is
      # -p sceneworks-worker, -p sceneworks-rust-api or
      # -p sceneworks-memory-adapter. Watching it woke this whole job — a ~24m
      # median run on the `cuda` pool — for zero coverage. The two lanes legitimately
      # differ: macos-mlx.yml's HOSTED macos-checks job runs the bare
      # workspace-wide `cargo test` / `cargo clippy --all-targets` over every
      # default member, which DOES compile the wrapper, so the entry earns its
      # keep there. The contract test in scripts/platform-review-contracts.test.mjs
      # derives all of this from each workflow's own cargo invocations and the
      # Cargo.toml dependency graph, so re-adding the entry here (or narrowing
      # what a lane builds out from under one of its path entries) goes red
      # instead of quietly rotting.
      - "apps/rust-api/**"
      # The builtin model catalog is include_str!'d into the worker and read by the
      # `manifest_menu_is_subset_of_descriptor` drift guard, so a manifest edit can
      # turn the candle suite red — gate on it.
      - "config/manifests/**"
      # The stage-1 candle facts dump this lane is the sole PR-triggered producer of
      # (sc-17592). Without this entry the "real dump, not a restamp" step below is
      # unreachable for the one edit it exists to catch: a restamp touches ONLY
      # config/engine-capabilities/capabilities.candle.json, which matches no other path
      # here, so the lane would not run at all on the PR that made the file wrong. Same
      # gap sc-17119 closed on the macOS side.
      #
      # THIS FILE, not `config/engine-capabilities/**` (sc-17665). The directory glob also
      # matched capabilities.mlx.json, so an mlx-only restamp woke this ENTIRE job — every
      # step below, ~24m median on the `cuda` pool — for a file the verify step never
      # opens. Nothing in this lane reads it: no Rust reads the facts directory at all
      # (`default_facts_dir()` only builds the dumper bin's default OUTPUT path; a repo-wide
      # grep finds no reader), and the three consumers that DO glob the whole directory are
      # all outside this job — `previewSupportCatalog.test.js` runs in check.yml's hosted
      # Linux `web` job, while `generate-preview-support.mjs` and `bump-inference.mjs` are
      # manual developer scripts that no workflow invokes at all.
      #
      # Narrowing costs no coverage. A restamp is the ONLY edit this drops, and it is
      # precisely the edit this lane cannot check; any *material* change to the sibling dump
      # also regenerates config/manifests/builtin.preview-support.jsonc, and
      # `config/manifests/**` above still wakes both lanes. Path filters match DELETES and
      # ADDS as well as modifications, so a restamp, a delete or a re-add of this file still
      # triggers the lane, and a rename is a delete+add that still matches.
      - "config/engine-capabilities/capabilities.candle.json"
      # The AUDIO dump, which the verify step below ALSO diffs (sc-17593). Both lanes read this one,
      # because `AUDIO_BACKEND` is candle on every platform and either box can produce it -- so
      # unlike the sibling media file, waking this job for it is not a wasted run: the step opens it.
      #
      # sc-17665 narrowed the entry above from `config/engine-capabilities/**` to a single filename,
      # and that landed while sc-17593 was in flight. The two are individually correct and combine
      # badly: the audio verification was added to a step whose trigger paths had just stopped
      # matching the audio file. Demonstrated on `97a7655a9`, an audio-only re-dump that woke neither
      # stage-1 lane -- declared but unreachable, for exactly the edit the step exists to catch.
      - "config/engine-capabilities/audio/capabilities.candle.json"
      - "Cargo.toml"
      - "Cargo.lock"
      # The toolchain and cargo-config seams (sc-17703, Michael's call — these are
      # UNDER-trigger fixes that deliberately spend box time on two rare-edit,
      # high-blast-radius files whose breakage would otherwise merge green and red
      # main misattributed). This lane runs no rust-toolchain action: cargo in-repo
      # auto-selects the toolchain rust-toolchain.toml pins (see the step comment
      # below), so a bump changes what this entire job compiles with. And
      # .cargo/config.toml carries `git-fetch-with-cli = true`, which routes every
      # git dependency fetch (including the pinned inference release) through the
      # system git rather than cargo's built-in transport — so an edit there
      # changes how this lane resolves its dependencies. The
      # channel is a concrete version, never floating `stable` (sc-17717): a
      # toolchain change is therefore always an edit to that file, which this
      # entry turns into a run of this lane — and the contract test keeps every
      # workflow's dtolnay `toolchain:` input in lockstep with the pin. When
      # bumping, pre-install the new version on this box first; see the bump
      # recipe in rust-toolchain.toml.
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/actions/prepare-rust-runner/**"
      - ".github/workflows/windows-candle.yml"
  pull_request:
    branches: [main]
    paths: *candle_paths
  workflow_dispatch:
    inputs:
      run_five_rung_reference:
        description: "Capture the SC-16402 Krea fresh-process five-rung reference"
        required: false
        type: boolean
        default: false
      provision_krea_snapshot:
        description: "Provision the exact public Krea q4 snapshot before capture"
        required: false
        type: boolean
        default: false
      inference_revision:
        description: "Exact 40-hex inference revision pinned by the adapter"
        required: false
        type: string
      krea_repository:
        description: "Published Krea MLX artifact repository identity"
        required: false
        type: string
        default: "SceneWorks/krea-2-turbo-mlx"
      krea_revision:
        description: "Exact 40-hex Krea artifact revision"
        required: false
        type: string

# Cancel superseded PR runs, but never cancel a main-push run: this lane is the
# ONLY thing that compiles the candle-gated worker code, so a main commit whose
# run is killed carries no candle verdict at all and a later break is misattributed
# to the next commit (sc-12399 — 8 of 30 main runs cancelled over one 37h window).
#
# The group KEY is what does the work here, not just cancel-in-progress. GitHub
# allows at most ONE pending run per concurrency group and cancels the previously
# pending run when a new one queues, so keying main on `github.ref` would still
# drop the middle commit of any 3+ merge burst (A runs, B pends, C evicts B) even
# with cancel-in-progress off. Keying main on `github.sha` puts every commit in its
# own group, where nothing can evict it; runs then serialize on the single
# self-hosted box instead. Do NOT collapse this back to `group: ...${{ github.ref }}`.
#
# COST, re-measured 2026-08-05 over 85 completed `candle-worker` jobs in a 29.5h
# window. This block previously claimed "~4.2m median (p90 4.5m)" and "the box sits
# ~12% utilized". Both were wrong by the time anyone read them: duration was ~6x low,
# and "the box" described a single machine that does not exist.
#
#   job duration   median 24.1m   p90 31.9m   max 44.0m   min 8.2m
#   queue wait     median  0.1m   p90 18.0m   max 55.5m
#   pool           FOUR runners carried the `cuda` label over that window
#                  (cuda-windows, -2, -3, -4), load spread evenly across them:
#                  23/18/22/22 jobs, 516/424/591/537 busy minutes
#   utilization    ~29% per box
#
# THE CONCLUSION IS UNCHANGED — keeping main-push runs uncancelled is affordable, and
# with more headroom than the old numbers implied. Only the magnitudes were wrong, and
# they were wrong in both directions at once (each run costs ~6x more than stated; there
# are ~4x more boxes to absorb it). Do not read the correction as "this lane got cheap".
#
# `queue: max` would be the other way to do this, but it cannot combine with
# `cancel-in-progress: true`, which the PR side still wants.
#
# RE-MEASURE; DO NOT TRUST THESE NUMBERS ON SIGHT. They went ~6x stale without anyone
# noticing, because nothing recomputes them and no test can — they describe fleet state,
# not repo content. Method, so the next re-measure is comparable:
#   * duration = repo-scoped jobs API `started_at` -> `completed_at`. Do NOT use
#     `gh run list`'s createdAt -> updatedAt: that folds queue wait into run time and
#     reports ~50m for a 24m job, which is how a wrong number gets quoted confidently.
#   * exclude `cancelled` runs — they truncate low and drag the median down.
#   * pool size = `gh api repos/{owner}/{repo}/actions/runners`. It is NOT fixed: two of
#     the four boxes above were no longer online hours after this measurement, so quote
#     the pool size and date together or the utilization figure means nothing.
#
# WHERE THE ~24m ACTUALLY GOES, and why the obvious saving is not one (sc-17820).
# Step-level `started_at` -> `completed_at` from the jobs API, five runs on 2026-08-05/06
# (31055081046, 31057684283, 31058077337, 31059604369, 31060918014). Those five ran
# 18.0 - 25.8m end to end; the 24.1m median above is over 85 runs, so do not expect this
# table to sum to it. Ranges are truncated to 0.1m, which always understates a max.
#
#   Fetch the pinned inference release           3.5 - 8.8m
#   Test the candle GPU worker (backend-candle)  3.6 - 5.6m
#   Check the candle sidecar builds (rust-api)   2.5 - 4.0m
#   Check and test the candle memory adapter     4.5 - 6.7m
#   Clippy (candle worker)                       0.5 - 1.0m
#   Verify capabilities.candle.json              0.7 - 0.9m
#
# IT IS ALL COMPILATION AND FETCHING. Inside the test step the split is stark and stable
# across all five runs -- `Finished test profile in 3m 23s .. 5m 15s`, then:
#
#   running 1317 tests ... test result: ok. 1274 passed; 43 ignored; finished in 7.6s
#
# So `cargo test -p sceneworks-worker --features backend-candle` spends 3-5 MINUTES
# building and 7.6 SECONDS running. sc-17820 proposed narrowing the PR invocation to the
# ~127 candle-exclusive tests on the grounds that the other ~92% are covered by `parity`
# and `macos-checks`. REJECTED, on four measured counts:
#   1. A libtest filter changes nothing about what cargo builds. The crate, all its
#      targets and the whole candle graph still compile; the saving is bounded above by
#      that 7.6s, i.e. ~0.5% of the job. The lane would still be ~24m.
#   2. Narrowing by TARGET (`--lib`, or naming individual `--test`s) would drop build
#      work, but drops the wrong things: the four integration targets cost seconds in
#      total, and `--lib` would discard `cuda_quant_smoke` (0.18s, the sc-13510 quant-
#      kernel scar, deliberately un-`#[ignore]`d here) and `candle_kernels_patch_guard`
#      -- the two targets whose whole reason to exist is that only this box runs them.
#      For scale: `Clippy (candle worker) --all-targets` costs 31 - 63s warm at the end
#      of this same job, so the extra targets are not where the minutes are.
#   3. It therefore does NOT make sc-17014 option (B) -- require this lane on the merge
#      queue -- viable. That was the story's actual prize, and the arithmetic (p90 18.0m
#      queue + p90 31.9m run vs the 60m `check_response_timeout_minutes`) is untouched.
#   4. The ~92% figure is a static `#[test]` count, and the lanes disagree with it. What
#      each lane's `sceneworks_worker` lib binary actually reports (runs 31061431547 and
#      31060918026, same day):
#
#        parity (hosted ubuntu, bare `cargo test`)   737 tests
#        macos-checks (hosted macos-26)             1595 tests
#        this lane (--features backend-candle)      1317 tests
#
#      `parity` runs 737 of this lane's 1317, so at most ~56% can be parity-covered, not
#      92%. The gap is real code: `include!("image_jobs/base.rs")` is itself cfg-gated on
#      `any(macos, backend-candle)` (image_jobs.rs), so `parity` never compiles that file,
#      and its 207 `#[cfg]` attributes split macOS bodies from `backend-candle` ones --
#      `macos-checks` compiles the macOS arm, nothing but this lane RUNS the candle arm.
#      (check.yml's hosted `candle` job does compile the candle cfg with `--all-targets`
#      clippy, but cannot run it -- see scripts/check-candle-build.mjs.) Narrowing here
#      would drop uncovered configurations to buy back seconds.
# If this lane needs to get cheaper, the levers are the FETCH step (a job-local CARGO_HOME
# under RUNNER_TEMP is re-downloaded every run -- see "Isolate Cargo dependency checkout")
# and the three separate compile graphs, not the test filter.
concurrency:
  group: windows-candle-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candle-worker:
    # Same-repo only — never execute untrusted fork code on the self-hosted runner.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64, cuda]
    env:
      # Native sm_120 (Blackwell) — this runner IS the RTX PRO 6000 box; nvcc emits
      # SASS directly (no load-time JIT). compute_80 PTX would also forward-JIT.
      CUDA_COMPUTE_CAP: "120"
      CARGO_NET_OFFLINE: "true"
    # Guardrail so a wedged step fails fast instead of riding GitHub's 6-hour
    # default (sc-10420). This lane is the SOLE self-hosted cuda box and
    # serializes main-push runs (github.sha concurrency), so a wedge here holds
    # that box and starves every queued PR/main run on it until the cap fires
    # (sc-13603). Well above the healthy ~11-14 min build+test+clippy — a cold
    # candle-kernels (nvcc) rebuild still fits comfortably.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && inputs.provision_krea_snapshot && 240 || github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && 120 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # sc-13166: point this lane at the REAL rustup toolchain bin and prepend it to
      # PATH, so cargo/rustc/clippy never dispatch through the fragile
      # %USERPROFILE%\.cargo\bin proxies (0-byte symlinks -> rustup.exe that go dangling
      # when rustup self-updates or its rustup.exe is deleted, or that fail to launch as
      # symlinks in the runner's Windows-service context — both surface as the cryptic
      # Windows ERROR_NO_ASSOCIATION at `cargo fetch` and turned every PR red, forcing
      # admin-override merges). The action fails loudly with an actionable message if no
      # usable toolchain is installed. See .github/actions/prepare-rust-runner.
      - uses: ./.github/actions/prepare-rust-runner
      # The shared runner exports RUSTC_WRAPPER=sccache. The prep action correctly clears a
      # missing wrapper, but an installed daemon can still reset its local connection mid-build
      # (Windows os error 10054), observed independently in both the backend-candle test and the
      # sidecar check. This is the repository's heaviest Rust/CUDA lane, so make rustc direct and
      # deterministic for this job only. Cargo registry/git/target caches remain intact; sibling
      # workflows may continue using sccache.
      - name: Disable unstable sccache wrapper for the heavy Candle lane
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value 'RUSTC_WRAPPER='
          Remove-Item Env:RUSTC_WRAPPER -ErrorAction SilentlyContinue
      # Multiple runner services share %USERPROFILE%\.cargo. A sibling job can replace
      # that global git checkout while rustc is still reading vendored inference sources,
      # which surfaces as an unrelated missing-path/os-error-267 failure. Keep dependency
      # state job-local; the verified toolchain remains on PATH from the step above.
      - name: Isolate Cargo dependency checkout
        shell: powershell
        run: |
          $jobCargoHome = Join-Path $env:RUNNER_TEMP 'cargo-home'
          New-Item -ItemType Directory -Force -Path $jobCargoHome | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_HOME=$jobCargoHome"
      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      # No rust-toolchain action: the self-hosted box has rustup + the repo's
      # `rust-toolchain.toml`-pinned toolchain (incl. clippy) pre-installed, and the
      # action's bash step breaks here — `bash` resolves to the box's WSL stub, not
      # Git Bash. cargo in-repo auto-selects the pinned toolchain.
      # nvcc needs the MSVC 14.44 host compiler (NOT VS2026 14.51, which CUDA 12.9
      # rejects). Load the BuildTools vcvars in-shell, then build+test in the same
      # cmd invocation so the toolchain env survives (each step is a fresh shell).
      - name: Test the candle GPU worker (backend-candle)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo test -p sceneworks-worker --features backend-candle
      # PR guard for the desktop candle SIDECAR the hosted lane no longer builds on
      # PRs (see header). `cargo check` runs the build scripts (incl. the nvcc kernel
      # compile) and typechecks the full graph, so a candle sidecar build break is
      # caught on the PR — cheap here on the warm, CUDA-equipped box.
      #
      # NB: `embed-web` is intentionally OMITTED. It embeds apps/web/dist via
      # rust-embed (with `debug-embed`, so it embeds at compile time even under
      # `cargo check`), which requires a built web bundle — this lane never runs a
      # web build, so including it fails with "no `get` on WebAssets". embed-web is
      # orthogonal to candle (static-serving glue) and is compiled on the push:main /
      # release.yml package builds, where web/dist exists. (Release-only codegen/link
      # breaks also still surface first in those builds.)
      - name: Check the candle sidecar builds (rust-api, backend-candle)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo check -p sceneworks-rust-api --features backend-candle
      # PR guard for the Candle memory-calibration adapter binary (epic 15448). Like the
      # candle-gated worker code it is invisible to every other lane: `src/bin/candle.rs` is
      # `compile_error!` on macOS, macos-mlx.yml builds only `--bin memory-mlx-adapter`, and the
      # Linux candle lane is workflow_dispatch-only. Before this step a break in it stayed hidden
      # until someone ran Candle calibration on a CUDA host — which is exactly where this epic's
      # downstream Candle stories start (sc-15804 review: an exhaustive
      # `MemoryStrategyParameters` literal here went stale against the inference contract with
      # nothing to catch it). Keep both the production typecheck and the binary's CUDA-only unit
      # tests here: the batching contamination guard cannot be compiled or exercised on macOS.
      - name: Check and test the candle memory adapter (memory-candle-adapter)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo check -p sceneworks-memory-adapter --features candle --bin memory-candle-adapter
          cargo test -p sceneworks-memory-adapter --features candle --bin memory-candle-adapter
      - name: Validate five-rung reference inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: powershell
        env:
          RUN_FIVE_RUNG_REFERENCE: ${{ inputs.run_five_rung_reference }}
          PROVISION_KREA_SNAPSHOT: ${{ inputs.provision_krea_snapshot }}
          INFERENCE_REVISION: ${{ inputs.inference_revision }}
          KREA_REPOSITORY: ${{ inputs.krea_repository }}
          KREA_REVISION: ${{ inputs.krea_revision }}
        run: |
          if ($env:PROVISION_KREA_SNAPSHOT -eq 'true' -and $env:RUN_FIVE_RUNG_REFERENCE -ne 'true') {
            throw 'provision_krea_snapshot requires run_five_rung_reference=true'
          }
          if ($env:RUN_FIVE_RUNG_REFERENCE -ne 'true') { exit 0 }
          if ($env:INFERENCE_REVISION -notmatch '^[0-9a-f]{40}$') {
            throw 'inference_revision must be an exact lowercase 40-hex commit'
          }
          if ($env:KREA_REVISION -notmatch '^[0-9a-f]{40}$') {
            throw 'krea_revision must be an exact lowercase 40-hex artifact revision'
          }
          if ($env:KREA_REPOSITORY -ne 'SceneWorks/krea-2-turbo-mlx') {
            throw 'krea_repository must be the fixed SceneWorks/krea-2-turbo-mlx reference artifact'
          }
          $pinLine = Select-String -Path 'crates/sceneworks-memory-adapter/src/lib.rs' -Pattern '^pub const INFERENCE_PIN: &str = "([0-9a-f]{40})";$'
          if (-not $pinLine -or $pinLine.Matches[0].Groups[1].Value -ne $env:INFERENCE_REVISION) {
            throw "input inference_revision does not match the adapter's compiled INFERENCE_PIN"
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        with:
          node-version: 22
      - name: Validate runner Python for Krea provisioning
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && inputs.provision_krea_snapshot }}
        shell: powershell
        run: |
          $version = python --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^Python 3\.(?<minor>\d+)\.') {
            throw "the self-hosted CUDA runner requires Python 3.12 or newer, got: $version"
          }
          if ([int]$Matches.minor -lt 12) {
            throw "the self-hosted CUDA runner requires Python 3.12 or newer, got: $version"
          }
      - name: Provision exact public Krea reference snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && inputs.provision_krea_snapshot }}
        shell: powershell
        env:
          KREA_REVISION: ${{ inputs.krea_revision }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_VERBOSITY: "error"
        run: |
          python -m pip install --disable-pip-version-check --no-input 'huggingface_hub==0.36.0'
          @'
          import os
