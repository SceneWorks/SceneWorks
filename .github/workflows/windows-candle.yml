          :capabilities_mismatch
          echo ::error::config/engine-capabilities/capabilities.candle.json differs in capability content from a fresh dump. DOWNLOAD the backend-capability-facts-candle artifact from this run and commit its capabilities.candle.json - this job already produced the authoritative file, so there is no reason to re-dump by hand on a CUDA box. Then run npm run gen:preview-support from apps/web.
