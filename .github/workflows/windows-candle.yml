name: Windows Candle worker

# Compiles AND tests the Rust GPU worker with the native candle (Windows/NVIDIA)
# engines (candle-gen) linked in — the off-Mac counterpart to macos-mlx.yml. The
# candle-gated worker code lives under
# `#[cfg(all(not(target_os = "macos"), feature = "backend-candle"))]`, so neither
# the Linux `parity` job (check.yml, no backend-candle) nor the macOS lane (mlx
# only) ever exercises it. The hosted `build-windows` desktop job COMPILES the
# candle sidecar but runs no worker tests, and server-candle-linux.yml is
# `workflow_dispatch`-only and compile-only. So before this lane, the
# candle-gated drift guard + sampler-knob + engine-map unit tests were validated
# ONLY by hand on the dev box — which let a stale candle test rot red on main
# undetected (sc-5495 → sc-7475; PR #865). This job closes that gap by actually
# RUNNING `cargo test --features backend-candle` on every candle-touching PR.
#
# It also compile-checks the desktop candle SIDECAR here
# (`cargo check -p sceneworks-rust-api --features backend-candle`): the hosted
# desktop-windows.yml lane stopped compiling it on PRs (the full candle/CUDA build
# moved to release/main-only, to keep every PR off the ~20–50 min hosted build).
# This warm box already has CUDA + an incremental target dir, so it's the cheap
# place to catch a candle sidecar build break on the PR instead of at release-tag
# time. (embed-web is left off — it needs a built web bundle; see the step comment.)
#
# And because linking candle is what it takes to produce them, this is the only PR
# lane that can prove `config/engine-capabilities/capabilities.candle.json` is a real
# dump rather than a restamped stale one — the last step in the job (sc-17592), the
# off-Mac mirror of the MLX step in macos-mlx.yml.
#
# RUNS ON A SELF-HOSTED Windows + NVIDIA (CUDA) RUNNER (label `cuda`). GitHub's
# hosted windows runners have no GPU and only compile; a real candle build also
# needs the box's MSVC 14.44 BuildTools toolset (CUDA 12.9's nvcc rejects VS2026's
# 14.51, sc-3676). The runner reuses its `_work` target dir, so candle compiles
# once and is incremental across runs. The real-weight GPU smokes stay `#[ignore]`d
# (the ~logic tests run driver-free); add `-- --ignored` by hand for a GPU pass.
# Exception: `cuda_quant_smoke` (sc-13510) is weightless and fast, so it runs
# un-ignored here — it exercises the patched candle-kernels quant kernels on the
# real GPU every time this lane fires.
#
# Runner prerequisites: Windows 11 + NVIDIA driver, CUDA Toolkit 12.9, VS2022
# BuildTools (MSVC 14.44), a Rust toolchain, registered with the `cuda` label.
#
# SECURITY: this repo is PUBLIC, and GitHub warns against running self-hosted
# runners for public repos because a fork PR could execute arbitrary code on the
# runner. The job-level `if:` below restricts execution to same-repo branches, so
# fork PRs never run here (mirrors macos-mlx.yml). Keep "Require approval for all
# external contributors' workflows" enabled in the repo Actions settings as
# defense in depth.

on:
  push:
    branches: [main]
    paths: &candle_paths
      - "crates/**"
      # NO apps/rust-worker/** here, deliberately — do not re-symmetrise with
      # macos-mlx.yml's anchor (sc-17703). That package (`sceneworks-rust-worker`)
      # is a 4-line binary wrapper over sceneworks-worker with no [features] block
      # and no candle-gated code, nothing in the workspace depends on it, and
      # nothing this job runs builds it: every cargo invocation below is
      # -p sceneworks-worker, -p sceneworks-rust-api or
      # -p sceneworks-memory-adapter. Watching it woke this whole job — a ~24m
      # median run on the `cuda` pool — for zero coverage. The two lanes legitimately
      # differ: macos-mlx.yml's HOSTED macos-checks job runs the bare
      # workspace-wide `cargo test` / `cargo clippy --all-targets` over every
      # default member, which DOES compile the wrapper, so the entry earns its
      # keep there. The contract test in scripts/platform-review-contracts.test.mjs
      # derives all of this from each workflow's own cargo invocations and the
      # Cargo.toml dependency graph, so re-adding the entry here (or narrowing
      # what a lane builds out from under one of its path entries) goes red
      # instead of quietly rotting.
      - "apps/rust-api/**"
      # The builtin model catalog is include_str!'d into the worker and read by the
      # `manifest_menu_is_subset_of_descriptor` drift guard, so a manifest edit can
      # turn the candle suite red — gate on it.
      - "config/manifests/**"
      # The stage-1 candle facts dump this lane is the sole PR-triggered producer of
      # (sc-17592). Without this entry the "real dump, not a restamp" step below is
      # unreachable for the one edit it exists to catch: a restamp touches ONLY
      # config/engine-capabilities/capabilities.candle.json, which matches no other path
      # here, so the lane would not run at all on the PR that made the file wrong. Same
      # gap sc-17119 closed on the macOS side.
      #
      # THIS FILE, not `config/engine-capabilities/**` (sc-17665). The directory glob also
      # matched capabilities.mlx.json, so an mlx-only restamp woke this ENTIRE job — every
      # step below, ~24m median on the `cuda` pool — for a file the verify step never
      # opens. Nothing in this lane reads it: no Rust reads the facts directory at all
      # (`default_facts_dir()` only builds the dumper bin's default OUTPUT path; a repo-wide
      # grep finds no reader), and the three consumers that DO glob the whole directory are
      # all outside this job — `previewSupportCatalog.test.js` runs in check.yml's hosted
      # Linux `web` job, while `generate-preview-support.mjs` and `bump-inference.mjs` are
      # manual developer scripts that no workflow invokes at all.
      #
      # Narrowing costs no coverage. A restamp is the ONLY edit this drops, and it is
      # precisely the edit this lane cannot check; any *material* change to the sibling dump
      # also regenerates config/manifests/builtin.preview-support.jsonc, and
      # `config/manifests/**` above still wakes both lanes. Path filters match DELETES and
      # ADDS as well as modifications, so a restamp, a delete or a re-add of this file still
      # triggers the lane, and a rename is a delete+add that still matches.
      - "config/engine-capabilities/capabilities.candle.json"
      # The AUDIO dump, which the verify step below ALSO diffs (sc-17593). Both lanes read this one,
      # because `AUDIO_BACKEND` is candle on every platform and either box can produce it -- so
      # unlike the sibling media file, waking this job for it is not a wasted run: the step opens it.
      #
      # sc-17665 narrowed the entry above from `config/engine-capabilities/**` to a single filename,
      # and that landed while sc-17593 was in flight. The two are individually correct and combine
      # badly: the audio verification was added to a step whose trigger paths had just stopped
      # matching the audio file. Demonstrated on `97a7655a9`, an audio-only re-dump that woke neither
      # stage-1 lane -- declared but unreachable, for exactly the edit the step exists to catch.
      - "config/engine-capabilities/audio/capabilities.candle.json"
      - "Cargo.toml"
      - "Cargo.lock"
      # The toolchain and cargo-config seams (sc-17703, Michael's call — these are
      # UNDER-trigger fixes that deliberately spend box time on two rare-edit,
      # high-blast-radius files whose breakage would otherwise merge green and red
      # main misattributed). This lane runs no rust-toolchain action: cargo in-repo
      # auto-selects the toolchain rust-toolchain.toml pins (see the step comment
      # below), so a bump changes what this entire job compiles with. And
      # .cargo/config.toml carries `git-fetch-with-cli = true`, which routes every
      # git dependency fetch (including the pinned inference release) through the
      # system git rather than cargo's built-in transport — so an edit there
      # changes how this lane resolves its dependencies. The
      # channel is a concrete version, never floating `stable` (sc-17717): a
      # toolchain change is therefore always an edit to that file, which this
      # entry turns into a run of this lane — and the contract test keeps every
      # workflow's dtolnay `toolchain:` input in lockstep with the pin. When
      # bumping, pre-install the new version on this box first; see the bump
      # recipe in rust-toolchain.toml.
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/actions/prepare-rust-runner/**"
      - ".github/workflows/windows-candle.yml"
  pull_request:
    branches: [main]
    paths: *candle_paths
  # PROVISIONING IS MODEL-PARAMETERIZED (sc-18677). It used to be hardcoded to the Krea q4
  # reference: a `provision_krea_snapshot` boolean, a `snapshot_download` literal naming
  # `SceneWorks/krea-2-turbo-mlx` with `allow_patterns=["q4/**"]`, and a resolve step that
  # rebuilt `models--SceneWorks--krea-2-turbo-mlx\snapshots\<rev>\q4` by hand. The machinery
  # was sound; only the model was welded in. Epic 17137 needs the same machinery pointed at
  # `MiniMaxAI/MiniMax-H3` so sc-17153/sc-17156 can measure per-tier VRAM on real weights.
  #
  # The Krea inputs were RENAMED, not duplicated, so there is exactly one provisioning path:
  #   provision_krea_snapshot -> provision_snapshot
  #   krea_repository         -> provision_repository   (same default)
  #   krea_revision           -> provision_revision
  # A Krea five-rung dispatch that sets only run_five_rung_reference / provision_snapshot /
  # provision_revision / inference_revision leaves every provision_* default in place and
  # resolves byte-identically to the old hardcoded path. `platform-review-contracts.test.mjs`
  # pins that equivalence field by field so it cannot rot.
  #
  # The `SCENEWORKS_KREA_*` env names below are NOT renamed: they are the memory-adapter
  # binary's contract (`crates/sceneworks-memory-adapter/src/bin/{candle,mlx}.rs` read them
  # via `required_env`), so renaming them would break the five-rung capture at runtime.
  #
  # GitHub caps workflow_dispatch at 10 inputs. Renaming rather than adding a parallel
  # provision_* family is what keeps this at 8 with room for the epic's later stories.
  workflow_dispatch:
    inputs:
      run_five_rung_reference:
        description: "Capture the SC-16402 Krea fresh-process five-rung reference"
        required: false
        type: boolean
        default: false
      provision_snapshot:
        description: "Provision the exact snapshot named by the provision_* inputs (defaults to the Krea q4 reference)"
        required: false
        type: boolean
        default: false
      inference_revision:
        description: "Exact 40-hex inference revision pinned by the adapter"
        required: false
        type: string
      provision_repository:
        description: "Hugging Face repo id to provision, owner/name (was krea_repository)"
        required: false
        type: string
        default: "SceneWorks/krea-2-turbo-mlx"
      provision_revision:
        description: "Exact 40-hex artifact revision to provision (was krea_revision)"
        required: false
        type: string
      provision_patterns:
        description: "Allow-patterns, one component per line or comma-separated (e.g. transformer/*). Default is the Krea q4 tier."
        required: false
        type: string
        default: "q4/**"
      provision_subdir:
        description: "Tier/subdirectory under the snapshot the resolve step must prove. Use '.' for a model whose components sit at the snapshot ROOT (H3); an empty value cannot override this default."
        required: false
        type: string
        default: "q4"
      provision_cache_dir:
        description: "Hub cache dir. Empty uses %USERPROFILE%\\.cache\\huggingface\\hub, the historical Krea location."
        required: false
        type: string

# Cancel superseded PR runs, but never cancel a main-push run: this lane is the
# ONLY thing that compiles the candle-gated worker code, so a main commit whose
# run is killed carries no candle verdict at all and a later break is misattributed
# to the next commit (sc-12399 — 8 of 30 main runs cancelled over one 37h window).
#
# The group KEY is what does the work here, not just cancel-in-progress. GitHub
# allows at most ONE pending run per concurrency group and cancels the previously
# pending run when a new one queues, so keying main on `github.ref` would still
# drop the middle commit of any 3+ merge burst (A runs, B pends, C evicts B) even
# with cancel-in-progress off. Keying main on `github.sha` puts every commit in its
# own group, where nothing can evict it; runs then serialize on the single
# self-hosted box instead. Do NOT collapse this back to `group: ...${{ github.ref }}`.
#
# COST, re-measured 2026-08-05 over 85 completed `candle-worker` jobs in a 29.5h
# window. This block previously claimed "~4.2m median (p90 4.5m)" and "the box sits
# ~12% utilized". Both were wrong by the time anyone read them: duration was ~6x low,
# and "the box" described a single machine that does not exist.
#
#   job duration   median 24.1m   p90 31.9m   max 44.0m   min 8.2m
#   queue wait     median  0.1m   p90 18.0m   max 55.5m
#   pool           FOUR runners carried the `cuda` label over that window
#                  (cuda-windows, -2, -3, -4), load spread evenly across them:
#                  23/18/22/22 jobs, 516/424/591/537 busy minutes
#   utilization    ~29% per box
#
# THE CONCLUSION IS UNCHANGED — keeping main-push runs uncancelled is affordable, and
# with more headroom than the old numbers implied. Only the magnitudes were wrong, and
# they were wrong in both directions at once (each run costs ~6x more than stated; there
# are ~4x more boxes to absorb it). Do not read the correction as "this lane got cheap".
#
# `queue: max` would be the other way to do this, but it cannot combine with
# `cancel-in-progress: true`, which the PR side still wants.
#
# RE-MEASURE; DO NOT TRUST THESE NUMBERS ON SIGHT. They went ~6x stale without anyone
# noticing, because nothing recomputes them and no test can — they describe fleet state,
# not repo content. Method, so the next re-measure is comparable:
#   * duration = repo-scoped jobs API `started_at` -> `completed_at`. Do NOT use
#     `gh run list`'s createdAt -> updatedAt: that folds queue wait into run time and
#     reports ~50m for a 24m job, which is how a wrong number gets quoted confidently.
#   * exclude `cancelled` runs — they truncate low and drag the median down.
#   * pool size = `gh api repos/{owner}/{repo}/actions/runners`. It is NOT fixed: two of
#     the four boxes above were no longer online hours after this measurement, so quote
#     the pool size and date together or the utilization figure means nothing.
#
# WHERE THE ~24m ACTUALLY GOES, and why the obvious saving is not one (sc-17820).
# Step-level `started_at` -> `completed_at` from the jobs API, five runs on 2026-08-05/06
# (31055081046, 31057684283, 31058077337, 31059604369, 31060918014). Those five ran
# 18.0 - 25.8m end to end; the 24.1m median above is over 85 runs, so do not expect this
# table to sum to it. Ranges are truncated to 0.1m, which always understates a max.
#
#   Fetch the pinned inference release           3.5 - 8.8m
#   Test the candle GPU worker (backend-candle)  3.6 - 5.6m
#   Check the candle sidecar builds (rust-api)   2.5 - 4.0m
#   Check and test the candle memory adapter     4.5 - 6.7m
#   Clippy (candle worker)                       0.5 - 1.0m
#   Verify capabilities.candle.json              0.7 - 0.9m
#
# IT IS ALL COMPILATION AND FETCHING. Inside the test step the split is stark and stable
# across all five runs -- `Finished test profile in 3m 23s .. 5m 15s`, then:
#
#   running 1317 tests ... test result: ok. 1274 passed; 43 ignored; finished in 7.6s
#
# So `cargo test -p sceneworks-worker --features backend-candle` spends 3-5 MINUTES
# building and 7.6 SECONDS running. sc-17820 proposed narrowing the PR invocation to the
# ~127 candle-exclusive tests on the grounds that the other ~92% are covered by `parity`
# and `macos-checks`. REJECTED, on four measured counts:
#   1. A libtest filter changes nothing about what cargo builds. The crate, all its
#      targets and the whole candle graph still compile; the saving is bounded above by
#      that 7.6s, i.e. ~0.5% of the job. The lane would still be ~24m.
#   2. Narrowing by TARGET (`--lib`, or naming individual `--test`s) would drop build
#      work, but drops the wrong things: the four integration targets cost seconds in
#      total, and `--lib` would discard `cuda_quant_smoke` (0.18s, the sc-13510 quant-
#      kernel scar, deliberately un-`#[ignore]`d here) and `candle_kernels_patch_guard`
#      -- the two targets whose whole reason to exist is that only this box runs them.
#      For scale: `Clippy (candle worker) --all-targets` costs 31 - 63s warm at the end
#      of this same job, so the extra targets are not where the minutes are.
#   3. It therefore does NOT make sc-17014 option (B) -- require this lane on the merge
#      queue -- viable. That was the story's actual prize, and the arithmetic (p90 18.0m
#      queue + p90 31.9m run vs the 60m `check_response_timeout_minutes`) is untouched.
#   4. The ~92% figure is a static `#[test]` count, and the lanes disagree with it. What
#      each lane's `sceneworks_worker` lib binary actually reports (runs 31061431547 and
#      31060918026, same day):
#
#        parity (hosted ubuntu, bare `cargo test`)   737 tests
#        macos-checks (hosted macos-26)             1595 tests
#        this lane (--features backend-candle)      1317 tests
#
#      `parity` runs 737 of this lane's 1317, so at most ~56% can be parity-covered, not
#      92%. The gap is real code: `include!("image_jobs/base.rs")` is itself cfg-gated on
#      `any(macos, backend-candle)` (image_jobs.rs), so `parity` never compiles that file,
#      and its 207 `#[cfg]` attributes split macOS bodies from `backend-candle` ones --
#      `macos-checks` compiles the macOS arm, nothing but this lane RUNS the candle arm.
#      (check.yml's hosted `candle` job does compile the candle cfg with `--all-targets`
#      clippy, but cannot run it -- see scripts/check-candle-build.mjs.) Narrowing here
#      would drop uncovered configurations to buy back seconds.
# If this lane needs to get cheaper, the levers are the FETCH step (a job-local CARGO_HOME
# under RUNNER_TEMP is re-downloaded every run -- see "Isolate Cargo dependency checkout")
# and the three separate compile graphs, not the test filter.
concurrency:
  group: windows-candle-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candle-worker:
    # Same-repo only — never execute untrusted fork code on the self-hosted runner.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # A provisioning or five-rung dispatch additionally requires `real-weights`; ordinary PR and
    # push runs keep the full `cuda` pool (sc-18677). This mirrors macos-mlx.yml:450 exactly, which
    # adds `weights` for `run_memory_calibration || run_five_rung_reference` and is the convention
    # this lane was missing -- the asymmetry epic 17137 recorded as "no weights label and no HF
    # provisioning input, unlike the Mac lane".
    #
    # It matters because the `cuda` pool is FOUR runners across TWO registration levels: org-level
    # `cuda-windows` / `cuda-windows-2` carry `real-weights`, repo-level `cuda-windows-3` /
    # `cuda-windows-4` do NOT. All four happen to be listener processes on the same physical box
    # today, so this narrowing changes nothing observable right now. It is what keeps a weights job
    # correct the day a `cuda` runner is added on a second machine: without it the job lands on a
    # box with no snapshot and fails at the resolve step, which is loud but wasteful; with it the
    # job simply queues for a box that has the weights.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (inputs.provision_snapshot || inputs.run_five_rung_reference)) && fromJSON('["self-hosted","Windows","X64","cuda","real-weights"]') || fromJSON('["self-hosted","Windows","X64","cuda"]') }}
    env:
      # Native sm_120 (Blackwell) — this runner IS the RTX PRO 6000 box; nvcc emits
      # SASS directly (no load-time JIT). compute_80 PTX would also forward-JIT.
      CUDA_COMPUTE_CAP: "120"
      CARGO_NET_OFFLINE: "true"
    # Guardrail so a wedged step fails fast instead of riding GitHub's 6-hour
    # default (sc-10420). This lane is the SOLE self-hosted cuda box and
    # serializes main-push runs (github.sha concurrency), so a wedge here holds
    # that box and starves every queued PR/main run on it until the cap fires
    # (sc-13603). Well above the healthy ~11-14 min build+test+clippy — a cold
    # candle-kernels (nvcc) rebuild still fits comfortably.
    #
    # Provisioning now keys the 240m budget on its OWN input rather than on the five-rung
    # conjunction (sc-18677): a provision-only dispatch is a supported mode, and H3's
    # component set is 144.051 GB (210.332 GB once transformer_ref joins in sc-17149) against
    # Krea q4's ~14 GB, so it is the branch that most
    # needs the long budget. Krea's two dispatch shapes keep their exact previous values --
    # five-rung + provision 240, five-rung alone 120, everything else 45.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.provision_snapshot && 240 || github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && 120 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # sc-13166: point this lane at the REAL rustup toolchain bin and prepend it to
      # PATH, so cargo/rustc/clippy never dispatch through the fragile
      # %USERPROFILE%\.cargo\bin proxies (0-byte symlinks -> rustup.exe that go dangling
      # when rustup self-updates or its rustup.exe is deleted, or that fail to launch as
      # symlinks in the runner's Windows-service context — both surface as the cryptic
      # Windows ERROR_NO_ASSOCIATION at `cargo fetch` and turned every PR red, forcing
      # admin-override merges). The action fails loudly with an actionable message if no
      # usable toolchain is installed. See .github/actions/prepare-rust-runner.
      - uses: ./.github/actions/prepare-rust-runner
      # The shared runner exports RUSTC_WRAPPER=sccache. The prep action correctly clears a
      # missing wrapper, but an installed daemon can still reset its local connection mid-build
      # (Windows os error 10054), observed independently in both the backend-candle test and the
      # sidecar check. This is the repository's heaviest Rust/CUDA lane, so make rustc direct and
      # deterministic for this job only. Cargo registry/git/target caches remain intact; sibling
      # workflows may continue using sccache.
      - name: Disable unstable sccache wrapper for the heavy Candle lane
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value 'RUSTC_WRAPPER='
          Remove-Item Env:RUSTC_WRAPPER -ErrorAction SilentlyContinue
      # Multiple runner services share %USERPROFILE%\.cargo. A sibling job can replace
      # that global git checkout while rustc is still reading vendored inference sources,
      # which surfaces as an unrelated missing-path/os-error-267 failure. Keep dependency
      # state job-local; the verified toolchain remains on PATH from the step above.
      - name: Isolate Cargo dependency checkout
        shell: powershell
        run: |
          $jobCargoHome = Join-Path $env:RUNNER_TEMP 'cargo-home'
          New-Item -ItemType Directory -Force -Path $jobCargoHome | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_HOME=$jobCargoHome"
      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      # No rust-toolchain action: the self-hosted box has rustup + the repo's
      # `rust-toolchain.toml`-pinned toolchain (incl. clippy) pre-installed, and the
      # action's bash step breaks here — `bash` resolves to the box's WSL stub, not
      # Git Bash. cargo in-repo auto-selects the pinned toolchain.
      # nvcc needs the MSVC 14.44 host compiler (NOT VS2026 14.51, which CUDA 12.9
      # rejects). Load the BuildTools vcvars in-shell, then build+test in the same
      # cmd invocation so the toolchain env survives (each step is a fresh shell).
      - name: Test the candle GPU worker (backend-candle)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo test -p sceneworks-worker --features backend-candle
      # PR guard for the desktop candle SIDECAR the hosted lane no longer builds on
      # PRs (see header). `cargo check` runs the build scripts (incl. the nvcc kernel
      # compile) and typechecks the full graph, so a candle sidecar build break is
      # caught on the PR — cheap here on the warm, CUDA-equipped box.
      #
      # NB: `embed-web` is intentionally OMITTED. It embeds apps/web/dist via
      # rust-embed (with `debug-embed`, so it embeds at compile time even under
      # `cargo check`), which requires a built web bundle — this lane never runs a
      # web build, so including it fails with "no `get` on WebAssets". embed-web is
      # orthogonal to candle (static-serving glue) and is compiled on the push:main /
      # release.yml package builds, where web/dist exists. (Release-only codegen/link
      # breaks also still surface first in those builds.)
      - name: Check the candle sidecar builds (rust-api, backend-candle)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo check -p sceneworks-rust-api --features backend-candle
      # PR guard for the Candle memory-calibration adapter binary (epic 15448). Like the
      # candle-gated worker code it is invisible to every other lane: `src/bin/candle.rs` is
      # `compile_error!` on macOS, macos-mlx.yml builds only `--bin memory-mlx-adapter`, and the
      # Linux candle lane is workflow_dispatch-only. Before this step a break in it stayed hidden
      # until someone ran Candle calibration on a CUDA host — which is exactly where this epic's
      # downstream Candle stories start (sc-15804 review: an exhaustive
      # `MemoryStrategyParameters` literal here went stale against the inference contract with
      # nothing to catch it). Keep both the production typecheck and the binary's CUDA-only unit
      # tests here: the batching contamination guard cannot be compiled or exercised on macOS.
      - name: Check and test the candle memory adapter (memory-candle-adapter)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo check -p sceneworks-memory-adapter --features candle --bin memory-candle-adapter
          cargo test -p sceneworks-memory-adapter --features candle --bin memory-candle-adapter
      # Two independent validations, in one step because both are pure input checks.
      #
      # (1) PROVISIONING. `provision_snapshot` no longer requires `run_five_rung_reference`
      # (sc-18677). The old throw existed because provisioning had exactly one consumer -- the
      # Krea capture -- so provisioning without it was necessarily a mistake. Epic 17137 makes
      # provisioning a first-class outcome: sc-17153/sc-17156 need H3 weights resident on this
      # box, and there is no H3 five-rung fixture to run. Everything the old guard actually
      # protected is still enforced, just against the generalized inputs.
      #
      # `provision_subdir` is validated for CONTAINMENT here, not merely for shape. The resolve
      # step joins it onto the cache path, and the same trap sc-17139 documented for the
      # manifest `subdir` key applies verbatim: `..` is spelled entirely from characters a
      # naive path pattern allows. The EndsWith assertion downstream already fails closed on a
      # traversal (Resolve-Path normalizes `..` away, so the suffix stops matching), but a
      # rejected input gives the operator the real reason instead of a confusing path mismatch.
      #
      # (2) FIVE-RUNG. Unchanged in substance -- still an exact 40-hex inference revision, an
      # exact 40-hex artifact revision, the fixed Krea repository, and an INFERENCE_PIN match.
      # Only the input NAMES moved (krea_revision -> provision_revision, krea_repository ->
      # provision_repository), so a five-rung dispatch is rejected under exactly the same
      # conditions as before.
      - name: Validate dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: powershell
        env:
          RUN_FIVE_RUNG_REFERENCE: ${{ inputs.run_five_rung_reference }}
          PROVISION_SNAPSHOT: ${{ inputs.provision_snapshot }}
          INFERENCE_REVISION: ${{ inputs.inference_revision }}
          PROVISION_REPOSITORY: ${{ inputs.provision_repository }}
          PROVISION_REVISION: ${{ inputs.provision_revision }}
          PROVISION_PATTERNS: ${{ inputs.provision_patterns }}
          PROVISION_SUBDIR: ${{ inputs.provision_subdir }}
          PROVISION_CACHE_DIR_INPUT: ${{ inputs.provision_cache_dir }}
        run: |
          # Gate on the SAME condition as the steps that consume these values (the params and
          # resolve steps run on `run_five_rung_reference || provision_snapshot`), not on
          # provision_snapshot alone. Scoping the containment checks to the provisioning branch
          # left them unreachable for a five-rung-only dispatch, which consumes provision_subdir
          # and provision_patterns just the same -- it failed closed downstream on the EndsWith
          # assertion, but reported a confusing path mismatch instead of the real reason.
          if ($env:PROVISION_SNAPSHOT -eq 'true' -or $env:RUN_FIVE_RUNG_REFERENCE -eq 'true') {
            if ($env:PROVISION_REPOSITORY -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$') {
              throw 'provision_repository must be a Hugging Face owner/name repo id'
            }
            if ($env:PROVISION_REVISION -notmatch '^[0-9a-f]{40}$') {
              throw 'provision_revision must be an exact lowercase 40-hex artifact revision'
            }
            $patterns = @($env:PROVISION_PATTERNS -split '[,\r\n]' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            if ($patterns.Count -eq 0) {
              throw 'provision_patterns must name at least one allow-pattern; an empty list would fetch the whole repository'
            }
            # Each pattern's leading literal segment is joined onto the snapshot root by the
            # resolve step's component-presence assertion. Without containment, `../../foo/*` lets
            # that assertion be satisfied by a directory outside the snapshot entirely -- which
            # is the one assertion that makes a root-resolved model's proof real.
            #
            # Validate the HEAD, computed with the identical expression the resolve step uses, and
            # decide containment by CANONICALIZING rather than by matching path segments. Textual
            # segment-equality is the wrong tool on Windows and was demonstrably bypassable two
            # ways: `..*` yields head `..` while the pattern itself contains no `..` segment
            # (moving the wildcard one character left defeats a check on `$pattern`), and `.. `
            # survives `-contains '..'` yet Win32 strips trailing spaces and dots from path
            # components, so it resolves to the parent anyway. GetFullPath collapses every such
            # spelling, including the ones nobody has thought of yet.
            $probe = Join-Path 'C:\__sw_containment_probe__' 'snapshot'
            foreach ($pattern in $patterns) {
              if ($pattern -match '^[\\/]' -or $pattern -match '^[A-Za-z]:') {
                throw "provision_patterns entries must be relative to the snapshot root: $pattern"
              }
              $head = (($pattern -split '[\*\?\[]')[0]).TrimEnd('/')
              if (-not $head) { continue }
              # TWO checks, because neither alone is sufficient.
              #
              # (a) Segment shape. Win32 strips trailing spaces and dots from every path
              # component, so `.. ` names the parent while comparing equal to nothing -- and
              # [System.IO.Path]::GetFullPath does NOT strip it, so (b) alone accepts it. Any
              # segment that is empty once trailing dots and spaces are removed is a disguised
              # `.`/`..` and has no legitimate use in a component name.
              foreach ($segment in ($head -split '[\\/]')) {
                if (-not $segment.TrimEnd(' ', '.')) {
                  throw "provision_patterns entries must not traverse out of the snapshot: $pattern"
                }
              }
              # (b) Canonical containment, which catches every ordinary spelling including the
              # wildcard-adjacent ones a check on `$pattern` misses (`..*` has head `..` while the
              # pattern itself contains no `..` segment).
              $full = [System.IO.Path]::GetFullPath((Join-Path $probe $head.Replace('/', '\')))
              if (-not $full.StartsWith($probe + '\', [StringComparison]::OrdinalIgnoreCase)) {
                throw "provision_patterns entries must not traverse out of the snapshot: $pattern"
              }
            }
            if ($env:PROVISION_SUBDIR) {
              # The shape regex alone is NOT containment: '.' is inside the character class, so
              # '..' matches it. The -contains check below is load-bearing.
              if ($env:PROVISION_SUBDIR -notmatch '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$') {
                throw 'provision_subdir must be a relative path of [A-Za-z0-9._-] segments'
              }
              if (($env:PROVISION_SUBDIR -split '/') -contains '..') {
                throw 'provision_subdir must not traverse out of the snapshot'
              }
            }
            if ($env:PROVISION_CACHE_DIR_INPUT) {
              # This value is written verbatim into $GITHUB_ENV, where a newline would inject
              # arbitrary job-scoped variables into every later step.
              if ($env:PROVISION_CACHE_DIR_INPUT -match '[\r\n]') {
                throw 'provision_cache_dir must be a single line'
              }
              # NOT IsPathRooted: it accepts `\foo` and `C:foo`, which are rooted but not
              # absolute, so the check would not mean what its message says. .NET Framework 4.x
              # (PowerShell 5.1) has no IsPathFullyQualified, hence the explicit drive pattern.
              if ($env:PROVISION_CACHE_DIR_INPUT -notmatch '^[A-Za-z]:\\') {
                throw 'provision_cache_dir must be an absolute path with a drive letter'
              }
            }
          }
          if ($env:RUN_FIVE_RUNG_REFERENCE -ne 'true') { exit 0 }
          if ($env:INFERENCE_REVISION -notmatch '^[0-9a-f]{40}$') {
            throw 'inference_revision must be an exact lowercase 40-hex commit'
          }
          if ($env:PROVISION_REPOSITORY -ne 'SceneWorks/krea-2-turbo-mlx') {
            throw 'provision_repository must be the fixed SceneWorks/krea-2-turbo-mlx reference artifact for a five-rung capture'
          }
          $pinLine = Select-String -Path 'crates/sceneworks-memory-adapter/src/lib.rs' -Pattern '^pub const INFERENCE_PIN: &str = "([0-9a-f]{40})";$'
          if (-not $pinLine -or $pinLine.Matches[0].Groups[1].Value -ne $env:INFERENCE_REVISION) {
            throw "input inference_revision does not match the adapter's compiled INFERENCE_PIN"
          }
      # Derives the cache dir and the exact snapshot suffix ONCE, so the provisioning step and
      # the resolve step below cannot drift apart on where the snapshot is meant to land. That
      # drift is the concrete failure this centralizes away: before sc-18677 the cache path
      # `%USERPROFILE%\.cache\huggingface\hub` was written out twice, in two different
      # languages (a Python `os.path.join` and a PowerShell `Join-Path`), and nothing tied them.
      #
      # The empty-input default reproduces the old hardcoded location EXACTLY, and deliberately
      # ignores HF_HOME even though this box sets it (E:\huggingface). Honoring HF_HOME would
      # silently relocate Krea's cache and break the "behaves identically" contract; a caller
      # that wants another cache passes provision_cache_dir explicitly.
      - name: Resolve snapshot provisioning parameters
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_five_rung_reference || inputs.provision_snapshot) }}
        shell: powershell
        env:
          PROVISION_REPOSITORY: ${{ inputs.provision_repository }}
          PROVISION_REVISION: ${{ inputs.provision_revision }}
          PROVISION_SUBDIR: ${{ inputs.provision_subdir }}
          PROVISION_CACHE_DIR_INPUT: ${{ inputs.provision_cache_dir }}
        run: |
          $cache = $env:PROVISION_CACHE_DIR_INPUT
          if (-not $cache) { $cache = Join-Path $env:USERPROFILE '.cache\huggingface\hub' }
          $folder = 'models--' + $env:PROVISION_REPOSITORY.Replace('/', '--')
          # '.' is the ROOT sentinel, and it is load-bearing rather than cosmetic. GitHub applies
          # an input's `default` whenever the dispatch supplies an empty value, so
          # `-f provision_subdir=` does NOT mean "no subdir" -- it silently becomes `q4`. Run
          # 31509409586 proved it: H3 provisioned correctly, then the resolve step looked for
          # ...\snapshots\939557dc...\q4 and threw. Because the default has to stay `q4` to keep a
          # Krea dispatch identical, a model whose components sit at the snapshot root is
          # otherwise INEXPRESSIBLE. Empty is still honored for any caller that can send it.
          $subdirTail = ''
          if ($env:PROVISION_SUBDIR -and $env:PROVISION_SUBDIR -ne '.') {
            $subdirTail = '\' + $env:PROVISION_SUBDIR.Replace('/', '\')
          }
          $suffix = '\' + $folder + '\snapshots\' + $env:PROVISION_REVISION + $subdirTail
          Add-Content -Path $env:GITHUB_ENV -Value "PROVISION_CACHE_DIR=$cache"
          Add-Content -Path $env:GITHUB_ENV -Value "PROVISION_SNAPSHOT_SUFFIX=$suffix"
          Add-Content -Path $env:GITHUB_ENV -Value "PROVISION_SUBDIR_TAIL=$subdirTail"
          Write-Host "cache dir       : $cache"
          Write-Host "snapshot suffix : $suffix"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        with:
          node-version: 22
      - name: Validate runner Python for snapshot provisioning
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.provision_snapshot }}
        shell: powershell
        run: |
          $version = python --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^Python 3\.(?<minor>\d+)\.') {
            throw "the self-hosted CUDA runner requires Python 3.12 or newer, got: $version"
          }
          if ([int]$Matches.minor -lt 12) {
            throw "the self-hosted CUDA runner requires Python 3.12 or newer, got: $version"
          }
      # ONE allow-pattern per component, never a bare repo fetch. MiniMaxAI/MiniMax-H3 is
      # 498.475 GB because it ships the root (modular) layout plus FL2VA/ and Ref2VA/ partition
      # re-packagings of the same components; only the root layout is referenced by
      # `modular_model_index.json` and only it is the conversion source (sc-17139 section 2).
      # Fetching by component takes that to 210.332 GB, and to 144.051 GB for the set sc-18677
      # actually provisions (transformer_ref is sc-17149's, deferred). Note this is the OPPOSITE of the rule for
      # `config/manifests` download rows, where an empty `files` list (whole repo) is correct --
      # those name SceneWorks-built artifacts that contain only what a user needs, whereas this
      # provisions a third-party repo with three overlapping copies of every component.
      - name: Provision exact snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.provision_snapshot }}
        shell: powershell
        env:
          PROVISION_REPOSITORY: ${{ inputs.provision_repository }}
          PROVISION_REVISION: ${{ inputs.provision_revision }}
          PROVISION_PATTERNS: ${{ inputs.provision_patterns }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_VERBOSITY: "error"
        run: |
          python -m pip install --disable-pip-version-check --no-input 'huggingface_hub==0.36.0'
          if ($LASTEXITCODE -ne 0) { throw "installing huggingface_hub failed with exit code $LASTEXITCODE" }
          @'
          import os
          from huggingface_hub import snapshot_download

          patterns = [p.strip() for p in os.environ["PROVISION_PATTERNS"].replace(",", "\n").splitlines() if p.strip()]
          if not patterns:
              raise SystemExit("provision_patterns resolved to an empty allow-list")

          repo = os.environ["PROVISION_REPOSITORY"]
          revision = os.environ["PROVISION_REVISION"]
          path = snapshot_download(
              repo_id=repo,
              repo_type="model",
              revision=revision,
              allow_patterns=patterns,
              cache_dir=os.environ["PROVISION_CACHE_DIR"],
              token=False,
              max_workers=4,
          )
          print(f"Exact public snapshot provisioned: {repo}@{revision}")
          print(f"  path: {path}")
          for pattern in patterns:
              print(f"  allow-pattern: {pattern}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "snapshot provisioning failed with exit code $LASTEXITCODE" }
      # Proves the EXACT snapshot path and fails loudly if absent. Three assertions, not one:
      #   1. the resolved directory exists;
      #   2. its canonical path ends with \models--<owner>--<name>\snapshots\<revision>[\<subdir>],
      #      so a stale cache entry, a different revision or a lookalike repo cannot satisfy it;
      #   3. every provisioned component directory is present under the SNAPSHOT root.
      # (3) is what makes this a real proof for a root-resolved model. With provision_subdir
      # empty the snapshot directory exists as soon as ANY file is fetched -- a README alone
      # would pass assertions 1 and 2 while every weight was missing. Checking the leading
      # literal segment of each allow-pattern closes that. For Krea it is exactly equivalent to
      # the pre-existing check (the sole pattern `q4/**` yields `<snapshot>\q4`, which IS the
      # resolved root), so it adds no new way for a Krea dispatch to fail.
      - name: Resolve exact snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_five_rung_reference || inputs.provision_snapshot) }}
        shell: powershell
        env:
          PROVISION_REPOSITORY: ${{ inputs.provision_repository }}
          PROVISION_PATTERNS: ${{ inputs.provision_patterns }}
          KREA_ROOT_OVERRIDE: ${{ secrets.SCENEWORKS_KREA_ROOT }}
        run: |
          $isKrea = $env:PROVISION_REPOSITORY -eq 'SceneWorks/krea-2-turbo-mlx'
          if ($isKrea -and $env:KREA_ROOT_OVERRIDE) {
            $root = $env:KREA_ROOT_OVERRIDE
          } else {
            $root = Join-Path $env:PROVISION_CACHE_DIR $env:PROVISION_SNAPSHOT_SUFFIX.TrimStart('\')
          }
          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "the exact snapshot is not available on this runner: $root"
          }
          $root = (Resolve-Path -LiteralPath $root).Path
          if (-not $root.EndsWith($env:PROVISION_SNAPSHOT_SUFFIX, [StringComparison]::OrdinalIgnoreCase)) {
            throw "the resolved root does not match the requested repository and exact revision: $root"
          }
          $snapshotRoot = $root
          if ($env:PROVISION_SUBDIR_TAIL) {
            $snapshotRoot = $root.Substring(0, $root.Length - $env:PROVISION_SUBDIR_TAIL.Length)
          }
          $missing = @()
          foreach ($pattern in ($env:PROVISION_PATTERNS -split '[,\r\n]' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
            $head = ($pattern -split '[\*\?\[]')[0]
            $head = $head.TrimEnd('/')
            if (-not $head) { continue }
            $component = Join-Path $snapshotRoot $head.Replace('/', '\')
            # Canonical containment, independently of the validation step. -LiteralPath suppresses
            # globbing, NOT Win32 path normalization, so a probe must be proven to land inside the
            # snapshot before its existence means anything.
            $full = [System.IO.Path]::GetFullPath($component)
            if (-not $full.StartsWith($snapshotRoot + '\', [StringComparison]::OrdinalIgnoreCase)) {
              throw "declared component escapes the snapshot root: $pattern"
            }
            if (-not (Test-Path -LiteralPath $component)) { $missing += $head }
          }
          if ($missing.Count -gt 0) {
            throw "provisioned snapshot is missing declared components under ${snapshotRoot}: $($missing -join ', ')"
          }
          Write-Host "resolved snapshot root: $root"
          # The model-neutral handle. Nothing in the repo reads it YET -- it is the seam
          # sc-17153/sc-17156 need, since SCENEWORKS_KREA_ROOT is a Krea-shaped name their
          # MiniMax measurement steps cannot reuse. Exported without an $isKrea guard so a provision-only
          # dispatch still names its snapshot to any step added after it.
          "SCENEWORKS_PROVISIONED_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($isKrea) {
            "SCENEWORKS_KREA_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Check out the exact inference reference source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_revision }}
          token: ${{ secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
          path: .calibration/inference
          persist-credentials: false
      - name: Build and run the authoritative Candle five-rung reference
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        shell: cmd
        env:
          # Env names are the memory-adapter binary's contract and are deliberately NOT
          # renamed alongside the dispatch inputs; see the workflow_dispatch header.
          SCENEWORKS_KREA_REPOSITORY: ${{ inputs.provision_repository }}
          SCENEWORKS_KREA_REVISION: ${{ inputs.provision_revision }}
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          echo .calibration/>>.git\info\exclude
          cargo build --release --locked -p sceneworks-memory-adapter --features candle --bin memory-candle-adapter
          node scripts\memory-calibration-harness.mjs run --config config\memory-calibration-plan.json --backend candle --fixture fresh-five-rung-krea-q4-1024-seed16402-step2 --fresh-per-case --provider-command "[\"target/release/memory-candle-adapter.exe\"]" --sceneworks-repo "%GITHUB_WORKSPACE%" --inference-repo "%GITHUB_WORKSPACE%\.calibration\inference" --output "%RUNNER_TEMP%\sc-16059-candle-fresh.json"
          node scripts\memory-calibration-harness.mjs run --config config\memory-calibration-plan.json --backend candle --fixture fresh-five-rung-krea-q4-1024-seed16402-step2 --batch-rungs --provider-command "[\"target/release/memory-candle-adapter.exe\"]" --sceneworks-repo "%GITHUB_WORKSPACE%" --inference-repo "%GITHUB_WORKSPACE%\.calibration\inference" --output "%RUNNER_TEMP%\sc-16059-candle-reused.json"
          node scripts\memory-calibration-harness.mjs check --input "%RUNNER_TEMP%\sc-16059-candle-fresh.json"
          node scripts\memory-calibration-harness.mjs check --input "%RUNNER_TEMP%\sc-16059-candle-reused.json"
          node scripts\memory-calibration-harness.mjs compare-reuse --fresh "%RUNNER_TEMP%\sc-16059-candle-fresh.json" --reused "%RUNNER_TEMP%\sc-16059-candle-reused.json" --output "%RUNNER_TEMP%\sc-16059-candle-reuse-comparison.json"
          node -e "const a=require(process.argv[1]); console.log(JSON.stringify(a,null,2)); if(!['amortizable','unable_to_amortize'].includes(a.verdict)) throw new Error('unexpected Candle reuse verdict: '+a.verdict)" "%RUNNER_TEMP%\sc-16059-candle-reuse-comparison.json"
      - name: Upload raw schema-checked Candle five-rung reference
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc-16059-candle-reuse-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sc-16059-candle-fresh.json
            ${{ runner.temp }}/sc-16059-candle-reused.json
            ${{ runner.temp }}/sc-16059-candle-reuse-comparison.json
          if-no-files-found: error
      - name: Clippy (candle worker)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo clippy -p sceneworks-worker --features backend-candle --all-targets -- -D warnings
      # sc-17592, the off-Mac mirror of macos-mlx.yml's MLX step. THE ONLY PR LANE THAT CAN PRODUCE
      # capabilities.candle.json, so it is the only place the checked-in file can be checked against
      # a real registry rather than taken on trust. (desktop-windows.yml builds the candle sidecar on
      # main/release only and runs no dumper; server-candle-linux.yml is workflow_dispatch-only.)
      #
      # Every other guard reads that file as a SOURCE: `verifyEngineCapabilityFacts` in
      # scripts/bump-inference.mjs checks that the file exists, names a backend SCENEWORKS_BACKENDS
      # declares, and carries the current `inferenceRevision` — nothing about the engine list — and
      # the vitest drift guard re-derives the catalog from its contents. Both are satisfied by editing
      # one line. That is not hypothetical — this file was RESTAMPED (revision line rewritten, all 264
      # lines of content untouched) through the same pin bumps that restamped the MLX one, because no
      # CUDA box re-dumped it and nothing could tell the difference. Measured before this step landed:
      # at pin a4f409ae the checked-in file matches a fresh dump BYTE-FOR-BYTE, so the restamps
      # happened to be correct — but nothing proved it until this step existed.
      #
      # `git diff --no-index --exit-code`, not `fc`: `cmd` has no `diff`, `bash` here resolves to the
      # box's WSL stub rather than Git Bash (see the header), and `fc`'s exit semantics are unreliable
      # for this. git is already on PATH — actions/checkout requires it. The byte diff is sound
      # because the dump is deterministic (BTreeMap grouping + sort_by(id) + a const revision + a
      # cfg!-derived dumper string; nothing path- or time-dependent) and `.gitattributes`
      # (`* text=auto eol=lf`) checks the file out LF even on Windows with core.autocrlf=true, so it
      # cannot false-red on line endings.
      #
      # Cheap: the steps above already built the candle graph, so this is a link plus a weights-free
      # registry walk. It needs the vcvars preamble anyway because the dumper links runtime-cuda.
      # Dumps to a scratch dir under RUNNER_TEMP, NEVER over the checked-in file, so a red run leaves
      # a readable diff instead of a mutated tree.
      #
      # `--no-default-features --features backend-candle` matches `dumper_invocation()`, which keys
      # only on `cfg!(target_os = "macos")` — so the `dumper` field a Windows dump emits is the exact
      # string the checked-in file already carries. (sceneworks-worker declares no `default` feature,
      # so this resolves the same graph as the plain `--features backend-candle` steps above.)
      #
      # LAST, deliberately — the same ordering rule sc-17119 landed on the macOS side. A step failure
      # aborts the job, and this one goes red on exactly the routine pin-bump PRs where nobody
      # re-dumped on a CUDA box. Placed earlier it would cancel `cargo test -p sceneworks-worker
      # --features backend-candle` — which THIS LANE IS THE ONLY PR LANE TO RUN — plus the sidecar
      # check, the memory-adapter check and clippy. A missing dump must not suppress unrelated
      # coverage; it is the least urgent signal in this job, so it reports last.
      #
      # When this fails after a pin bump, the fix is to commit the dump it just produced and re-run
      # `npm run gen:preview-support` from apps/web — not to restamp the revision line.
      #
      # The AUDIO dump (sc-17593) is verified here too, and in macos-mlx.yml's twin step. Unlike the
      # media files, `audio/capabilities.candle.json` is written by BOTH lanes — `AUDIO_BACKEND` is
      # `candle` on every platform — so it is the most exposed to a restamp AND the only facts file
      # whose correctness rests on a cross-lane claim: that a Mac and this box produce identical
      # bytes. That holds by construction (`candle-audio-catalog` gates no registration on the
      # platform, its `metal`/`cuda` features only forward the compute backend, and the audio
      # provenance stamps a lane-NEUTRAL invocation rather than `dumper_invocation()` — deliberately,
      # since a platform-branched string there would make the two lanes flip one line back and forth
      # at every pin bump with nothing red). Checking it on both lanes is what turns that argument
      # into a measurement, and it costs nothing either side: the same dumper run already writes it.
      - name: Verify capabilities.candle.json is a real dump, not a restamp
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          if not defined RUNNER_TEMP goto :no_runner_temp
          set "scratch=%RUNNER_TEMP%\engine-capability-facts-verify"
          rmdir /s /q "%scratch%" 2>nul
          if exist "%scratch%\capabilities.candle.json" goto :stale_scratch
          cargo run -p sceneworks-worker --bin dump-engine-capabilities --no-default-features --features backend-candle -- "%scratch%" || exit /b 1
          if not exist "%scratch%\capabilities.candle.json" goto :no_candle_file
          git diff --no-index --exit-code -- config\engine-capabilities\capabilities.candle.json "%scratch%\capabilities.candle.json"
          if errorlevel 2 goto :diff_failed
          if errorlevel 1 goto :restamped
          if not exist "%scratch%\audio\capabilities.candle.json" goto :no_audio_file
          git diff --no-index --exit-code -- config\engine-capabilities\audio\capabilities.candle.json "%scratch%\audio\capabilities.candle.json"
          if errorlevel 2 goto :audio_diff_failed
          if errorlevel 1 goto :audio_restamped
          exit /b 0
          :no_runner_temp
          echo ::error::RUNNER_TEMP is not set, so there is nowhere safe to dump. Refusing to run rather than risk writing into the checked-out tree.
          exit /b 1
          :stale_scratch
          echo ::error::could not clear the scratch dir, so a previous run's capabilities.candle.json is still there and would be diffed instead of a fresh dump. This runner is self-hosted - check for a stray handle on %scratch%.
          exit /b 1
          :no_candle_file
          echo ::error::the dumper exited 0 but wrote no capabilities.candle.json. This lane linked a registry whose backend is not named candle, so nothing was verified - reconcile SCENEWORKS_BACKENDS with the linked backend.
          exit /b 1
          :diff_failed
          echo ::error::git could not compare the checked-in capabilities.candle.json against the fresh dump. This is a tooling or missing-file failure, NOT a restamp - read the git error above.
          exit /b 1
          :restamped
          echo ::error::config/engine-capabilities/capabilities.candle.json does not match a fresh dump at this pin. Re-dump it on a CUDA box with: cargo run -p sceneworks-worker --bin dump-engine-capabilities --no-default-features --features backend-candle - then run npm run gen:preview-support from apps/web. Do NOT just rewrite the inferenceRevision line.
          exit /b 1
          :no_audio_file
          echo ::error::the dumper wrote capabilities.candle.json but no audio/capabilities.candle.json. This build links no audio registry, so every audio route is unverified here - both runtime bundles carry the audio lane default-on, so reconcile the build features with SCENEWORKS_AUDIO_BACKENDS.
          exit /b 1
          :audio_diff_failed
          echo ::error::git could not compare the checked-in audio/capabilities.candle.json against the fresh dump. This is a tooling or missing-file failure, NOT a restamp - read the git error above.
          exit /b 1
          :audio_restamped
          echo ::error::config/engine-capabilities/audio/capabilities.candle.json does not match a fresh dump at this pin. Either box re-dumps it - the audio registry is candle-native everywhere - then run npm run gen:preview-support from apps/web. If the macOS lane passes this same check while this one fails, the two lanes have stopped producing identical audio bytes, which is what the shared file assumes. Do NOT just rewrite the inferenceRevision line.
          exit /b 1
