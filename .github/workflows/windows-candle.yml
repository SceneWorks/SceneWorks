          exit /b 1
          :no_runtime_file
          echo ::error::the dumper wrote legacy facts but no runtime/capabilities.candle.json. The rich inference descriptor snapshot required by the backend matrix was not captured.
          exit /b 1
          :runtime_mismatch
          echo ::error::config/engine-capabilities/runtime/capabilities.candle.json does not match inference's fresh runtime capability snapshot. Download the backend-capability-facts-candle artifact from this run; never hand-author descriptor facts.
          exit /b 1
      - name: Upload fresh Candle capability facts after a verification failure
