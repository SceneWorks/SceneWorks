name: H3 Veda Mac2 native MLX fixtures

on:
  workflow_dispatch:
    inputs:
      sceneworks_sha:
        description: "Exact SceneWorks commit containing this guarded workflow."
        required: true
        type: string
      inference_sha:
        description: "Exact frozen inference commit for the five MLX fixtures."
        required: true
        type: string
      expected_runner:
        description: "Exact Mac2 runner name (nax-macos-2)."
        required: true
        type: string
      physical_gpu_id:
        description: "Mac2 platform UUID from verified inventory; must differ from Mac1."
        required: true
        type: string
      metal_device_name:
        description: "Exact Metal device name from verified Mac2 inventory."
        required: true
        type: string
      run_dir:
        description: "Unique absolute external evidence directory on Mac2."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: h3-veda-mlx-five-${{ inputs.physical_gpu_id }}
  cancel-in-progress: false

jobs:
  mac2:
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 75
    env:
      S9_SCENEWORKS_SHA: ${{ inputs.sceneworks_sha }}
      S9_INFERENCE_SHA: ${{ inputs.inference_sha }}
      S9_EXPECTED_RUNNER: ${{ inputs.expected_runner }}
      S9_PHYSICAL_GPU_ID: ${{ inputs.physical_gpu_id }}
      S9_METAL_DEVICE_NAME: ${{ inputs.metal_device_name }}
      S9_RUN_DIR: ${{ inputs.run_dir }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/sceneworks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sceneworks_sha }}
          path: sceneworks
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_sha }}
          path: inference
          fetch-depth: 1
          token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Bind verified owned Python 3.12
        run: node scripts/h3-veda-owned-python.mjs bootstrap --run-dir "$S9_RUN_DIR"
      - name: Assert exact source, toolchain and physical runner before build
        run: |
          test "$GITHUB_SHA" = "$S9_SCENEWORKS_SHA"
          test "$RUNNER_NAME" = 'nax-macos-2'
          test "$S9_EXPECTED_RUNNER" = 'nax-macos-2'
          test "$S9_INFERENCE_SHA" = 'ba6ed0db452ecbed780ab8eeeac883cd9758ed3a'
          test "$(git rev-parse HEAD)" = "$S9_SCENEWORKS_SHA"
          test "$(git -C ../inference rev-parse HEAD)" = "$S9_INFERENCE_SHA"
          test "$(git -C ../inference status --porcelain=v1 --untracked-files=all)" = ''
          test "$(git status --porcelain=v1 --untracked-files=all)" = ''
          test "$S9_PHYSICAL_GPU_ID" = '734A72AE-13DA-52A8-B0CF-F97E1D646124'
          test "$S9_METAL_DEVICE_NAME" = 'Apple M5 Max'
          "$S9_GUARD_PYTHON" -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12)'
      - name: Build and run five exact native MLX fixtures under Mac2 admission
        env:
          GH_TOKEN: ${{ secrets.INFERENCE_READ_TOKEN }}
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          "$S9_GUARD_PYTHON" scripts/h3-veda-mlx-fixtures.py \
            --sceneworks "$GITHUB_WORKSPACE/sceneworks" \
            --inference "$GITHUB_WORKSPACE/inference" \
            --sceneworks-sha "$S9_SCENEWORKS_SHA" \
            --inference-sha "$S9_INFERENCE_SHA" \
            --expected-runner "$S9_EXPECTED_RUNNER" \
            --physical-gpu-id "$S9_PHYSICAL_GPU_ID" \
            --metal-device-name "$S9_METAL_DEVICE_NAME" \
            --run-dir "$S9_RUN_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: h3-veda-mlx-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.run_dir }}/tools/python-3.12-attestation.json
            ${{ inputs.run_dir }}/mlx-five-fixtures/receipt.json
            ${{ inputs.run_dir }}/mlx-five-fixtures/running.json
            ${{ inputs.run_dir }}/mlx-five-fixtures/build.jsonl
            ${{ inputs.run_dir }}/mlx-five-fixtures/build.stderr.log
            ${{ inputs.run_dir }}/mlx-five-fixtures/toolchain-*.json
            ${{ inputs.run_dir }}/mlx-five-fixtures/toolchain-install.*.log
            ${{ inputs.run_dir }}/mlx-five-fixtures/fixture-*-receipt.json
            ${{ inputs.run_dir }}/mlx-five-fixtures/fixture-*.stdout.log
            ${{ inputs.run_dir }}/mlx-five-fixtures/fixture-*.stderr.log
            ${{ inputs.run_dir }}/mlx-five-fixtures/*-phase.json
            ${{ inputs.run_dir }}/mlx-five-fixtures/global-lock-profile-qualification.json
            ${{ inputs.run_dir }}/mlx-five-fixtures/actions-ancestor-proof.json
            ${{ inputs.run_dir }}/mlx-five-fixtures/watchdog-closure.json
            ${{ inputs.run_dir }}/mlx-five-fixtures/watchdog-unresolved.json
          if-no-files-found: error
          retention-days: 30
