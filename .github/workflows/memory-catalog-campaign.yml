# Manually-triggered memory-anchor measurement campaign (sc-22738, epic 22723).
#
# `scripts/measure-memory-catalog.mjs` walks every anchor the plan declares for ONE backend on ONE
# host and COMMITS each measurement as it lands (capture -> check -> ingest -> extract -> stamp ->
# matrix -> commit). It refuses a detached HEAD and a dirty tree, and it asserts BOTH checkouts stay
# clean and stable for the whole walk. This workflow is the on-demand way to run that walk on the
# self-hosted GPU boxes instead of tying up an interactive shell for a day.
#
# WHY DISPATCH-ONLY, AND WHY IT GATES NOTHING. Per FEATURE_DEVELOPMENT.md's "Gate teardown"
# (2026-08-15/16, sc-19758 / sc-19751), measurement runs ONCE at epic end or on explicit request --
# never per code change. There is deliberately no `push:`, no `pull_request:` and no `schedule:`
# here, so this workflow can never become a required check and can never be selected as one: a
# `workflow_dispatch`-only workflow reports no context on any PR.
#
# The optional qwen-image-2-1-app-lifecycle profile is a separate app proof. It calls
# the reusable workflow at this dispatch's exact commit and skips BOTH catalog
# jobs, including every plan/walk/branch/push/PR step described below. Catalog is
# still the default profile; no app run can publish catalog measurements.
#
# The issue-3197 sdxl-cuda-endpoints profile reuses the candle build, pin and cache setup,
# then captures only resident maximum + fully optimized sequential minimum in fresh processes.
# It retains JSON evidence and PNG output as artifacts; it makes no branch, commit, push or PR.
# After packaging the pair, sdxl-cuda-admitted-replay exercises one ordinary owned API/worker
# request at a six-GiB admission cap, with selected-card activity/peak and real served PNG output.
# CI_IMPACT: manual only, two real renders, 60 minutes each; 180-minute job ceiling includes
# the existing native CUDA build. Normal CI adds only a small pure metadata test.
#
# WHAT IT PRODUCES. A NEW branch `story/<campaign>-<backend>-campaign-<run_id>` carrying one commit
# per measured anchor, pushed as the walk proceeds (never only at the end), plus a work-dir artifact
# with the summary JSON, the per-anchor logs and the retained raw bundles. The last step opens a PR
# back into the dispatched `ref` when the branch has commits. Nothing is merged automatically.
#
# RE-RUNNING A FAILED DISPATCH IS SUPPORTED, AND IS THE RECOVERY FOR A TRANSIENT INFRA FAULT.
# `gh run rerun --failed` reuses the RUN ID, so the branch name is the same one -- and the new
# attempt RESUMES that branch rather than colliding with it or re-cutting it. Anchors an earlier
# attempt already committed stay put, plan as `current`, and are skipped; the walk appends the rest.
# See the header of `scripts/ci/memory-catalog/branch.sh` for the three arms and why they exist.
#
# FETCHING THE WEIGHTS IT NEEDS (`download_missing`, default false, sc-22738). Neither box holds the
# whole catalog, and an anchor whose pinned snapshot is under none of the hub roots plans as
# `weights_missing` and is skipped. Downloading the missing snapshots on the Windows box is faster
# than copying them off the Mac's SSD, so the dispatch can turn on `--download-missing`: for the
# `weights_missing` anchors AND ONLY THOSE, the walk resolves each repository/pinned-revision/file
# globs out of the manifest rows the plan already reads, fetches them one at a time through the
# Hugging Face CLI into the FIRST hub root, and classifies the anchor again. `$HF_TOKEN` (a runner
# secret) is exported for the CLI and is only needed for a gated repository; a failed fetch leaves
# that one anchor `weights_missing (download failed: …)` and never stops the walk. The flag reaches
# the dry run (which fetches nothing) and the walk, never the `--list` pass.
#
# WHAT `--download-missing` CANNOT FETCH, AND WHO STAGES IT (sc-22738). Two identity stacks are not
# manifest downloads on either lane — the worker fetches them on FIRST USE — so there is nothing for
# the walk to resolve and no repository to pass the hub CLI. They are operator-staged, by design,
# through the same env vars both worker lanes already read, and `--list` reports an unset or
# half-staged one as `weights_missing` naming the variable and the missing file:
#
#   SCENEWORKS_INSTANTID_WEIGHTS     ip-adapter / scrfd_10g / arcface_iresnet100 (instantid_realvisxl)
#   SCENEWORKS_INSTANTID_CONTROLNET  the IdentityNet `ControlNetModel` directory
#   SCENEWORKS_PULID_WEIGHTS         the five loose PuLID files (pulid_flux, all three tiers)
#
# Run 34356681566 planned all four of those cells `weights_missing` because the CUDA box carries
# none of the three variables. The inputs below are the way to supply them without touching the
# runner service: each is optional, and an EMPTY one leaves whatever the runner's own environment
# already exports intact rather than blanking it. `docs/calibration-runbook.md` §"Adapter
# environment for the SDXL family" and the `SCENEWORKS_PULID_WEIGHTS` block list the exact file
# names each directory must hold.
#
# THE SCARCE RESOURCE IS THE GPU, NOT THE RUNNER. Each job takes a job-level `concurrency` group
# keyed on (backend, runner) with `cancel-in-progress: false`, so two campaigns can never share one
# box's GPU: the second dispatch queues behind the first rather than fighting it for unified memory
# (MLX) or VRAM (CUDA).
name: Memory catalog campaign

on:
  workflow_dispatch:
    inputs:
      run_moss_training_acceptance:
        description: "Terminal MOSS training acceptance only; all other jobs are disabled. No downloads/publication."
        required: false
        type: boolean
        default: false
      moss_runner_label:
        description: "MOSS only: explicitly choose a Mac with cached MOSS snapshots; unspecified is rejected."
        required: true
        type: choice
        options: [unspecified, real-weights, rw-llm, rw-mage, rw-krea]
        default: unspecified
      moss_phase:
        description: "MOSS capture runs eight training cells and eight cross-loads; finalize verifies that run plus actual preview inspections without GPU execution."
        required: false
        type: choice
        options: [capture, finalize]
        default: capture
      moss_inspection_json:
        description: "MOSS finalize only: named per-cell inspections, including the original positive captureRunId, actual review timestamps and manifest seal."
        required: false
        type: string
        default: ""
      profile:
        description: "Catalog by default; Qwen app lifecycle runs only the reusable app proof, with no catalog walk or publication."
        required: false
        type: choice
        options:
          - catalog
          - qwen-image-2-1-app-lifecycle
          - iris-mlx-real-weights
          - supra2-mlx-real-weights
          - moss-edit-terminal
          - moss-upstream-reference
          - sdxl-cuda-endpoints
          - sdxl-cuda-admitted-replay
          - windows-storage-probe
        default: catalog
      inference_sha:
        description: "App lifecycle only: exact final inference pin (40 hex). The dispatched branch/tag must resolve to the exact source SHA supplied as ref."
        required: false
        type: string
        default: ""
      moss_terminal:
        description: "MOSS only: closed JSON candidate/bundle identity and upload, execute or verify phase. See docs/moss-edit-terminal.md for exact fields."
        required: false
        type: string
        default: "{}"
      moss_reference:
        description: "Closed frozen-upstream reference envelope: Base/single/probe or approved three-case quality suite; exact artifact IDs (null for uploads)."
        required: false
        type: string
        default: "{}"
      qwen_app_runner_target:
        description: "App lifecycle only: primary selects rw-starvector/nax-macos; secondary selects rw-mage/nax-macos-2."
        required: false
        type: choice
        options:
          - primary
          - secondary
        default: primary
      iris_smoke_filter:
        description: "Iris MLX real-weights only (sc-25690): all | inference | training | full_ft | <one smoke test name> | cleanup."
        required: false
        type: string
        default: all
      backend:
        description: "Which lane to walk. mlx runs on a Mac, candle on the Windows CUDA box."
        required: true
        type: choice
        options:
          - mlx
          - candle
        default: mlx
      campaign:
        description: "Campaign id -- one path segment, e.g. sc-22738. Names the evidence prefix, the work dir and the branch."
        required: true
        type: string
        default: sc-22738
      anchors:
        description: "Optional comma-separated anchor keys (<model>:<tier>:<backend>). Empty walks every planned anchor for the backend."
        required: false
        type: string
        default: ""
      models:
        description: "Optional space-separated model ids to restrict the walk to. Empty means every model."
        required: false
        type: string
        default: ""
      skip_current:
        description: "Skip anchors already current at the pinned inference revision (--skip-current)."
        required: false
        type: boolean
        default: true
      hf_cache_roots:
        description: >-
          Optional extra Hugging Face hub roots, one per line or ';'-separated. Empty falls back
          to $SCENEWORKS_MEMORY_CAMPAIGN_HF_CACHE on the runner, then this lane's default:
          /Volumes/Models/huggingface/hub for mlx (either Mac), E:\huggingface\hub for candle
          (the Windows CUDA box).
        required: false
        type: string
        default: ""
      download_missing:
        description: >-
          Fetch the pinned snapshots of anchors that would otherwise plan as weights_missing
          (--download-missing). They land in the FIRST hub root above through the Hugging Face CLI
          at the manifest's pinned revision, one at a time; a gated repo needs $HF_TOKEN on the
          runner. Off by default: leave it off when the box already holds its weights.
        required: false
        type: boolean
        default: false
      qwen_persistent_weights:
        description: >-
          MLX Qwen-Image 2.1-only: reuse ~/sceneworks-rw-weights/hub, shared with the
          terminal real-weight evidence job. Missing manifest-pinned files can be fetched there
          with download_missing. Requires models drawn from qwen_image_2_1 / qwen_image_2_1_turbo
          (space-separated) and empty hf_cache_roots.
          This catalog measures base anchors; overlay/training evidence belongs to real-weights.
        required: false
        type: boolean
        default: false
      ref:
        description: "Catalog: branch to walk and PR target. App lifecycle: exact source SHA, identical to the workflow dispatch --ref."
        required: true
        type: string
        default: feature/sc-22723-memory-anchor-measurability
      runner_label:
        description: >-
          Which Mac the mlx lane runs on (ignored for candle). `rw-krea` is the SECOND Mac
          (nax-macos-2); `nax` is Michael's dev Mac (nax-macos), which is also the app repo's
          ordinary PR runner. Both label sets were verified against the runners that actually served
          recent jobs -- see the runbook note before changing either.
        required: true
        type: choice
        options:
          - "rw-krea (nax-macos-2, the second Mac)"
          - "nax (nax-macos, the dev Mac)"
        default: "rw-krea (nax-macos-2, the second Mac)"
      push_every:
        description: "Push the campaign branch once this many new anchor commits have landed. 1 pushes after every anchor."
        required: false
        type: string
        default: "1"
      probe_budget_minutes:
        description: >-
          Per-capture wall-clock budget (--probe-budget-minutes). Defaults to 60 minutes for
          both image and video captures. Investigate timed-out cells separately before explicitly
          choosing a larger budget. A number sets both lanes; video=N or image=N overrides one.
        required: false
        type: string
        default: "60"
      instantid_weights:
        description: >-
          Absolute path on the runner to the InstantID identity bundle DIRECTORY holding
          ip-adapter.safetensors, scrfd_10g.safetensors and arcface_iresnet100.safetensors. Not a
          manifest download on either lane -- the worker fetches it on first use -- so
          --download-missing cannot supply it and the operator stages it. Empty keeps whatever the
          runner already exports as $SCENEWORKS_INSTANTID_WEIGHTS.
        required: false
        type: string
        default: ""
      instantid_controlnet:
        description: >-
          Absolute path on the runner to the InstantID IdentityNet `ControlNetModel` directory
          (diffusion_pytorch_model.safetensors). Empty keeps $SCENEWORKS_INSTANTID_CONTROLNET.
        required: false
        type: string
        default: ""
      pulid_weights:
        description: >-
          Absolute path on the runner to the PuLID-FLUX bundle DIRECTORY holding all five loose
          files (pulid_flux_v0.9.1, eva02_clip_l_336, bisenet_parsing, scrfd_10g,
          arcface_iresnet100). Empty keeps $SCENEWORKS_PULID_WEIGHTS.
        required: false
        type: string
        default: ""

# `gh pr create` and the branch pushes both run as the default GITHUB_TOKEN. The only other secret
# this workflow reads is `HF_TOKEN`, scoped to the walk and SDXL endpoint steps that can fetch
# missing Hugging Face snapshots when `download_missing` is enabled.
permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

env:
  CAMPAIGN: ${{ inputs.campaign }}
  BASE_REF: ${{ inputs.ref }}
  PUSH_EVERY: ${{ inputs.push_every }}
  ANCHORS_INPUT: ${{ inputs.anchors }}
  MODELS_INPUT: ${{ inputs.models }}
  SKIP_CURRENT: ${{ inputs.skip_current }}
  HF_CACHE_INPUT: ${{ inputs.hf_cache_roots }}
  DOWNLOAD_MISSING: ${{ inputs.download_missing }}
  # The per-lane wall-clock budget, straight through to `--probe-budget-minutes` (sc-22738 review).
  # It is a dispatch input rather than a constant so a cell that needs longer than its lane's
  # default can be re-measured without a source edit and a PR.
  PROBE_BUDGET_INPUT: ${{ inputs.probe_budget_minutes }}
  # The three operator-staged identity stacks (sc-22738). Carried as INPUT_-prefixed names on
  # purpose: `stage-identity-bundles.sh` copies each into $GITHUB_ENV under the name the worker
  # actually reads ONLY when it is non-empty, so an unused input can never blank a runner that
  # already exports the real variable.
  INPUT_INSTANTID_WEIGHTS: ${{ inputs.instantid_weights }}
  INPUT_INSTANTID_CONTROLNET: ${{ inputs.instantid_controlnet }}
  INPUT_PULID_WEIGHTS: ${{ inputs.pulid_weights }}

jobs:
  windows-storage-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'windows-storage-probe' }}
    runs-on: [self-hosted, Windows, X64, cuda-windows-2]
    timeout-minutes: 3
    permissions: {}
    steps:
      # CI_IMPACT: manual only; bounded filesystem/CIM reads, no checkout, downloads,
      # compiler, GPU, model, deletion or process control. Results stay in Actions logs.
      - name: Observe only the exact failed listener build directory
        shell: powershell
        env:
          PROBE_SOURCE: ${{ inputs.ref }}
          PROBE_BACKEND: ${{ inputs.backend }}
          PROBE_TRAINING: ${{ inputs.run_moss_training_acceptance }}
          PROBE_DOWNLOAD: ${{ inputs.download_missing }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $workspace = 'D:\actions-runner-2\_work\SceneWorks\SceneWorks'
          $target = Join-Path $workspace 'target\debug'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $report = [ordered]@{
            schema = 1; kind = 'sc-26584-read-only-windows-storage-probe'
            runId = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; source = $env:GITHUB_SHA
            runner = $env:RUNNER_NAME; workspace = $env:GITHUB_WORKSPACE; target = $target
            startedAt = [DateTime]::UtcNow.ToString('o'); status = 'incomplete'
            limitations = @('No deletion authorization', 'Scoped CIM matches absolute target paths only; relative paths, inaccessible process metadata and open file handles are not resolved', 'Cargo is not executed; configuration evidence is not a complete effective Cargo configuration evaluation')
          }
          function Check-Bound {
            if ($clock.Elapsed.TotalSeconds -gt 90) { throw 'Read-only inventory exceeded 90 seconds' }
          }
          function Assert-Unredirected([string]$path) {
            $cursor = [IO.Path]::GetFullPath($path)
            while ($cursor) {
              Check-Bound
              if ([IO.File]::Exists($cursor) -or [IO.Directory]::Exists($cursor)) {
                if (([IO.File]::GetAttributes($cursor) -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "Reparse ancestor: $cursor" }
              }
              $next = [IO.Path]::GetDirectoryName($cursor)
              if ($next -eq $cursor) { break }
              $cursor = $next
            }
          }
          try {
            if ($env:RUNNER_NAME -ne 'cuda-windows-2' -or $env:RUNNER_OS -ne 'Windows' -or $env:GITHUB_REPOSITORY -ne 'SceneWorks/SceneWorks' -or $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') { throw 'Unexpected probe venue' }
            if ($env:GITHUB_WORKSPACE -ine $workspace -or $env:PROBE_SOURCE -cne $env:GITHUB_SHA -or $env:PROBE_SOURCE -cnotmatch '^[a-f0-9]{40}$') { throw 'Exact source/workspace required' }
            if ($env:PROBE_BACKEND -ne 'candle' -or $env:PROBE_TRAINING -ne 'false' -or $env:PROBE_DOWNLOAD -ne 'false') { throw 'Read-only candle profile requires training/download selectors off' }
            $volume = Get-Volume -DriveLetter D
            $report.volumeBefore = @{ drive = 'D'; size = [long]$volume.Size; free = [long]$volume.SizeRemaining }
            $report.targetEnvironment = @{ CARGO_TARGET_DIR = $env:CARGO_TARGET_DIR; CARGO_BUILD_TARGET_DIR = $env:CARGO_BUILD_TARGET_DIR; CARGO_HOME = $env:CARGO_HOME }
            $configs = [Collections.Generic.List[object]]::new()
            $directories = [Collections.Generic.List[string]]::new()
            $cursor = $workspace
            while ($cursor) {
              $directories.Add((Join-Path $cursor '.cargo'))
              $cursor = [IO.Path]::GetDirectoryName($cursor)
            }
            if ($env:CARGO_HOME) { $directories.Add($env:CARGO_HOME) }
            else { $directories.Add((Join-Path $env:USERPROFILE '.cargo')) }
            foreach ($directory in ($directories | Select-Object -Unique)) {
              foreach ($name in @('config', 'config.toml')) {
                Check-Bound
                $file = Join-Path $directory $name
                Assert-Unredirected $file
                if (-not [IO.File]::Exists($file)) { continue }
                $info = [IO.FileInfo]::new($file)
                if ($info.Length -gt 65536) { throw 'Cargo configuration exceeds read bound' }
                $section = ''; $settings = @(); $lineNumber = 0
                foreach ($line in [IO.File]::ReadAllLines($file)) {
                  $lineNumber++
                  if ($line -match '^\s*\[([^]]+)\]') { $section = $matches[1] }
                  if (($section -eq 'build' -and $line -match '^\s*target-dir\s*=') -or $line -match '^\s*build\.target-dir\s*=') {
                    $settings += @{ line = $lineNumber; setting = $line.Substring(0, [Math]::Min(512, $line.Length)) }
                  }
                }
                $configs.Add(@{ path = $file; bytes = $info.Length; targetSettings = $settings })
              }
            }
            $report.cargoConfigurations = @($configs.ToArray())
            Assert-Unredirected $target
            $categories = @{}; $visited = 0; $reparse = [Collections.Generic.List[string]]::new()
            $report.inventory = @{ exists = [IO.Directory]::Exists($target); categories = $categories; files = 0; bytes = [long]0; visited = 0; reparseCount = 0; reparseExamples = @(); complete = $false }
            $stack = [Collections.Generic.Stack[string]]::new()
            if ($report.inventory.exists) { $stack.Push($target) }
            while ($stack.Count) {
              Check-Bound
              foreach ($entry in [IO.Directory]::EnumerateFileSystemEntries($stack.Pop())) {
                Check-Bound
                $visited++; $report.inventory.visited = $visited
                if ($visited -gt 250000) { throw 'Target inventory exceeds 250000 entries' }
                $relative = $entry.Substring($target.Length + 1)
                $attributes = [IO.File]::GetAttributes($entry)
                if (($attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                  $report.inventory.reparseCount++
                  if ($reparse.Count -lt 16) { $reparse.Add($relative.Substring(0, [Math]::Min(512, $relative.Length))) }
                  $report.inventory.reparseExamples = @($reparse.ToArray())
                  continue
                }
                if (($attributes -band [IO.FileAttributes]::Directory) -ne 0) { $stack.Push($entry); continue }
                $category = if ($relative.Contains('\')) { $relative.Split('\')[0] } else { '(root files)' }
                if ($category -notin @('deps', 'build', 'incremental', '.fingerprint', 'examples', '(root files)')) { $category = '(other)' }
                if (-not $categories.ContainsKey($category)) { $categories[$category] = @{ files = 0; bytes = [long]0 } }
                $length = [IO.FileInfo]::new($entry).Length
                $categories[$category].files++
                $categories[$category].bytes += $length
                $report.inventory.files++
                $report.inventory.bytes += $length
              }
            }
            $report.inventory.complete = $report.inventory.reparseCount -eq 0
            Check-Bound
            $escaped = $target.Replace('\', '\\').Replace("'", "''")
            $filter = "ExecutablePath LIKE '$escaped\\%' OR CommandLine LIKE '%$escaped\\%'"
            $rows = @(Get-CimInstance Win32_Process -Filter $filter -Property ProcessId,ParentProcessId,CreationDate,ExecutablePath,CommandLine -OperationTimeoutSec 5 | Select-Object -First 65)
            if ($rows.Count -gt 64) { throw 'Scoped target process evidence exceeds 64 rows' }
            $report.scopedProcesses = @($rows | ForEach-Object {
              $executable = [string]$_.ExecutablePath
              $command = [string]$_.CommandLine
              $underTarget = $executable.StartsWith($target + '\', [StringComparison]::OrdinalIgnoreCase)
              $mentionsTarget = $command.IndexOf($target + '\', [StringComparison]::OrdinalIgnoreCase) -ge 0
              if ($underTarget -or $mentionsTarget) {
                @{ pid = $_.ProcessId; ppid = $_.ParentProcessId; created = [string]$_.CreationDate; executableName = [IO.Path]::GetFileName($executable); executableMetadataAvailable = [bool]$executable; commandMetadataAvailable = [bool]$command; executableUnderTarget = $underTarget; commandMentionsTarget = $mentionsTarget }
              }
            })
            $volume = Get-Volume -DriveLetter D
            $report.volumeAfter = @{ drive = 'D'; size = [long]$volume.Size; free = [long]$volume.SizeRemaining }
            Check-Bound
            $report.status = 'observed'
          } catch {
            $report.error = $_.Exception.Message.Substring(0, [Math]::Min(512, $_.Exception.Message.Length))
            throw
          } finally {
            $report.elapsedSeconds = $clock.Elapsed.TotalSeconds
            $report.finishedAt = [DateTime]::UtcNow.ToString('o')
            Write-Output ('MOSS_WINDOWS_STORAGE_PROBE=' + ($report | ConvertTo-Json -Depth 8 -Compress))
          }
  moss-selector-preflight:
    if: ${{ inputs.run_moss_training_acceptance && inputs.profile != 'windows-storage-probe' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      capture_run_id: ${{ steps.select.outputs.capture_run_id }}
    steps:
      - name: Reject conflicting selectors before compiler or device jobs
        id: select
        env:
          SELECTORS: ${{ toJSON(inputs) }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_EVENT: ${{ github.event_name }}
          DISPATCH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const i = JSON.parse(process.env.SELECTORS);
          const bad = [];
          if (process.env.DISPATCH_EVENT !== 'workflow_dispatch' || process.env.DISPATCH_REPOSITORY !== 'SceneWorks/SceneWorks') bad.push('MOSS requires an explicit dispatch in SceneWorks/SceneWorks');
          if (!/^[0-9a-f]{40}$/.test(process.env.DISPATCH_SHA)) bad.push('actual dispatched GitHub SHA must be exact 40-hex');
          if (!['real-weights','rw-llm','rw-mage','rw-krea'].includes(i.moss_runner_label)) bad.push('explicitly choose moss_runner_label=real-weights|rw-llm|rw-mage|rw-krea with cached MOSS snapshots');
          if (i.profile && i.profile !== 'catalog') bad.push('profile must remain catalog (MOSS replaces it)');
          const emptyEnvelope = (value) => {
            if (value === undefined || value === '') return true;
            try { const object = JSON.parse(value); return object !== null && typeof object === 'object' && !Array.isArray(object) && Object.keys(object).length === 0; }
            catch { return false; }
          };
          if (!emptyEnvelope(i.moss_reference) || !emptyEnvelope(i.moss_terminal)) bad.push('clear MOSS edit/reference selectors');
          if (i.anchors || i.models || (i.iris_smoke_filter && i.iris_smoke_filter !== 'all')) bad.push('clear anchors/models/iris_smoke_filter overrides');
          if (i.download_missing || i.qwen_persistent_weights) bad.push('disable download_missing and qwen_persistent_weights; MOSS is cached/offline only');
          if (i.inference_sha && !/^[0-9a-f]{40}$/.test(i.inference_sha)) bad.push('inference_sha must be empty or exact 40-hex permanent lock pin');
          if (!['capture','finalize'].includes(i.moss_phase)) bad.push('moss_phase must be capture or finalize');
          let captureRunId = '';
          if (i.moss_phase === 'capture' && i.moss_inspection_json) bad.push('capture must not consume prior evidence or pre-written inspections');
          if (i.moss_phase === 'finalize') {
            try {
              const inspection = JSON.parse(i.moss_inspection_json);
              if (inspection === null || typeof inspection !== 'object' || Array.isArray(inspection) || typeof inspection.captureRunId !== 'string' || !/^[1-9][0-9]*$/.test(inspection.captureRunId)) throw new Error('invalid capture run');
              captureRunId = inspection.captureRunId;
            } catch { bad.push('finalize requires actual moss_inspection_json with its original positive captureRunId'); }
          }
          const defaults = {backend:'mlx',campaign:'sc-22738',skip_current:true,hf_cache_roots:'',qwen_app_runner_target:'primary',runner_label:'rw-krea (nax-macos-2, the second Mac)',push_every:'1',probe_budget_minutes:'60',instantid_weights:'',instantid_controlnet:'',pulid_weights:''};
          for (const [key,value] of Object.entries(defaults)) if (i[key] !== undefined && i[key] !== value) bad.push('reset conflicting catalog/app selector ' + key);
