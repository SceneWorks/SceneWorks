# Manually-triggered memory-anchor measurement campaign (sc-22738, epic 22723).
#
# `scripts/measure-memory-catalog.mjs` walks every anchor the plan declares for ONE backend on ONE
# host and COMMITS each measurement as it lands (capture -> check -> ingest -> extract -> stamp ->
# matrix -> commit). It refuses a detached HEAD and a dirty tree, and it asserts BOTH checkouts stay
# clean and stable for the whole walk. This workflow is the on-demand way to run that walk on the
# self-hosted GPU boxes instead of tying up an interactive shell for a day.
#
# WHY DISPATCH-ONLY, AND WHY IT GATES NOTHING. Per FEATURE_DEVELOPMENT.md's "Gate teardown"
# (2026-08-15/16, sc-19758 / sc-19751), measurement runs ONCE at epic end or on explicit request --
# never per code change. There is deliberately no `push:`, no `pull_request:` and no `schedule:`
# here, so this workflow can never become a required check and can never be selected as one: a
# `workflow_dispatch`-only workflow reports no context on any PR.
#
# WHAT IT PRODUCES. A NEW branch `story/<campaign>-<backend>-campaign-<run_id>` carrying one commit
# per measured anchor, pushed as the walk proceeds (never only at the end), plus a work-dir artifact
# with the summary JSON, the per-anchor logs and the retained raw bundles. The last step opens a PR
# back into the dispatched `ref` when the branch has commits. Nothing is merged automatically.
#
# FETCHING THE WEIGHTS IT NEEDS (`download_missing`, default false, sc-22738). Neither box holds the
# whole catalog, and an anchor whose pinned snapshot is under none of the hub roots plans as
# `weights_missing` and is skipped. Downloading the missing snapshots on the Windows box is faster
# than copying them off the Mac's SSD, so the dispatch can turn on `--download-missing`: for the
# `weights_missing` anchors AND ONLY THOSE, the walk resolves each repository/pinned-revision/file
# globs out of the manifest rows the plan already reads, fetches them one at a time through the
# Hugging Face CLI into the FIRST hub root, and classifies the anchor again. `$HF_TOKEN` (a runner
# secret) is exported for the CLI and is only needed for a gated repository; a failed fetch leaves
# that one anchor `weights_missing (download failed: …)` and never stops the walk. The flag reaches
# the dry run (which fetches nothing) and the walk, never the `--list` pass.
#
# WHAT `--download-missing` CANNOT FETCH, AND WHO STAGES IT (sc-22738). Two identity stacks are not
# manifest downloads on either lane — the worker fetches them on FIRST USE — so there is nothing for
# the walk to resolve and no repository to pass the hub CLI. They are operator-staged, by design,
# through the same env vars both worker lanes already read, and `--list` reports an unset or
# half-staged one as `weights_missing` naming the variable and the missing file:
#
#   SCENEWORKS_INSTANTID_WEIGHTS     ip-adapter / scrfd_10g / arcface_iresnet100 (instantid_realvisxl)
#   SCENEWORKS_INSTANTID_CONTROLNET  the IdentityNet `ControlNetModel` directory
#   SCENEWORKS_PULID_WEIGHTS         the five loose PuLID files (pulid_flux, all three tiers)
#
# Run 34356681566 planned all four of those cells `weights_missing` because the CUDA box carries
# none of the three variables. The inputs below are the way to supply them without touching the
# runner service: each is optional, and an EMPTY one leaves whatever the runner's own environment
# already exports intact rather than blanking it. `docs/calibration-runbook.md` §"Adapter
# environment for the SDXL family" and the `SCENEWORKS_PULID_WEIGHTS` block list the exact file
# names each directory must hold.
#
# THE SCARCE RESOURCE IS THE GPU, NOT THE RUNNER. Each job takes a job-level `concurrency` group
# keyed on (backend, runner) with `cancel-in-progress: false`, so two campaigns can never share one
# box's GPU: the second dispatch queues behind the first rather than fighting it for unified memory
# (MLX) or VRAM (CUDA).
name: Memory catalog campaign

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Which lane to walk. mlx runs on a Mac, candle on the Windows CUDA box."
        required: true
        type: choice
        options:
          - mlx
          - candle
        default: mlx
      campaign:
        description: "Campaign id -- one path segment, e.g. sc-22738. Names the evidence prefix, the work dir and the branch."
        required: true
        type: string
        default: sc-22738
      anchors:
        description: "Optional comma-separated anchor keys (<model>:<tier>:<backend>). Empty walks every planned anchor for the backend."
        required: false
        type: string
        default: ""
      models:
        description: "Optional space-separated model ids to restrict the walk to. Empty means every model."
        required: false
        type: string
        default: ""
      skip_current:
        description: "Skip anchors already current at the pinned inference revision (--skip-current)."
        required: false
        type: boolean
        default: true
      hf_cache_roots:
        description: >-
          Optional extra Hugging Face hub roots, one per line or ';'-separated. Empty falls back
          to $SCENEWORKS_MEMORY_CAMPAIGN_HF_CACHE on the runner, then this lane's default:
          /Volumes/Models/huggingface/hub for mlx (either Mac), E:\huggingface\hub for candle
          (the Windows CUDA box).
        required: false
        type: string
        default: ""
      download_missing:
        description: >-
          Fetch the pinned snapshots of anchors that would otherwise plan as weights_missing
          (--download-missing). They land in the FIRST hub root above through the Hugging Face CLI
          at the manifest's pinned revision, one at a time; a gated repo needs $HF_TOKEN on the
          runner. Off by default: leave it off when the box already holds its weights.
        required: false
        type: boolean
        default: false
      ref:
        description: "Branch to walk from. The campaign branch is cut from this ref and the PR targets it."
        required: true
        type: string
        default: feature/sc-22723-memory-anchor-measurability
      runner_label:
        description: >-
          Which Mac the mlx lane runs on (ignored for candle). `rw-krea` is the SECOND Mac
          (nax-macos-2); `nax` is Michael's dev Mac (nax-macos), which is also the app repo's
          ordinary PR runner. Both label sets were verified against the runners that actually served
          recent jobs -- see the runbook note before changing either.
        required: true
        type: choice
        options:
          - "rw-krea (nax-macos-2, the second Mac)"
          - "nax (nax-macos, the dev Mac)"
        default: "rw-krea (nax-macos-2, the second Mac)"
      push_every:
        description: "Push the campaign branch once this many new anchor commits have landed. 1 pushes after every anchor."
        required: false
        type: string
        default: "1"
      probe_budget_minutes:
        description: >-
          Per-probe wall-clock budget (--probe-budget-minutes). Empty uses the lane defaults, 165
          minutes for a video anchor and 60 for an image one. `240` sets both lanes;
          `video=240` (or `video=240,image=90`) raises ONE lane and leaves the other's tighter
          backstop alone. Raise a lane when a cell reported runtime_budget_exceeded and you believe
          it was still rendering: the reason names that lane's longest completed capture on the
          cell's own backend and the cell it was read from, and a re-run at the same budget stops at
          the same second. The heavy candle video cells (scail2_14b, wan_2_2_i2v_14b,
          wan_2_2_t2v_14b -- 14B DiTs at 480p/720p) have no completed candle render on file at all,
          so their 165 minutes is the figure to raise if one of them stops.
        required: false
        type: string
        default: ""
      instantid_weights:
        description: >-
          Absolute path on the runner to the InstantID identity bundle DIRECTORY holding
          ip-adapter.safetensors, scrfd_10g.safetensors and arcface_iresnet100.safetensors. Not a
          manifest download on either lane -- the worker fetches it on first use -- so
          --download-missing cannot supply it and the operator stages it. Empty keeps whatever the
          runner already exports as $SCENEWORKS_INSTANTID_WEIGHTS.
        required: false
        type: string
        default: ""
      instantid_controlnet:
        description: >-
          Absolute path on the runner to the InstantID IdentityNet `ControlNetModel` directory
          (diffusion_pytorch_model.safetensors). Empty keeps $SCENEWORKS_INSTANTID_CONTROLNET.
        required: false
        type: string
        default: ""
      pulid_weights:
        description: >-
          Absolute path on the runner to the PuLID-FLUX bundle DIRECTORY holding all five loose
          files (pulid_flux_v0.9.1, eva02_clip_l_336, bisenet_parsing, scrfd_10g,
          arcface_iresnet100). Empty keeps $SCENEWORKS_PULID_WEIGHTS.
        required: false
        type: string
        default: ""

# `gh pr create` and the branch pushes both run as the default GITHUB_TOKEN. The only other secret
# this workflow reads is `HF_TOKEN`, and only the Hugging Face CLI sees it, only under
# `download_missing` against a gated repository.
permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

env:
  CAMPAIGN: ${{ inputs.campaign }}
  BASE_REF: ${{ inputs.ref }}
  PUSH_EVERY: ${{ inputs.push_every }}
  ANCHORS_INPUT: ${{ inputs.anchors }}
  MODELS_INPUT: ${{ inputs.models }}
  SKIP_CURRENT: ${{ inputs.skip_current }}
  HF_CACHE_INPUT: ${{ inputs.hf_cache_roots }}
  DOWNLOAD_MISSING: ${{ inputs.download_missing }}
  # The per-lane wall-clock budget, straight through to `--probe-budget-minutes` (sc-22738 review).
  # It is a dispatch input rather than a constant so a cell that needs longer than its lane's
  # default can be re-measured without a source edit and a PR.
  PROBE_BUDGET_INPUT: ${{ inputs.probe_budget_minutes }}
  # The three operator-staged identity stacks (sc-22738). Carried as INPUT_-prefixed names on
  # purpose: `stage-identity-bundles.sh` copies each into $GITHUB_ENV under the name the worker
  # actually reads ONLY when it is non-empty, so an unused input can never blank a runner that
  # already exports the real variable.
  INPUT_INSTANTID_WEIGHTS: ${{ inputs.instantid_weights }}
  INPUT_INSTANTID_CONTROLNET: ${{ inputs.instantid_controlnet }}
  INPUT_PULID_WEIGHTS: ${{ inputs.pulid_weights }}
  # Read by the Hugging Face CLI itself when --download-missing fetches a gated repository. Absent
  # is not an error: every SceneWorks rehost and every upstream this campaign fetches is public, so
  # an unset token only matters for a gated one. `hf_transfer` is opt-in on the runner, not here.
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  mlx:
    if: ${{ inputs.backend == 'mlx' }}
    name: mlx catalog campaign
    # `rw-krea` and `nax` are the two macOS label sets verified as carried by a live runner
    # (nax-macos-2 and nax-macos respectively). A label NO runner carries does not fail the
    # dispatch -- the job queues silently until the run is cancelled -- so this is a closed choice
    # rather than a free-text label.
    runs-on: ${{ startsWith(inputs.runner_label, 'nax') && fromJSON('["self-hosted","macOS","ARM64","nax"]') || fromJSON('["self-hosted","macOS","ARM64","rw-krea"]') }}
    concurrency:
      group: memory-catalog-campaign-mlx-${{ startsWith(inputs.runner_label, 'nax') && 'nax' || 'rw-krea' }}
      cancel-in-progress: false
    # The full MLX walk is ~147 anchors of real GPU renders, so this is deliberately a two-day
    # ceiling rather than a measured budget. Each anchor is bounded on its own by the harness
    # (`PROBE_BUDGET_MINUTES`, sc-22738), so this ceiling now only catches a wedge OUTSIDE a probe;
    # every anchor that finished before a timeout has already been committed and pushed.
    timeout-minutes: 2880
    env:
      # Survives actions/checkout's `clean: true` between jobs on this persistent box, and keeps the
      # ~30-40 GB of build output out of the checkout the harness asserts is clean.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
      CARGO_NET_OFFLINE: "true"
      BACKEND: mlx
      DEFAULT_HF_CACHE: /Volumes/Models/huggingface/hub
      # No INFERENCE_CLONE_DIR here: a job-level `env:` cannot expand $HOME, and the Macs want
      # exactly the script's default, `$HOME/memory-catalog-inference`. The candle lane sets it
      # because its clone belongs on D: rather than in the runner user's profile.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The job only ever needs the tip of `ref`: branch.sh cuts a brand-new branch from HEAD
          # (`git switch -c`), the harness commits per anchor on top of that, and push.sh pushes
          # that new branch -- a new branch whose base commit already exists on the remote pushes
          # fine from a shallow clone. Nothing in scripts/ci/memory-catalog/*.sh or
          # measure-memory-catalog.mjs reads history beyond HEAD (no `git log`, `merge-base`,
          # `describe`, or history-dependent `rev-list`). A depth-0 clone here was pulling the
          # repo's full 2+ GiB history pack on every dispatch -- 27+ minutes on the Windows CUDA
          # runner vs 8 seconds shallow -- for no benefit.
          fetch-depth: 1

      - name: Cut the campaign branch
        id: branch
        run: bash scripts/ci/memory-catalog/branch.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # No `npm ci`: every script this campaign runs imports only node built-ins and sibling
      # scripts/ modules, and an install would be one more thing that can dirty the box.

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.97.1"

      - name: Fetch prebuilt MLX (sc-21382)
        # Same step as macos-mlx.yml: pmetal-mlx-sys's cmake build of libmlx is ~6 min on every cache
        # miss. Exit 1 means "no prebuilt published for this mlx-rs rev", which is a slow source
        # build rather than an error; anything else is fatal.
        run: |
          set +e
          scripts/fetch-prebuilt-mlx.sh --github-env
          rc=$?
          set -e
          if [ "$rc" = 1 ]; then
            echo "::warning title=prebuilt MLX unavailable::no prebuilt for the pinned mlx-rs rev; building libmlx from source (see step log)"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi

      # BEFORE `cargo fetch`, ON PURPOSE. This is the ONE network fetch of the ~650 MB inference repo
      # the job makes: it lands a persistent, shallow clone and exports the GIT_CONFIG_* rewrite that
      # makes cargo's git transport read from THAT clone instead of pulling the repo a second time.
      # See the header of scripts/ci/memory-catalog/inference.sh.
      - name: Clone the pinned inference revision
        run: bash scripts/ci/memory-catalog/inference.sh

      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked

      - name: Build the MLX memory adapter
        run: |
          cargo build --release --locked -p sceneworks-memory-adapter \
            --features mlx --bin memory-mlx-adapter
          echo "ADAPTER=$CARGO_TARGET_DIR/release/memory-mlx-adapter" >> "$GITHUB_ENV"

      - name: Bind the operator-staged identity bundles
        run: bash scripts/ci/memory-catalog/stage-identity-bundles.sh

      - name: Plan the walk
        run: bash scripts/ci/memory-catalog/plan.sh

      - name: Walk the catalog
        id: walk
        run: bash scripts/ci/memory-catalog/run.sh

      - name: Push whatever landed
        # ALWAYS. A cancelled or timed-out walk has already committed every anchor it finished; this
        # is the step that makes sure those commits leave the box.
        if: ${{ always() }}
        run: bash scripts/ci/memory-catalog/push.sh

      - name: Upload the campaign work dir
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.campaign }}-mlx-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-catalog-${{ inputs.campaign }}-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Open the results PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/memory-catalog/pr.sh

  candle:
    if: ${{ inputs.backend == 'candle' }}
    name: candle catalog campaign
    # The one self-hosted CUDA pool, exactly as desktop-windows.yml spells it. There is no runner
    # choice here: both Windows runners are processes on ONE box.
    runs-on: [self-hosted, Windows, X64, cuda]
    concurrency:
      group: memory-catalog-campaign-candle-cuda
      cancel-in-progress: false
    # Shorter than the MLX ceiling because the candle plan is a smaller set of anchors, but still a
    # day: same reasoning -- a wedge ceiling, not a measured budget.
    timeout-minutes: 1440
    env:
      # Native sm_120 (Blackwell) -- this runner IS the RTX PRO 6000 box, same as windows-candle.yml.
      CUDA_COMPUTE_CAP: "120"
      # The runbook keeps exactly one device visible on the CUDA capture host; the harness's own
      # preflight refuses the walk when this is unset.
      CUDA_VISIBLE_DEVICES: "1"
      CARGO_NET_OFFLINE: "true"
      BACKEND: candle
      DEFAULT_HF_CACHE: 'E:\huggingface\hub'
      # The persistent inference clone, on the drive this runner already keeps its per-runner caches
      # on. Deliberately NOT under $GITHUB_WORKSPACE or $RUNNER_TEMP: both are wiped between jobs,
      # which is what made every dispatch re-pull ~650 MB over this box's slow link.
      INFERENCE_CLONE_DIR: 'D:\memory-catalog-inference'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # See the mlx job's checkout step for why a shallow clone is sufficient here too.
          fetch-depth: 1

      # WHY THIS STEP EXISTS: `bash` ON THIS BOX IS THE WSL RELAY, NOT GIT BASH.
      # ------------------------------------------------------------------------------------------
      # Every `run:` step below inherits the workflow-level `shell: bash`, which makes the runner
      # resolve `bash` off the job's PATH. On this self-hosted Windows runner that resolved to
      # C:\Windows\System32\bash.exe -- the WSL relay, with no distro installed -- so the FIRST bash
      # step ("Cut the campaign branch") died before executing a single line:
      #
      #   <3>WSL (11 - Relay) ERROR: CreateProcessCommon:818: execvpe(/bin/bash) failed:
      #   No such file or directory                                         (run 34041687689)
      #
      # GitHub-HOSTED windows images put Git's bin ahead of System32, which is why the same
      # `shell: bash` default is fine for desktop-windows.yml's `windows-2022` job. This box is not
      # that image: every other step this repo runs on the `[self-hosted, Windows, X64, cuda]` pool
      # is `shell: cmd` or `shell: powershell` (windows-candle.yml, desktop-windows.yml's
      # package-windows job, .github/actions/prepare-rust-runner), so nothing had exercised bash
      # here before this campaign.
      #
      # WHY $GITHUB_PATH AND NOT AN EXPLICIT `shell:` LINE. The obvious fix is a per-step
      # `shell: 'C:\Program Files\Git\bin\bash.exe -eo pipefail {0}'`, but the runner splits a
      # custom `shell:` string on its FIRST SPACE to separate the interpreter from its arguments,
      # so a path under "C:\Program Files\..." is torn in half and never resolves. Prepending the
      # directory to $GITHUB_PATH fixes the same problem without that trap, and fixes it in one
      # place: it repoints the step shell AND the `bash scripts/...` each step invokes AND the
      # `git`/`sed`/`tr`/`tail`/`cygpath` those scripts reach for.
      #
      # It is Git's `bin\bash.exe` (NOT `usr\bin\bash.exe`) on purpose: the `bin` wrapper is the one
      # that puts /usr/bin and /mingw64/bin on PATH for its children. `bin\` holds only bash/sh/git,
      # so prepending it cannot shadow a Windows tool the way prepending `usr\bin\` would.
      #
      # The mlx job deliberately keeps the plain workflow-level `shell: bash`.
      - name: Put Git Bash ahead of the WSL relay on PATH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Prefer the Git that actually served the checkout (…\Git\cmd\git.exe -> …\Git\bin), then
          # the two standard install roots. Resolved rather than hard-coded so a relocated Git is
          # found instead of producing a second cryptic failure.
          $candidates = New-Object System.Collections.Generic.List[string]
          $git = Get-Command git.exe -CommandType Application -ErrorAction SilentlyContinue
          if ($git) {
            $candidates.Add((Join-Path (Split-Path -Parent (Split-Path -Parent $git.Source)) 'bin'))
          }
          $candidates.Add('C:\Program Files\Git\bin')
          $candidates.Add('C:\Program Files (x86)\Git\bin')

          $binDir = $null
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath (Join-Path $candidate 'bash.exe') -PathType Leaf) {
              $binDir = $candidate
              break
            }
          }
          if (-not $binDir) {
            $where = if ($git) { $git.Source } else { 'git.exe is not on PATH either' }
            Write-Host "::error title=Git Bash not found::this lane needs Git for Windows' bash.exe; none of [$($candidates -join '; ')] has one (git.exe: $where). Without it every bash step falls through to C:\Windows\System32\bash.exe, the WSL relay, and dies with 'execvpe(/bin/bash) failed'. Install Git for Windows on this runner."
            exit 1
          }

          # Prove it launches before betting a day-long walk on it (same posture as
          # prepare-rust-runner verifying cargo, sc-13166).
          $bash = Join-Path $binDir 'bash.exe'
          $probe = & $bash -c 'echo ok'
          if ($LASTEXITCODE -ne 0 -or $probe -ne 'ok') {
            Write-Host "::error title=Git Bash is not usable::'$bash' exists but did not run 'echo ok' (exit $LASTEXITCODE, output '$probe')."
            exit 1
          }

          # $GITHUB_PATH PREPENDS, so this wins over C:\Windows\System32 for every later step.
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
          Write-Host "bash for this job: $bash"

      - name: Cut the campaign branch
        id: branch
        run: bash scripts/ci/memory-catalog/branch.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Makes this box build against the REAL rustup toolchain bin rather than the fragile
      # %USERPROFILE%\.cargo\bin proxies (sc-13166). Same composite action every candle lane uses.
      - name: Prepare the Rust toolchain
        uses: ./.github/actions/prepare-rust-runner

      # BEFORE `cargo fetch`, ON PURPOSE -- and this lane is why. Run 34044786385 spent 70 minutes at
      # ~150 KB/s in cargo's git fetch of the inference repo, died with `fetch-pack: unexpected
      # disconnect`, and started over. This step does the ONE fetch, shallow, into a clone on D: that
      # outlives the job, and exports the GIT_CONFIG_* rewrite pointing cargo at it. See the header
      # of scripts/ci/memory-catalog/inference.sh.
      - name: Clone the pinned inference revision
        run: bash scripts/ci/memory-catalog/inference.sh

      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked

      - name: Build the candle memory adapter
        # cmd + vcvars64 + NVCC_CCBIN is how every CUDA compile on this box is spelled; candle-gen's
        # cuda feature invokes nvcc, which needs the host compiler on PATH.
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo build --release --locked -p sceneworks-memory-adapter --features candle --bin memory-candle-adapter
          if errorlevel 1 exit /b 1
          echo ADAPTER=%GITHUB_WORKSPACE%\target\release\memory-candle-adapter.exe>>%GITHUB_ENV%

      # BEFORE the walk, and it FAILS THE JOB rather than warning (sc-22738). Run 34272596969 spent
      # 51 guarded renders -- about an hour of GPU time -- refusing every peak as contaminated by
      # pid 6308, an adapter orphaned by the cancelled run before it. See the script's header.
      - name: Census the profiled GPU
        run: bash scripts/ci/memory-catalog/gpu-preflight.sh

      - name: Bind the operator-staged identity bundles
        run: bash scripts/ci/memory-catalog/stage-identity-bundles.sh

      - name: Plan the walk
        run: bash scripts/ci/memory-catalog/plan.sh

      - name: Walk the catalog
        id: walk
        run: bash scripts/ci/memory-catalog/run.sh

      - name: Push whatever landed
        if: ${{ always() }}
        run: bash scripts/ci/memory-catalog/push.sh

      - name: Upload the campaign work dir
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.campaign }}-candle-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-catalog-${{ inputs.campaign }}-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Open the results PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/memory-catalog/pr.sh
