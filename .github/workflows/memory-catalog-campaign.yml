      # BEFORE `cargo fetch`, ON PURPOSE. This is the ONE network fetch of the ~650 MB inference repo
      # the job makes: it lands a persistent, shallow clone and exports the GIT_CONFIG_* rewrite that
      # makes cargo's git transport read from THAT clone instead of pulling the repo a second time.
      # See the header of scripts/ci/memory-catalog/inference.sh.
      - name: Clone the pinned inference revision
        run: bash scripts/ci/memory-catalog/inference.sh

      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked

      - name: Build the MLX memory adapter
        # Unstripped, like the other release producers on these Macs (iris-mlx-real-weights,
        # qwen-image-2-1-app-lifecycle): Rust 1.97.1's bundled LLVM predates rust-lang/rust#158410's
        # Mach-O string-table alignment fix, and a release build strips by default. On nax-macos-2
        # the stripped mlx-rs proc-macro dylibs are then not found by the crate that uses them
        # (E0463 on `pmetal-mlx-rs`, sc-25690 runs 38340620426, 38393909347, 38394612935; cleaning
        # and rebuilding them stripped changed nothing). A failed build says what it saw.
        env:
          CARGO_PROFILE_RELEASE_STRIP: "none"
        run: |
          build() {
            cargo build --release --locked -p sceneworks-memory-adapter \
              --features mlx --bin memory-mlx-adapter "$@"
          }
          if ! build; then
            ls -la "$CARGO_TARGET_DIR"/release/deps/libmlx_macros* \
              "$CARGO_TARGET_DIR"/release/deps/libmlx_internal_macros* || true
            env | grep -E '^(RUST|CARGO_BUILD|CARGO_PROFILE|CARGO_ENCODED)' || true
            grep -nE 'rustflags|linker|strip|target-dir|^\[' "$CARGO_HOME/config.toml" || true
            build -v 2>&1 | grep -E 'Running .*(mlx_macros|mlx_internal_macros|pmetal_mlx_rs)' | cut -c1-4000 || true
            exit 1
          fi
          echo "ADAPTER=$CARGO_TARGET_DIR/release/memory-mlx-adapter" >> "$GITHUB_ENV"

      - name: Bind the operator-staged identity bundles
        run: bash scripts/ci/memory-catalog/stage-identity-bundles.sh

      - name: Bind the persistent Qwen weights
        if: ${{ inputs.qwen_persistent_weights }}
        run: node scripts/ci/memory-catalog/bind-qwen-persistent-cache.mjs

      - name: Plan the walk
        run: bash scripts/ci/memory-catalog/plan.sh

      - name: Walk the catalog
        id: walk
        # The CLI reads this only if --download-missing fetches a gated repository.
        # An unset token is fine for public snapshots.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/ci/memory-catalog/run.sh

      - name: Push whatever landed
        # ALWAYS. A cancelled or timed-out walk has already committed every anchor it finished; this
        # is the step that makes sure those commits leave the box.
        if: ${{ always() }}
        run: bash scripts/ci/memory-catalog/push.sh

      - name: Upload the campaign work dir
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.campaign }}-mlx-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-catalog-${{ inputs.campaign }}-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Open the results PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/memory-catalog/pr.sh

  candle:
    if: ${{ !inputs.run_moss_training_acceptance && (inputs.profile == 'sdxl-cuda-endpoints' || inputs.profile == 'sdxl-cuda-admitted-replay' || ((inputs.profile == '' || inputs.profile == 'catalog') && inputs.backend == 'candle')) }}
    name: candle catalog campaign
    # The one self-hosted CUDA pool, exactly as desktop-windows.yml spells it. There is no runner
    # choice here: all four Windows listeners are processes on ONE box.
    runs-on: [self-hosted, Windows, X64, cuda]
    concurrency:
      group: memory-catalog-campaign-candle-cuda
      cancel-in-progress: false
    # Shorter than the MLX ceiling because the candle plan is a smaller set of anchors, but still a
    # day: same reasoning -- a wedge ceiling, not a measured budget.
    timeout-minutes: ${{ startsWith(inputs.profile, 'sdxl-cuda-') && 180 || 1440 }}
    env:
      # Native sm_120 (Blackwell) -- this runner IS the RTX PRO 6000 box, same as windows-candle.yml.
      CUDA_COMPUTE_CAP: "120"
      # Catalog defaults to GPU1. After compilation the manual SDXL controller selects one idle
      # physical GPU0/1 and gives each child a matching single-device visibility/identity binding.
      CUDA_VISIBLE_DEVICES: "1"
      SCENEWORKS_GPU_ID: "1"
      CARGO_NET_OFFLINE: "true"
      BACKEND: candle
      MEMORY_CAMPAIGN_PROFILE: ${{ inputs.profile || 'catalog' }}
      DEFAULT_HF_CACHE: 'E:\huggingface\hub'
      # The persistent inference clone, on the drive this runner already keeps its per-runner caches
      # on. Deliberately NOT under $GITHUB_WORKSPACE or $RUNNER_TEMP: both are wiped between jobs,
      # which is what made every dispatch re-pull ~650 MB over this box's slow link.
      INFERENCE_CLONE_DIR: 'D:\memory-catalog-inference'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # See the mlx job's checkout step for why a shallow clone is sufficient here too.
          fetch-depth: 1

      # WHY THIS STEP EXISTS: `bash` ON THIS BOX IS THE WSL RELAY, NOT GIT BASH.
      # ------------------------------------------------------------------------------------------
      # Every `run:` step below inherits the workflow-level `shell: bash`, which makes the runner
      # resolve `bash` off the job's PATH. On this self-hosted Windows runner that resolved to
      # C:\Windows\System32\bash.exe -- the WSL relay, with no distro installed -- so the FIRST bash
      # step ("Cut the campaign branch") died before executing a single line:
      #
      #   <3>WSL (11 - Relay) ERROR: CreateProcessCommon:818: execvpe(/bin/bash) failed:
      #   No such file or directory                                         (run 34041687689)
      #
      # GitHub-HOSTED windows images put Git's bin ahead of System32, which is why the same
      # `shell: bash` default is fine for desktop-windows.yml's `windows-2022` job. This box is not
      # that image: every other step this repo runs on the `[self-hosted, Windows, X64, cuda]` pool
      # is `shell: cmd` or `shell: powershell` (windows-candle.yml, desktop-windows.yml's
      # package-windows job, .github/actions/prepare-rust-runner), so nothing had exercised bash
      # here before this campaign.
      #
      # WHY $GITHUB_PATH AND NOT AN EXPLICIT `shell:` LINE. The obvious fix is a per-step
      # `shell: 'C:\Program Files\Git\bin\bash.exe -eo pipefail {0}'`, but the runner splits a
      # custom `shell:` string on its FIRST SPACE to separate the interpreter from its arguments,
      # so a path under "C:\Program Files\..." is torn in half and never resolves. Prepending the
      # directory to $GITHUB_PATH fixes the same problem without that trap, and fixes it in one
      # place: it repoints the step shell AND the `bash scripts/...` each step invokes AND the
      # `git`/`sed`/`tr`/`tail`/`cygpath` those scripts reach for.
      #
      # It is Git's `bin\bash.exe` (NOT `usr\bin\bash.exe`) on purpose: the `bin` wrapper is the one
      # that puts /usr/bin and /mingw64/bin on PATH for its children. `bin\` holds only bash/sh/git,
      # so prepending it cannot shadow a Windows tool the way prepending `usr\bin\` would.
      #
      # The mlx job deliberately keeps the plain workflow-level `shell: bash`.
      - name: Put Git Bash ahead of the WSL relay on PATH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Prefer the Git that actually served the checkout (…\Git\cmd\git.exe -> …\Git\bin), then
          # the two standard install roots. Resolved rather than hard-coded so a relocated Git is
          # found instead of producing a second cryptic failure.
          $candidates = New-Object System.Collections.Generic.List[string]
          $git = Get-Command git.exe -CommandType Application -ErrorAction SilentlyContinue
          if ($git) {
            $candidates.Add((Join-Path (Split-Path -Parent (Split-Path -Parent $git.Source)) 'bin'))
          }
          $candidates.Add('C:\Program Files\Git\bin')
          $candidates.Add('C:\Program Files (x86)\Git\bin')

          $binDir = $null
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath (Join-Path $candidate 'bash.exe') -PathType Leaf) {
              $binDir = $candidate
              break
            }
          }
          if (-not $binDir) {
            $where = if ($git) { $git.Source } else { 'git.exe is not on PATH either' }
            Write-Host "::error title=Git Bash not found::this lane needs Git for Windows' bash.exe; none of [$($candidates -join '; ')] has one (git.exe: $where). Without it every bash step falls through to C:\Windows\System32\bash.exe, the WSL relay, and dies with 'execvpe(/bin/bash) failed'. Install Git for Windows on this runner."
            exit 1
          }

          # Prove it launches before betting a day-long walk on it (same posture as
          # prepare-rust-runner verifying cargo, sc-13166).
          $bash = Join-Path $binDir 'bash.exe'
          $probe = & $bash -c 'echo ok'
          if ($LASTEXITCODE -ne 0 -or $probe -ne 'ok') {
            Write-Host "::error title=Git Bash is not usable::'$bash' exists but did not run 'echo ok' (exit $LASTEXITCODE, output '$probe')."
            exit 1
          }

          # $GITHUB_PATH PREPENDS, so this wins over C:\Windows\System32 for every later step.
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
          Write-Host "bash for this job: $bash"

      - name: Cut the campaign branch
        if: ${{ !startsWith(inputs.profile, 'sdxl-cuda-') }}
        id: branch
        run: bash scripts/ci/memory-catalog/branch.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Makes this box build against the REAL rustup toolchain bin rather than the fragile
      # %USERPROFILE%\.cargo\bin proxies (sc-13166). Same composite action every candle lane uses.
      - name: Prepare the Rust toolchain
        uses: ./.github/actions/prepare-rust-runner

      # THE SAME DECISION windows-candle.yml ALREADY MADE, FOR THE SAME REASON (sc-22738).
      # ------------------------------------------------------------------------------------------
      # The shared runner exports RUSTC_WRAPPER=sccache. The prep action above correctly clears a
      # wrapper that is MISSING, but an INSTALLED daemon can still reset its local connection
      # mid-build -- Windows os error 10054, "an existing connection was forcibly closed by the
      # remote host". windows-candle.yml records that failure twice (the backend-candle test and the
      # sidecar check) and disables the wrapper for both. This job hit it a third time: run
      # 34490358777 died four minutes into "Build the candle memory adapter" with ZERO rustc
      # diagnostics --
      #
      #   sccache: error: failed to execute compile
      #   sccache: caused by: error reading compile response from server
      #   sccache: caused by: An existing connection was forcibly closed by the remote host.
      #                       (os error 10054)
      #   error: could not compile `candle-transformers` / `candle-gen`
      #
      # -- because a wrapper that drops its socket reports no compiler error to attribute the
      # failure to. That is also why this is a DISABLE and not a retry-with-fallback: a retry would
      # spend a second cold candle build to learn exactly as little.
      #
      # This job compiles candle-core, candle-transformers, the whole vendored inference tree and
      # the CUDA kernels on that same box, and does it COLD every dispatch (actions/checkout's
      # `clean: true` runs `git clean -ffdx`, which takes `target/` with it). It is the heavy Candle
      # lane by every property the sibling comment names, so rustc is made direct and deterministic
      # FOR THIS JOB ONLY. Cargo's registry/git caches are untouched and every sibling workflow keeps
      # its sccache.
      - name: Disable unstable sccache wrapper for the heavy Candle lane
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value 'RUSTC_WRAPPER='
          Remove-Item Env:RUSTC_WRAPPER -ErrorAction SilentlyContinue

      # NO "Isolate Cargo dependency checkout" STEP HERE, AND THAT IS DELIBERATE (sc-22738).
      # ------------------------------------------------------------------------------------------
      # windows-candle.yml pairs the step above with one that repoints CARGO_HOME at
      # $RUNNER_TEMP\cargo-home, because a sibling runner service could replace the SHARED
      # %USERPROFILE%\.cargo git checkout while rustc was still reading vendored inference sources
      # (surfacing as an unrelated missing-path / os error 267). That premise does not hold for this
      # job: sc-17614 established -- and .github/actions/prepare-rust-runner/action.yml documents at
      # its "CARGO_HOME IS NOT RUSTUP'S HOME HERE" header -- that each runner service pins CARGO_HOME
      # in its OWN .env to a PER-RUNNER dependency cache (D:\cargo-home-N: registry\, git\,
      # config.toml, no bin\). A runner service executes one job at a time, so the cargo git checkout
      # this job reads is already private to it and a second copy would buy nothing.
      #
      # It would also cost something measured. windows-candle.yml's own header states the price of
      # its step: "a job-local CARGO_HOME under RUNNER_TEMP is re-downloaded every run". This is the
      # lane whose entire fetch design exists because this box's link is slow -- the persistent
      # shallow inference clone below was cut after a 70-minute 150 KB/s cargo fetch died mid-pack --
      # so discarding the per-runner crates.io registry on every dispatch is the wrong trade here.
      #
      # If a runner service is ever registered WITHOUT that CARGO_HOME pin, the result is a loud
      # failure in the build step below rather than silent corruption, and re-running the failed job
      # is now a supported recovery: scripts/ci/memory-catalog/branch.sh resumes the campaign branch
      # instead of colliding with it.

      # BEFORE `cargo fetch`, ON PURPOSE -- and this lane is why. Run 34044786385 spent 70 minutes at
      # ~150 KB/s in cargo's git fetch of the inference repo, died with `fetch-pack: unexpected
      # disconnect`, and started over. This step does the ONE fetch, shallow, into a clone on D: that
      # outlives the job, and exports the GIT_CONFIG_* rewrite pointing cargo at it. See the header
      # of scripts/ci/memory-catalog/inference.sh.
      - name: Clone the pinned inference revision
        run: bash scripts/ci/memory-catalog/inference.sh

      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked

      - name: Build the candle memory adapter
        # cmd + vcvars64 + NVCC_CCBIN is how every CUDA compile on this box is spelled; candle-gen's
        # cuda feature invokes nvcc, which needs the host compiler on PATH.
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo build --release --locked -p sceneworks-memory-adapter --features candle --bin memory-candle-adapter
          if errorlevel 1 exit /b 1
          rem CI_IMPACT: manual SDXL profiles only; three pure binding/clock contracts, no GPU or model calls.
          if "%MEMORY_CAMPAIGN_PROFILE:~0,10%"=="sdxl-cuda-" (
            cargo test --release --locked -p sceneworks-memory-adapter --features candle --bin memory-candle-adapter sdxl_endpoint_ -- --nocapture
            if errorlevel 1 exit /b 1
          )
          echo ADAPTER=%GITHUB_WORKSPACE%\target\release\memory-candle-adapter.exe>>%GITHUB_ENV%

      # CI_IMPACT: explicit replay only. Reuses this job's native CUDA toolchain and caches,
      # runs the new pure gate contracts and strict worker Clippy, then builds the real app/worker.
      # No normal-CI inference is added; the single real render is the next explicit replay step.
      - name: Validate the SDXL gate and build the native app for admitted replay
        if: ${{ inputs.profile == 'sdxl-cuda-admitted-replay' }}
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo test --release --locked -p sceneworks-core --lib sdxl_endpoint_ -- --nocapture
          if errorlevel 1 exit /b 1
          cargo test --release --locked -p sceneworks-worker --features backend-candle --lib candle_memory_strategy::tests::sdxl_ -- --nocapture
          if errorlevel 1 exit /b 1
          cargo test --release --locked -p sceneworks-worker --features backend-candle --lib generator_cache::tests::sdxl_cuda_policy_transitions_reload_without_fragmenting_other_provider_caches -- --exact --nocapture
          if errorlevel 1 exit /b 1
          rem CI_IMPACT: reuse the built test binary for the pure production component/inventory contracts.
          cargo test --release --locked -p sceneworks-worker --features backend-candle --lib image_jobs::sdxl_endpoint_inventory_tests -- --nocapture
          if errorlevel 1 exit /b 1
          cargo clippy --release --locked -p sceneworks-worker --features backend-candle --lib -- -D warnings
          if errorlevel 1 exit /b 1
          rem Preserve linked capability output from this already-required worker build; no weights or inference.
          cargo run --release --locked -p sceneworks-worker --no-default-features --features backend-candle --bin dump-engine-capabilities -- "%RUNNER_TEMP%\memory-catalog-%CAMPAIGN%-%GITHUB_RUN_ID%\engine-capability-facts"
          if errorlevel 1 exit /b 1
          cargo build --release --locked -p sceneworks-rust-api --features backend-candle --bin sceneworks-rust-api
          if errorlevel 1 exit /b 1
          echo SDXL_REPLAY_API=%GITHUB_WORKSPACE%\target\release\sceneworks-rust-api.exe>>%GITHUB_ENV%

      # BEFORE the walk, and it FAILS THE JOB rather than warning (sc-22738). Run 34272596969 spent
      # 51 guarded renders -- about an hour of GPU time -- refusing every peak as contaminated by
      # pid 6308, an adapter orphaned by the cancelled run before it. See the script's header.
      - name: Census the profiled GPU
        if: ${{ !startsWith(inputs.profile, 'sdxl-cuda-') }}
        run: bash scripts/ci/memory-catalog/gpu-preflight.sh

      - name: Bind the operator-staged identity bundles
        run: bash scripts/ci/memory-catalog/stage-identity-bundles.sh

      - name: Plan the walk
        if: ${{ !startsWith(inputs.profile, 'sdxl-cuda-') }}
        run: bash scripts/ci/memory-catalog/plan.sh

      - name: Measure the two SDXL q4 CUDA endpoints
        if: ${{ inputs.profile == 'sdxl-cuda-endpoints' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/ci/memory-catalog/sdxl-endpoints.sh

      - name: Replay one ordinary admitted SDXL q4 app job
        if: ${{ inputs.profile == 'sdxl-cuda-admitted-replay' }}
        run: bash scripts/ci/memory-catalog/sdxl-endpoints.sh

      - name: Walk the catalog
        if: ${{ !startsWith(inputs.profile, 'sdxl-cuda-') }}
        id: walk
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/ci/memory-catalog/run.sh

      - name: Push whatever landed
        if: ${{ always() && !startsWith(inputs.profile, 'sdxl-cuda-') }}
        run: bash scripts/ci/memory-catalog/push.sh

      - name: Upload the campaign work dir
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.campaign }}-candle-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-catalog-${{ inputs.campaign }}-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Open the results PR
        if: ${{ always() && !startsWith(inputs.profile, 'sdxl-cuda-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/memory-catalog/pr.sh
