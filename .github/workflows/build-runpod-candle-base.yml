name: Build RunPod Candle base

# Manual, source-bound refresh of the prebuilt CUDA worker. Release publication
# consumes an immutable digest from this image only after its source guard passes.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-candle-base-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'SceneWorks/SceneWorks' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/next') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish source-bound CUDA worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/rust.Dockerfile
          target: rust-worker-candle
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sceneworks/sceneworks-runpod:candle-prebuilt-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
