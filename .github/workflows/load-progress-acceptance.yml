name: Model load progress terminal acceptance
# sc27984: never on push/PR; ordinary CI only compiles the ignored Rust tests.
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      inference_sha:
        required: true
        type: string
      case:
        required: true
        type: string
      backend:
        required: true
        type: string
      hf_hub_cache:
        required: false
        type: string
        default: ""
      build_only:
        required: false
        type: boolean
        default: true
      mac_go:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact clean final SceneWorks SHA (40 hex, same revision as dispatch ref)
        required: true
        type: string
      inference_sha:
        description: Exact inference SHA permanently pinned by the selected source
        required: true
        type: string
      case:
        description: One bounded job, or cuda_all for the three sequential CUDA jobs sharing one build
        required: true
        type: choice
        options: [image_mlx, image_cuda, audio, training, cuda_all, ort_cpu]
      backend:
        description: MLX requires Mac go; CUDA preserves GPU0; cpu accepts only ort_cpu
        required: true
        type: choice
        options: [cuda, mlx, cpu]
      hf_hub_cache:
        description: Absolute provisioned HF hub for GPU cases; unused by ort_cpu (no downloads)
        required: false
        type: string
      build_only:
        description: Compile ignored acceptance tests without executing models
        required: true
        type: boolean
        default: true
      mac_go:
        description: Michael explicitly approved this dev Mac GPU run (needed only for MLX execution)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  accept:
    runs-on: ${{ inputs.backend == 'mlx' && fromJSON('["self-hosted","macOS","ARM64","rw-starvector","real-weights"]') || inputs.backend == 'cpu' && fromJSON('["self-hosted","Windows","X64","cuda"]') || fromJSON('["self-hosted","Windows","X64","cuda","real-weights"]') }}
    timeout-minutes: 180
    concurrency:
      # Distinct pending requests must remain queued; preserve the existing physical GPU0 binding.
      group: ${{ format('load-progress-{0}-{1}-{2}', inputs.backend, github.run_id, github.run_attempt) }}
      cancel-in-progress: false
    env:
      LOAD_PROGRESS_SOURCE_SHA: ${{ inputs.source_sha }}
      LOAD_PROGRESS_INFERENCE_SHA: ${{ inputs.inference_sha }}
      LOAD_PROGRESS_BACKEND: ${{ inputs.backend }}
      LOAD_PROGRESS_CASE: ${{ inputs.case }}
      LOAD_PROGRESS_MAC_GO: ${{ inputs.mac_go }}
      LOAD_PROGRESS_OUTPUT: ${{ github.workspace }}/../load-progress-${{ github.run_id }}-${{ github.run_attempt }}
      LOAD_PROGRESS_TARGET_DIR: ${{ github.workspace }}/../load-progress-target-${{ inputs.source_sha }}-${{ inputs.backend }}
      HF_HUB_CACHE: ${{ inputs.hf_hub_cache }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SCENEWORKS_GPU_ID: ${{ inputs.backend == 'cpu' && 'cpu' || inputs.backend == 'cuda' && '0' || 'mlx' }}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_COMPUTE_CAP: "120"
      CUDA_VISIBLE_DEVICES: ${{ inputs.backend == 'cuda' && '0' || '' }}
      NVIDIA_VISIBLE_DEVICES: ${{ inputs.backend == 'cuda' && '0' || '' }}
      RUSTC_WRAPPER: ""
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: none
      CARGO_PROFILE_TEST_STRIP: none
      BUILD_ONLY: ${{ inputs.build_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require selected CUDA dispatch before native setup
        id: preflight-cuda
        if: ${{ inputs.backend == 'cuda' || inputs.backend == 'cpu' }}
        shell: powershell
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          node scripts/load-progress-acceptance.mjs --workflow-preflight
          if ($LASTEXITCODE -ne 0) { throw 'load progress admission failed' }
      - name: Require selected MLX dispatch before native setup
        id: preflight-mlx
        if: ${{ inputs.backend == 'mlx' }}
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          node scripts/load-progress-acceptance.mjs --workflow-preflight
      - uses: ./.github/actions/prepare-rust-runner
        if: ${{ inputs.backend == 'cuda' || inputs.backend == 'cpu' }}
        with:
          workspace-directory: .
      - name: Preserve listener-owned CUDA dependency and kernel build caches
        if: ${{ inputs.backend == 'cuda' || inputs.backend == 'cpu' }}
        shell: powershell
        run: |
          node scripts/select-windows-cargo-cache.mjs
          if ($LASTEXITCODE -ne 0) { throw 'isolated persistent Cargo cache selection failed' }
      - name: Fetch the exact locked CUDA dependencies
        if: ${{ inputs.backend == 'cuda' || inputs.backend == 'cpu' }}
        shell: powershell
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'locked dependency fetch failed' }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        if: ${{ inputs.backend == 'mlx' }}
        with:
          toolchain: "1.98.0"
      - name: Prepare Debug MLX library without model execution
        if: ${{ inputs.backend == 'mlx' }}
        shell: bash
        run: |
          set +e
          scripts/fetch-prebuilt-mlx.sh --build-type Debug --github-env
          rc=$?
          set -e
          if [ "$rc" = 1 ]; then
            echo "PMETAL_MLX_PREBUILT_DIR=" >> "$GITHUB_ENV"
            echo "PMETAL_METALLIB_PATH=" >> "$GITHUB_ENV"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: Compile then execute the one selected MLX case
        if: ${{ inputs.backend == 'mlx' }}
        shell: bash
        run: |
          if [ "$BUILD_ONLY" = true ]; then
            node scripts/load-progress-acceptance.mjs --build-only
          else
            node scripts/load-progress-acceptance.mjs
          fi
      - name: Compile then execute the selected bounded CUDA jobs
        if: ${{ inputs.backend == 'cuda' }}
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          if "%BUILD_ONLY%"=="true" (node scripts/load-progress-acceptance.mjs --build-only) else (python -I scripts/ci/windows_cuda_execution.py --actor load-progress-acceptance --budget-minutes 170 --cuda-ordinals 0 --probe-visible 0 -- node scripts/load-progress-acceptance.mjs)
      - name: Compile then execute only the explicit CPU ORT fixture
        if: ${{ inputs.backend == 'cpu' }}
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          if "%BUILD_ONLY%"=="true" (node scripts/load-progress-acceptance.mjs --build-only) else (node scripts/load-progress-acceptance.mjs)
      - name: Retain progress POSTs, output identities and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-progress-${{ inputs.backend }}-${{ inputs.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Aggregate child evidence is retained without uploading case state or build targets.
          path: |
            ${{ steps.preflight-cuda.outputs.directory || steps.preflight-mlx.outputs.directory }}/evidence/
            ${{ steps.preflight-cuda.outputs.directory || steps.preflight-mlx.outputs.directory }}/image_cuda/evidence/
            ${{ steps.preflight-cuda.outputs.directory || steps.preflight-mlx.outputs.directory }}/audio/evidence/
            ${{ steps.preflight-cuda.outputs.directory || steps.preflight-mlx.outputs.directory }}/training/evidence/
            ${{ runner.temp }}/sceneworks-cuda-execution-${{ github.run_id }}-${{ github.run_attempt }}-load-progress-acceptance/
          if-no-files-found: error
          retention-days: 30
