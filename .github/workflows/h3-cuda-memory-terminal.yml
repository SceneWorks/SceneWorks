name: H3 CUDA long-clip memory acceptance

# Same-ref callable ONLY from the existing explicit manual dispatch bridge.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  anchors:
    if: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.plan).stationary_pair_authorized == true }}
    runs-on: ${{ fromJSON(format('["self-hosted","Windows","X64","cuda","real-weights","{0}"]', fromJSON(inputs.plan).expectedRunner)) }}
    # Existing physical GPU1 lane; never cancel a prior owned inference run.
    concurrency:
      group: windows-candle-gpu-real-weights
      cancel-in-progress: false
    timeout-minutes: ${{ fromJSON(inputs.plan).additionalSparse24 == true && 600 || 360 }}
    env:
      SW_F329_PLAN: ${{ inputs.plan }}
      H3_TERMINAL_AUTHORIZED_PAIR: ${{ format('{0}:{1}', fromJSON(inputs.plan).sceneworks, fromJSON(inputs.plan).inference) }}
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CUDA_COMPUTE_CAP: '120'
      CUDA_PATH: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ fromJSON(inputs.plan).sceneworks }}
          path: sceneworks
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: SceneWorks/inference
          ref: ${{ fromJSON(inputs.plan).inference }}
          path: inference
          fetch-depth: 128
          persist-credentials: false
      - name: Require final source pair and private Windows output roots before setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = $env:SW_F329_PLAN | ConvertFrom-Json
          if ($env:GITHUB_SHA -ne $p.sceneworks) { throw 'dispatch source differs from frozen SceneWorks candidate' }
          if ($env:RUNNER_NAME -ne $p.expectedRunner) { throw 'unexpected real-weights listener' }
          if ((git -C sceneworks rev-parse HEAD) -ne $p.sceneworks -or (git -C inference rev-parse HEAD) -ne $p.inference) { throw 'checkout source mismatch' }
          git -C inference fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw 'cannot verify inference main' }
          $root = "D:\Codex\work\sw-f329-acceptance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'refusing to overwrite prior acceptance output' }
          $tempRoot = "$root-temp"
          New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null
          $uuid = (nvidia-smi -i 1 --query-gpu=uuid --format=csv,noheader,nounits).Trim()
          if ($LASTEXITCODE -ne 0 -or $uuid -notmatch '^GPU-[0-9a-fA-F-]{36}$') { throw 'physical GPU1 unavailable' }
          $encoding = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "SW_F329_OUTPUT=$root`nTEMP=$tempRoot`nTMP=$tempRoot`nCUDA_VISIBLE_DEVICES=$uuid`nCUDA_DEVICE_ORDER=PCI_BUS_ID`nSCENEWORKS_GPU_ID=1`n", $encoding)
      - name: Check script entry point and pure refusal contracts before native/model setup
        working-directory: sceneworks
        shell: cmd
        run: |
          node --check scripts\h3-cuda-memory-terminal.mjs
          if errorlevel 1 exit /b %ERRORLEVEL%
          node scripts\h3-cuda-memory-terminal.mjs check
          if errorlevel 1 exit /b %ERRORLEVEL%
          node --test scripts\h3-cuda-memory-terminal.test.mjs
      - name: Build and execute the two stationary-pair anchors
        working-directory: sceneworks
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %ERRORLEVEL%
          where ffmpeg
          if errorlevel 1 exit /b %ERRORLEVEL%
          where ffprobe
          if errorlevel 1 exit /b %ERRORLEVEL%
          node scripts\h3-cuda-memory-terminal.mjs run "%GITHUB_WORKSPACE%\sceneworks" "%GITHUB_WORKSPACE%\inference" "%SW_F329_OUTPUT%"
      - name: Keep output, source, allocation, numerical and media evidence
        if: always() && env.SW_F329_OUTPUT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sw-f329-cuda-memory-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SW_F329_OUTPUT }}/*.json
            ${{ env.SW_F329_OUTPUT }}/workstation-veda/*.json
            ${{ env.SW_F329_OUTPUT }}/workstation-veda/*.log
            ${{ env.SW_F329_OUTPUT }}/workstation-veda/*.mp4
            ${{ env.SW_F329_OUTPUT }}/24gib-veda-dense/*.json
            ${{ env.SW_F329_OUTPUT }}/24gib-veda-dense/*.log
            ${{ env.SW_F329_OUTPUT }}/24gib-veda-dense/*.mp4
            ${{ env.SW_F329_OUTPUT }}/24gib-veda-sparse/*.json
            ${{ env.SW_F329_OUTPUT }}/24gib-veda-sparse/*.log
            ${{ env.SW_F329_OUTPUT }}/24gib-veda-sparse/*.mp4
          if-no-files-found: error
