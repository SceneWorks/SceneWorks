          name: h3-terminal-${{ inputs.backend }}-reduced-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.H3_CASE_ARTIFACT_PATHS }}
            !${{ env.H3_OUTPUT_EFFECTIVE }}/**/service/**
            !${{ env.H3_OUTPUT_EFFECTIVE }}/**/tmp/**
            !${{ env.H3_OUTPUT_EFFECTIVE }}/**/target/**
            !${{ env.H3_OUTPUT_EFFECTIVE }}/**/fixture-target/**
            !${{ env.H3_OUTPUT_EFFECTIVE }}/**/*.safetensors
            !${{ env.H3_OUTPUT_EFFECTIVE }}/**/*.gguf
            !${{ env.H3_OUTPUT_EFFECTIVE }}/**/*.bin
            !${{ env.H3_OUTPUT_EFFECTIVE }}/**/*.pt
            !${{ env.H3_OUTPUT_EFFECTIVE }}/**/*.pth
          if-no-files-found: error
          retention-days: 30
      - name: Retain evidence including failure and resume identity
        if: always() && inputs.case_id != '' && env.H3_OUTPUT_EFFECTIVE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h3-${{ inputs.case_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Receipts/media only. App/cache/build state lives outside the case directory;
          # also exclude accidentally staged checkpoint payloads from evidence publication.
          path: |
            ${{ env.H3_CASE_ARTIFACT_PATHS }}
            !${{ env.H3_OUTPUT_EFFECTIVE }}/${{ inputs.case_id }}/service/**
            !${{ env.H3_OUTPUT_EFFECTIVE }}/${{ inputs.case_id }}/**/target/**
            !${{ env.H3_OUTPUT_EFFECTIVE }}/${{ inputs.case_id }}/**/fixture-target/**
            !${{ env.H3_OUTPUT_EFFECTIVE }}/${{ inputs.case_id }}/**/*.safetensors
            !${{ env.H3_OUTPUT_EFFECTIVE }}/${{ inputs.case_id }}/**/*.gguf
            !${{ env.H3_OUTPUT_EFFECTIVE }}/${{ inputs.case_id }}/**/*.bin
            !${{ env.H3_OUTPUT_EFFECTIVE }}/${{ inputs.case_id }}/**/*.pt
            !${{ env.H3_OUTPUT_EFFECTIVE }}/${{ inputs.case_id }}/**/*.pth
          if-no-files-found: error
          retention-days: 30
