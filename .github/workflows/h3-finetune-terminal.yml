name: H3 fine-tune explicit terminal case

# No pull_request/push/schedule trigger: real models never belong to ordinary CI.
on:
  # Called locally from the already registered server-candle-linux workflow at
  # the SAME caller ref. This file need not exist/register on default main first.
  workflow_call:
    inputs:
      stationary_pair_authorized:
        required: true
        type: boolean
      sceneworks_sha:
        required: true
        type: string
      inference_sha:
        required: true
        type: string
      native_evidence_ref:
        required: false
        type: string
      native_evidence_sha:
        required: false
        type: string
      backend:
        required: true
        type: string
      expected_runner:
        required: true
        type: string
      plan_path:
        required: false
        type: string
        default: ''
      output_path:
        required: false
        type: string
        default: ''
      case_id:
        required: false
        type: string
      campaign_request:
        required: false
        type: string
        default: '{}'
    secrets:
      SCENEWORKS_INFERENCE_READ_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
# Do not cancel another pending/running acceptance case or introduce GPU ownership locks.
concurrency:
  group: h3-finetune-terminal-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  terminal:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stationary_pair_authorized == true && (inputs.backend == 'mlx' || inputs.backend == 'cuda') }}
    # The Windows lane SELECTS the exact listener the request names: each approved full-weights
    # CUDA listener carries its own name as a label, so appending the requested runner to the label
    # set lands the job on that one. Without it, the lane's two listeners both match and the job
    # can land on the other one, which the exact-runner assertion then refuses — a coin flip
    # between two approved machines. The macOS lane needs only the `real-weights` label, which
    # exactly one macOS listener carries.
    runs-on: ${{ inputs.backend == 'mlx' && fromJSON('["self-hosted","macOS","ARM64","real-weights"]') || fromJSON(format('["self-hosted","windows","cuda","real-weights","{0}"]', inputs.expected_runner)) }}
    concurrency:
      group: ${{ inputs.backend == 'cuda' && 'windows-candle-gpu-real-weights' || 'h3-import-proofs-nax-macos' }}
      cancel-in-progress: false
    timeout-minutes: 1440
    env:
      # The macOS real-weights lane keeps its HF home on the reviewed-weights volume, so the
      # staging probe reads the SAME hub the reviewed weights are pre-seeded into, and the
      # lane's private copy of the staged set lands on that volume instead of the runner's
      # smaller internal disk. The runner service does not carry HF_HOME, and without this the
      # probe would read a different directory than the one the weights are seeded into.
      HF_HOME: ${{ inputs.backend == 'mlx' && '/Volumes/Models/huggingface' || '' }}
      # Native sm_120 for the RTX PRO 6000 hosts, as the shipping Windows CUDA lanes build it.
      CUDA_COMPUTE_CAP: ${{ inputs.backend == 'cuda' && '120' || '' }}
      H3_NATIVE_EVIDENCE_REF: ${{ inputs.native_evidence_ref }}
      H3_NATIVE_EVIDENCE_SHA: ${{ inputs.native_evidence_sha }}
      H3_SCENEWORKS_SHA: ${{ inputs.sceneworks_sha }}
      H3_INFERENCE_SHA: ${{ inputs.inference_sha }}
      H3_OUTPUT_EFFECTIVE: ${{ inputs.output_path }}
      H3_STAGE_BACKEND: ${{ inputs.backend }}
      H3_STAGE_SOURCE_SHA: ${{ inputs.sceneworks_sha }}
      H3_TERMINAL_ROUTE: h3-terminal-${{ inputs.backend }}
      H3_STAGE_REQUEST: ${{ inputs.campaign_request }}
    steps:
      # The Windows lane's steps run under bash. A self-hosted Windows listener's own bash
      # resolution falls through to the WSL relay, which has no /bin/bash there, so the job died in
      # its very first step. Git for Windows' bash IS on the box; putting it on the PATH is how
      # this organization selects it (the inference Windows native-terminal lane does the same), and
      # its absence is then a loud refusal instead of a relay error.
      - name: Select Git Bash
        if: ${{ inputs.backend == 'cuda' }}
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      # nvcc needs the MSVC host compiler, and a fresh step has no MSVC environment, so the native
      # build failed with "nvcc fatal: Cannot find compiler 'cl.exe' in PATH". This loads the same
      # BuildTools MSVC 14.44 the Windows Candle lanes use (CUDA 12.9 rejects VS2026's 14.51) and
      # exports its environment to the REST of the job, because this lane builds through bash and
      # node across several steps rather than inside one cmd invocation.
      - name: Activate the MSVC host compiler for nvcc
        if: ${{ inputs.backend == 'cuda' }}
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64"
          if not exist "%NVCC_CCBIN%\cl.exe" exit /b 1
          rem Name the MSVC linker exactly. Git Bash puts its own usr\bin first on PATH inside every
          rem bash step, and its coreutils `link.exe` then shadows MSVC's, so rustc invoked the wrong
          rem binary ("/usr/bin/link: extra operand"). An absolute linker is immune to PATH order.
          set "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=%NVCC_CCBIN%\link.exe"
          if not exist "%CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER%" exit /b 1
          powershell -NoProfile -Command "foreach ($n in 'PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCINSTALLDIR','VCToolsVersion','WindowsSdkDir','WindowsSDKVersion','WindowsSdkBinPath','UCRTVersion','UniversalCRTSdkDir','VSCMD_ARG_TGT_ARCH','VSCMD_ARG_HOST_ARCH','NVCC_CCBIN','CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER') { $v = [Environment]::GetEnvironmentVariable($n); if ($v) { ($n + '=' + $v) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append } }" || exit /b 1
      - name: Record the original terminal job start
        shell: bash
        run: echo "H3_TERMINAL_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.sceneworks_sha }}
          path: sceneworks
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_sha }}
          path: inference
          fetch-depth: 0
          token: ${{ secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: ${{ inputs.native_evidence_sha != '' }}
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.native_evidence_sha }}
          path: inference-evidence
          fetch-depth: 0
          token: ${{ secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # sc-26691: an adaptive-matrix lane waits up to six hours, after all its staging and its first
      # two cases, for the OTHER backend's inline anchors. When that peer was never dispatched, or
      # has already ended without publishing them, the anchors can never arrive. Check the peer
      # before any staging or model work and fail within minutes (a bounded grace covers a peer
      # dispatched seconds after this one); the wait loop re-checks it while waiting.
      - name: Fail fast when the adaptive matrix has no live peer lane
        if: ${{ inputs.case_id == '' && fromJSON(inputs.campaign_request).inspect_only != true && fromJSON(inputs.campaign_request).inspectOnly != true }}
        shell: bash
        working-directory: sceneworks
        env:
          GH_TOKEN: ${{ github.token }}
          H3_ANCHOR_INFERENCE_SHA: ${{ inputs.inference_sha }}
          H3_ANCHOR_EVIDENCE_SHA: ${{ inputs.native_evidence_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {execFileSync} from "node:child_process";
          import {awaitPeerLane} from "./scripts/lib/h3-peer-lane.mjs";
          const env=process.env,request=JSON.parse(env.H3_STAGE_REQUEST||"{}");
          // Only the inline reduced-v1 bootstrap is known to be adaptive this early; an external plan
          // is classified by the wait loop's own liveness check once the plan is read.
          if(request.adaptive_matrix===false||request.bootstrap?.cohort!=="reduced-v1"){console.log("no adaptive peer pairing requested");process.exit(0);}
          const backend=env.H3_STAGE_BACKEND,peer=backend==="mlx"?"cuda":"mlx";
          const gh=args=>execFileSync("gh",args,{encoding:"utf8",maxBuffer:16*1024*1024,env});
          const result=await awaitPeerLane({gh,repository:env.GITHUB_REPOSITORY,headSha:env.H3_SCENEWORKS_SHA,selfRunId:env.GITHUB_RUN_ID,peerBackend:peer,anchorName:`h3-anchors-${peer}-${env.H3_SCENEWORKS_SHA}-${env.H3_ANCHOR_INFERENCE_SHA}-${env.H3_ANCHOR_EVIDENCE_SHA}`,startedAt:Date.parse(env.H3_TERMINAL_JOB_STARTED_AT)});
          console.log(JSON.stringify({peerLane:result.state,peerRun:result.run?.id??result.anchors?.workflow_run?.id??null}));
          NODE
      # BOTH lanes SELECT the reviewed CPython 3.12 already on the runner rather than installing
      # one, through each platform's own verified selector in this repository.
      #
      # Neither platform can install one here. setup-python installs into the HOSTED runner's tool
      # cache, "/Users/runner", which does not exist on a self-hosted Mac whose home is the
      # operator's, so the action cannot create its cache and the job dies before any model work.
      # On Windows the same action removes the existing install and its HKLM registry entries, and
      # the runner account cannot do the registry part ("Requested registry access is not allowed"),
      # so the install fails there too — and it deletes the tool-cache interpreter on the way out.
      #
      # The macOS selector requires an absolute CPython 3.12 arm64 interpreter; the Windows probe
      # checks the interpreter is CPython 3.12, AMD64 and 64-bit.
      - name: Provision the pinned Windows CPython 3.12.10
        if: ${{ runner.os == 'Windows' && fromJSON(inputs.campaign_request).inspect_only != true && fromJSON(inputs.campaign_request).inspectOnly != true }}
        id: speech_python_windows
        shell: powershell
        working-directory: sceneworks
        run: |
          # The organization's portable CPython 3.12.10 x64: a hash-pinned NuGet package expanded
          # into an owned root, with no installer and no registry writes. It is idempotent — an
          # existing install that verifies is reused — and serialized by an exclusive lock, so the
          # two CUDA listeners can share it. This is the same provisioning the StarVector terminal
          # lane uses on these hosts; it does not depend on whatever python happens to be on PATH.
          . (Join-Path $PWD 'scripts\provision-starvector-windows-python.ps1')
          $pythonRoot = 'E:\huggingface\sc26691-python\cpython-3.12.10-x64-nuget'
          $lockPath = 'E:\huggingface\sc26691-python\.locks\cpython-3.12.10-x64-nuget.lock'
          $executable = Invoke-StarVectorWindowsPythonLock -LockPath $lockPath -ScriptBlock {
            $installed = Install-StarVectorWindowsPythonPackage -DestinationRoot $pythonRoot -AllowedRoot $pythonRoot -RunnerTemp $env:RUNNER_TEMP
            (Select-StarVectorBootstrapPython -CandidatePaths @($installed) -ExpectedVersion @(3, 12, 10)).Executable
          }
          "python-path=$executable" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Select the reviewed macOS CPython 3.12
        if: ${{ runner.os == 'macOS' && fromJSON(inputs.campaign_request).inspect_only != true && fromJSON(inputs.campaign_request).inspectOnly != true }}
        id: speech_python_macos
        shell: bash
        working-directory: sceneworks
        run: |
          set -euo pipefail
          candidate="$(node scripts/select-starvector-macos-python.mjs select /opt/homebrew/bin/python3.12 /usr/local/bin/python3.12)"
          "$candidate" --version | grep -E '^Python 3\.12\.'
          echo "python-path=$candidate" >> "$GITHUB_OUTPUT"
      - name: Prepare private CPU-only conditioning and source-variant tools
        if: ${{ fromJSON(inputs.campaign_request).inspect_only != true && fromJSON(inputs.campaign_request).inspectOnly != true }}
        shell: bash
        working-directory: sceneworks
        env:
          SPEECH_BASE_PYTHON: ${{ steps.speech_python_windows.outputs.python-path || steps.speech_python_macos.outputs.python-path }}
          EXPECTED_RUNNER: ${{ inputs.expected_runner }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {execFileSync} from "node:child_process";
          import {appendFile,mkdir,writeFile,lstat} from "node:fs/promises";
          import {createHash} from "node:crypto";
          import path from "node:path";
          import {assertCliEnvironment,parseStageRequest} from "./scripts/h3-finetune-terminal-stage.mjs";
          const env=process.env;assertCliEnvironment({env,platform:process.platform,backend:env.H3_STAGE_BACKEND});assert.equal(env.RUNNER_NAME,env.EXPECTED_RUNNER);
          const request=parseStageRequest(env.H3_STAGE_REQUEST||"{}"),venv=path.join(env.RUNNER_TEMP,`h3-cpu-python-${env.GITHUB_RUN_ID}-${env.GITHUB_RUN_ATTEMPT}`);
          try{await lstat(venv);assert.fail("private CPU venv must be new");}catch(error){if(error.code!=="ENOENT")throw error;}
          execFileSync(env.SPEECH_BASE_PYTHON,["-I","-B","-m","venv",venv],{stdio:"inherit",timeout:120000});
          const python=path.join(venv,process.platform==="win32"?"Scripts/python.exe":"bin/python");
          const torchArgs=["-I","-B","-m","pip","install","--isolated","--no-cache-dir","torch==2.9.1"];
          if(process.platform==="win32")torchArgs.push("--index-url","https://download.pytorch.org/whl/cpu");
          const bridgeNeeded=Boolean(env.H3_NATIVE_EVIDENCE_SHA);
          if(bridgeNeeded)execFileSync(python,torchArgs,{stdio:"inherit",timeout:900000});
          const packages=[];if(request.bootstrap?.cohort==="reduced-v1"||request.assetSets.includes("speech"))packages.push("pyarrow==19.0.1");if(request.prepare_float_variants===true)packages.push("numpy==2.2.6");
          if(packages.length)execFileSync(python,["-I","-B","-m","pip","install","--isolated","--no-cache-dir",...packages],{stdio:"inherit",timeout:600000});
          const versions=bridgeNeeded?JSON.parse(execFileSync(python,["-I","-B","-c","import json,sys,torch; assert sys.version_info[:2]==(3,12); assert str(torch.__version__).split('+')[0]=='2.9.1'; print(json.dumps({'python':sys.version.split()[0],'torch':str(torch.__version__)}))"],{encoding:"utf8",timeout:30000})):JSON.parse(execFileSync(python,["-I","-B","-c","import json,sys; assert sys.version_info[:2]==(3,12); print(json.dumps({'python':sys.version.split()[0],'torch':None}))"],{encoding:"utf8",timeout:30000}));
          const help=bridgeNeeded?execFileSync(python,["-I","-B",path.join(env.GITHUB_WORKSPACE,"inference-evidence","scripts/h3_actual_checkpoint_oracle.py"),"--help"],{encoding:"utf8",timeout:30000}):"No artifact bridge requested for this legacy case.";
          const freeze=execFileSync(python,["-I","-B","-m","pip","freeze","--all"],{encoding:"utf8",timeout:30000});
          const evidence=path.join(env.RUNNER_TEMP,`h3-terminal-stage-${env.GITHUB_SHA}-${env.GITHUB_RUN_ID}-${env.GITHUB_RUN_ATTEMPT}`);await mkdir(evidence,{recursive:true});
          await writeFile(path.join(evidence,"cpu-tools-freeze.txt"),freeze);await writeFile(path.join(evidence,"cpu-bridge-help.txt"),help);
          await writeFile(path.join(evidence,"cpu-tools.json"),JSON.stringify({kind:"h3-cpu-oracle-tools",status:"import-and-help-preflight-passed",numericProof:false,pythonExecutable:python,...versions,sourceSha:env.GITHUB_SHA,nativeEvidenceSha:env.H3_NATIVE_EVIDENCE_SHA,freezeSha256:createHash("sha256").update(freeze).digest("hex"),device:"cpu",meaning:"Actual import/version/help only; selected-artifact arithmetic remains unproven until the native/CPU comparison passes."},null,2)+"\n");
          await appendFile(env.GITHUB_ENV,`H3_SPEECH_PYTHON=${python}\n${bridgeNeeded?"H3_PROBE_PYTHON="+python+"\n":""}`);
          NODE
      # Each attempt stages the verified weights into its own private root and its owned service
      # writes real copies beside them (managed import, normalized bundle, resolved cache), and a
      # failed attempt leaves all of it behind: a few failures filled E: and, on the macOS lane,
      # /Volumes/Models. Clear only this campaign's earlier run roots (and their bootstrap and
      # cargo-target siblings) under the same parent the stage derives its private root from, and
      # only for runs GitHub reports as completed, before this run stages anything.
      - name: Clear this campaign's completed prior-run roots on the weights volume
        if: ${{ fromJSON(inputs.campaign_request).inspect_only != true && fromJSON(inputs.campaign_request).inspectOnly != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {spawnSync} from "node:child_process";
          import {readdir, rm, statfs} from "node:fs/promises";
          import path from "node:path";
          // The stage's privateRunRoot parent: E:\\huggingface on Windows, $HF_HOME elsewhere.
          const hfHome = process.platform === "win32" ? "E:\\huggingface" : process.env.HF_HOME;
          if (!hfHome || !path.isAbsolute(hfHome)) throw new Error("an absolute HF_HOME is required to locate the private run roots");
          const parent = path.join(hfHome, "sc26691-private"), current = process.env.GITHUB_RUN_ID;
          const entries = await readdir(parent, {withFileTypes: true}).catch(e => { if (e.code === "ENOENT") return []; throw e; });
          for (const entry of entries) {
            const match = /^(\d+)-\d+(?:-bootstrap-[0-9a-f]{40}|-target|-native|-fixture)?$/.exec(entry.name);
            if (!entry.isDirectory() || !match || match[1] === current) continue;
            // A directory whose name only LOOKS like a run root (a stray test leftover such as
            // `1-1-native` or `101-1`) has no run behind it: the lookup 404s. That is a reason to
            // keep the directory and say so, never to fail the campaign; deletion stays limited to
            // roots of runs of THIS repository that GitHub reports as completed.
            const lookup = spawnSync("gh", ["api", `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${match[1]}`, "--jq", "[.status, .repository.full_name] | @tsv"], {encoding: "utf8"});
            if (lookup.status !== 0) {
              if (/HTTP 404|Not Found/i.test(`${lookup.stderr}${lookup.stdout}`)) { console.log(`keeping ${entry.name}: no run ${match[1]} in ${process.env.GITHUB_REPOSITORY} (404)`); continue; }
              throw new Error(`run lookup for ${entry.name} failed: ${lookup.stderr || lookup.error?.message || lookup.status}`);
            }
            const [status, repository] = lookup.stdout.trim().split("\t");
            if (repository !== process.env.GITHUB_REPOSITORY) { console.log(`keeping ${entry.name}: run ${match[1]} belongs to ${repository || "no repository"}`); continue; }
            if (status !== "completed") { console.log(`keeping ${entry.name}: run ${match[1]} is ${status}`); continue; }
            await rm(path.join(parent, entry.name), {recursive: true, force: false});
            console.log(`removed ${entry.name}`);
          }
          const fs = await statfs(hfHome);
          console.log(`${hfHome} free ${(fs.bavail * fs.bsize / 2 ** 30).toFixed(1)} GiB`);
          NODE
      - name: Bootstrap the reduced terminal campaign when requested
        id: bootstrap
        shell: bash
        working-directory: sceneworks
        env:
          PLAN_INPUT: ${{ inputs.plan_path }}
          OUTPUT_INPUT: ${{ inputs.output_path }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {appendFile, mkdir, readFile, writeFile} from "node:fs/promises";
          import path from "node:path";
          import {bootstrapTerminal} from "./scripts/h3-finetune-terminal-bootstrap.mjs";
          import {privateRunRoot} from "./scripts/h3-finetune-terminal-stage.mjs";

          const env = process.env;
          const request = JSON.parse(env.H3_STAGE_REQUEST || "{}");
          const evidenceRoot = path.join(env.RUNNER_TEMP, `h3-terminal-stage-${env.GITHUB_SHA}-${env.GITHUB_RUN_ID}-${env.GITHUB_RUN_ATTEMPT}`);
          await mkdir(evidenceRoot, { recursive: true });
          if (request.bootstrap === undefined) {
            await appendFile(env.GITHUB_ENV, "H3_BOOTSTRAP_PREPARED=false\n");
            await appendFile(env.GITHUB_OUTPUT, "prepared=false\n");
          } else {
            const bootstrap = request.bootstrap;
            assert.ok(bootstrap && typeof bootstrap === "object" && !Array.isArray(bootstrap), "request.bootstrap must be a typed object");
            assert.equal(bootstrap.casebook, "sc-26691-h3-cases-v1", "bootstrap casebook identity required");
            assert.equal(bootstrap.cohort, "reduced-v1", "bootstrap cohort must be reduced-v1");
            assert.ok(bootstrap.operator && typeof bootstrap.operator === "object", "typed operator configuration required");
            assert.ok(Array.isArray(bootstrap.componentSelections) || Array.isArray(bootstrap.components), "explicit component selections required");
            assert.ok(bootstrap.legalAuthority && typeof bootstrap.legalAuthority === "object", "explicit legal authority required");
            assert.equal(env.GITHUB_SHA, env.H3_SCENEWORKS_SHA, "dispatch commit must equal the requested SceneWorks source");
            assert.match(env.H3_SCENEWORKS_SHA ?? "", /^[a-f0-9]{40}$/, "dispatch SceneWorks SHA required");
            assert.match(env.H3_INFERENCE_SHA ?? "", /^[a-f0-9]{40}$/, "dispatch inference SHA required");
            // The output root sits BESIDE the per-run private staging root, on the same volume. The
            // runtime hardlinks the staged model files into each case's data directory so a 34 GB
            // checkpoint costs nothing per case, and a hardlink cannot cross volumes: with the
            // output root in RUNNER_TEMP (the internal disk on macOS, D: on Windows) and the staged
            // root on the weights volume (/Volumes/Models, E:), the first case failed with EXDEV. A
            // sibling — not a child — keeps it out of the stage's own run-root cleanup.
            const stagedRoot = privateRunRoot({ backend: env.H3_STAGE_BACKEND, platform: process.platform, env, runId: env.GITHUB_RUN_ID, attempt: env.GITHUB_RUN_ATTEMPT });
            await mkdir(path.dirname(stagedRoot), { recursive: true });
            const outputRoot = `${stagedRoot}-bootstrap-${env.GITHUB_SHA}`;
            const result = await bootstrapTerminal({
              request, backend: env.H3_STAGE_BACKEND, swRoot: process.cwd(),
              inferenceRoot: path.join(env.GITHUB_WORKSPACE, "inference"), evidenceRoot, env, outputRoot,
            });
            assert.equal(result.prepared, true, "bootstrap must report prepared:true");
            assert.equal(result.proof, false, "bootstrap is preparation, not proof");
            assert.ok(typeof result.planPath === "string" && path.isAbsolute(result.planPath), "bootstrap must return an absolute planPath");
            assert.ok(typeof result.output === "string" && path.isAbsolute(result.output), "bootstrap must return an absolute private output root");
            const plan = JSON.parse(await readFile(result.planPath, "utf8"));
            assert.equal(plan.sceneworks, env.H3_SCENEWORKS_SHA, "bootstrap plan must use the dispatch SceneWorks source");
            assert.equal(plan.inference, env.H3_INFERENCE_SHA, "bootstrap plan must use the dispatch inference source");
            assert.equal(plan.inventory, "reduced-v1", "bootstrap plan must be the reduced inventory");
            // The output must stay in the workflow-owned, run-scoped location chosen above: beside
            // this run's private staging root, under the same sc26691-private parent.
            const resolvedOutput = path.resolve(result.output), ownedParent = path.resolve(path.dirname(stagedRoot));
            assert.ok(resolvedOutput.startsWith(ownedParent + path.sep), "bootstrap output must stay beside this run's private staging root");
            assert.equal(path.basename(ownedParent), "sc26691-private", "bootstrap output must stay under the owned sc26691-private parent");
            assert.ok(resolvedOutput.includes(`${env.GITHUB_RUN_ID}-${env.GITHUB_RUN_ATTEMPT}`), "bootstrap output must be derived from the private run/attempt identity");
            await writeFile(path.join(evidenceRoot, "bootstrap.json"), JSON.stringify({ kind: "h3-terminal-bootstrap", prepared: true, proof: false, planPath: result.planPath, output: result.output, sourceSha: env.H3_SCENEWORKS_SHA, inferenceSha: env.H3_INFERENCE_SHA, nativeEvidenceSha: env.H3_NATIVE_EVIDENCE_SHA ?? null }, null, 2) + "\n");
            await appendFile(env.GITHUB_ENV, `H3_PLAN_EFFECTIVE=${result.planPath}\nH3_OUTPUT_EFFECTIVE=${result.output}\nH3_BOOTSTRAP_PREPARED=true\n`);
            await appendFile(env.GITHUB_OUTPUT, `prepared=true\nplan=${result.planPath}\noutput=${result.output}\n`);
            console.log(JSON.stringify({ bootstrap: "prepared", planPath: result.planPath, output: result.output, proof: false }));
          }
          NODE
      - name: Ensure selected assets and conditioning in this terminal route
        id: stage
        shell: bash
        working-directory: sceneworks
        env:
          PLAN: ${{ inputs.plan_path }}
