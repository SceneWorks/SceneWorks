name: H3 fine-tune explicit terminal case

# No pull_request/push/schedule trigger: real models never belong to ordinary CI.
on:
  # Called locally from the already registered server-candle-linux workflow at
  # the SAME caller ref. This file need not exist/register on default main first.
  workflow_call:
    inputs:
      stationary_pair_authorized:
        required: true
        type: boolean
      sceneworks_sha:
        required: true
        type: string
      inference_sha:
        required: true
        type: string
      backend:
        required: true
        type: string
      expected_runner:
        required: true
        type: string
      plan_path:
        required: true
        type: string
      output_path:
        required: true
        type: string
      case_id:
        required: true
        type: string
    secrets:
      SCENEWORKS_INFERENCE_READ_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      stationary_pair_authorized:
        description: Coordinator confirmed final stationary pair after reviews, inference-main merge and permanent pin
        required: true
        type: boolean
        default: false
      sceneworks_sha:
        description: Exact clean SceneWorks revision containing this workflow
        required: true
        type: string
      inference_sha:
        description: Exact permanent inference-main revision pinned by SceneWorks
        required: true
        type: string
      backend:
        description: Physical backend for this case (no CPU substitution)
        required: true
        type: choice
        options: [mlx, cuda]
      expected_runner:
        description: Exact runner name; MLX must be nax-macos-2
        required: true
        type: string
      plan_path:
        description: Already staged external absolute campaign plan; no automatic model download
        required: true
        type: string
      output_path:
        description: Plan's external persistent evidence directory (never a checkout/cache)
        required: true
        type: string
      case_id:
        description: One exact case from scripts/h3-finetune-terminal.mjs list
        required: true
        type: string
permissions:
  contents: read
# Do not cancel another pending/running acceptance case or introduce GPU ownership locks.
concurrency:
  group: h3-finetune-terminal-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  terminal:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stationary_pair_authorized == true && (inputs.backend == 'mlx' || inputs.backend == 'cuda') }}
    runs-on: ${{ inputs.backend == 'mlx' && fromJSON('["self-hosted","macOS","ARM64","rw-chroma"]') || fromJSON('["self-hosted","windows","cuda","real-weights"]') }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.sceneworks_sha }}
          path: sceneworks
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_sha }}
          path: inference
          fetch-depth: 0
          token: ${{ secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Validate explicit inputs before any product execution
        shell: bash
        env:
          PLAN: ${{ inputs.plan_path }}
          OUTPUT: ${{ inputs.output_path }}
          CASE_ID: ${{ inputs.case_id }}
          BACKEND: ${{ inputs.backend }}
          EXPECTED_RUNNER: ${{ inputs.expected_runner }}
          SW_SHA: ${{ inputs.sceneworks_sha }}
          INF_SHA: ${{ inputs.inference_sha }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFile} from "node:fs/promises";
            const e=process.env,p=JSON.parse(await readFile(e.PLAN,"utf8"));
            assert.equal(e.GITHUB_SHA,e.SW_SHA,"caller workflow commit must equal the exact requested SceneWorks source");
            assert.match(e.SW_SHA,/^[a-f0-9]{40}$/); assert.match(e.INF_SHA,/^[a-f0-9]{40}$/);
            assert.equal(e.RUNNER_NAME,e.EXPECTED_RUNNER);
            assert.equal(p.output,e.OUTPUT);
            assert.equal(p.sceneworks,e.SW_SHA); assert.equal(p.inference,e.INF_SHA);
            assert.equal(p.cases.find(c=>c.id===e.CASE_ID)?.backend,e.BACKEND);
          '
      - name: Read the checked-out root Rust pin
        shell: bash
        working-directory: sceneworks
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFile,appendFile} from "node:fs/promises";
            import path from "node:path";
            import os from "node:os";
            const pins=[...(await readFile("rust-toolchain.toml","utf8")).matchAll(/^channel\s*=\s*"([^"]+)"\s*$/gm)];
            assert.equal(pins.length,1,"one root Rust channel is required");
            const pin=pins[0][1]; assert.match(pin,/^\d+\.\d+\.\d+$/);
            await appendFile(process.env.GITHUB_ENV,`RUSTUP_TOOLCHAIN=${pin}\n`);
            await appendFile(process.env.GITHUB_PATH,path.join(process.env.CARGO_HOME || path.join(os.homedir(),".cargo"),"bin")+"\n");
          '
      - name: Prepare the root-pinned compiler without changing the runner default
        shell: bash
        working-directory: sceneworks
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update -c rustfmt -c clippy
          rustup run "$RUSTUP_TOOLCHAIN" rustc --version
          rustup run "$RUSTUP_TOOLCHAIN" cargo --version
      - name: Execute or reverify one durable source-bound case
        shell: bash
        working-directory: sceneworks
        env:
          PLAN: ${{ inputs.plan_path }}
          CASE_ID: ${{ inputs.case_id }}
          H3_TERMINAL_AUTHORIZED_PAIR: ${{ inputs.sceneworks_sha }}:${{ inputs.inference_sha }}
        run: node scripts/h3-finetune-terminal.mjs run-case "$PLAN" "$CASE_ID" "$GITHUB_WORKSPACE/sceneworks" "$GITHUB_WORKSPACE/inference"
      - name: Retain evidence including failure and resume identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h3-${{ inputs.case_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Receipts/media only. App/cache/build state lives outside the case directory;
          # also exclude accidentally staged checkpoint payloads from evidence publication.
          path: |
            ${{ inputs.output_path }}/${{ inputs.case_id }}/
            !${{ inputs.output_path }}/${{ inputs.case_id }}/service/**
            !${{ inputs.output_path }}/${{ inputs.case_id }}/**/target/**
            !${{ inputs.output_path }}/${{ inputs.case_id }}/**/fixture-target/**
            !${{ inputs.output_path }}/${{ inputs.case_id }}/**/*.safetensors
            !${{ inputs.output_path }}/${{ inputs.case_id }}/**/*.gguf
            !${{ inputs.output_path }}/${{ inputs.case_id }}/**/*.bin
            !${{ inputs.output_path }}/${{ inputs.case_id }}/**/*.pt
            !${{ inputs.output_path }}/${{ inputs.case_id }}/**/*.pth
          if-no-files-found: error
          retention-days: 30
