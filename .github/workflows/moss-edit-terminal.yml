# Manual real-model smoke only. Ordinary CI supplies the normal merge checks.
# Historical campaigns remain in Git history and controller exports.
# CI_IMPACT: replaces multi-backend campaigns with one CUDA build and one image.
# No automatic trigger or additional normal-CI inference; run cost is unmeasured.
name: MOSS Image Edit build and image
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact SceneWorks commit to build
        required: true
        type: string
      inference_sha:
        description: Exact inference main commit already pinned by source_sha
        required: true
        type: string
      bundle_run_id:
        description: Existing run containing reference image and model file inventory
        required: true
        type: string
      bundle_artifact_id:
        description: Existing input bundle artifact ID
        required: true
        type: string
      bundle_manifest_sha256:
        description: SHA256 of the existing bundle-inventory.json
        required: true
        type: string
      cuda_device:
        description: Physical CUDA device; checked again after build
        type: choice
        default: '0'
        options: ['0', '1']
      hf_home:
        description: Optional existing complete HF cache; default is bundle CUDA cache
        required: false
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      inference_sha:
        required: true
        type: string
      candidate_id:
        required: false
        type: string
      bundle_run_id:
        required: false
        type: string
      bundle_artifact_id:
        required: false
        type: string
      bundle_manifest_sha256:
        required: true
        type: string
      phase:
        default: smoke
        required: false
        type: string
      tooling_sha:
        required: false
        type: string
      mlx_candidate_id:
        required: false
        type: string
      mlx_source_sha:
        required: false
        type: string
      mlx_inference_sha:
        required: false
        type: string
      original_inventory_path:
        required: false
        type: string
      original_inventory_sha256:
        required: false
        type: string
      retry_inventory_path:
        required: false
        type: string
      retry_inventory_sha256:
        required: false
        type: string
      retry_run_id:
        required: false
        type: string
      retry_artifact_id:
        required: false
        type: string
      mlx_run_id:
        required: false
        type: string
      mlx_run_attempt:
        required: false
        type: string
      mlx_artifact_id:
        required: false
        type: string
      mlx_tooling_sha:
        required: false
        type: string
      cuda_hf_run_id:
        required: false
        type: string
      cuda_hf_run_attempt:
        required: false
        type: string
      cuda_hf_artifact_id:
        required: false
        type: string
      upload_path:
        required: false
        type: string
      upload_kind:
        required: false
        type: string
      execution_run_id:
        required: false
        type: string
      execution_run_attempt:
        required: false
        default: "1"
        type: string
      native_run_id:
        required: false
        type: string
      native_run_attempt:
        required: false
        type: string
      review_artifact_id:
        required: false
        type: string
      review_run_id:
        required: false
        type: string
      cuda_device:
        type: string
        default: '0'
        required: false
      hf_home:
        type: string
        required: false
    secrets:
      INFERENCE_READ_TOKEN:
        required: false
      SCENEWORKS_INFERENCE_READ_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: moss-edit-terminal-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  build-and-image:
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: 240
    env:
      MOSS_SOURCE_SHA: ${{ inputs.source_sha }}
      MOSS_INFERENCE_SHA: ${{ inputs.inference_sha }}
      MOSS_SOURCE: ${{ github.workspace }}/source
      MOSS_INFERENCE: ${{ github.workspace }}/inference
      MOSS_BUNDLE: ${{ github.workspace }}/../moss-sc-26752/moss-inputs-${{ github.run_id }}-${{ github.run_attempt }}
      MOSS_ROOT: ${{ github.workspace }}/../moss-sc-26752/moss-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      MOSS_BUNDLE_SHA: ${{ inputs.bundle_manifest_sha256 }}
      MOSS_CUDA_DEVICE: ${{ inputs.cuda_device || '0' }}
      MOSS_HF_HOME: ${{ inputs.hf_home }}
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_STRIP: none
      CUDA_COMPUTE_CAP: '120'
    steps:
      - name: Require the current smoke contract
        shell: powershell
        env:
          MOSS_PHASE: ${{ inputs.phase }}
        run: |
          # The registered memory-catalog wrapper uses execute for this same one-image job.
          if ($env:MOSS_PHASE -and $env:MOSS_PHASE -notin @('smoke', 'execute')) {
            throw 'Legacy campaign phases are retired. Use smoke or the registered wrapper execute phase for build and one image.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_sha }}
          path: inference
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.INFERENCE_READ_TOKEN || secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: ./source/.github/actions/prepare-rust-runner
        with:
          workspace-directory: source
      - name: Preserve the existing listener Cargo dependency cache
        working-directory: source
        shell: powershell
        run: |
          node scripts/select-windows-cargo-cache.mjs
          if ($LASTEXITCODE -ne 0) { throw 'listener Cargo cache selection failed' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.bundle_artifact_id }}
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ env.MOSS_BUNDLE }}
      - name: Build and generate one MOSS LoRA edit image
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          node source\scripts\moss-edit-terminal-actions.mjs smoke
      - name: Retain output and build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: moss-build-and-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MOSS_ROOT }}/*.json
            ${{ env.MOSS_ROOT }}/output.png
            ${{ env.MOSS_ROOT }}/logs/
          if-no-files-found: warn
          retention-days: 30
