# sc-26757 final campaign only. Dispatch after integrated review, inference main
# merge, permanent pin and stationary clean paired sources. No PR/push trigger.
name: MOSS Image Edit terminal campaign
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact stationary permanent-pin SceneWorks feature commit
        required: true
        type: string
      inference_sha:
        description: Exact final inference main commit pinned by source_sha
        required: true
        type: string
      candidate_id:
        description: Immutable campaign identity, shared by both native backends
        required: true
        type: string
      bundle_run_id:
        description: Actions run retaining the reviewed immutable campaign input bundle
        required: false
        type: string
      bundle_artifact_id:
        description: Exact campaign input artifact ID
        required: false
        type: string
      bundle_manifest_sha256:
        description: SHA256 of bundle-inventory.json covering every campaign input byte
        required: true
        type: string
      phase:
        description: Execute once, or verify actual retained evidence after review
        required: true
        type: choice
        options: [upload, execute, continue, verify]
      tooling_sha:
        description: Separate reviewed continuation tooling commit; required for continue and repaired verify
        required: false
        type: string
      original_inventory_path:
        description: Exact locally sealed R16 partial evidence inventory on nax-macos; continue only
        required: false
        type: string
      original_inventory_sha256:
        description: SHA256 of the original partial evidence inventory; continue only
        required: false
        type: string
      retry_inventory_path:
        description: Exact sealed prior failed-continuation artifact inventory; retry only
        required: false
        type: string
      retry_inventory_sha256:
        description: SHA256 of the prior failed-continuation artifact inventory; retry only
        required: false
        type: string
      retry_run_id:
        description: Prior failed retry run retaining immutable artifact bytes; chained retry only
        required: false
        type: string
      retry_artifact_id:
        description: Exact prior failed retry artifact ID; chained retry only
        required: false
        type: string
      upload_path:
        description: Exact sealed local directory on nax-macos; upload only
        required: false
        type: string
      upload_kind:
        description: Upload bundle or retained review evidence
        required: false
        type: choice
        options: [bundle, review]
      execution_run_id:
        description: Prior execute run ID, required only for verify
        required: false
        type: string
      execution_run_attempt:
        description: Exact prior execute attempt; never merge artifacts from different attempts
        required: false
        default: "1"
        type: string
      native_run_id:
        description: Original native-build run when verifying a later continuation run
        required: false
        type: string
      native_run_attempt:
        description: Original native-build attempt when verifying a later continuation run
        required: false
        type: string
      review_artifact_id:
        description: Actual external and visual review artifact ID; verify only
        required: false
        type: string
      review_run_id:
        description: Run retaining the later review artifact; verify only
        required: false
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      inference_sha:
        required: true
        type: string
      candidate_id:
        required: true
        type: string
      bundle_run_id:
        required: false
        type: string
      bundle_artifact_id:
        required: false
        type: string
      bundle_manifest_sha256:
        required: true
        type: string
      phase:
        required: true
        type: string
      tooling_sha:
        required: false
        type: string
      original_inventory_path:
        required: false
        type: string
      original_inventory_sha256:
        required: false
        type: string
      retry_inventory_path:
        required: false
        type: string
      retry_inventory_sha256:
        required: false
        type: string
      retry_run_id:
        required: false
        type: string
      retry_artifact_id:
        required: false
        type: string
      mlx_run_id:
        required: false
        type: string
      mlx_run_attempt:
        required: false
        type: string
      mlx_artifact_id:
        required: false
        type: string
      mlx_tooling_sha:
        required: false
        type: string
      upload_path:
        required: false
        type: string
      upload_kind:
        required: false
        type: string
      execution_run_id:
        required: false
        type: string
      execution_run_attempt:
        required: false
        default: "1"
        type: string
      native_run_id:
        required: false
        type: string
      native_run_attempt:
        required: false
        type: string
      review_artifact_id:
        required: false
        type: string
      review_run_id:
        required: false
        type: string
    secrets:
      INFERENCE_READ_TOKEN:
        required: false
      SCENEWORKS_INFERENCE_READ_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
# Run-specific group never cancels another queued candidate or creates a hardware lock.
concurrency:
  group: moss-edit-terminal-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
env:
  MOSS_SOURCE_SHA: ${{ inputs.source_sha }}
  MOSS_INFERENCE_SHA: ${{ inputs.inference_sha }}
  MOSS_CANDIDATE: ${{ inputs.candidate_id }}
  MOSS_BUNDLE_SHA: ${{ inputs.bundle_manifest_sha256 }}
  MOSS_SOURCE: ${{ github.workspace }}/source
  MOSS_INFERENCE: ${{ github.workspace }}/inference
  MOSS_BUNDLE: ${{ github.workspace }}/../moss-sc-26752/moss-bundle-${{ github.run_id }}-${{ github.run_attempt }}
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_RELEASE_STRIP: none
jobs:
  upload-inputs:
    if: inputs.phase == 'upload'
    runs-on: [self-hosted, macOS, ARM64, rw-starvector]
    timeout-minutes: 15
    env:
      MOSS_UPLOAD_PATH: ${{ inputs.upload_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Export canonical durable paths before artifact operations
        run: node source/scripts/moss-edit-terminal-actions.mjs normalize-env
      - name: Verify exact owned local bytes on their actual preparation host
        env:
          MOSS_UPLOAD_KIND: ${{ inputs.upload_kind }}
        run: |
          test "$RUNNER_NAME" = nax-macos
          node source/scripts/moss-edit-terminal-actions.mjs validate-upload "$MOSS_UPLOAD_PATH" "$MOSS_UPLOAD_KIND" "$MOSS_BUNDLE_SHA" "$MOSS_SOURCE_SHA" "$MOSS_INFERENCE_SHA" "$MOSS_CANDIDATE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: moss-${{ inputs.upload_kind }}-${{ inputs.candidate_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MOSS_UPLOAD_PATH }}/
          if-no-files-found: error
          retention-days: 90
  windows-maintenance:
    if: inputs.phase == 'execute'
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: 15
    env:
      MOSS_ROOT: ${{ github.workspace }}/../moss-sc-26752/moss-build-${{ github.run_id }}-${{ github.run_attempt }}-cuda
    steps:
      # No uses steps: run before another job prepares/downloads its action dependencies.
      - name: Reclaim only verified stopped MOSS copies and conditionally copy the R6 build cache
        shell: powershell
        env:
          MOSS_MAINTENANCE_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MOSS_SOURCE_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Exact reviewed source SHA required' }
          $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
          $node = Join-Path $runnerRoot 'externals\node24\bin\node.exe'
          if (-not (Test-Path -LiteralPath $node -PathType Leaf)) { throw 'Existing runner Node24 is required; no install on full disk' }
          $headers = @{ Authorization = "Bearer $env:MOSS_MAINTENANCE_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = "https://api.github.com/repos/SceneWorks/SceneWorks/contents/scripts/ci/moss-owned-cache-maintenance.mjs?ref=$env:MOSS_SOURCE_SHA"
          $helper = Invoke-RestMethod -Uri $url -Headers $headers
          if ($helper.path -ne 'scripts/ci/moss-owned-cache-maintenance.mjs' -or $helper.encoding -ne 'base64' -or $helper.size -gt 131072) { throw 'Unexpected reviewed maintenance helper' }
          $program = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($helper.content))
          # Stream exact-ref source in memory; no disk write, checkout, tool install or GPU probe.
          $program | & $node --input-type=module - --moss-disk-maintenance
          if ($LASTEXITCODE -ne 0) { throw 'Guarded stopped-run disk recovery failed' }
  build-native:
    needs: windows-maintenance
    if: inputs.phase == 'execute'
    strategy:
      fail-fast: false
      matrix:
        backend: [mlx, cuda]
    runs-on: ${{ matrix.backend == 'mlx' && fromJSON('["self-hosted","macOS","ARM64","rw-starvector"]') || fromJSON('["self-hosted","Windows","X64","cuda","real-weights"]') }}
    timeout-minutes: 180
    env:
      MOSS_BACKEND: ${{ matrix.backend }}
      MOSS_BUILDS: ${{ matrix.backend == 'mlx' && '/Volumes/Models/sceneworks-terminal-sc-26752' || format('{0}/../moss-sc-26752', github.workspace) }}/moss-builds-${{ github.run_id }}-${{ github.run_attempt }}-build-${{ matrix.backend }}
      MOSS_ROOT: ${{ matrix.backend == 'mlx' && '/Volumes/Models/sceneworks-terminal-sc-26752' || format('{0}/../moss-sc-26752', github.workspace) }}/moss-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.backend }}
      CUDA_COMPUTE_CAP: '120'
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: GPU-e4b79931-7be6-f216-460a-f5405cfafffe
      SCENEWORKS_GPU_ID: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_sha }}
          path: inference
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.INFERENCE_READ_TOKEN || secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Export canonical durable paths before artifact operations
        run: node source/scripts/moss-edit-terminal-actions.mjs normalize-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.bundle_artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.MOSS_BUNDLE }}
      - name: Validate immutable bundle and configure owned paths
        run: node source/scripts/moss-edit-terminal-actions.mjs configure-env
      - if: matrix.backend == 'cuda'
        uses: ./source/.github/actions/prepare-rust-runner
        with:
          workspace-directory: source
      - if: matrix.backend == 'mlx'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.98.0"
      - name: Fetch Release libmlx or retain its source build fallback
        if: matrix.backend == 'mlx'
        working-directory: source
        shell: bash
        run: |
          set +e
          scripts/fetch-prebuilt-mlx.sh --build-type Release --github-env
          rc=$?
          set -e
          if [ "$rc" = 1 ]; then
            echo "PMETAL_MLX_PREBUILT_DIR=" >> "$GITHUB_ENV"
            echo "PMETAL_METALLIB_PATH=" >> "$GITHUB_ENV"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: Build exact embedded API, worker, web and native inventories (MLX)
        if: matrix.backend == 'mlx'
        # Keep host proc-macro Mach-O string tables loadable on the macOS runner.
        env:
          CARGO_PROFILE_DEV_STRIP: none
          CARGO_PROFILE_TEST_STRIP: none
        shell: bash
        run: node source/scripts/moss-edit-terminal-actions.mjs build "$MOSS_ROOT/runtime.json"
      - name: Build exact embedded API, worker, web and native inventories (CUDA)
        if: matrix.backend == 'cuda'
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          node source\scripts\moss-edit-terminal-actions.mjs build "%MOSS_ROOT%/runtime.json" || exit /b 1
      - name: Retain immutable native build and actual install evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: moss-native-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MOSS_BUILDS }}/${{ matrix.backend }}/
          if-no-files-found: error
          retention-days: 90
      - name: Retain native setup diagnostics without package/cache bytes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: moss-build-diagnostics-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MOSS_ROOT }}/*.json
            ${{ env.MOSS_ROOT }}/*.jsonl
            ${{ env.MOSS_ROOT }}/*.log
          if-no-files-found: error
          retention-days: 90
  execute-mlx:
    needs: build-native
    if: inputs.phase == 'execute'
    runs-on: [self-hosted, macOS, ARM64, rw-starvector]
    timeout-minutes: 720
    env:
      MOSS_BACKEND: mlx
      MOSS_BUILDS: /Volumes/Models/sceneworks-terminal-sc-26752/moss-builds-${{ github.run_id }}-${{ github.run_attempt }}-execute-mlx
      MOSS_ROOT: /Volumes/Models/sceneworks-terminal-sc-26752/moss-execute-${{ github.run_id }}-${{ github.run_attempt }}-mlx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_sha }}
          path: inference
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.INFERENCE_READ_TOKEN || secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Export canonical durable paths before artifact operations
        run: node source/scripts/moss-edit-terminal-actions.mjs normalize-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.bundle_artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.MOSS_BUNDLE }}
      - name: Validate immutable bundle and configure owned paths
        run: node source/scripts/moss-edit-terminal-actions.mjs configure-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: moss-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MOSS_BUILDS }}
          merge-multiple: false
      - name: Place source-bound backend artifacts at their declared local paths
        run: node source/scripts/moss-edit-terminal-actions.mjs arrange-builds "${{ env.MOSS_BUILDS }}"
      - name: Provision exact headless CPU browser into the owned job directory
        run: node source/scripts/moss-edit-terminal-actions.mjs provision-browser "${{ env.MOSS_ROOT }}/runtime.json"
      - name: Execute allocated native rows and all refusal probes
        run: node source/scripts/moss-edit-terminal-actions.mjs execute "${{ env.MOSS_ROOT }}/runtime.json"
      - name: Retain complete and partial evidence; never upload HF caches, targets or credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: moss-execution-mlx-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MOSS_ROOT }}/evidence/
            ${{ env.MOSS_ROOT }}/handoff/
            ${{ env.MOSS_ROOT }}/commands/
            ${{ env.MOSS_ROOT }}/captures/
            ${{ env.MOSS_ROOT }}/samples/
            ${{ env.MOSS_ROOT }}/devices/
            ${{ env.MOSS_ROOT }}/cleanup/
            ${{ env.MOSS_ROOT }}/*.json
            ${{ env.MOSS_ROOT }}/*.jsonl
            ${{ env.MOSS_ROOT }}/*.log
          if-no-files-found: error
          retention-days: 90
  execute-cuda:
    needs: execute-mlx
    if: inputs.phase == 'execute'
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: 720
    env:
      MOSS_BACKEND: cuda
      MOSS_BUILDS: ${{ github.workspace }}/../moss-sc-26752/moss-builds-${{ github.run_id }}-${{ github.run_attempt }}-execute-cuda
      MOSS_ROOT: ${{ github.workspace }}/../moss-sc-26752/moss-execute-${{ github.run_id }}-${{ github.run_attempt }}-cuda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_sha }}
          path: inference
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.INFERENCE_READ_TOKEN || secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Export canonical durable paths before artifact operations
        run: node source/scripts/moss-edit-terminal-actions.mjs normalize-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.bundle_artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.MOSS_BUNDLE }}
      - name: Validate immutable bundle and configure owned paths
        run: node source/scripts/moss-edit-terminal-actions.mjs configure-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: moss-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MOSS_BUILDS }}
          merge-multiple: false
      - name: Place source-bound backend artifacts at their declared local paths
        run: node source/scripts/moss-edit-terminal-actions.mjs arrange-builds "${{ env.MOSS_BUILDS }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moss-execution-mlx-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MOSS_ROOT }}/prior
      - name: Provision exact headless CPU browser into the owned job directory
        run: node source/scripts/moss-edit-terminal-actions.mjs provision-browser "${{ env.MOSS_ROOT }}/runtime.json"
      - name: Execute allocated native rows and all refusal probes
        run: node source/scripts/moss-edit-terminal-actions.mjs execute "${{ env.MOSS_ROOT }}/runtime.json"
      - name: Retain complete and partial evidence; never upload HF caches, targets or credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: moss-execution-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MOSS_ROOT }}/evidence/
            ${{ env.MOSS_ROOT }}/handoff/
            ${{ env.MOSS_ROOT }}/commands/
            ${{ env.MOSS_ROOT }}/captures/
            ${{ env.MOSS_ROOT }}/samples/
            ${{ env.MOSS_ROOT }}/devices/
            ${{ env.MOSS_ROOT }}/cleanup/
            ${{ env.MOSS_ROOT }}/*.json
            ${{ env.MOSS_ROOT }}/*.jsonl
            ${{ env.MOSS_ROOT }}/*.log
          if-no-files-found: error
          retention-days: 90
  continue-mlx:
    if: inputs.phase == 'continue'
    runs-on: [self-hosted, macOS, ARM64, rw-starvector]
    timeout-minutes: 720
    env:
      MOSS_BACKEND: mlx
      MOSS_ROOT: /Volumes/Models/sceneworks-terminal-sc-26752/moss-execute-${{ inputs.execution_run_id }}-${{ inputs.execution_run_attempt }}-mlx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tooling_sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_sha }}
          path: inference
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.INFERENCE_READ_TOKEN || secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Normalize exact stopped private root
        run: node tooling/scripts/moss-edit-terminal-actions.mjs normalize-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.retry_artifact_id != ''
        with:
          artifact-ids: ${{ inputs.retry_artifact_id }}
          run-id: ${{ inputs.retry_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/moss-prior-retry
      - name: Recover the completed original job and run only untouched MLX rows
        env:
          MOSS_ORIGINAL_INVENTORY_PATH: ${{ inputs.original_inventory_path }}
          MOSS_ORIGINAL_INVENTORY_SHA256: ${{ inputs.original_inventory_sha256 }}
          MOSS_RETRY_INVENTORY_PATH: ${{ inputs.retry_inventory_path }}
          MOSS_RETRY_INVENTORY_SHA256: ${{ inputs.retry_inventory_sha256 }}
          MOSS_RETRY_RUN_ID: ${{ inputs.retry_run_id }}
          MOSS_RETRY_ARTIFACT_ID: ${{ inputs.retry_artifact_id }}
        run: |
          test "$RUNNER_NAME" = nax-macos
          node tooling/scripts/moss-edit-terminal-actions.mjs continue-mlx "$MOSS_ROOT/runtime.json" "$GITHUB_WORKSPACE/tooling" "${{ inputs.tooling_sha }}" "${{ inputs.execution_run_id }}" "${{ inputs.execution_run_attempt }}" "$MOSS_ORIGINAL_INVENTORY_PATH" "$MOSS_ORIGINAL_INVENTORY_SHA256" "$MOSS_RETRY_INVENTORY_PATH" "$MOSS_RETRY_INVENTORY_SHA256" "$MOSS_RETRY_RUN_ID" "$MOSS_RETRY_ARTIFACT_ID" "$RUNNER_TEMP/moss-prior-retry"
      - name: Retain original and appended actual MLX evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: moss-execution-mlx-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MOSS_ROOT }}/evidence/
            ${{ env.MOSS_ROOT }}/handoff/
            ${{ env.MOSS_ROOT }}/commands/
            ${{ env.MOSS_ROOT }}/captures/
            ${{ env.MOSS_ROOT }}/samples/
            ${{ env.MOSS_ROOT }}/devices/
            ${{ env.MOSS_ROOT }}/cleanup/
            ${{ env.MOSS_ROOT }}/*.json
            ${{ env.MOSS_ROOT }}/*.jsonl
            ${{ env.MOSS_ROOT }}/*.log
          if-no-files-found: error
          retention-days: 90
  supplement-mlx-handoff:
    if: inputs.phase == 'continue-cuda'
    runs-on: [self-hosted, macOS, ARM64, rw-starvector]
    timeout-minutes: 30
    env:
      MOSS_STOPPED_MLX: /Volumes/Models/sceneworks-terminal-sc-26752/moss-execute-${{ inputs.execution_run_id }}-${{ inputs.execution_run_attempt }}-mlx
      MOSS_PRIOR_MLX: ${{ github.workspace }}/../moss-sc-26752/moss-h27-prior-${{ github.run_id }}-${{ github.run_attempt }}
      MOSS_SUPPLEMENT: ${{ github.workspace }}/../moss-sc-26752/moss-h27-hidden-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tooling_sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Normalize supplemental artifact paths before Actions globbing
        run: node tooling/scripts/moss-edit-terminal-actions.mjs normalize-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.mlx_artifact_id }}
          run-id: ${{ inputs.mlx_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ env.MOSS_PRIOR_MLX }}
      - name: Stage exactly seven manifest-bound stopped Mac metadata files
        run: node tooling/scripts/moss-edit-terminal-actions.mjs stage-completed-mlx-handoff "$MOSS_PRIOR_MLX" "$MOSS_STOPPED_MLX" "$MOSS_SUPPLEMENT" "${{ inputs.candidate_id }}" "${{ inputs.source_sha }}" "${{ inputs.inference_sha }}" "${{ inputs.execution_run_id }}" "${{ inputs.execution_run_attempt }}" "${{ inputs.mlx_run_id }}" "${{ inputs.mlx_run_attempt }}" "${{ inputs.mlx_artifact_id }}" "${{ inputs.mlx_tooling_sha }}" "${{ inputs.tooling_sha }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: moss-mlx-hidden-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MOSS_SUPPLEMENT }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  continue-cuda:
    needs: [continue-mlx, supplement-mlx-handoff]
    if: ${{ always() && ((inputs.phase == 'continue' && needs.continue-mlx.result == 'success') || (inputs.phase == 'continue-cuda' && needs.supplement-mlx-handoff.result == 'success')) }}
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: 720
    env:
      MOSS_BACKEND: cuda
      MOSS_BUILDS: ${{ github.workspace }}/../moss-sc-26752/moss-builds-${{ github.run_id }}-${{ github.run_attempt }}-execute-cuda
      MOSS_ROOT: ${{ github.workspace }}/../moss-sc-26752/moss-execute-${{ github.run_id }}-${{ github.run_attempt }}-cuda
      MOSS_REHYDRATE_ROOT: ${{ github.workspace }}/../moss-sc-26752/moss-build-${{ github.run_id }}-${{ github.run_attempt }}-cuda
      CUDA_COMPUTE_CAP: '120'
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: GPU-e4b79931-7be6-f216-460a-f5405cfafffe
      SCENEWORKS_GPU_ID: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tooling_sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_sha }}
          path: inference
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.INFERENCE_READ_TOKEN || secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Normalize durable continuation paths
        run: node tooling/scripts/moss-edit-terminal-actions.mjs normalize-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.bundle_artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.MOSS_BUNDLE }}
      - name: Validate bundle and configure private execution/build roots
        shell: pwsh
        run: |
          node tooling/scripts/moss-edit-terminal-actions.mjs configure-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/scripts/moss-edit-terminal-actions.mjs configure "$env:MOSS_BUNDLE/campaign.json" "$env:MOSS_SOURCE" "$env:MOSS_INFERENCE" "$env:MOSS_REHYDRATE_ROOT" cuda "$env:MOSS_BUILDS"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: moss-native-*-${{ inputs.execution_run_id }}-${{ inputs.execution_run_attempt }}
          run-id: ${{ inputs.execution_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.MOSS_BUILDS }}
      - name: Place and validate original H17 native artifacts
        run: node tooling/scripts/moss-edit-terminal-actions.mjs arrange-builds "${{ env.MOSS_BUILDS }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.phase == 'continue'
        with:
          name: moss-execution-mlx-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MOSS_ROOT }}/prior
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.phase == 'continue-cuda'
        with:
          artifact-ids: ${{ inputs.mlx_artifact_id }}
          run-id: ${{ inputs.mlx_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ env.MOSS_ROOT }}/prior
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.phase == 'continue-cuda'
        with:
          name: moss-mlx-hidden-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MOSS_ROOT }}/prior
      - name: Authenticate completed MLX handoff before CUDA package adoption
        if: inputs.phase == 'continue-cuda'
        run: node tooling/scripts/moss-edit-terminal-actions.mjs completed-mlx-handoff "${{ env.MOSS_ROOT }}/runtime.json" "${{ inputs.execution_run_id }}" "${{ inputs.execution_run_attempt }}" "${{ inputs.mlx_run_id }}" "${{ inputs.mlx_run_attempt }}" "${{ inputs.mlx_artifact_id }}" "${{ inputs.mlx_tooling_sha }}" "${{ inputs.tooling_sha }}"
      - name: Adopt original sealed CUDA packages, rehydrate only if absent
        run: node tooling/scripts/moss-edit-terminal-actions.mjs prepare-cuda-packages "${{ env.MOSS_ROOT }}/runtime.json" "${{ env.MOSS_REHYDRATE_ROOT }}/runtime.json" "${{ inputs.execution_run_id }}" "${{ inputs.execution_run_attempt }}"
      - name: Provision exact execution browser
        run: node tooling/scripts/moss-edit-terminal-actions.mjs provision-browser "${{ env.MOSS_ROOT }}/runtime.json"
      - name: Run untouched CUDA rows and refusals against original H17 native binary
        if: inputs.phase == 'continue'
        run: node tooling/scripts/moss-edit-terminal-actions.mjs continue-cuda "${{ env.MOSS_ROOT }}/runtime.json" "${{ github.workspace }}/tooling" "${{ inputs.tooling_sha }}"
      - name: Run CUDA only from the authenticated completed MLX handoff
        if: inputs.phase == 'continue-cuda'
        run: node tooling/scripts/moss-edit-terminal-actions.mjs continue-cuda-only "${{ env.MOSS_ROOT }}/runtime.json" "${{ github.workspace }}/tooling" "${{ inputs.tooling_sha }}" "${{ env.MOSS_ROOT }}/completed-mlx-artifact.json"
      - name: Retain complete and partial CUDA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: moss-execution-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MOSS_ROOT }}/evidence/
            ${{ env.MOSS_ROOT }}/handoff/
            ${{ env.MOSS_ROOT }}/commands/
            ${{ env.MOSS_ROOT }}/captures/
            ${{ env.MOSS_ROOT }}/samples/
            ${{ env.MOSS_ROOT }}/devices/
            ${{ env.MOSS_ROOT }}/cleanup/
            ${{ env.MOSS_ROOT }}/*.json
            ${{ env.MOSS_ROOT }}/*.jsonl
            ${{ env.MOSS_ROOT }}/*.log
            ${{ env.MOSS_ROOT }}/rehydration/
          if-no-files-found: error
          retention-days: 90
  verify-retained:
    if: inputs.phase == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOSS_BACKEND: cuda
      MOSS_BUILDS: ${{ github.workspace }}/../moss-sc-26752/moss-builds-${{ github.run_id }}-${{ github.run_attempt }}-review
      MOSS_ROOT: ${{ github.workspace }}/../moss-sc-26752/moss-review-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.tooling_sha != ''
        with:
          ref: ${{ inputs.tooling_sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_sha }}
          path: inference
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.INFERENCE_READ_TOKEN || secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Export canonical durable paths before artifact operations
        run: node source/scripts/moss-edit-terminal-actions.mjs normalize-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.bundle_artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.MOSS_BUNDLE }}
      - name: Validate immutable bundle and configure owned paths
        run: node source/scripts/moss-edit-terminal-actions.mjs configure-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: moss-native-*-${{ inputs.native_run_id || inputs.execution_run_id }}-${{ inputs.native_run_attempt || inputs.execution_run_attempt }}
          run-id: ${{ inputs.native_run_id || inputs.execution_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.MOSS_BUILDS }}
      - name: Place original source-bound native artifacts
        run: node source/scripts/moss-edit-terminal-actions.mjs arrange-builds "${{ env.MOSS_BUILDS }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moss-execution-cuda-${{ inputs.execution_run_id }}-${{ inputs.execution_run_attempt }}
          run-id: ${{ inputs.execution_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.MOSS_ROOT }}/prior
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.review_artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.review_run_id || inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.MOSS_ROOT }}/reviews
      - name: Verify original H17 execution without repair
        if: inputs.tooling_sha == ''
        run: node source/scripts/moss-edit-terminal-actions.mjs finalize "${{ env.MOSS_ROOT }}/runtime.json"
      - name: Verify original H17 product with separately identified repair tooling
        if: inputs.tooling_sha != ''
        run: node tooling/scripts/moss-edit-terminal-actions.mjs finalize-repair "${{ env.MOSS_ROOT }}/runtime.json" "${{ github.workspace }}/tooling" "${{ inputs.tooling_sha }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: moss-reviewed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MOSS_ROOT }}/evidence/
            ${{ env.MOSS_ROOT }}/commands/
          if-no-files-found: error
          retention-days: 90
