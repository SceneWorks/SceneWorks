name: Server Candle (Linux/NVIDIA)

# Compile-checks + builds the candle (Linux/NVIDIA) server with `--features
# backend-candle` (epic 4811 / epic 5482, sc-5160). Candle is CPU+CUDA cross-
# platform, so the Linux server "rides the Windows candle port": the same provider
# crates desktop-windows.yml builds on Windows/CUDA also build here on
# Linux/NVIDIA — including the SeedVR2 upscaler (image_upscale + video_upscale),
# the sc-5160 deliverable. This is the standing Linux-compile validation for the
# candle-gated worker/server code (the default Linux `parity` job and the Docker
# image build both build WITHOUT backend-candle, so the candle paths — the
# crates/sceneworks-worker caption/image/video/upscale/engines/gpu modules under
# `#[cfg(all(not(target_os = "macos"), feature = "backend-candle"))]` — are
# otherwise only ever validated by hand on the dev box, and there is no Linux GPU
# box in the dev loop).
#
# Manual `workflow_dispatch` only, like the Windows lane (sc-3676/sc-5562): a candle
# build (nvcc compiles every provider's CUDA kernels) is heavy and there is no
# standing self-hosted GPU runner. Compilation does NOT need a GPU (nvcc + the host
# gcc suffice); only running the binary would. Trigger it from the Actions tab
# before merging candle changes that should hold on Linux as well as Windows.

on:
  workflow_dispatch:
    inputs:
      starvector_terminal_operation:
        description: Run the ordinary Linux build or bridge one terminal operation from this existing default-branch workflow.
        required: true
        default: standard
        type: choice
        options: [standard, source, provision, readiness, campaign, diagnostic-candle-1b]
      inference_revision:
        description: Exact merged inference commit for terminal provisioning.
        required: false
        default: 252e6a7a0fee08d2e07b0e8652234e4cea28aa59
        type: string
      inference_preflight_run_id:
        description: Exact inference preflight workflow run id.
        required: false
        default: "34884997565"
        type: string
      inference_preflight_artifact:
        description: Complete inference preflight artifact name.
        required: false
        default: starvector-terminal-preflight-252e6a7a0fee08d2e07b0e8652234e4cea28aa59-34884997565-1
        type: string
      mac_app_data_source:
        description: Absolute macOS source-produced app-data root.
        required: false
        type: string
      mac_hf_home_source:
        description: Absolute macOS isolated Hugging Face source root.
        required: false
        type: string
      windows_app_data_source:
        description: Absolute Windows source-produced app-data root.
        required: false
        type: string
      windows_hf_home_source:
        description: Absolute Windows isolated Hugging Face source root.
        required: false
        type: string
      permanent_pin:
        description: Exact permanent inference pin for the one terminal campaign.
        required: false
        default: 252e6a7a0fee08d2e07b0e8652234e4cea28aa59
        type: string
      campaign_run_id:
        description: Unique terminal campaign identity.
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # Every terminal phase shares one non-canceling bridge queue. An unrelated
  # ordinary Linux compile must not cancel a source/provision/readiness/campaign
  # caller, and a later terminal phase must wait for its predecessor to finish.
  group: ${{ (inputs.starvector_terminal_operation == 'standard' || inputs.starvector_terminal_operation == '') && format('server-candle-linux-{0}', github.ref) || 'starvector-terminal-bridge' }}
  cancel-in-progress: ${{ inputs.starvector_terminal_operation == 'standard' || inputs.starvector_terminal_operation == '' }}

jobs:
  build-candle:
    if: ${{ inputs.starvector_terminal_operation == 'standard' || inputs.starvector_terminal_operation == '' }}
    runs-on: ubuntu-22.04
    env:
      # compute_80 PTX the driver JITs forward to sm_120 — one binary covers
      # Ampere->Blackwell (mirrors the Windows lane / build-sidecar.mjs default).
      CUDA_COMPUTE_CAP: "80"
      CARGO_NET_OFFLINE: "true"
    # Guardrail so a wedged step fails fast instead of riding GitHub's 6-hour
    # default (sc-10420, sc-13603). workflow_dispatch-only full candle/CUDA
    # release build (CUDA toolkit install + nvcc + web build); sized generously
    # off the ~25 min observed run since it runs rarely and its rust-cache is
    # usually cold.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.97.1"
          components: clippy
      # DELIBERATELY NOT `save-if: main` — same reasoning as desktop-linux.yml: this lane is
      # `workflow_dispatch:` only, never runs on `main`, and contributed no entry to the 2026-08-15
      # cache inventory. Do not re-symmetrise it with the PR lanes.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2 (v2.9.1+1)
      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      # Install the CUDA 12.9 Toolkit (nvcc + cudart/cublas/curand/nvrtc dev libs)
      # the candle `cuda` feature links against. Sets CUDA_PATH for the build.
      # `--toolkit` skips the (GPU-less runner) driver install — we only compile.
      - name: Install CUDA Toolkit 12.9
        # v0.2.35: the version catalog must contain CUDA 12.9.1 — the older v0.2.21
        # pin tops out at 12.8.0 (network method still validates against the map), so
        # `cuda: "12.9.1"` failed with "Version not available". (Kept in lockstep with
        # desktop-windows.yml's pin.)
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "12.9.1"
          method: "network"
          linux-local-args: '["--toolkit"]'
      # The candle-gen single-rev invariant the default skew gate is blind to: with
      # `--features backend-candle` the optional candle-gen providers are pulled, so
      # a candle-gen pin that resolves a different gen-core rev would split contract
      # types from the explicit runtime catalog (sc-4482). `--target all`
      # also resolves the macOS-only mlx-gen transitive gen-core.
      - name: Guard against gen-core version skew (candle)
        run: |
          bash scripts/check-gen-core-skew.sh --self-test
          bash scripts/check-gen-core-skew.sh sceneworks-worker --features backend-candle
          bash scripts/check-gen-core-skew.sh sceneworks-rust-api --features embed-web,backend-candle
      # Lint the candle-gated code so it can't silently rot between hand-builds. The
      # worker carries all the `#[cfg(feature = "backend-candle")]` paths; checking
      # it alone (no embed-web) avoids a web build for the rot guard. This is the
      # core "does the candle worker code compile on Linux" gate.
      - name: Clippy candle-gated code
        run: cargo clippy -p sceneworks-worker --features backend-candle -- -D warnings
      # The Linux half of the same guard the Windows lane now carries: the Candle
      # memory-calibration adapter binary (epic 15448). `src/bin/candle.rs` is `compile_error!` on
      # macOS and macos-mlx.yml builds only `--bin memory-mlx-adapter`, so this lane and the
      # Windows one are the only places it is ever compiled.
      - name: Check the candle memory adapter builds (memory-candle-adapter)
        run: cargo check -p sceneworks-memory-adapter --features candle --bin memory-candle-adapter
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      # `embed-web` bakes apps/web/dist into the binary (rust-embed), so build the
      # web bundle first — mirrors build-sidecar.mjs on the Windows lane.
      - name: Build web assets
        run: npm run build --prefix apps/web
      # The faithful "build the candle Linux server" step: the rust-api binary with
      # the embedded web bundle + the candle backend — nvcc compiles every provider's
      # CUDA kernels and the full link exercises the real Linux/NVIDIA candle wiring.
      - name: Build candle server (rust-api, embed-web + backend-candle)
        run: cargo build -p sceneworks-rust-api --release --features embed-web,backend-candle
      - name: Upload candle server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sceneworks-api-candle-linux
          path: target/release/sceneworks-rust-api
          if-no-files-found: error

  # GitHub exposes workflow_dispatch only for files that already exist on the
  # default branch. This standing manual workflow is therefore the narrow
  # bridge that can call the feature branch's source/provision/readiness/campaign
  # reusable workflows before the final feature-to-main merge.
  starvector-source-closure:
    if: ${{ inputs.starvector_terminal_operation == 'source' }}
    uses: ./.github/workflows/starvector-terminal-source.yml
    secrets: inherit

  starvector-provision:
    if: ${{ inputs.starvector_terminal_operation == 'provision' }}
    uses: ./.github/workflows/starvector-terminal-provision.yml
    with:
      inference_revision: ${{ inputs.inference_revision }}
      inference_preflight_run_id: ${{ inputs.inference_preflight_run_id }}
      inference_preflight_artifact: ${{ inputs.inference_preflight_artifact }}
      mac_app_data_source: ${{ inputs.mac_app_data_source }}
      mac_hf_home_source: ${{ inputs.mac_hf_home_source }}
      windows_app_data_source: ${{ inputs.windows_app_data_source }}
      windows_hf_home_source: ${{ inputs.windows_hf_home_source }}
    secrets: inherit

  starvector-readiness:
    if: ${{ inputs.starvector_terminal_operation == 'readiness' }}
    uses: ./.github/workflows/starvector-terminal-readiness.yml
    with:
      permanent_pin: ${{ inputs.permanent_pin }}
    secrets: inherit

  starvector-campaign:
    if: ${{ inputs.starvector_terminal_operation == 'campaign' }}
    uses: ./.github/workflows/starvector-terminal.yml
    with:
      permanent_pin: ${{ inputs.permanent_pin }}
      campaign_run_id: ${{ inputs.campaign_run_id }}
    secrets: inherit

  # Fixed-input product-route diagnostic for the otherwise idle Windows CUDA
  # host. It is deliberately separate from terminal readiness and acceptance:
  # no result from this job is consumed by the terminal receipt.
  starvector-diagnostic-candle-1b:
    if: ${{ inputs.starvector_terminal_operation == 'diagnostic-candle-1b' }}
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: 90
    env:
      CARGO_NET_OFFLINE: "true"
      STARVECTOR_TERMINAL_GPU_ID: "0"
      STARVECTOR_TERMINAL_NO_JOB_DOWNLOADS: "1"
      STARVECTOR_TERMINAL_ROOT: D:\sceneworks-terminal
      STARVECTOR_TERMINAL_WEIGHTS_ROOT: D:\sceneworks-terminal\weights
      STARVECTOR_TERMINAL_LEASE_ROOT: C:\ProgramData\SceneWorks\terminal-leases
      STARVECTOR_TERMINAL_LEASE_HELPER: ${{ github.workspace }}\target\release\starvector_terminal_lease.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve fixed offline diagnostic inputs
        shell: powershell
        run: |
          $plan = Get-Content -Raw release\starvector-terminal-campaign-v1.json | ConvertFrom-Json
          $corpusPin = $plan.inference_contract.revision
          if ($corpusPin -notmatch '^[a-f0-9]{40}$') { throw 'sealed corpus source pin is invalid' }
          $pinEnvironment = node scripts\lib\starvector-terminal-pin-paths.mjs "$env:STARVECTOR_TERMINAL_ROOT" "$corpusPin"
          if ($LASTEXITCODE -ne 0) { throw 'immutable corpus path resolution failed' }
          $corpusPath = $pinEnvironment | Where-Object { $_ -like 'STARVECTOR_TERMINAL_CORPUS_ASSETS_ROOT=*' }
          if (@($corpusPath).Count -ne 1) { throw 'immutable corpus path resolution was ambiguous' }
          "STARVECTOR_DIAGNOSTIC_CORPUS_PIN=$corpusPin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STARVECTOR_DIAGNOSTIC_OUTPUT=$env:RUNNER_TEMP\starvector-diagnostic-candle-1b" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $corpusPath | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $currentPin = node scripts\starvector-terminal-diagnostic.mjs source-pin "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0 -or $currentPin -notmatch '^[a-f0-9]{40}$') { throw 'current source inference pin resolution failed' }
          "STARVECTOR_DIAGNOSTIC_PERMANENT_PIN=$currentPin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run fixed CUDA 1B product-route diagnostic
        shell: powershell
        run: |
          cargo build --release --locked --offline -p sceneworks-worker --bin starvector_terminal_lease
          if ($LASTEXITCODE -ne 0) { throw 'source-built lease helper failed' }
          node scripts\starvector-terminal-diagnostic.mjs run "$env:GITHUB_WORKSPACE" "$env:STARVECTOR_DIAGNOSTIC_OUTPUT" "$env:STARVECTOR_TERMINAL_WEIGHTS_ROOT" "$env:STARVECTOR_TERMINAL_CORPUS_ASSETS_ROOT" "$env:STARVECTOR_DIAGNOSTIC_PERMANENT_PIN" "$env:STARVECTOR_DIAGNOSTIC_CORPUS_PIN" "$env:GITHUB_SHA" "$env:STARVECTOR_TERMINAL_LEASE_ROOT" "$env:STARVECTOR_TERMINAL_LEASE_HELPER"
          if ($LASTEXITCODE -ne 0) { throw 'fixed CUDA diagnostic failed' }
      - name: Verify owned product service cleanup
        if: ${{ always() }}
        shell: powershell
        run: |
          $stopped = Join-Path $env:STARVECTOR_DIAGNOSTIC_OUTPUT 'product-service-stopped.json'
          $active = Join-Path $env:STARVECTOR_DIAGNOSTIC_OUTPUT 'product-service-provenance.json'
          $startFailed = Join-Path $env:STARVECTOR_DIAGNOSTIC_OUTPUT 'product-service-start-failed.json'
          $needsStop = Test-Path -LiteralPath $active
          if (!$needsStop -and (Test-Path -LiteralPath $startFailed)) {
            $failure = Get-Content -Raw -LiteralPath $startFailed | ConvertFrom-Json
            $needsStop = $failure.cleanup.status -eq 'failed' -and $null -ne $failure.active_state
          }
          if ($needsStop -and !(Test-Path -LiteralPath $stopped)) {
            node scripts\starvector-terminal-product-service.mjs stop "$env:STARVECTOR_DIAGNOSTIC_OUTPUT"
            if ($LASTEXITCODE -ne 0) { throw 'fallback product service cleanup failed' }
          }
          $state = "$env:RUNNER_TEMP\starvector-diagnostic-candle-1b-product-service-state"
          if (Test-Path -LiteralPath $state) { throw 'owned diagnostic service state remains after cleanup' }
      - name: Seal diagnostic artifact inventory
        if: ${{ always() }}
        shell: powershell
        run: |
          if (Test-Path -LiteralPath $env:STARVECTOR_DIAGNOSTIC_OUTPUT) {
            $inventory = node scripts\hash-artifact-inventory.mjs --root "$env:STARVECTOR_DIAGNOSTIC_OUTPUT"
            if ($LASTEXITCODE -ne 0) { throw 'diagnostic artifact inventory failed' }
            $inventory | Out-File -LiteralPath "$env:STARVECTOR_DIAGNOSTIC_OUTPUT\artifact-inventory.json" -Encoding utf8
          }
      - name: Upload diagnostic-only CUDA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starvector-diagnostic-candle-1b-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\starvector-diagnostic-candle-1b
          if-no-files-found: error
