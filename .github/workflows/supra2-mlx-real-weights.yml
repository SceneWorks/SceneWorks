# sc-24216 (epic 24212): the Supra2-IMG SceneWorks worker real-weight tests on nax-macos-2 — the
# install-time conversion, a default render through the production MLX arm, and the offline
# installed-model job lifecycle (progress, cancel mid-denoise, recovery, unload + reload).
#
# Reusable only: the registered dispatcher (memory-catalog-campaign.yml, profile
# `supra2-mlx-real-weights`) calls it at the dispatch's exact commit and skips both catalog jobs, so
# it never walks, commits, pushes or opens a PR. It gates nothing (FEATURE_DEVELOPMENT.md "Gate
# teardown"): real-weight evidence collected on explicit request.
#
# `rw-krea` is the label verified on nax-macos-2 (as iris-mlx-real-weights.yml); the script refuses
# any other runner name BEFORE any GPU work, so a relabelled dev Mac can never run it. Bounded:
# 60-minute job ceiling; every test runs under a process-tree phys_footprint guard with a stated cap
# and wall limit (scripts/ci/supra2-mlx-real-weights/run.sh).
name: Supra2-IMG MLX worker real weights

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact SceneWorks commit to build (40 hex)
        required: true
        type: string

permissions:
  contents: read

jobs:
  supra2-mlx-worker:
    runs-on: [self-hosted, macOS, ARM64, rw-krea]
    timeout-minutes: 60
    concurrency:
      group: supra2-mlx-real-weights-nax-macos-2
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the exact source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be 40 lowercase hex" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Refuse any runner but nax-macos-2 before build
        run: |
          echo "runner: $RUNNER_NAME"
          [[ "$RUNNER_NAME" == "nax-macos-2" ]] || { echo "::error::Supra2 MLX evidence runs only on nax-macos-2"; exit 1; }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.97.1"
      - name: Fetch Release libmlx or use its source build
        run: |
          set +e
          scripts/fetch-prebuilt-mlx.sh --build-type Release --github-env
          rc=$?
          set -e
          if [ "$rc" = 1 ]; then
            echo "PMETAL_MLX_PREBUILT_DIR=" >> "$GITHUB_ENV"
            echo "PMETAL_METALLIB_PATH=" >> "$GITHUB_ENV"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: Guarded Supra2 worker real-weight tests
        env:
          SUPRA2_EVIDENCE_DIR: ${{ runner.temp }}/supra2-mlx-real-weights-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ci/supra2-mlx-real-weights/run.sh
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supra2-mlx-real-weights-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supra2-mlx-real-weights-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30
