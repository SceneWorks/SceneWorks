name: Desktop (Windows)

# Windows desktop CI, split into two jobs by trigger (cache-budget + CI-cost work —
# sc-10456, follow-on to sc-10432):
#
#   build-windows  (pull_request, GitHub-hosted windows-2022) — CHEAP (~3–5 min):
#     desktop-crate test + clippy + bundle-config tests + the gen-core skew guard.
#     No CUDA Toolkit, candle build, or packaging — the `sceneworks-desktop` crate
#     is the Tauri host shell and links neither candle nor CUDA, so nvcc isn't needed
#     to check it. This is the PR gate: the Linux `parity` job (check.yml) excludes
#     the desktop crate, so this is the only lane that exercises it
#     (epic 1330 Phase 3 / sc-1356).
#
#   package-windows  (push:main + workflow_dispatch, SELF-HOSTED `cuda` pool) — the full
#     candle/CUDA sidecar build + NSIS/MSI packaging, as an UNSIGNED smoke so a
#     packaging break (NSIS's ~2 GB datablock limit, Tauri bundling) surfaces the
#     moment it lands on main — before a release tag, not during one. Runs on the same
#     RTX box as windows-candle.yml: CUDA + the toolchain are pre-installed (no ~7 min
#     toolkit install) and the target dir persists on disk (warm, incremental), so it
#     uses ZERO GitHub Actions cache. That's why it moved here — the hosted lane's
#     2.3 GB rust-cache entry was a prime LRU-eviction target under the repo's hard
#     10 GB cache cap, causing cold ~33 min rebuilds; taking it off the cache frees
#     that budget and removes the churn.
#
# The SIGNED, SHIPPED installers are still built by release.yml's `windows` job on
# `v*` tags (GitHub-hosted; keep its build steps in sync with package-windows). The
# candle SIDECAR compile is additionally guarded on every PR, cheaply, on the
# self-hosted windows-candle.yml lane (`cargo check -p sceneworks-rust-api --features
# backend-candle`).
#
# The desktop is candle (CUDA) by default off-Mac (sc-5559/sc-5563): the Python torch
# worker is retired, so a non-candle Windows build has no inference backend at all —
# a useless shell. The ~2.7 GB CUDA/cuDNN/onnxruntime redist is NOT bundled into the
# installer (it exceeded NSIS's ~2 GB datablock limit); the app downloads it on first
# run (cuda_provision.rs), so the installers stay small. (Folds in the former
# desktop-candle-windows.yml lane.)

on:
  # THE MERGE QUEUE'S SPECULATIVE MERGE (sc-17014). `build-windows` is a REQUIRED status check, and
  # the queue evaluates the same required set against `gh-readonly-queue/main/**` — without a run
  # for that ref the check stays pending until the group times out and its entries are EVICTED.
  #
  # READ THE TWO JOB-LEVEL `if:`s BELOW BEFORE TOUCHING THIS. They split on `pull_request`, so a
  # bare `merge_group:` would have done exactly the wrong thing on both sides: skipped the cheap
  # hosted `build-windows` (reporting Success with no coverage — a required check that validates
  # nothing) while waking `package-windows`, the ~13-17m candle/CUDA packaging job, on the
  # self-hosted `cuda` pool for every queued entry. Both conditions are now explicit about
  # merge_group rather than inferring it from "not a pull request".
  merge_group:
  # NO `paths:` FILTER, deliberately (sc-17014) — see the `changes` gate job. A path-filtered
  # workflow's required check stays Pending forever instead of passing.
  pull_request:
  push:
    branches:
      - main
    paths: &desktop_paths
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/rust-api/**"
      - "apps/rust-worker/**"
      - "crates/**"
      # Also embedded into the installer: the builtin model catalog (via
      # include_str! in setup.rs). Changes here can break the packaged app, so
      # they must trigger the job that compiles + packages the desktop.
      # (The Python worker was retired off-Mac — sc-5563 — so apps/worker +
      # packages/shared no longer feed the desktop bundle.)
      - "config/manifests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # Root build script (api:build:embedded:candle) driven by build-sidecar.mjs.
      - "package.json"
      - ".github/actions/prepare-rust-runner/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

# Cancel superseded PR runs, but never cancel a main-push run — same reasoning as
# windows-candle.yml (sc-12399). `package-windows` below is non-PR-only, so main is
# the ONLY place the full candle/CUDA desktop package is built before a release tag;
# cancelling it pushes packaging breaks to release time. It also shares the `cuda`
# runner pool with windows-candle.yml, so it is part of the same queue.
#
# Main must key on `github.sha`, not `github.ref`: GitHub keeps at most ONE pending
# run per group and evicts it when a newer run queues, so a shared main group still
# drops the middle commit of a 3+ merge burst even with cancel-in-progress off.
# Per-SHA groups cannot evict each other; runs serialize on the box instead.
concurrency:
  group: desktop-windows-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Supplies the path filter the triggers above gave up so `build-windows` could become a required
  # check. See .github/workflows/changed-paths.yml for why a required check cannot carry one.
  changes:
    uses: ./.github/workflows/changed-paths.yml
    with:
      lane: .github/workflows/desktop-windows.yml
      anchor: desktop_paths

  # PR + MERGE-QUEUE gate — cheap desktop-crate checks on a hosted runner. No candle/CUDA/packaging.
  build-windows:
    # Both events, not just pull_request: this is the required check, so it has to actually run
    # against the speculative merge rather than skip into a free Success.
    needs: changes
    # FAIL OPEN. `!cancelled()` and the `result != 'success'` clause are BOTH load-bearing, and
    # neither is decoration: in GitHub Actions a job whose `needs:` FAILED is skipped, and a
    # skipped job reports **Success**, which satisfies a required status check. So without this,
    # a broken gate — a checkout failure, a dead runner, a syntax error in the reusable workflow —
    # would silently skip this lane and turn its required check green without running a thing.
    # That is the exact false-green shape this whole story exists to remove, reintroduced one
    # level up. A gate that did not succeed must therefore RUN the lane, matching
    # merge-group-relevance.mjs's own internal fallback. Do not "simplify" this back to a bare
    # `needs.changes.outputs.relevant == 'true'`.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    # windows-2022 ships VS2022 with an MSVC 14.4x toolset (matches the desktop
    # crate's expectations); pinned rather than windows-latest per sc-3676.
    runs-on: windows-2022
    env:
      CARGO_NET_OFFLINE: "true"
    # Guardrail so a wedged step fails fast instead of riding GitHub's 6-hour
    # default (sc-10420, sc-13603). Hosted runner; well above the healthy
    # ~4-8 min desktop-crate test+clippy, with headroom for a cold rust-cache
    # miss that recompiles the desktop dependency graph.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop CLI and config-test dependencies
        run: npm ci --prefix apps/desktop
      - name: Validate desktop bundle configuration
        run: npm --prefix apps/desktop test
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.97.1"
          components: clippy
      # Save only on `main` — see the note on the `parity-rust` cache step in check.yml.
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2 (v2.9.1+1)
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      # MSVC (cl.exe) on PATH so the desktop crate's cargo test/clippy link cleanly.
      # Cheap (~9s).
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      # candle-gen single-rev invariant (sc-4482): a candle-gen pin resolving a
      # different gen-core rev would split contract types from the explicit runtime
      # catalog. `cargo tree` only — no compile, no CUDA needed. `--target all`
      # also resolves the macOS-only mlx-gen transitive gen-core.
      - name: Guard against gen-core version skew (candle)
        shell: bash
        run: |
          bash scripts/check-gen-core-skew.sh --self-test
          bash scripts/check-gen-core-skew.sh sceneworks-worker --features backend-candle
          bash scripts/check-gen-core-skew.sh sceneworks-rust-api --features embed-web,backend-candle
      # Placeholder sidecar + resource dirs so the desktop crate's Tauri build-script
      # resource validation passes (stage-test-sidecars.mjs uses node built-ins only,
      # so no npm install is needed on this path).
      - name: Stage desktop test sidecar placeholders
        run: node apps/desktop/scripts/stage-test-sidecars.mjs
      - name: Run Windows project-registry fingerprint regression
        run: cargo test -p sceneworks-core windows_registry_cache_detects_between_window_rewrite_with_restored_mtime
      - name: Run Windows resolved-cache and materialization safety regressions
        run: "cargo test -p sceneworks-core model_artifacts::resolved_cache:: -- --test-threads=1"
      - name: Run desktop Rust tests
        run: cargo test -p sceneworks-desktop
      - name: Check desktop Rust lint
        run: npm run desktop:check

  # Full candle/CUDA package smoke on the self-hosted RTX box. push:main + dispatch
  # only (never PRs). Same box as windows-candle.yml; see the header for why it lives
  # here (off the 10 GB Actions cache).
  package-windows:
    # main + workflow_dispatch ONLY. `!= 'pull_request'` used to mean exactly that; with a
    # merge_group trigger it no longer does, and this is the heavy candle/CUDA package on the
    # self-hosted `cuda` pool. Deliberately NOT a required check either: it never runs on a PR, so
    # requiring it would strand every PR on a check that cannot report.
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    runs-on: [self-hosted, Windows, X64, cuda]
    env:
      # compute_80 PTX the driver JITs forward to sm_120 — one binary covers
      # Ampere->Blackwell (sc-3676); matches release.yml + build-sidecar.mjs's default.
      # A distinct value from windows-candle.yml's 120 is fine: this is a `--release`
      # build in a separate target subdir from that lane's debug checks, so their
      # candle-kernels artifacts never collide or thrash each other.
      CUDA_COMPUTE_CAP: "80"
      CARGO_NET_OFFLINE: "true"
    # Guardrail so a wedged step fails fast instead of riding GitHub's 6-hour
    # default (sc-10420). This is the full candle/CUDA sidecar build + NSIS/MSI
    # packaging on the self-hosted `cuda` pool (shared with windows-candle.yml), so a
    # wedge here holds a box and starves queued PR/main runs behind it
    # (sc-13603). Well above the healthy ~13-17 min warm package — a cold candle
    # rebuild fits.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # sc-13166: same self-hosted `cuda` pool as windows-candle.yml — point this lane at
      # the real rustup toolchain bin (prepended to PATH) so it never dispatches through
      # the fragile %USERPROFILE%\.cargo\bin proxies that go dangling on rustup
      # self-update/deletion and fail with ERROR_NO_ASSOCIATION. package-windows is
      # main + dispatch only, so this failure reddens `main` rather than PRs, but the
      # remedy is identical. See .github/actions/prepare-rust-runner.
      - uses: ./.github/actions/prepare-rust-runner
      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      # No setup-node / rust-toolchain / CUDA-toolkit / rust-cache actions: this box
      # has Node, rustup + the repo's pinned toolchain, the CUDA 12.9 Toolkit, and the
      # MSVC 14.44 BuildTools pre-installed, and reuses its _work target dir (warm).
      # Mirrors windows-candle.yml. `tauri build` fetches NSIS/WiX + ffmpeg itself.
      #
      # nvcc needs the MSVC 14.44 host compiler (NOT VS2026 14.51, which CUDA 12.9
      # rejects — sc-3676): load vcvars in-shell, then run the whole build in the SAME
      # cmd invocation so the toolchain env reaches the cargo build that build-sidecar
      # spawns (each step is a fresh shell). `|| exit /b 1` because cmd does not
      # fail-fast between lines. Mirrors release.yml's `windows` job — keep in sync.
      - name: Build candle installers (NSIS + MSI) — packaging smoke
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          call npm ci --prefix apps/web || exit /b 1
          call npm ci --prefix apps/desktop || exit /b 1
          call npm --prefix apps/desktop run build -- --bundles nsis,msi || exit /b 1
