name: Qwen3.8 27B describer weight provisioning

# Dispatch-only (SW-7120). Downloads pinned Candle tiers of the Qwen3.8 27B describer into the CUDA
# real-weights runner's hub cache, in the standard hub layout, for qwen38-describer-validation.yml.
# `tiers: quantised` (the default) is the fully quantized q4-full/ and q8-full/ folders (SW-7202) of
# SceneWorks/qwen3.8-27b-abliterated-candle (~47.6 GB; refuses with under 70 GB free). `tiers: bf16`
# is the full-precision huihui-ai/Huihui-Qwen3.8-27B-abliterated snapshot the catalog's bf16 row
# names (~55.6 GB; refuses with under 75 GB free). `tiers: expander-q4` / `expander-q8` is ONE tier
# of the MiniMax-H3-Image prompt expander (SW-7202): its candle-q4-full/ (~17.4 GB, refuses under
# 40 GB free) or candle-q8-full/ (~29.5 GB, under 52 GB) folder of SceneWorks/minimax-h3-image-pe,
# plus the five upstream prompt/ files of MiniMaxAI/MiniMax-H3-Image-PE, each at its catalog
# revision, for qwen38-describer-validation.yml `job: expander`. `tiers: drafts` provisions the two
# Qwen3.8-27B block drafts (SW-7204: SceneWorks/qwen3.8-27b-dflash2 and
# SceneWorks/qwen3.8-27b-dspine-b16, ~7.9 GB, refuses under 20 GB free) that the validation's
# `block_draft: on|no_fit` runs need; the other choices keep their old footprint. Runs no model. Does nothing when
# every file is already present at its published size.
on:
  workflow_dispatch:
    inputs:
      tiers:
        description: quantised (describer q4 and q8 from the re-host), bf16 (describer full precision from upstream), or one prompt-expander tier
        required: true
        type: choice
        options: [quantised, bf16, expander-q4, expander-q8, drafts]
        default: quantised

permissions:
  contents: read

jobs:
  provision:
    # One writer at a time into the shared cache.
    concurrency:
      group: qwen38-describer-provision
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: 240
    env:
      HF_HUB_CACHE: 'E:\huggingface\hub'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate runner Python for snapshot provisioning
        shell: powershell
        run: |
          $version = python --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^Python 3\.(?<minor>\d+)\.') {
            throw "the self-hosted CUDA runner requires Python 3.12 or newer, got: $version"
          }
          if ([int]$Matches.minor -lt 12) {
            throw "the self-hosted CUDA runner requires Python 3.12 or newer, got: $version"
          }
      - name: Test the provisioning checks without network
        run: python -I -B scripts/ci/qwen38_describer_provision_test.py
      - name: Provision the pinned ${{ inputs.tiers }} tiers
        shell: powershell
        env:
          SCENEWORKS_QWEN38_DESCRIBER_PROVISION: ${{ inputs.tiers }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_VERBOSITY: "error"
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "qwen38-describer-provision-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'failed to create the job-local provisioning venv' }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --no-input -r .github/requirements-hf.txt
          if ($LASTEXITCODE -ne 0) { throw 'failed to install the pinned huggingface_hub client' }
          & $python -I -B scripts/ci/qwen38_describer_provision.py
          if ($LASTEXITCODE -ne 0) { throw "describer provisioning failed with exit code $LASTEXITCODE" }
