name: H3 Veda terminal owned campaign

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Explicit physical backend; no automatic host selection."
        required: true
        type: choice
        options: [mlx, candle_cuda]
      mode:
        description: "Inspect or stage the host, build a durable source-bound binary, prepare/import, resume a bounded batch, or export selected closed-batch media."
        required: true
        type: choice
        options: [inventory, stage, build, prepare, resume, review]
      review_case_ids:
        description: "Review mode only; JSON array of 1-4 exact owned case IDs. Selection is never acceptance."
        required: false
        type: string
      sceneworks_sha:
        description: "Exact frozen SceneWorks commit containing this workflow."
        required: true
        type: string
      inference_main_sha:
        description: "Exact inference source; prepare/resume/review require permanent main and Cargo pin."
        required: true
        type: string
      expected_runner:
        description: "Exact runner name; Mac must be nax-macos-2, Windows must be an explicitly selected cuda-windows host."
        required: true
        type: string
      manifest_path:
        description: "Build: absolute source-frozen template; prepare/resume/review: absolute host manifest; unused by inventory/stage."
        required: false
        type: string
      corpus_root:
        description: "Prepare: absolute staged corpus root; stage defaults to owned source-bound directory."
        required: false
        type: string
      offline_cache_root:
        description: "HF_HOME parent containing hub; prepare/resume require complete cache, inventory needs no cache."
        required: false
        type: string
      run_dir:
        description: "Persistent external owned directory; stage may derive it from the observed Actions checkout."
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: h3-veda-terminal-${{ inputs.run_dir }}
  cancel-in-progress: false

jobs:
  mac2:
    if: inputs.backend == 'mlx'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: ${{ (inputs.mode == 'inventory' || inputs.mode == 'stage') && 10 || 75 }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/sceneworks
    env:
      S9_EXPECTED_RUNNER: ${{ inputs.expected_runner }}
      S9_SCENEWORKS_SHA: ${{ inputs.sceneworks_sha }}
      S9_INFERENCE_SHA: ${{ inputs.inference_main_sha }}
      S9_MANIFEST: ${{ inputs.manifest_path }}
      S9_CORPUS_ROOT: ${{ inputs.corpus_root }}
      S9_CACHE: ${{ inputs.offline_cache_root }}
      S9_RUN_DIR: ${{ inputs.run_dir }}
      HF_HOME: ${{ inputs.offline_cache_root }}
      CARGO_TARGET_DIR: ${{ inputs.run_dir }}/cargo-target
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sceneworks_sha }}
          path: sceneworks
          fetch-depth: 1
      - name: Verify configured cross-repository read credential
        if: inputs.mode != 'inventory'
        env:
          GH_TOKEN: ${{ secrets.INFERENCE_READ_TOKEN }}
        run: gh api repos/SceneWorks/inference --jq .full_name
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_main_sha }}
          path: inference
          fetch-depth: 0
          token: ${{ inputs.mode == 'inventory' && github.token || secrets.INFERENCE_READ_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.mode == 'build' || inputs.mode == 'prepare' || inputs.mode == 'resume'
        with:
          python-version: "3.12"
      - name: Bind Python 3.12 interpreter for owned process supervision
        if: inputs.mode == 'build' || inputs.mode == 'prepare' || inputs.mode == 'resume'
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12); print(f"S9_GUARD_PYTHON={sys.executable}")' >> "$GITHUB_ENV"
      - name: Assert exact source and named runner before build
        run: |
          test "$GITHUB_SHA" = "$S9_SCENEWORKS_SHA"
          test "$RUNNER_NAME" = 'nax-macos-2'
          test "$S9_EXPECTED_RUNNER" = 'nax-macos-2'
          test "$(git rev-parse HEAD)" = "$S9_SCENEWORKS_SHA"
          test "$(git -C ../inference rev-parse HEAD)" = "$S9_INFERENCE_SHA"
          if test '${{ inputs.mode }}' != inventory && test '${{ inputs.mode }}' != stage; then
            test "$(git -C ../inference rev-parse refs/remotes/origin/main)" = "$S9_INFERENCE_SHA"
          fi
      - name: Verify existing read credential against live run, runner, and LensWorks queue
        if: inputs.mode != 'inventory'
        env:
          GH_TOKEN: ${{ secrets.INFERENCE_READ_TOKEN }}
        run: node scripts/h3-veda-actions.mjs probe-auth mlx
      - name: Verify CPU inventory same-repository Actions identity
        if: inputs.mode == 'inventory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/h3-veda-actions.mjs probe-inventory-auth mlx
      - name: CPU-only host inventory or synthetic corpus staging
        if: inputs.mode == 'inventory' || inputs.mode == 'stage'
        env:
          GH_TOKEN: ${{ inputs.mode == 'inventory' && github.token || secrets.INFERENCE_READ_TOKEN }}
        run: node scripts/h3-veda-actions.mjs ${{ inputs.mode }} mlx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.mode == 'inventory' || inputs.mode == 'stage'
        with:
          name: h3-veda-mlx-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/h3-veda-terminal/setup-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Generate masked job-owned private API token
        if: inputs.mode == 'prepare' || inputs.mode == 'resume'
        run: node scripts/h3-veda-actions.mjs owned-token
      - name: Build durable normal product API and worker from frozen source
        if: inputs.mode == 'build'
        run: node scripts/h3-veda-actions.mjs build "$S9_MANIFEST" mlx "$S9_RUN_DIR"
      - name: Prepare or verify owned private corpus
        if: inputs.mode == 'prepare' || inputs.mode == 'resume'
        env:
          GH_TOKEN: ${{ secrets.INFERENCE_READ_TOKEN }}
        run: |
          if test '${{ inputs.mode }}' = prepare; then
            node scripts/h3-veda-actions.mjs prepare "$S9_MANIFEST" config/terminal-evidence/epic-25140-corpus.plan.json "$S9_CORPUS_ROOT" mlx "$S9_RUN_DIR" "$S9_CACHE"
          else
            node scripts/h3-veda-actions.mjs resume "$S9_MANIFEST" mlx "$S9_RUN_DIR" "$S9_CACHE"
          fi
      - name: Run bounded guardian-owned native campaign
        if: inputs.mode == 'resume'
        env:
          GH_TOKEN: ${{ secrets.INFERENCE_READ_TOKEN }}
        run: |
          node scripts/h3-veda-actions.mjs admit mlx
          node scripts/h3-veda-acceptance.mjs run "$S9_RUN_DIR/manifest.bound.json" mlx "$S9_RUN_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.mode == 'build'
        with:
          name: h3-veda-product-build-mlx-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.run_dir }}/mlx-product-build-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Stage selected real output review media from closed owned batch
        if: inputs.mode == 'review'
        env:
          S9_REVIEW_CASE_IDS: ${{ inputs.review_case_ids }}
        run: node scripts/h3-veda-actions.mjs review "$S9_RUN_DIR" "$RUNNER_TEMP/h3-veda-terminal/review-media" mlx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.mode == 'review'
        with:
          name: h3-veda-review-media-mlx-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h3-veda-terminal/review-media/
          if-no-files-found: error
          retention-days: 30
      - name: Redact transport receipt without media or control token
        if: always() && (inputs.mode == 'prepare' || inputs.mode == 'resume' || inputs.mode == 'review')
        run: node scripts/h3-veda-actions.mjs redact "$S9_RUN_DIR" "$RUNNER_TEMP/h3-veda-terminal/receipt.json" mlx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && (inputs.mode == 'prepare' || inputs.mode == 'resume' || inputs.mode == 'review')
        with:
          name: h3-veda-terminal-mlx-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h3-veda-terminal/receipt.json
          if-no-files-found: error
          retention-days: 30

  windows_cuda:
    if: inputs.backend == 'candle_cuda'
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: ${{ (inputs.mode == 'inventory' || inputs.mode == 'stage') && 10 || 75 }}
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}/sceneworks
    env:
      S9_EXPECTED_RUNNER: ${{ inputs.expected_runner }}
      S9_SCENEWORKS_SHA: ${{ inputs.sceneworks_sha }}
      S9_INFERENCE_SHA: ${{ inputs.inference_main_sha }}
      S9_MANIFEST: ${{ inputs.manifest_path }}
      S9_CORPUS_ROOT: ${{ inputs.corpus_root }}
      S9_CACHE: ${{ inputs.offline_cache_root }}
      S9_RUN_DIR: ${{ inputs.run_dir }}
      HF_HOME: ${{ inputs.offline_cache_root }}
      CARGO_TARGET_DIR: ${{ inputs.run_dir }}/cargo-target
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sceneworks_sha }}
          path: sceneworks
          fetch-depth: 1
      - name: Verify configured cross-repository read credential
        if: inputs.mode != 'inventory'
        env:
          GH_TOKEN: ${{ secrets.INFERENCE_READ_TOKEN }}
        run: gh api repos/SceneWorks/inference --jq .full_name
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_main_sha }}
          path: inference
          fetch-depth: 0
          token: ${{ inputs.mode == 'inventory' && github.token || secrets.INFERENCE_READ_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.mode == 'build' || inputs.mode == 'prepare' || inputs.mode == 'resume'
        with:
          python-version: "3.12"
      - name: Bind Python 3.12 interpreter for owned process supervision
        if: inputs.mode == 'build' || inputs.mode == 'prepare' || inputs.mode == 'resume'
        run: |
          $python = (python -c "import sys; assert sys.version_info[:2] == (3, 12); print(sys.executable)").Trim()
          Add-Content -Path $env:GITHUB_ENV -Value "S9_GUARD_PYTHON=$python"
      - name: Assert exact source and named runner before build
        run: |
          if ($env:GITHUB_SHA -ne $env:S9_SCENEWORKS_SHA) { throw 'workflow source SHA differs' }
          if ($env:RUNNER_NAME -ne $env:S9_EXPECTED_RUNNER -or $env:S9_EXPECTED_RUNNER -notin @('cuda-windows','cuda-windows-2')) { throw 'unadmitted Windows physical runner' }
          if ((git rev-parse HEAD) -ne $env:S9_SCENEWORKS_SHA) { throw 'SceneWorks checkout differs' }
          if ((git -C ../inference rev-parse HEAD) -ne $env:S9_INFERENCE_SHA) { throw 'inference checkout differs' }
          if ('${{ inputs.mode }}' -notin @('inventory','stage') -and (git -C ../inference rev-parse refs/remotes/origin/main) -ne $env:S9_INFERENCE_SHA) { throw 'inference permanent main differs' }
      - name: Verify existing read credential against live run, runner, and LensWorks queue
        if: inputs.mode != 'inventory'
        env:
          GH_TOKEN: ${{ secrets.INFERENCE_READ_TOKEN }}
        run: node scripts/h3-veda-actions.mjs probe-auth candle_cuda
      - name: Verify CPU inventory same-repository Actions identity
        if: inputs.mode == 'inventory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/h3-veda-actions.mjs probe-inventory-auth candle_cuda
      - name: CPU-only host inventory or synthetic corpus staging
        if: inputs.mode == 'inventory' || inputs.mode == 'stage'
        env:
          GH_TOKEN: ${{ inputs.mode == 'inventory' && github.token || secrets.INFERENCE_READ_TOKEN }}
        run: node scripts/h3-veda-actions.mjs ${{ inputs.mode }} candle_cuda
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.mode == 'inventory' || inputs.mode == 'stage'
        with:
          name: h3-veda-candle_cuda-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/h3-veda-terminal/setup-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Generate masked job-owned private API token
        if: inputs.mode == 'prepare' || inputs.mode == 'resume'
        run: node scripts/h3-veda-actions.mjs owned-token
      - name: Build durable normal Candle/CUDA product API and worker from frozen source
        if: inputs.mode == 'build'
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          node scripts/h3-veda-actions.mjs build "%S9_MANIFEST%" candle_cuda "%S9_RUN_DIR%" || exit /b 1
      - name: Prepare or verify owned private corpus
        if: inputs.mode == 'prepare' || inputs.mode == 'resume'
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.INFERENCE_READ_TOKEN }}
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          if "${{ inputs.mode }}" == "prepare" (node scripts/h3-veda-actions.mjs prepare "%S9_MANIFEST%" config/terminal-evidence/epic-25140-corpus.plan.json "%S9_CORPUS_ROOT%" candle_cuda "%S9_RUN_DIR%" "%S9_CACHE%") else (node scripts/h3-veda-actions.mjs resume "%S9_MANIFEST%" candle_cuda "%S9_RUN_DIR%" "%S9_CACHE%")
          if errorlevel 1 exit /b 1
      - name: Run bounded guardian-owned native campaign
        if: inputs.mode == 'resume'
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.INFERENCE_READ_TOKEN }}
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          node scripts/h3-veda-actions.mjs admit candle_cuda
          if errorlevel 1 exit /b 1
          node scripts/h3-veda-acceptance.mjs run "%S9_RUN_DIR%\manifest.bound.json" candle_cuda "%S9_RUN_DIR%"
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.mode == 'build'
        with:
          name: h3-veda-product-build-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.run_dir }}/candle_cuda-product-build-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Stage selected real output review media from closed owned batch
        if: inputs.mode == 'review'
        env:
          S9_REVIEW_CASE_IDS: ${{ inputs.review_case_ids }}
        run: node scripts/h3-veda-actions.mjs review "$env:S9_RUN_DIR" "$env:RUNNER_TEMP/h3-veda-terminal/review-media" candle_cuda
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.mode == 'review'
        with:
          name: h3-veda-review-media-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h3-veda-terminal/review-media/
          if-no-files-found: error
          retention-days: 30
      - name: Redact transport receipt without media or control token
        if: always() && (inputs.mode == 'prepare' || inputs.mode == 'resume' || inputs.mode == 'review')
        run: node scripts/h3-veda-actions.mjs redact "$env:S9_RUN_DIR" "$env:RUNNER_TEMP/h3-veda-terminal/receipt.json" candle_cuda
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && (inputs.mode == 'prepare' || inputs.mode == 'resume' || inputs.mode == 'review')
        with:
          name: h3-veda-terminal-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h3-veda-terminal/receipt.json
          if-no-files-found: error
          retention-days: 30
