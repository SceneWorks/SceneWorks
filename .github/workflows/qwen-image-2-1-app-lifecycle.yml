# sc-24163 E11: app lifecycle only; engine evidence owns learned effect and memory.
# Called by the registered catalog dispatcher at the exact feature commit;
# run after the final repair pin lands, while the selected Mac is idle.
name: Qwen Image 2.1 MLX app lifecycle
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact SceneWorks feature commit containing the final inference pin (40 hex)
        required: true
        type: string
      inference_sha:
        description: Exact final inference revision pinned by that checkout (40 hex)
        required: true
        type: string
      runner_target:
        description: Exact physical Mac for this app proof (primary or secondary)
        required: false
        type: string
        default: primary
permissions:
  contents: read
jobs:
  app-lifecycle:
    runs-on: ${{ inputs.runner_target == 'secondary' && fromJSON('["self-hosted","macOS","ARM64","rw-mage"]') || fromJSON('["self-hosted","macOS","ARM64","rw-starvector"]') }}
    timeout-minutes: 720
    concurrency:
      group: qwen-image-2-1-app-lifecycle-primary-mac
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      QWEN_APP_SOURCE_SHA: ${{ inputs.source_sha }}
      QWEN_APP_INFERENCE_SHA: ${{ inputs.inference_sha }}
      QWEN_APP_RUNNER_TARGET: ${{ inputs.runner_target }}
    steps:
      - name: Require the selected Mac and immutable inputs
        run: |
          case "$QWEN_APP_RUNNER_TARGET:$RUNNER_NAME" in
            primary:nax-macos|secondary:nax-macos-2) ;;
            *) echo "selected app runner target/name mismatch" >&2; exit 1 ;;
          esac
          test "$GITHUB_SHA" = "$QWEN_APP_SOURCE_SHA"
          [[ "$QWEN_APP_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QWEN_APP_INFERENCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.97.1"
      - name: Fetch Release libmlx or use its source build
        run: |
          set +e
          scripts/fetch-prebuilt-mlx.sh --build-type Release --github-env
          rc=$?
          set -e
          if [ "$rc" = 1 ]; then
            echo "PMETAL_MLX_PREBUILT_DIR=" >> "$GITHUB_ENV"
            echo "PMETAL_METALLIB_PATH=" >> "$GITHUB_ENV"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: Build and exercise the owned API and MLX worker
        run: node scripts/qwen-image-2-1-app-lifecycle.mjs
        env:
          QWEN_APP_OUTPUT: ${{ runner.temp }}/qwen-image-2-1-app-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain lifecycle receipt, owned logs and generated previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: qwen-image-2-1-mlx-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-image-2-1-app-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: error
          retention-days: 30
