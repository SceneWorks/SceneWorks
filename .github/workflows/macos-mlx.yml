name: macOS MLX worker

# Compiles AND tests the Rust GPU worker with the native MLX engine (mlx-gen, epic
# 2337) linked in — the macOS-only build the Linux `parity` job (check.yml) and the
# Windows desktop job cannot exercise, because mlx-gen is gated to
# `cfg(target_os = "macos")` and builds Apple MLX from source.
#
# RUNS ON A SELF-HOSTED macOS 26.2+ RUNNER. GitHub's hosted macOS images top out well
# below macOS 26.2, so they could only build at a lowered deployment target and could
# NOT exercise the NAX matrix-unit fast path at all. A self-hosted 26.2+ runner builds
# at the workspace 26.2 pin (/.cargo/config.toml — no override) and actually RUNS
# `nax_guard`, the only way CI can guarantee the NAX 16-bit kernels are correct
# (sc-2772 / sc-3019). It also keeps the heavy MLX-from-source build warm across runs
# (the runner reuses its target dir), so MLX compiles once, not every run.
#
# Runner prerequisites: macOS >= 26.2, full Xcode + the Metal Toolchain, a Rust
# toolchain, cmake (MLX builds through CMake — a box without it fails in
# pmetal-mlx-sys's build script), registered with the `nax` label. See
# docs/rust-mlx-build.md.
#
# SECURITY: this repo is PUBLIC, and GitHub warns against running self-hosted runners
# for public repos because a fork PR could execute arbitrary code on the runner. The
# job-level `if:` below restricts execution to same-repo branches (the epic's story
# branches pushed to origin), so fork PRs never run here. Keep "Require approval for
# all external contributors' workflows" enabled in the repo Actions settings as
# defense in depth.

# Ordinary work still PRs into `main`, while substantial epics PR their story
# branches into protected `feature/*` integration branches. The hosted required
# check must report on both targets. The self-hosted NAX job below deliberately
# remains limited to final integration PRs targeting `main` and explicit
# dispatches so feature-story traffic does not consume the two-Mac pool.
on:
  # THE MERGE QUEUE'S SPECULATIVE MERGE. Without this trigger the queue's `gh-readonly-queue/main/**`
  # ref is validated only by check.yml's hosted Linux jobs, and this lane — the ONLY compiler of
  # `cfg(target_os = "macos")` code anywhere in CI — never sees it. Two individually-green PRs whose
  # merge does not compile under that cfg would merge, exactly the shape that broke `main` in
  # e71b932f.
  #
  # NOTE THE ASYMMETRY WITH THE TWO TRIGGERS BELOW: they are path-filtered and this one CANNOT BE.
  # GitHub supports no `paths:` / `paths-ignore:` filter on `merge_group` (community discussion
  # 45899, still open), so a bare trigger here would wake this lane for a README-only queue entry.
  # The filter therefore moves into the `changes` gate job, which reads the SAME anchor below and
  # skips the build when nothing it watches changed. Do not "simplify" that job away.
  #
  # Only the hosted half runs here. See the `merge_group` note on `nax-worker`.
  merge_group:
  push:
    branches: [main]
    paths: &mlx_paths
      - "crates/**"
      - "apps/rust-worker/**"
      # This lane lints the whole default-member set (see the clippy step), and
      # apps/rust-api carries the largest macOS-conditional surface outside the
      # worker. Without this entry a rust-api-only PR would not trigger the lane at
      # all, so the widened lint would be declared but unreachable for exactly the
      # PRs that need it. windows-candle.yml already watches this path. sc-17026.
      - "apps/rust-api/**"
      # The builtin model catalog is include_str!'d into the worker (via
      # sceneworks-core/builtin_manifests.rs) and read by the worker's
      # `engines::tests::manifest_menu_is_subset_of_descriptor` drift guard, so a
      # manifest-only edit can turn this suite red — gate on it (matches the
      # windows-candle.yml / desktop-windows.yml filters). sc-8617.
      - "config/manifests/**"
      # The stage-1 MLX facts dump this lane is the sole producer of (sc-17119). Without this entry
      # the "real dump, not a restamp" step below is unreachable for the one edit it exists to
      # catch: a restamp touches ONLY config/engine-capabilities/capabilities.mlx.json, matching no
      # other path here, so the lane would not run at all on the PR that made the file wrong.
      #
      # THIS FILE, not `config/engine-capabilities/**` (sc-17665). The directory glob also matched
      # capabilities.candle.json, so a candle-only restamp woke this whole macOS job -- including the
      # bare `cargo test` over every default member -- for a file its verify step never opens.
      # Self-hosted runners are the fleet's most constrained resource. Nothing here reads the sibling
      # file: no Rust reads the facts directory at all (`default_facts_dir()` only builds the dumper
      # bin's default OUTPUT path), and the three consumers that DO glob it sit outside this job --
      # previewSupportCatalog.test.js runs in check.yml's hosted Linux `web` job, and
      # generate-preview-support.mjs / bump-inference.mjs are manual scripts no workflow invokes.
      #
      # No coverage is lost. A restamp is the only edit this drops, and it is exactly the edit this
      # lane cannot check; a *material* sibling change also regenerates
      # config/manifests/builtin.preview-support.jsonc, and `config/manifests/**` above still wakes
      # both lanes. Path filters match DELETES and ADDS too, so a restamp, delete or re-add of this
      # file still triggers the lane.
      - "config/engine-capabilities/capabilities.mlx.json"
      # The AUDIO dump, which the verify step below ALSO diffs (sc-17593). Both lanes read this one,
      # because `AUDIO_BACKEND` is candle on every platform and either box can produce it -- so
      # unlike the sibling media file, waking this job for it is not a wasted run: the step opens it.
      #
      # sc-17665 narrowed the entry above from `config/engine-capabilities/**` to a single filename,
      # and that landed while sc-17593 was in flight. The two are individually correct and combine
      # badly: the audio verification was added to a step whose trigger paths had just stopped
      # matching the audio file. Demonstrated on `97a7655a9`, an audio-only re-dump that woke neither
      # stage-1 lane -- declared but unreachable, for exactly the edit the step exists to catch.
      - "config/engine-capabilities/audio/capabilities.candle.json"
      - "Cargo.toml"
      - "Cargo.lock"
      # sc-17703 (Michael's call — a deliberate under-trigger fix): rust-toolchain.toml
      # governs which toolchain cargo resolves, so a bump changes what this lane
      # compiles with — and nothing else here would trigger on it. The channel is a
      # concrete version, never floating `stable` (sc-17717), and both jobs' dtolnay
      # `toolchain:` inputs carry the same version (contract-test enforced), so a
      # toolchain change is always an edit that wakes this lane.
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/workflows/macos-mlx.yml"
  # NO `paths:` FILTER, deliberately (sc-17014). `macos-checks` below is a REQUIRED status check,
  # and GitHub leaves a path-filtered workflow's check **Pending** forever rather than passing it —
  # so a filter here would block every PR that does not touch these paths. The `changes` gate job
  # replaces it: a job skipped by `if:` reports Success, which a required check accepts. The `push:`
  # trigger above keeps its filter, since nothing gates on main pushes.
  pull_request:
    branches: [main, "feature/*"]
  workflow_dispatch:
    inputs:
      run_memory_calibration:
        description: "Build and run the authoritative MLX memory-strategy adapter"
        required: false
        type: boolean
        default: false
      run_five_rung_reference:
        description: "Capture the SC-16402 Z-Image fresh-process five-rung reference"
        required: false
        type: boolean
        default: false
      provision_qwen_snapshot:
        description: "Provision the exact public Qwen tier snapshot before calibration"
        required: false
        type: boolean
        default: false
      qwen_tier:
        description: "Exact Qwen artifact tier and calibration fixture to run"
        required: false
        type: choice
        options:
          - bf16
          - q4
          - q8
        default: bf16
      inference_revision:
        description: "Exact 40-hex inference revision pinned by the adapter"
        required: false
        type: string
      qwen_repository:
        description: "Published Qwen MLX artifact repository identity"
        required: false
        type: string
        default: "SceneWorks/qwen-image-mlx"
      qwen_revision:
        description: "Exact 40-hex Qwen artifact revision"
        required: false
        type: string
      qwen_source_path_prefix:
        description: "Repository path that will receive immutable Qwen logs and outputs"
        required: false
        type: string
        default: "docs/calibration/sc-18353"
      provision_z_image_snapshot:
        description: "Provision the exact public Z-Image q4 snapshot before capture"
        required: false
        type: boolean
        default: false
      z_image_repository:
        description: "Published Z-Image MLX artifact repository identity"
        required: false
        type: string
        default: "SceneWorks/z-image-turbo-mlx"
      z_image_revision:
        description: "Exact 40-hex Z-Image artifact revision"
        required: false
        type: string

# Cancel superseded PR runs, but never cancel a main-push run — same reasoning as
# windows-candle.yml (sc-12399). This lane is the only thing in CI that runs
# `nax_guard`, so a main commit whose run is killed carries no NAX verdict at all
# and a later kernel break is misattributed to the next commit.
#
# Main must key on `github.sha`, not `github.ref`: GitHub keeps at most ONE pending
# run per group and evicts it when a newer run queues, so a shared main group still
# drops the middle commit of a 3+ merge burst even with cancel-in-progress off.
# Per-SHA groups cannot evict each other, so every main commit keeps its own NAX
# verdict; they then spread across the self-hosted nax pool (one group per SHA imposes
# no ordering between them) and queue only once the pool is saturated. Do NOT collapse
# this back to `group: ...${{ github.ref }}`.
concurrency:
  group: macos-mlx-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# BUILD ARTIFACTS OUTSIDE THE DIRECTORY `actions/checkout` CLEANS.
#
# This lane had no cache of any kind, and `actions/checkout` defaults to `clean: true` —
# `git clean -ffdx` in the repo directory, which deletes gitignored `target/`. So every PR
# rebuilt the whole MLX-from-source graph from nothing on a self-hosted Mac. Measured on
# `nax-macos` 2026-08-04: `target/debug/deps` carried one job's timestamps end to end
# (CACHEDIR.TAG 21:58, newest artifact 22:16) across 13 GB, i.e. the entire tree was cold.
#
# `github.workspace` is `_work/<repo>/<repo>`; its parent is the runner's per-repo work
# directory, which checkout does not touch and the runner does not recreate between jobs
# (only `_temp` is). `../cargo-target` therefore survives the clean, stays scoped per repo
# and per box, and needs no cache action, no upload, and no network round trip. Workflow-level
# because the `runner` context is step-level only, while `github` is available here.
#
# This is the PR merge gate, so its wall clock is queue pressure for every other job on the
# same two boxes (sc-14708). Reclaiming the cold build is the cheapest reduction available.
#
# It is a cache: if a box runs short of disk, delete the directory and the next job rebuilds
# it. Nothing here is a test input — the calibration/reference dispatch paths below take their
# weights from host snapshots, never from `target/`.
#
# SCOPED TO `nax-worker`, NOT WORKFLOW-LEVEL. It was workflow-level when first written, which
# silently broke the hosted job's cache: `Swatinem/rust-cache` derives its target path as
# `<workspace>/target` from its `workspaces` input and does NOT read `CARGO_TARGET_DIR`, so it
# cached an empty `<workspace>/target` while the build wrote to `../cargo-target`. Only
# `~/.cargo` was stored, the artifacts were not, and the job stayed cold at 26m55s while
# reporting a green cache step. Confirmed from the run-31010484672 log, where "Cache Paths"
# ends in `/SceneWorks/SceneWorks/target` and the env above ends in `/../cargo-target`.
#
# The override only ever helped a PERSISTENT runner, where surviving `clean: true` between jobs
# is the whole point. A hosted runner is ephemeral — nothing survives it either way — so there
# the default `<workspace>/target` is correct precisely because it is what rust-cache stores.

jobs:
  # THE PATH FILTER THE `merge_group` TRIGGER CANNOT HAVE. See the note on that trigger: GitHub
  # supports no `paths:` filter for merge-queue events, so this hosted job re-derives the same
  # verdict the other two triggers get for free, by parsing THIS FILE'S OWN `mlx_paths` anchor and
  # diffing the merge group. Reading the anchor rather than copying it is the point — a copy would
  # rot in the silent direction, where a newly watched path this job did not know about reads as
  # "not relevant" and skips the lane on a green-looking merge group.
  #
  # ~15s on a hosted runner, and it only gates the hosted `macos-checks` job. `nax-worker` never
  # runs on a merge group at all, so it does not need this.
  #
  # push / pull_request runs reach this job already path-filtered by the triggers, so it re-answers
  # `true` for them; that is a couple of cheap seconds to keep one code path rather than two.
  changes:
    uses: ./.github/workflows/changed-paths.yml
    with:
      lane: .github/workflows/macos-mlx.yml
      anchor: mlx_paths

  # THE HOSTED HALF. Everything on this lane that does not need Apple matrix-unit silicon.
  #
  # This job did not exist because it could not: the workspace `/.cargo/config.toml` pins
  # MACOSX_DEPLOYMENT_TARGET=26.2 for MLX's NAX kernels, and GitHub's hosted macOS images
  # topped out at macos-15 / SDK 15, so the whole lane had to be self-hosted. That is no
  # longer true — `macos-26` went GA 2026-02-26 and the image is macOS 26.5.2 with SDKs
  # 26.0 through 26.5 and Xcode 26.2 through 26.6 installed.
  #
  # The split is by HARDWARE, not by cost. Exactly one thing on this lane needs an M5: the
  # `nax_guard` test, which exercises a 16-bit fused SDPA against an f32 reference and is
  # meaningful only where the matrix-unit kernels actually dispatch. Build, both clippy
  # steps, the rest of the workspace test suite, and the capability dump are all ordinary
  # macOS work. Keeping them on a hand-registered pool of two Macs — one of which is a
  # developer's daily driver — is what made every PR compete with real-weight jobs for
  # unified memory, up to and including jetsam kills (six on 2026-08-04).
  #
  # WHY 15.0 HERE, for now. At the workspace's 26.2 pin this job would compile the NAX
  # kernels in, and the hosted image's host OS (26.5.2) is above the 26.2 floor that
  # `is_nax_available()` checks — so on hosted silicon that is probably not M5 it may claim
  # NAX and dispatch matrix-unit kernels onto hardware without matrix units. That is an
  # open question, not a known failure: the MLX C++ is fetched at build time and is not in
  # the fork checkout, so whether the gate is OS-version-only or also device-capability
  # gated could not be read. Until a trial run answers it, this job builds the same
  # non-NAX configuration the inference repo's hosted `macos-metal` lane has always built,
  # and the 26.2 verdict stays entirely with `nax-worker` below. Settle it by running just
  # `nax_guard` on this image at 26.2 and reading the result; if it has teeth there, this
  # override can go and `nax-worker` can shrink further.
  #
  # CACHED. The first version of this job shipped without a cache action, on the claim that
  # "the MLX-from-source build is ~13 GB, above GitHub's 10 GB cache ceiling". Both halves of
  # that were wrong and it is worth recording why, because the reasoning is the reusable part.
  #
  # 13 GB was the size of the whole `target/` directory, measured on a developer box. That is
  # not what gets cached. `Swatinem/rust-cache` prunes workspace-member artifacts, keeps
  # dependency artifacts, and compresses with zstd — so the stored set is a subset of a subset.
  # Re-measured 2026-08-05 on `nax-macos`, the real numbers are:
  #
  #   whole target dir      8.7 GB   (not 13)
  #     debug/deps          6.9 GB
  #     debug/build         1.4 GB
  #       pmetal-mlx-sys    1.3 GB   <- the C++/Metal build, i.e. the slow part of this job
  #   ~/.cargo/registry     1.4 GB
  #
  # The thing that actually costs the wall clock — compiling MLX's C++ and Metal kernels — is
  # 1.3 GB, a rounding error against the ceiling. (Ignore the 11 GB in a developer's
  # `~/.cargo/git`: that is local accumulation across many pinned revisions, where a hosted
  # runner fetches only the two it needs.)
  #
  # If the stored size ever does exceed 10 GB, that limit is no longer hard — since 2025-11-20
  # a repo can go past it pay-as-you-go on Pro/Team/Enterprise, with a budget cap that makes
  # the cache read-only rather than failing builds. Read the size this action reports before
  # spending anything; the measurement is one run, the estimate above is still an estimate.
  #
  # `cache-bin` is left at its default here, unlike the self-hosted lanes. Its post step
  # deletes non-cargo-installed regular files from `$CARGO_HOME/bin`, which orphans `rustup`
  # on a persistent box — harmless on an ephemeral hosted runner, which is what this is.
  macos-checks:
    name: macOS build, lint and workspace tests (hosted)
    # NO same-repo guard, deliberately — it was removed once its premise proved false. It read:
    # "the 'Fetch the pinned inference release' step reads the PRIVATE SceneWorks/inference repo,
    # and a fork PR has neither the secret nor a `github.token` that can see it."
    #
    # SceneWorks/inference is PUBLIC and was never intended to be private. Verified two ways:
    # the pinned rev fetches with no token, no credential helper and no HOME; and the same fetch
    # succeeds with the EMPTY token a fork PR would supply. So the guard protected nothing.
    #
    # It also became actively harmful when `macos-checks` was made a required status check
    # (sc-17014): a fork PR matched the guard, this job was SKIPPED, and a skipped job reports
    # Success — so the required macOS check went green having validated nothing. That is the same
    # false-green class the fail-open work removed one level down, and it was reachable, not
    # theoretical.
    #
    # This job is HOSTED and ephemeral, so running fork code here is ordinary CI. The two
    # SELF-HOSTED jobs — `nax-worker` below and windows-candle.yml's `candle-worker` — KEEP their
    # guards: there the concern is untrusted code on a persistent box, which repo visibility has
    # nothing to do with. Do not "restore symmetry" by adding one back here.
    #
    # THE MERGE-QUEUE GATE runs through here: `changes` supplies the path filter the `merge_group`
    # trigger cannot carry. On push / pull_request it always answers `true` (those triggers are
    # already filtered), so this only ever subtracts merge-group runs for diffs this lane cannot
    # be affected by.
    needs: changes
    # FAIL OPEN. `!cancelled()` and the `result != 'success'` clause are BOTH load-bearing, and
    # neither is decoration: in GitHub Actions a job whose `needs:` FAILED is skipped, and a
    # skipped job reports **Success**, which satisfies a required status check. So without this,
    # a broken gate — a checkout failure, a dead runner, a syntax error in the reusable workflow —
    # would silently skip this lane and turn its required check green without running a thing.
    # That is the exact false-green shape this whole story exists to remove, reintroduced one
    # level up. A gate that did not succeed must therefore RUN the lane, matching
    # merge-group-relevance.mjs's own internal fallback. Do not "simplify" this back to a bare
    # `needs.changes.outputs.relevant == 'true'`.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: macos-26
    env:
      # See the WHY 15.0 block above. Provisional, pending the `is_nax_available()` trial.
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Well above the observed warm 6-14 min, sized for a cold MLX-from-source build on a
    # hosted image rather than on an M5 Max. Re-size from the first ten runs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.97.1"
          components: clippy
      # Keyed by job + rustc version + lockfile by default, which is what we want: the MLX pin
      # moves with `Cargo.lock`, so a pin bump invalidates the native build rather than
      # silently reusing kernels compiled from a different MLX revision.
      #
      # This job deliberately leaves `CARGO_TARGET_DIR` unset so the build lands in
      # `<workspace>/target` — the path this action derives and stores. See the block above
      # `jobs:`; pointing the two at different directories caches nothing and says nothing,
      # which is exactly what the first version of this step did.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (v2.9.1+1)
      - name: Ensure Metal compiler
        # The hosted image ships Xcode but not necessarily the Metal toolchain component,
        # and mlx-sys's build script shells out to `xcrun metal`. Same step the inference
        # repo's hosted macOS lane carries, for the same reason.
        run: |
          if ! xcrun --find metal >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version || true
      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Build the MLX GPU worker (mlx-gen linked)
        run: cargo build -p sceneworks-worker
      # LINT BEFORE TEST, and the same widened package scope sc-17026 established: every
      # default member, not just the worker. A step failure aborts the job, so tests first
      # would mean an unrelated red test skips the lint entirely.
      - name: Clippy (macOS default feature set, every default member)
        run: cargo clippy --all-targets -- -D warnings
      # sceneworks-memory-adapter is NOT a workspace default member, so the step above
      # cannot reach it. Its Candle twin is guarded on windows-candle.yml.
      - name: Clippy the MLX memory adapter (memory-mlx-adapter)
        run: cargo clippy -p sceneworks-memory-adapter --features mlx --all-targets -- -D warnings
      # ... and for the same reason the workspace test step below cannot reach its unit tests
      # either: `cargo test` covers default members only. Until sc-18250 this binary's tests ran in
      # NO lane, so reverting the sc-18104 dispatch-refusal fix merged green. Twin of
      # windows-candle.yml's memory-candle-adapter test step; pinned by
      # scripts/platform-review-contracts.test.mjs.
      - name: Test the MLX memory adapter (memory-mlx-adapter)
        run: cargo test -p sceneworks-memory-adapter --features mlx --bin memory-mlx-adapter
      # The whole workspace suite MINUS the one test that needs matrix-unit silicon.
      # `nax_16bit_sdpa_is_correct` runs on `nax-worker` below and nowhere else; the
      # contract test in scripts/platform-review-contracts.test.mjs pins both halves so
      # this skip cannot quietly become a hole.
      - name: Workspace tests (excluding the NAX guard, which needs M5)
        run: cargo test -- --skip nax_16bit_sdpa_is_correct

  nax-worker:
    # Same-repo only — never execute untrusted fork code on the self-hosted runner.
    #
    # FEATURE-TARGET STORY PRS ARE HOSTED-ONLY. `macos-checks` is required on
    # `feature/*`, but automatically running this job for every story would turn
    # the two-Mac NAX pool into feature-branch queue capacity. NAX evidence is
    # instead captured by an explicit dispatch at the frozen feature head; this
    # job also continues to run on the final same-repo integration PR to `main`.
    #
    # AND NEVER ON A MERGE GROUP, deliberately. The pool is two hand-registered Macs, one of them a
    # developer's daily driver, and PR runs there already compete with real-weight jobs for unified
    # memory badly enough to have produced six jetsam kills on 2026-08-04. A merge group is an
    # ADDITIONAL run per queued batch on top of the PR run and the main-push run, and the queue can
    # build several speculative groups at once (`max_entries_to_build`), so this would be the
    # heaviest new consumer of the scarcest hardware in the fleet.
    #
    # What that costs is bounded and specific: `nax_16bit_sdpa_is_correct`, the one test the hosted
    # job skips. Everything else this lane proves — the whole workspace suite, both clippy scopes,
    # the MLX-linked build — is `macos-checks` above, which DOES gate the queue. And `nax_guard`
    # asserts a property of the M5 matrix-unit kernels, not of how two PRs compose, so it is a poor
    # fit for the class the merge queue exists to catch. It still runs on final integration PRs
    # targeting `main`, explicit final-head dispatches, and the post-merge main push, which are
    # the points where authoritative NAX evidence is required.
    #
    # `needs: changes` IS LOAD-BEARING HERE, not just an optimisation. sc-17014 dropped the
    # `paths:` filter from this workflow's pull_request trigger so `macos-checks` could become a
    # required check — which means that without this gate, EVERY pull request in the repo would
    # wake this job on the two-Mac `nax` pool, including docs-only ones. The trigger filter used to
    # be what protected that pool; this is now.
    needs: changes
    # FAIL OPEN. `!cancelled()` and the `result != 'success'` clause are BOTH load-bearing, and
    # neither is decoration: in GitHub Actions a job whose `needs:` FAILED is skipped, and a
    # skipped job reports **Success**, which satisfies a required status check. So without this,
    # a broken gate — a checkout failure, a dead runner, a syntax error in the reusable workflow —
    # would silently skip this lane and turn its required check green without running a thing.
    # That is the exact false-green shape this whole story exists to remove, reintroduced one
    # level up. A gate that did not succeed must therefore RUN the lane, matching
    # merge-group-relevance.mjs's own internal fallback. Do not "simplify" this back to a bare
    # `needs.changes.outputs.relevant == 'true'`.
    if: ${{ !cancelled() && github.event_name != 'merge_group' && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') && (github.event_name != 'pull_request' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    # The PR/main path needs only `nax`. The workflow_dispatch calibration paths
    # additionally need the HF snapshots, and those are HOST STATE that does not travel
    # with a label — the same defect class this repo just fixed for release.yml's signing
    # cert. Left on bare `nax` with a multi-box pool:
    #   * without provision_*, "Resolve exact ... snapshot" fails with "not available on
    #     this runner" — but only AFTER paying the full build + clippy + test;
    #   * with provision_*, it succeeds, having downloaded ~57 GiB onto whichever box won
    #     the scheduling, scattering duplicate multi-tens-of-GiB caches across the pool.
    # Routing every calibration dispatch to `weights` keeps the big caches on the boxes
    # designated to hold them, and makes a provisioning run top that box up rather than
    # seeding a new copy somewhere arbitrary.
    #
    # `inputs` is available to job-level `runs-on`, and the event_name guard short-circuits
    # for push/pull_request, where the inputs are null.
    #
    # WARNING: at least one runner must carry `weights`, or a calibration dispatch has no
    # eligible runner and queues indefinitely instead of failing. See the label topology
    # table in docs/rust-mlx-build.md.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (inputs.run_memory_calibration || inputs.run_five_rung_reference)) && fromJSON('["self-hosted","macOS","ARM64","nax","weights"]') || fromJSON('["self-hosted","macOS","ARM64","nax"]') }}
    env:
      CARGO_NET_OFFLINE: "true"
      # Survives `actions/checkout`'s `clean: true` between jobs on this persistent box. See
      # the rationale block above `jobs:`. Job-level rather than workflow-level so it cannot
      # reach the hosted job, whose cache action stores `<workspace>/target` instead.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
    # Guardrail so a wedged step fails fast instead of riding GitHub's 6-hour
    # default (sc-10420). The nax pool is small and hand-registered — GitHub's
    # hosted images cannot run this lane at all, so capacity is exactly the Macs
    # somebody provisioned (scripts/setup-nax-runner.sh, docs/rust-mlx-build.md).
    # A wedge therefore removes a whole box from a pool of a couple, and the
    # remaining boxes absorb every queued PR/main run (sc-13603). Only an explicit
    # calibration+provisioning dispatch gets four hours for the approximately 57 GiB
    # public snapshot.
    #
    # The 45 is now LOOSE and deliberately left alone. It was sized against a
    # ~6-14 min warm build+test+clippy, and both clippy steps plus the workspace suite
    # have since moved to `macos-checks`; the PR path here is a build, one test target
    # and the capability dump. A cold MLX-from-source rebuild still has to fit, which is
    # what the headroom is really for. Re-size it from measured runs after the split has
    # a few weeks of data rather than guessing it down now — guessing budgets down from
    # an estimate instead of a measurement is the sc-16981 defect.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && ((inputs.run_memory_calibration && inputs.provision_qwen_snapshot) || (inputs.run_five_rung_reference && inputs.provision_z_image_snapshot)) && 240 || github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && 120 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.97.1"
          components: clippy
      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      # No MACOSX_DEPLOYMENT_TARGET override: the workspace /.cargo/config.toml pins
      # 26.2, so the NAX kernels compile in and the fast path is actually built.
      - name: Build the MLX GPU worker (mlx-gen linked, NAX at 26.2)
        run: cargo build -p sceneworks-worker
      # THE ONLY REASON THIS JOB IS SELF-HOSTED.
      #
      # `nax_guard` exercises a 16-bit fused SDPA against an f32 reference and goes red
      # when the kernels were compiled below the 26.2 floor — the tripwire for a
      # miscompile that produces right-scale, uncorrelated garbage. It is meaningful only
      # where the matrix-unit kernels actually dispatch, which is Apple M5 silicon that no
      # cloud sells and no hosted image provides. Everything else this lane used to do —
      # the widened sc-17026 clippy over every default member, the memory-adapter lint,
      # and the rest of the workspace test suite — now runs on `macos-checks` above,
      # because none of it needs matrix units and all of it was competing with
      # real-weight jobs for unified memory on a two-Mac pool.
      #
      # `--test nax_guard` rather than a bare `cargo test`: the workspace suite is the
      # hosted job's responsibility now, and running it twice would put the whole point of
      # the split back on the scarce hardware. The two halves are pinned against each
      # other in scripts/platform-review-contracts.test.mjs — the hosted job must run the
      # workspace suite skipping exactly this test, and this job must run exactly this
      # test — so neither can drift into a hole without failing that contract.
      #
      # Deliberately NOT `-p sceneworks-worker` for anything but this test target. The
      # narrow spelling is what sc-17026 removed, and re-introducing it for the suite
      # would re-dark every non-worker crate.
      - name: NAX 16-bit SDPA guard (needs M5 matrix units)
        run: cargo test -p sceneworks-worker --test nax_guard
      # sc-17119. THE ONLY LANE THAT CAN PRODUCE capabilities.mlx.json, so it is the only place the
      # checked-in file can be checked against a real registry rather than taken on trust.
      #
      # Every other guard reads that file as a source: `verifyEngineCapabilityFacts` checks that it
      # exists, names a backend SCENEWORKS_BACKENDS declares, and carries the current
      # `inferenceRevision` -- nothing about the engine list -- and the vitest drift guard re-derives
      # the catalog from its contents. Both are satisfied by editing one line. That is not
      # hypothetical -- the file was RESTAMPED (revision line rewritten, 334 lines of content
      # untouched) through two consecutive pin bumps, 35251a88 and 06e0c5e9, because no Mac was
      # available to re-dump it and nothing could tell the difference. The restamps happened to be
      # correct; nothing proved it until this step existed.
      #
      # Cheap: the build and test steps above already built the mlx-gen graph, so this is a link plus
      # a weights-free registry walk. Dumps to a scratch dir, never over the checked-in file, so a
      # red run leaves a readable diff instead of a mutated tree.
      #
      # LAST, deliberately -- the same rule the clippy steps above are ordered by, applied to a step
      # that fires on a PREDICTABLE, routine event. A step failure aborts the job, and this one goes
      # red on exactly the pin-bump PRs where nobody re-dumped on a Mac. Placed earlier it would
      # cancel both clippy steps and `cargo test` -- and this lane is the ONLY place in CI that runs
      # `nax_guard`, so a stale facts file would cost the repo its entire NAX kernel verdict for that
      # commit, on precisely the PRs where descriptors just moved. A missing dump must not suppress
      # unrelated coverage; it is the least urgent signal in this job, so it reports last.
      #
      # When this fails after a pin bump, the fix is to commit the dump it just produced and re-run
      # `npm run gen:preview-support` from apps/web -- not to restamp the revision line.
      #
      # capabilities.candle.json had the same hole (it was restamped by the same commits); the mirror
      # could NOT be written here, because it needs the CUDA box and windows-candle.yml runs every
      # step under `shell: cmd`/`powershell` -- its own header records that `bash` there resolves to
      # the box's WSL stub, and `cmd` has no `diff`. sc-17592 closed it there instead, as a `cmd` step
      # using `git diff --no-index --exit-code`. Keep the two in sync: a change to the semantics here
      # wants the same change in windows-candle.yml's "Verify capabilities.candle.json" step.
      #
      # The AUDIO dump (sc-17593) is verified in BOTH lanes, and deliberately so. It is the one facts
      # file both lanes write -- `AUDIO_BACKEND` is `candle` on every platform -- so it is the most
      # exposed to a restamp and the only one whose correctness rests on a cross-lane claim: that a
      # Mac and the CUDA box produce identical bytes. That claim holds by construction
      # (`candle-audio-catalog` gates no registration on the platform, and the audio provenance
      # stamps a lane-neutral invocation rather than this build's own), and checking it on both lanes
      # is what turns it from an argument into a measurement. Costs nothing either side: the same
      # `dump-engine-capabilities` run already writes it. If this half fails while the mlx half
      # passes, lane-independence is what broke, not the dump.
      - name: Verify capabilities.mlx.json is a real dump, not a restamp
        id: verify_capabilities
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/backend-capability-facts-mlx"
          mkdir -p "$scratch"
          cargo run -p sceneworks-worker --bin dump-engine-capabilities -- "$scratch"
          if ! diff -u config/engine-capabilities/capabilities.mlx.json \
                     "$scratch/capabilities.mlx.json"; then
            echo "::error::config/engine-capabilities/capabilities.mlx.json does not match a fresh"\
                 "dump at this pin. Re-dump it on a Mac:"\
                 "cargo run -p sceneworks-worker --bin dump-engine-capabilities,"\
                 "then (cd apps/web && npm run gen:preview-support)."
            exit 1
          fi
          if ! diff -u config/engine-capabilities/audio/capabilities.candle.json \
                     "$scratch/audio/capabilities.candle.json"; then
            echo "::error::config/engine-capabilities/audio/capabilities.candle.json does not"\
                 "match a fresh dump at this pin. Either box re-dumps it --"\
                 "cargo run -p sceneworks-worker --bin dump-engine-capabilities"\
                 "[--no-default-features --features backend-candle] --"\
                 "then (cd apps/web && npm run gen:preview-support)."
            exit 1
          fi
      - name: Upload fresh MLX capability facts after a verification failure
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && steps.verify_capabilities.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mlx-capability-facts-${{ github.run_id }}
          path: ${{ runner.temp }}/backend-capability-facts-mlx
          if-no-files-found: error
      - name: Validate Qwen provisioning mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RUN_MEMORY_CALIBRATION: ${{ inputs.run_memory_calibration }}
          PROVISION_QWEN_SNAPSHOT: ${{ inputs.provision_qwen_snapshot }}
        run: |
          if [[ "$PROVISION_QWEN_SNAPSHOT" == "true" && "$RUN_MEMORY_CALIBRATION" != "true" ]]; then
            echo "provision_qwen_snapshot requires run_memory_calibration=true" >&2
            exit 1
          fi
      - name: Validate Z-Image provisioning mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RUN_FIVE_RUNG_REFERENCE: ${{ inputs.run_five_rung_reference }}
          PROVISION_Z_IMAGE_SNAPSHOT: ${{ inputs.provision_z_image_snapshot }}
        run: |
          if [[ "$PROVISION_Z_IMAGE_SNAPSHOT" == "true" && "$RUN_FIVE_RUNG_REFERENCE" != "true" ]]; then
            echo "provision_z_image_snapshot requires run_five_rung_reference=true" >&2
            exit 1
          fi
      - name: Validate memory-strategy calibration identities
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration }}
        env:
          INFERENCE_REVISION: ${{ inputs.inference_revision }}
          QWEN_REPOSITORY: ${{ inputs.qwen_repository }}
          QWEN_REVISION: ${{ inputs.qwen_revision }}
          QWEN_TIER: ${{ inputs.qwen_tier }}
        run: |
          if [[ ! "$INFERENCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "inference_revision must be an exact lowercase 40-hex commit" >&2
            exit 1
          fi
          if [[ ! "$QWEN_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "qwen_revision must be an exact lowercase 40-hex artifact revision" >&2
            exit 1
          fi
          if [[ "$QWEN_REPOSITORY" != "SceneWorks/qwen-image-mlx" ]]; then
            echo "qwen_repository must be the fixed SceneWorks/qwen-image-mlx calibration artifact" >&2
            exit 1
          fi
          if [[ "$QWEN_TIER" != "bf16" && "$QWEN_TIER" != "q4" && "$QWEN_TIER" != "q8" ]]; then
            echo "qwen_tier must be one of bf16, q4, or q8" >&2
            exit 1
          fi
          PIN="$(sed -nE 's/^pub const INFERENCE_PIN: &str = "([0-9a-f]{40})";/\1/p' crates/sceneworks-memory-adapter/src/lib.rs)"
          if [[ "$PIN" != "$INFERENCE_REVISION" ]]; then
            echo "input inference_revision does not match the adapter's compiled INFERENCE_PIN" >&2
            exit 1
          fi
      - name: Validate five-rung reference identities
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        env:
          INFERENCE_REVISION: ${{ inputs.inference_revision }}
          Z_IMAGE_REPOSITORY: ${{ inputs.z_image_repository }}
          Z_IMAGE_REVISION: ${{ inputs.z_image_revision }}
        run: |
          if [[ ! "$INFERENCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "inference_revision must be an exact lowercase 40-hex commit" >&2
            exit 1
          fi
          if [[ ! "$Z_IMAGE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "z_image_revision must be an exact lowercase 40-hex artifact revision" >&2
            exit 1
          fi
          if [[ "$Z_IMAGE_REPOSITORY" != "SceneWorks/z-image-turbo-mlx" ]]; then
            echo "z_image_repository must be the fixed SceneWorks/z-image-turbo-mlx reference artifact" >&2
            exit 1
          fi
          PIN="$(sed -nE 's/^pub const INFERENCE_PIN: &str = "([0-9a-f]{40})";/\1/p' crates/sceneworks-memory-adapter/src/lib.rs)"
          if [[ "$PIN" != "$INFERENCE_REVISION" ]]; then
            echo "input inference_revision does not match the adapter's compiled INFERENCE_PIN" >&2
            exit 1
          fi
      - name: Set up runner Python 3.12 for Qwen provisioning
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration && inputs.provision_qwen_snapshot }}
        run: |
          command -v python3.12 >/dev/null
          python3.12 --version | grep -E '^Python 3\.12\.'
          python3.12 -m venv "$RUNNER_TEMP/qwen-provision-venv"
      - name: Install pinned Qwen provisioning client
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration && inputs.provision_qwen_snapshot }}
        run: |
          "$RUNNER_TEMP/qwen-provision-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input "huggingface_hub==0.36.0"
      - name: Set up runner Python 3.12 for Z-Image provisioning
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && inputs.provision_z_image_snapshot }}
        run: |
          command -v python3.12 >/dev/null
          python3.12 --version | grep -E '^Python 3\.12\.'
          python3.12 -m venv "$RUNNER_TEMP/z-image-provision-venv"
      - name: Install pinned Z-Image provisioning client
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && inputs.provision_z_image_snapshot }}
        run: |
          "$RUNNER_TEMP/z-image-provision-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input "huggingface_hub==0.36.0"
      - name: Provision exact public Qwen calibration snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration && inputs.provision_qwen_snapshot }}
        env:
          QWEN_REVISION: ${{ inputs.qwen_revision }}
          QWEN_TIER: ${{ inputs.qwen_tier }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_VERBOSITY: "error"
        run: |
          "$RUNNER_TEMP/qwen-provision-venv/bin/python" - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          huggingface_cache = os.path.join(
              os.environ["HOME"],
              ".cache",
              "huggingface",
              "hub",
          )
          application_cache = os.path.join(
              os.environ["HOME"],
              "Library",
              "Application Support",
              "SceneWorks",
              "data",
              "cache",
              "huggingface",
              "hub",
          )
          repository_cache = os.path.join(
              huggingface_cache,
              "models--SceneWorks--qwen-image-mlx",
          )
          cache_dir = (
              huggingface_cache
              if os.path.isdir(repository_cache)
              else application_cache
          )
          snapshot_download(
              repo_id="SceneWorks/qwen-image-mlx",
              repo_type="model",
              revision=os.environ["QWEN_REVISION"],
              allow_patterns=[f"{os.environ['QWEN_TIER']}/**"],
              cache_dir=cache_dir,
              token=False,
              max_workers=4,
          )
          print("Exact public Qwen calibration snapshot provisioned")
          PY
      - name: Provision exact public Z-Image reference snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && inputs.provision_z_image_snapshot }}
        env:
          Z_IMAGE_REVISION: ${{ inputs.z_image_revision }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_VERBOSITY: "error"
        run: |
          "$RUNNER_TEMP/z-image-provision-venv/bin/python" - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="SceneWorks/z-image-turbo-mlx",
              repo_type="model",
              revision=os.environ["Z_IMAGE_REVISION"],
              allow_patterns=["q4/**"],
              cache_dir=os.path.join(os.environ["HOME"], ".cache", "huggingface", "hub"),
              token=False,
              max_workers=4,
          )
          print("Exact public Z-Image reference snapshot provisioned")
          PY
      - name: Resolve exact Qwen calibration snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration }}
        env:
          QWEN_REVISION: ${{ inputs.qwen_revision }}
          QWEN_TIER: ${{ inputs.qwen_tier }}
          QWEN_ROOT_OVERRIDE: ${{ secrets.SCENEWORKS_QWEN_IMAGE_ROOT }}
        run: |
          EXPECTED_SUFFIX="/models--SceneWorks--qwen-image-mlx/snapshots/$QWEN_REVISION/$QWEN_TIER"
          QWEN_ROOT=""
          if [[ -n "$QWEN_ROOT_OVERRIDE" && -d "$QWEN_ROOT_OVERRIDE" ]]; then
            QWEN_OVERRIDE_ROOT="$(cd "$QWEN_ROOT_OVERRIDE" && pwd -P)"
            if [[ "$QWEN_OVERRIDE_ROOT" == *"$EXPECTED_SUFFIX" ]]; then
              QWEN_ROOT="$QWEN_OVERRIDE_ROOT"
            fi
          fi
          if [[ -z "$QWEN_ROOT" ]]; then
            QWEN_HF_ROOT="$HOME/.cache/huggingface/hub/models--SceneWorks--qwen-image-mlx/snapshots/$QWEN_REVISION/$QWEN_TIER"
            QWEN_APP_ROOT="$HOME/Library/Application Support/SceneWorks/data/cache/huggingface/hub/models--SceneWorks--qwen-image-mlx/snapshots/$QWEN_REVISION/$QWEN_TIER"
            if [[ -d "$QWEN_HF_ROOT" ]]; then
              QWEN_ROOT="$QWEN_HF_ROOT"
            elif [[ -d "$QWEN_APP_ROOT" ]]; then
              QWEN_ROOT="$QWEN_APP_ROOT"
            else
              echo "the exact Qwen calibration snapshot is not available on this runner" >&2
              exit 1
            fi
          fi
          if [[ ! -d "$QWEN_ROOT" ]]; then
            echo "the exact Qwen calibration snapshot is not available on this runner" >&2
            exit 1
          fi
          QWEN_ROOT="$(cd "$QWEN_ROOT" && pwd -P)"
          if [[ "$QWEN_ROOT" != *"$EXPECTED_SUFFIX" ]]; then
            echo "the Qwen calibration root does not match the fixed repository and exact revision" >&2
            exit 1
          fi
          printf 'SCENEWORKS_QWEN_IMAGE_ROOT=%s\n' "$QWEN_ROOT" >> "$GITHUB_ENV"
      - name: Resolve exact Z-Image reference snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        env:
          Z_IMAGE_REVISION: ${{ inputs.z_image_revision }}
          Z_IMAGE_ROOT_OVERRIDE: ${{ secrets.SCENEWORKS_Z_IMAGE_ROOT }}
        run: |
          if [[ -n "$Z_IMAGE_ROOT_OVERRIDE" ]]; then
            Z_IMAGE_ROOT="$Z_IMAGE_ROOT_OVERRIDE"
          else
            Z_IMAGE_HF_ROOT="$HOME/.cache/huggingface/hub/models--SceneWorks--z-image-turbo-mlx/snapshots/$Z_IMAGE_REVISION/q4"
            Z_IMAGE_APP_ROOT="$HOME/Library/Application Support/SceneWorks/data/cache/huggingface/hub/models--SceneWorks--z-image-turbo-mlx/snapshots/$Z_IMAGE_REVISION/q4"
            if [[ -d "$Z_IMAGE_HF_ROOT" ]]; then
              Z_IMAGE_ROOT="$Z_IMAGE_HF_ROOT"
            elif [[ -d "$Z_IMAGE_APP_ROOT" ]]; then
              Z_IMAGE_ROOT="$Z_IMAGE_APP_ROOT"
            else
              echo "the exact Z-Image reference snapshot is not available on this runner" >&2
              exit 1
            fi
          fi
          Z_IMAGE_ROOT="$(cd "$Z_IMAGE_ROOT" && pwd -P)"
          EXPECTED_SUFFIX="/models--SceneWorks--z-image-turbo-mlx/snapshots/$Z_IMAGE_REVISION/q4"
          if [[ "$Z_IMAGE_ROOT" != *"$EXPECTED_SUFFIX" ]]; then
            echo "the Z-Image reference root does not match the fixed repository and exact revision" >&2
            exit 1
          fi
          printf 'SCENEWORKS_Z_IMAGE_ROOT=%s\n' "$Z_IMAGE_ROOT" >> "$GITHUB_ENV"
      - name: Fingerprint the exact Qwen artifact inventory
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration }}
        run: |
          node scripts/hash-artifact-inventory.mjs \
            --root "$SCENEWORKS_QWEN_IMAGE_ROOT" \
            --github-env "$GITHUB_ENV"
      - name: Check out the exact inference calibration source
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_memory_calibration || inputs.run_five_rung_reference) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_revision }}
          token: ${{ secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
          path: .calibration/inference
          persist-credentials: false
      - name: Build and run the authoritative Qwen MLX ladder calibration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration }}
        env:
          SCENEWORKS_QWEN_IMAGE_REPOSITORY: ${{ inputs.qwen_repository }}
          SCENEWORKS_QWEN_IMAGE_REVISION: ${{ inputs.qwen_revision }}
          SCENEWORKS_MEMORY_CAPTURE_DIR: ${{ runner.temp }}/memory-mlx-raw
          SCENEWORKS_MEMORY_SOURCE_PATH_PREFIX: ${{ inputs.qwen_source_path_prefix }}
          QWEN_TIER: ${{ inputs.qwen_tier }}
        run: |
          printf '.calibration/\n' >> .git/info/exclude
          cargo build --release --locked -p sceneworks-memory-adapter \
            --features mlx --bin memory-mlx-adapter
          if [[ "$QWEN_TIER" == "bf16" ]]; then
            QWEN_SEED=15511
          else
            QWEN_SEED=16353
          fi
          node scripts/memory-calibration-harness.mjs run \
            --config config/memory-calibration-plan.json \
            --backend mlx \
            --fixture "qwen-image-${QWEN_TIER}-seed${QWEN_SEED}-step2" \
            --fresh-per-case \
            --provider-command "[\"$CARGO_TARGET_DIR/release/memory-mlx-adapter\"]" \
            --sceneworks-repo "$GITHUB_WORKSPACE" \
            --inference-repo "$GITHUB_WORKSPACE/.calibration/inference" \
            --raw-log-dir "$SCENEWORKS_MEMORY_CAPTURE_DIR" \
            --source-path-prefix "$SCENEWORKS_MEMORY_SOURCE_PATH_PREFIX" \
            --output "$RUNNER_TEMP/memory-mlx-evidence.json"
          node scripts/memory-calibration-harness.mjs check \
            --input "$RUNNER_TEMP/memory-mlx-evidence.json" \
            --source-root "$SCENEWORKS_MEMORY_CAPTURE_DIR"
      - name: Upload raw schema-checked MLX calibration evidence
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-mlx-evidence-${{ inputs.qwen_tier }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/memory-mlx-evidence.json
            ${{ runner.temp }}/memory-mlx-raw
          if-no-files-found: error
      - name: Build and run the authoritative MLX five-rung reference
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        env:
          SCENEWORKS_Z_IMAGE_REPOSITORY: ${{ inputs.z_image_repository }}
          SCENEWORKS_Z_IMAGE_REVISION: ${{ inputs.z_image_revision }}
        run: |
          printf '.calibration/\n' >> .git/info/exclude
          cargo build --release --locked -p sceneworks-memory-adapter \
            --features mlx --bin memory-mlx-adapter
          node scripts/memory-calibration-harness.mjs assess-reuse \
            --config config/memory-calibration-plan.json \
            --backend mlx \
            --fixture fresh-five-rung-z-image-q4-768-seed16402-step2 \
            --provider-command "[\"$CARGO_TARGET_DIR/release/memory-mlx-adapter\"]" \
            --output "$RUNNER_TEMP/sc-16059-mlx-reuse-assessment.json"
          node -e 'const a=require(process.argv[1]); if(a.verdict!=="unable_to_amortize") throw new Error(`unexpected MLX reuse verdict: ${a.verdict}`)' \
            "$RUNNER_TEMP/sc-16059-mlx-reuse-assessment.json"
          node scripts/memory-calibration-harness.mjs run \
            --config config/memory-calibration-plan.json \
            --backend mlx \
            --fixture fresh-five-rung-z-image-q4-768-seed16402-step2 \
            --fresh-per-case \
            --provider-command "[\"$CARGO_TARGET_DIR/release/memory-mlx-adapter\"]" \
            --sceneworks-repo "$GITHUB_WORKSPACE" \
            --inference-repo "$GITHUB_WORKSPACE/.calibration/inference" \
            --output "$RUNNER_TEMP/sc-16059-mlx-fresh.json"
          node scripts/memory-calibration-harness.mjs check \
            --input "$RUNNER_TEMP/sc-16059-mlx-fresh.json"
      - name: Upload raw schema-checked MLX five-rung reference
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc-16059-mlx-reuse-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sc-16059-mlx-fresh.json
            ${{ runner.temp }}/sc-16059-mlx-reuse-assessment.json
          if-no-files-found: error
