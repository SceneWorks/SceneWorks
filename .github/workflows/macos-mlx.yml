name: macOS MLX worker

# Compiles AND tests the Rust GPU worker with the native MLX engine (mlx-gen, epic
# 2337) linked in — the macOS-only build the Linux `parity` job (check.yml) and the
# Windows desktop job cannot exercise, because mlx-gen is gated to
# `cfg(target_os = "macos")` and builds Apple MLX from source.
#
# RUNS ON A SELF-HOSTED macOS 26.2+ RUNNER. GitHub's hosted macOS images top out well
# below macOS 26.2, so they could only build at a lowered deployment target and could
# NOT exercise the NAX matrix-unit fast path at all. A self-hosted 26.2+ runner builds
# at the workspace 26.2 pin (/.cargo/config.toml — no override) and actually RUNS
# `nax_guard`, the only way CI can guarantee the NAX 16-bit kernels are correct
# (sc-2772 / sc-3019). It also keeps the heavy MLX-from-source build warm across runs
# (the runner reuses its target dir), so MLX compiles once, not every run.
#
# Runner prerequisites: macOS >= 26.2, full Xcode + the Metal Toolchain, a Rust
# toolchain, cmake (MLX builds through CMake — a box without it fails in
# pmetal-mlx-sys's build script), registered with the `nax` label. See
# docs/rust-mlx-build.md.
#
# SECURITY: this repo is PUBLIC, and GitHub warns against running self-hosted runners
# for public repos because a fork PR could execute arbitrary code on the runner. The
# job-level `if:` below restricts execution to same-repo branches (the epic's story
# branches pushed to origin), so fork PRs never run here. Keep "Require approval for
# all external contributors' workflows" enabled in the repo Actions settings as
# defense in depth.

# Epic-3018 stories merged to main via PR #456 and `rust-mlx-integration` was
# deleted; epic work now branches off and PRs into main (sc-4177 re-pointed the
# lane after it sat dead on the deleted branch).
on:
  push:
    branches: [main]
    paths: &mlx_paths
      - "crates/**"
      - "apps/rust-worker/**"
      # This lane lints the whole default-member set (see the clippy step), and
      # apps/rust-api carries the largest macOS-conditional surface outside the
      # worker. Without this entry a rust-api-only PR would not trigger the lane at
      # all, so the widened lint would be declared but unreachable for exactly the
      # PRs that need it. windows-candle.yml already watches this path. sc-17026.
      - "apps/rust-api/**"
      # The builtin model catalog is include_str!'d into the worker (via
      # sceneworks-core/builtin_manifests.rs) and read by the worker's
      # `engines::tests::manifest_menu_is_subset_of_descriptor` drift guard, so a
      # manifest-only edit can turn this suite red — gate on it (matches the
      # windows-candle.yml / desktop-windows.yml filters). sc-8617.
      - "config/manifests/**"
      # The stage-1 MLX facts dump this lane is the sole producer of (sc-17119). Without this entry
      # the "real dump, not a restamp" step below is unreachable for the one edit it exists to
      # catch: a restamp touches ONLY config/engine-capabilities/capabilities.mlx.json, matching no
      # other path here, so the lane would not run at all on the PR that made the file wrong.
      - "config/engine-capabilities/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/macos-mlx.yml"
  pull_request:
    branches: [main]
    paths: *mlx_paths
  workflow_dispatch:
    inputs:
      run_memory_calibration:
        description: "Build and run the authoritative MLX memory-strategy adapter"
        required: false
        type: boolean
        default: false
      run_five_rung_reference:
        description: "Capture the SC-16402 Z-Image fresh-process five-rung reference"
        required: false
        type: boolean
        default: false
      provision_qwen_snapshot:
        description: "Provision the exact public Qwen tier snapshot before calibration"
        required: false
        type: boolean
        default: false
      qwen_tier:
        description: "Exact Qwen artifact tier and calibration fixture to run"
        required: false
        type: choice
        options:
          - bf16
          - q4
          - q8
        default: bf16
      inference_revision:
        description: "Exact 40-hex inference revision pinned by the adapter"
        required: false
        type: string
      qwen_repository:
        description: "Published Qwen MLX artifact repository identity"
        required: false
        type: string
        default: "SceneWorks/qwen-image-mlx"
      qwen_revision:
        description: "Exact 40-hex Qwen artifact revision"
        required: false
        type: string
      provision_z_image_snapshot:
        description: "Provision the exact public Z-Image q4 snapshot before capture"
        required: false
        type: boolean
        default: false
      z_image_repository:
        description: "Published Z-Image MLX artifact repository identity"
        required: false
        type: string
        default: "SceneWorks/z-image-turbo-mlx"
      z_image_revision:
        description: "Exact 40-hex Z-Image artifact revision"
        required: false
        type: string

# Cancel superseded PR runs, but never cancel a main-push run — same reasoning as
# windows-candle.yml (sc-12399). This lane is the only thing in CI that runs
# `nax_guard`, so a main commit whose run is killed carries no NAX verdict at all
# and a later kernel break is misattributed to the next commit.
#
# Main must key on `github.sha`, not `github.ref`: GitHub keeps at most ONE pending
# run per group and evicts it when a newer run queues, so a shared main group still
# drops the middle commit of a 3+ merge burst even with cancel-in-progress off.
# Per-SHA groups cannot evict each other, so every main commit keeps its own NAX
# verdict; they then spread across the self-hosted nax pool (one group per SHA imposes
# no ordering between them) and queue only once the pool is saturated. Do NOT collapse
# this back to `group: ...${{ github.ref }}`.
concurrency:
  group: macos-mlx-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nax-worker:
    # Same-repo only — never execute untrusted fork code on the self-hosted runner.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # The PR/main path needs only `nax`. The workflow_dispatch calibration paths
    # additionally need the HF snapshots, and those are HOST STATE that does not travel
    # with a label — the same defect class this repo just fixed for release.yml's signing
    # cert. Left on bare `nax` with a multi-box pool:
    #   * without provision_*, "Resolve exact ... snapshot" fails with "not available on
    #     this runner" — but only AFTER paying the full build + clippy + test;
    #   * with provision_*, it succeeds, having downloaded ~57 GiB onto whichever box won
    #     the scheduling, scattering duplicate multi-tens-of-GiB caches across the pool.
    # Routing every calibration dispatch to `weights` keeps the big caches on the boxes
    # designated to hold them, and makes a provisioning run top that box up rather than
    # seeding a new copy somewhere arbitrary.
    #
    # `inputs` is available to job-level `runs-on`, and the event_name guard short-circuits
    # for push/pull_request, where the inputs are null.
    #
    # WARNING: at least one runner must carry `weights`, or a calibration dispatch has no
    # eligible runner and queues indefinitely instead of failing. See the label topology
    # table in docs/rust-mlx-build.md.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (inputs.run_memory_calibration || inputs.run_five_rung_reference)) && fromJSON('["self-hosted","macOS","ARM64","nax","weights"]') || fromJSON('["self-hosted","macOS","ARM64","nax"]') }}
    env:
      CARGO_NET_OFFLINE: "true"
    # Guardrail so a wedged step fails fast instead of riding GitHub's 6-hour
    # default (sc-10420). The nax pool is small and hand-registered — GitHub's
    # hosted images cannot run this lane at all, so capacity is exactly the Macs
    # somebody provisioned (scripts/setup-nax-runner.sh, docs/rust-mlx-build.md).
    # A wedge therefore removes a whole box from a pool of a couple, and the
    # remaining boxes absorb every queued PR/main run (sc-13603). Well above the
    # healthy ~6-14 min warm build+test+clippy — a cold MLX-from-source rebuild
    # still fits. Only an explicit calibration+provisioning dispatch gets four
    # hours for the approximately 57 GiB public snapshot.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && ((inputs.run_memory_calibration && inputs.provision_qwen_snapshot) || (inputs.run_five_rung_reference && inputs.provision_z_image_snapshot)) && 240 || github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && 120 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
          components: clippy
      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}@github.com/SceneWorks/inference.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/SceneWorks/inference"
        run: cargo fetch --locked
      # No MACOSX_DEPLOYMENT_TARGET override: the workspace /.cargo/config.toml pins
      # 26.2, so the NAX kernels compile in and the fast path is actually built.
      - name: Build the MLX GPU worker (mlx-gen linked, NAX at 26.2)
        run: cargo build -p sceneworks-worker
      # Lint EVERY default member on macOS, not just the worker (sc-17026).
      #
      # LINT BEFORE TEST, deliberately. A step failure aborts the job, so with the tests
      # first an unrelated red test means the lint below never executes — which is
      # exactly what happened on the first run of this PR: an inherited `mlx_fit_gate`
      # failure from main (sc-17037) aborted the job and the widened lint, the whole
      # point of this change, never ran. Lint coverage that only runs when every test
      # already passes is not coverage. Clippy is also the cheaper, faster signal.
      #
      # `npm run rust:lint` — what a Mac developer runs before pushing, and what the
      # Linux `parity` lane runs — covers every default member. This step was scoped to
      # `-p sceneworks-worker`, so macOS-conditional code outside the worker was linted
      # by NO lane in the configuration it actually ships in — `parity` lints these
      # crates on Linux, and nothing linted them on a Mac. Lines naming
      # `target_os = "macos"` today: sceneworks-core 15, apps/rust-api 22,
      # sceneworks-image-quality 1. apps/rust-worker and sceneworks-mcp have none yet —
      # covering them now is what stops the first one from arriving unlinted. A
      # macOS-only unused import or dead symbol in any of them lands on a developer's
      # `rust:check` instead of in review — the sc-17007 failure class, one crate over.
      #
      # Cheap: the two steps above already built the heavy mlx-gen/MLX graph, so the
      # marginal cost is the small non-worker crates. Deliberately NOT `--workspace` —
      # default-members excludes apps/desktop (it needs the Tauri stack and staged
      # sidecar placeholders), which desktop-macos-check.yml owns instead.
      - name: Clippy (macOS default feature set, every default member)
        run: cargo clippy --all-targets -- -D warnings
      # sceneworks-memory-adapter is NOT a workspace default member, so the step above
      # cannot reach it — and this lane otherwise compiles it only inside the
      # `workflow_dispatch` calibration path below. Its Candle twin is guarded on a real
      # PR lane (windows-candle.yml:200-201, `cargo check` + `cargo test`); the MLX twin
      # was guarded on none, so a break in the authoritative MLX calibration adapter
      # surfaced only when someone dispatched a calibration run. (server-candle-linux.yml
      # also checks the Candle bin, but it is `workflow_dispatch`-only, so it is not a
      # PR guard.)
      #
      # `clippy --all-targets -- -D warnings`, not `cargo check`: the defect class this
      # story is about — a symbol left behind when its cfg'd call sites compile out — is
      # a WARNING, so a bare `check` cannot see it. This is the only place `-D warnings`
      # is ever applied to this crate on any platform or feature set. `--all-targets`
      # rather than `--bin`, so its tests are linted too; the Candle bin is skipped
      # automatically here via its `required-features`. sc-17026.
      - name: Clippy the MLX memory adapter (memory-mlx-adapter)
        run: cargo clippy -p sceneworks-memory-adapter --features mlx --all-targets -- -D warnings
      # Every default member, not just the worker — the same widening as the clippy
      # steps above and for the same reason: `npm run rust:check` runs a bare
      # `cargo test` (whole default-member set), so macOS-conditional test code in
      # sceneworks-core / rust-api / image-quality ran on NO lane. Measured on an
      # M-series Mac with the graph already built for `-p sceneworks-worker`: the added
      # members are 24 suites in ~26 s of actual test time. Still runs the NAX 16-bit
      # SDPA guard, which is this lane's original reason to exist. sc-17026.
      - name: Workspace tests incl. the NAX 16-bit SDPA guard
        run: cargo test
      # sc-17119. THE ONLY LANE THAT CAN PRODUCE capabilities.mlx.json, so it is the only place the
      # checked-in file can be checked against a real registry rather than taken on trust.
      #
      # Every other guard reads that file as a source: `verifyEngineCapabilityFacts` checks that it
      # exists, names a backend SCENEWORKS_BACKENDS declares, and carries the current
      # `inferenceRevision` -- nothing about the engine list -- and the vitest drift guard re-derives
      # the catalog from its contents. Both are satisfied by editing one line. That is not
      # hypothetical -- the file was RESTAMPED (revision line rewritten, 334 lines of content
      # untouched) through two consecutive pin bumps, 35251a88 and 06e0c5e9, because no Mac was
      # available to re-dump it and nothing could tell the difference. The restamps happened to be
      # correct; nothing proved it until this step existed.
      #
      # Cheap: the build and test steps above already built the mlx-gen graph, so this is a link plus
      # a weights-free registry walk. Dumps to a scratch dir, never over the checked-in file, so a
      # red run leaves a readable diff instead of a mutated tree.
      #
      # LAST, deliberately -- the same rule the clippy steps above are ordered by, applied to a step
      # that fires on a PREDICTABLE, routine event. A step failure aborts the job, and this one goes
      # red on exactly the pin-bump PRs where nobody re-dumped on a Mac. Placed earlier it would
      # cancel both clippy steps and `cargo test` -- and this lane is the ONLY place in CI that runs
      # `nax_guard`, so a stale facts file would cost the repo its entire NAX kernel verdict for that
      # commit, on precisely the PRs where descriptors just moved. A missing dump must not suppress
      # unrelated coverage; it is the least urgent signal in this job, so it reports last.
      #
      # When this fails after a pin bump, the fix is to commit the dump it just produced and re-run
      # `npm run gen:preview-support` from apps/web -- not to restamp the revision line.
      #
      # capabilities.candle.json had the same hole (it was restamped by the same commits); the mirror
      # could NOT be written here, because it needs the CUDA box and windows-candle.yml runs every
      # step under `shell: cmd`/`powershell` -- its own header records that `bash` there resolves to
      # the box's WSL stub, and `cmd` has no `diff`. sc-17592 closed it there instead, as a `cmd` step
      # using `git diff --no-index --exit-code`. Keep the two in sync: a change to the semantics here
      # wants the same change in windows-candle.yml's "Verify capabilities.candle.json" step.
      - name: Verify capabilities.mlx.json is a real dump, not a restamp
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cargo run -p sceneworks-worker --bin dump-engine-capabilities -- "$scratch"
          if ! diff -u config/engine-capabilities/capabilities.mlx.json \
                     "$scratch/capabilities.mlx.json"; then
            echo "::error::config/engine-capabilities/capabilities.mlx.json does not match a fresh"\
                 "dump at this pin. Re-dump it on a Mac:"\
                 "cargo run -p sceneworks-worker --bin dump-engine-capabilities,"\
                 "then (cd apps/web && npm run gen:preview-support)."
            exit 1
          fi
      - name: Validate Qwen provisioning mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RUN_MEMORY_CALIBRATION: ${{ inputs.run_memory_calibration }}
          PROVISION_QWEN_SNAPSHOT: ${{ inputs.provision_qwen_snapshot }}
        run: |
          if [[ "$PROVISION_QWEN_SNAPSHOT" == "true" && "$RUN_MEMORY_CALIBRATION" != "true" ]]; then
            echo "provision_qwen_snapshot requires run_memory_calibration=true" >&2
            exit 1
          fi
      - name: Validate Z-Image provisioning mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RUN_FIVE_RUNG_REFERENCE: ${{ inputs.run_five_rung_reference }}
          PROVISION_Z_IMAGE_SNAPSHOT: ${{ inputs.provision_z_image_snapshot }}
        run: |
          if [[ "$PROVISION_Z_IMAGE_SNAPSHOT" == "true" && "$RUN_FIVE_RUNG_REFERENCE" != "true" ]]; then
            echo "provision_z_image_snapshot requires run_five_rung_reference=true" >&2
            exit 1
          fi
      - name: Validate memory-strategy calibration identities
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration }}
        env:
          INFERENCE_REVISION: ${{ inputs.inference_revision }}
          QWEN_REPOSITORY: ${{ inputs.qwen_repository }}
          QWEN_REVISION: ${{ inputs.qwen_revision }}
          QWEN_TIER: ${{ inputs.qwen_tier }}
        run: |
          if [[ ! "$INFERENCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "inference_revision must be an exact lowercase 40-hex commit" >&2
            exit 1
          fi
          if [[ ! "$QWEN_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "qwen_revision must be an exact lowercase 40-hex artifact revision" >&2
            exit 1
          fi
          if [[ "$QWEN_REPOSITORY" != "SceneWorks/qwen-image-mlx" ]]; then
            echo "qwen_repository must be the fixed SceneWorks/qwen-image-mlx calibration artifact" >&2
            exit 1
          fi
          if [[ "$QWEN_TIER" != "bf16" && "$QWEN_TIER" != "q4" && "$QWEN_TIER" != "q8" ]]; then
            echo "qwen_tier must be one of bf16, q4, or q8" >&2
            exit 1
          fi
          PIN="$(sed -nE 's/^pub const INFERENCE_PIN: &str = "([0-9a-f]{40})";/\1/p' crates/sceneworks-memory-adapter/src/lib.rs)"
          if [[ "$PIN" != "$INFERENCE_REVISION" ]]; then
            echo "input inference_revision does not match the adapter's compiled INFERENCE_PIN" >&2
            exit 1
          fi
      - name: Validate five-rung reference identities
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        env:
          INFERENCE_REVISION: ${{ inputs.inference_revision }}
          Z_IMAGE_REPOSITORY: ${{ inputs.z_image_repository }}
          Z_IMAGE_REVISION: ${{ inputs.z_image_revision }}
        run: |
          if [[ ! "$INFERENCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "inference_revision must be an exact lowercase 40-hex commit" >&2
            exit 1
          fi
          if [[ ! "$Z_IMAGE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "z_image_revision must be an exact lowercase 40-hex artifact revision" >&2
            exit 1
          fi
          if [[ "$Z_IMAGE_REPOSITORY" != "SceneWorks/z-image-turbo-mlx" ]]; then
            echo "z_image_repository must be the fixed SceneWorks/z-image-turbo-mlx reference artifact" >&2
            exit 1
          fi
          PIN="$(sed -nE 's/^pub const INFERENCE_PIN: &str = "([0-9a-f]{40})";/\1/p' crates/sceneworks-memory-adapter/src/lib.rs)"
          if [[ "$PIN" != "$INFERENCE_REVISION" ]]; then
            echo "input inference_revision does not match the adapter's compiled INFERENCE_PIN" >&2
            exit 1
          fi
      - name: Set up runner Python 3.12 for Qwen provisioning
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration && inputs.provision_qwen_snapshot }}
        run: |
          command -v python3.12 >/dev/null
          python3.12 --version | grep -E '^Python 3\.12\.'
          python3.12 -m venv "$RUNNER_TEMP/qwen-provision-venv"
      - name: Install pinned Qwen provisioning client
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration && inputs.provision_qwen_snapshot }}
        run: |
          "$RUNNER_TEMP/qwen-provision-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input "huggingface_hub==0.36.0"
      - name: Set up runner Python 3.12 for Z-Image provisioning
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && inputs.provision_z_image_snapshot }}
        run: |
          command -v python3.12 >/dev/null
          python3.12 --version | grep -E '^Python 3\.12\.'
          python3.12 -m venv "$RUNNER_TEMP/z-image-provision-venv"
      - name: Install pinned Z-Image provisioning client
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && inputs.provision_z_image_snapshot }}
        run: |
          "$RUNNER_TEMP/z-image-provision-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input "huggingface_hub==0.36.0"
      - name: Provision exact public Qwen calibration snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration && inputs.provision_qwen_snapshot }}
        env:
          QWEN_REVISION: ${{ inputs.qwen_revision }}
          QWEN_TIER: ${{ inputs.qwen_tier }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_VERBOSITY: "error"
        run: |
          "$RUNNER_TEMP/qwen-provision-venv/bin/python" - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          huggingface_cache = os.path.join(
              os.environ["HOME"],
              ".cache",
              "huggingface",
              "hub",
          )
          application_cache = os.path.join(
              os.environ["HOME"],
              "Library",
              "Application Support",
              "SceneWorks",
              "data",
              "cache",
              "huggingface",
              "hub",
          )
          repository_cache = os.path.join(
              huggingface_cache,
              "models--SceneWorks--qwen-image-mlx",
          )
          cache_dir = (
              huggingface_cache
              if os.path.isdir(repository_cache)
              else application_cache
          )
          snapshot_download(
              repo_id="SceneWorks/qwen-image-mlx",
              repo_type="model",
              revision=os.environ["QWEN_REVISION"],
              allow_patterns=[f"{os.environ['QWEN_TIER']}/**"],
              cache_dir=cache_dir,
              token=False,
              max_workers=4,
          )
          print("Exact public Qwen calibration snapshot provisioned")
          PY
      - name: Provision exact public Z-Image reference snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference && inputs.provision_z_image_snapshot }}
        env:
          Z_IMAGE_REVISION: ${{ inputs.z_image_revision }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_VERBOSITY: "error"
        run: |
          "$RUNNER_TEMP/z-image-provision-venv/bin/python" - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="SceneWorks/z-image-turbo-mlx",
              repo_type="model",
              revision=os.environ["Z_IMAGE_REVISION"],
              allow_patterns=["q4/**"],
              cache_dir=os.path.join(os.environ["HOME"], ".cache", "huggingface", "hub"),
              token=False,
              max_workers=4,
          )
          print("Exact public Z-Image reference snapshot provisioned")
          PY
      - name: Resolve exact Qwen calibration snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration }}
        env:
          QWEN_REVISION: ${{ inputs.qwen_revision }}
          QWEN_TIER: ${{ inputs.qwen_tier }}
          QWEN_ROOT_OVERRIDE: ${{ secrets.SCENEWORKS_QWEN_IMAGE_ROOT }}
        run: |
          EXPECTED_SUFFIX="/models--SceneWorks--qwen-image-mlx/snapshots/$QWEN_REVISION/$QWEN_TIER"
          QWEN_ROOT=""
          if [[ -n "$QWEN_ROOT_OVERRIDE" && -d "$QWEN_ROOT_OVERRIDE" ]]; then
            QWEN_OVERRIDE_ROOT="$(cd "$QWEN_ROOT_OVERRIDE" && pwd -P)"
            if [[ "$QWEN_OVERRIDE_ROOT" == *"$EXPECTED_SUFFIX" ]]; then
              QWEN_ROOT="$QWEN_OVERRIDE_ROOT"
            fi
          fi
          if [[ -z "$QWEN_ROOT" ]]; then
            QWEN_HF_ROOT="$HOME/.cache/huggingface/hub/models--SceneWorks--qwen-image-mlx/snapshots/$QWEN_REVISION/$QWEN_TIER"
            QWEN_APP_ROOT="$HOME/Library/Application Support/SceneWorks/data/cache/huggingface/hub/models--SceneWorks--qwen-image-mlx/snapshots/$QWEN_REVISION/$QWEN_TIER"
            if [[ -d "$QWEN_HF_ROOT" ]]; then
              QWEN_ROOT="$QWEN_HF_ROOT"
            elif [[ -d "$QWEN_APP_ROOT" ]]; then
              QWEN_ROOT="$QWEN_APP_ROOT"
            else
              echo "the exact Qwen calibration snapshot is not available on this runner" >&2
              exit 1
            fi
          fi
          if [[ ! -d "$QWEN_ROOT" ]]; then
            echo "the exact Qwen calibration snapshot is not available on this runner" >&2
            exit 1
          fi
          QWEN_ROOT="$(cd "$QWEN_ROOT" && pwd -P)"
          if [[ "$QWEN_ROOT" != *"$EXPECTED_SUFFIX" ]]; then
            echo "the Qwen calibration root does not match the fixed repository and exact revision" >&2
            exit 1
          fi
          printf 'SCENEWORKS_QWEN_IMAGE_ROOT=%s\n' "$QWEN_ROOT" >> "$GITHUB_ENV"
      - name: Resolve exact Z-Image reference snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        env:
          Z_IMAGE_REVISION: ${{ inputs.z_image_revision }}
          Z_IMAGE_ROOT_OVERRIDE: ${{ secrets.SCENEWORKS_Z_IMAGE_ROOT }}
        run: |
          if [[ -n "$Z_IMAGE_ROOT_OVERRIDE" ]]; then
            Z_IMAGE_ROOT="$Z_IMAGE_ROOT_OVERRIDE"
          else
            Z_IMAGE_HF_ROOT="$HOME/.cache/huggingface/hub/models--SceneWorks--z-image-turbo-mlx/snapshots/$Z_IMAGE_REVISION/q4"
            Z_IMAGE_APP_ROOT="$HOME/Library/Application Support/SceneWorks/data/cache/huggingface/hub/models--SceneWorks--z-image-turbo-mlx/snapshots/$Z_IMAGE_REVISION/q4"
            if [[ -d "$Z_IMAGE_HF_ROOT" ]]; then
              Z_IMAGE_ROOT="$Z_IMAGE_HF_ROOT"
            elif [[ -d "$Z_IMAGE_APP_ROOT" ]]; then
              Z_IMAGE_ROOT="$Z_IMAGE_APP_ROOT"
            else
              echo "the exact Z-Image reference snapshot is not available on this runner" >&2
              exit 1
            fi
          fi
          Z_IMAGE_ROOT="$(cd "$Z_IMAGE_ROOT" && pwd -P)"
          EXPECTED_SUFFIX="/models--SceneWorks--z-image-turbo-mlx/snapshots/$Z_IMAGE_REVISION/q4"
          if [[ "$Z_IMAGE_ROOT" != *"$EXPECTED_SUFFIX" ]]; then
            echo "the Z-Image reference root does not match the fixed repository and exact revision" >&2
            exit 1
          fi
          printf 'SCENEWORKS_Z_IMAGE_ROOT=%s\n' "$Z_IMAGE_ROOT" >> "$GITHUB_ENV"
      - name: Check out the exact inference calibration source
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_memory_calibration || inputs.run_five_rung_reference) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_revision }}
          token: ${{ secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
          path: .calibration/inference
          persist-credentials: false
      - name: Build and run the authoritative Qwen MLX ladder calibration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration }}
        env:
          SCENEWORKS_QWEN_IMAGE_REPOSITORY: ${{ inputs.qwen_repository }}
          SCENEWORKS_QWEN_IMAGE_REVISION: ${{ inputs.qwen_revision }}
          QWEN_TIER: ${{ inputs.qwen_tier }}
        run: |
          printf '.calibration/\n' >> .git/info/exclude
          cargo build --release --locked -p sceneworks-memory-adapter \
            --features mlx --bin memory-mlx-adapter
          if [[ "$QWEN_TIER" == "bf16" ]]; then
            QWEN_SEED=15511
          else
            QWEN_SEED=16353
          fi
          node scripts/memory-calibration-harness.mjs run \
            --config config/memory-calibration-plan.json \
            --backend mlx \
            --fixture "qwen-image-${QWEN_TIER}-seed${QWEN_SEED}-step2" \
            --fresh-per-case \
            --provider-command '["target/release/memory-mlx-adapter"]' \
            --sceneworks-repo "$GITHUB_WORKSPACE" \
            --inference-repo "$GITHUB_WORKSPACE/.calibration/inference" \
            --output "$RUNNER_TEMP/memory-mlx-evidence.json"
          node scripts/memory-calibration-harness.mjs check \
            --input "$RUNNER_TEMP/memory-mlx-evidence.json"
      - name: Upload raw schema-checked MLX calibration evidence
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.run_memory_calibration }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-mlx-evidence-${{ inputs.qwen_tier }}-${{ github.run_id }}
          path: ${{ runner.temp }}/memory-mlx-evidence.json
          if-no-files-found: error
      - name: Build and run the authoritative MLX five-rung reference
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        env:
          SCENEWORKS_Z_IMAGE_REPOSITORY: ${{ inputs.z_image_repository }}
          SCENEWORKS_Z_IMAGE_REVISION: ${{ inputs.z_image_revision }}
        run: |
          printf '.calibration/\n' >> .git/info/exclude
          cargo build --release --locked -p sceneworks-memory-adapter \
            --features mlx --bin memory-mlx-adapter
          node scripts/memory-calibration-harness.mjs assess-reuse \
            --config config/memory-calibration-plan.json \
            --backend mlx \
            --fixture fresh-five-rung-z-image-q4-768-seed16402-step2 \
            --provider-command '["target/release/memory-mlx-adapter"]' \
            --output "$RUNNER_TEMP/sc-16059-mlx-reuse-assessment.json"
          node -e 'const a=require(process.argv[1]); if(a.verdict!=="unable_to_amortize") throw new Error(`unexpected MLX reuse verdict: ${a.verdict}`)' \
            "$RUNNER_TEMP/sc-16059-mlx-reuse-assessment.json"
          node scripts/memory-calibration-harness.mjs run \
            --config config/memory-calibration-plan.json \
            --backend mlx \
            --fixture fresh-five-rung-z-image-q4-768-seed16402-step2 \
            --fresh-per-case \
            --provider-command '["target/release/memory-mlx-adapter"]' \
            --sceneworks-repo "$GITHUB_WORKSPACE" \
            --inference-repo "$GITHUB_WORKSPACE/.calibration/inference" \
            --output "$RUNNER_TEMP/sc-16059-mlx-fresh.json"
          node scripts/memory-calibration-harness.mjs check \
            --input "$RUNNER_TEMP/sc-16059-mlx-fresh.json"
      - name: Upload raw schema-checked MLX five-rung reference
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.run_five_rung_reference }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc-16059-mlx-reuse-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sc-16059-mlx-fresh.json
            ${{ runner.temp }}/sc-16059-mlx-reuse-assessment.json
          if-no-files-found: error
