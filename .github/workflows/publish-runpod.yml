name: Publish RunPod image

# A release build compiles every candle CUDA provider and can consume most of a
# hosted runner's 120-minute budget. Keep this lane off pull requests and branch
# pushes; the normal Check workflow provides PR-time scaffold/parity coverage.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional safe tag (must start with manual-); defaults to manual-<short-sha>"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runpod-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/sceneworks/sceneworks-runpod
  CARGO_NET_OFFLINE: "true"

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate publication ref and derive tags
        id: publication
        shell: bash
        env:
          MANUAL_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              release_tag="${BASH_REMATCH[1]}"
            else
              echo "Refusing to publish: release refs must be exact vX.Y.Z tags." >&2
              exit 1
            fi
            {
              echo "release=true"
              echo "release_tag=${release_tag}"
              echo "manual_tag=manual-disabled"
            } >> "${GITHUB_OUTPUT}"
          else
            tag="${MANUAL_TAG_INPUT}"
            if [[ -z "${tag}" ]]; then
              tag="manual-${GITHUB_SHA:0:12}"
            fi
            if [[ ! "${tag}" =~ ^manual-[a-z0-9][a-z0-9._-]{0,119}$ ]]; then
              echo "Refusing to publish: manual tags must match ^manual-[a-z0-9][a-z0-9._-]{0,119}$." >&2
              exit 1
            fi
            {
              echo "release=false"
              echo "release_tag=0.0.0"
              echo "manual_tag=${tag}"
            } >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Install pinned scaffold dependencies
        run: npm ci --ignore-scripts
      - name: Fetch the exact public inference terminal contract
        run: |
          set -euo pipefail
          inference_root="$RUNNER_TEMP/starvector-pinned-inference"
          echo "STARVECTOR_TERMINAL_INFERENCE_TEST_ROOT=$inference_root" >> "$GITHUB_ENV"
          git init "$inference_root"
          git -C "$inference_root" remote add origin https://github.com/SceneWorks/inference.git
          git -C "$inference_root" fetch --depth=2 origin 0b084cbf46b5b4f4f561305ef116268b57eecf7f
          git -C "$inference_root" checkout --detach FETCH_HEAD
          test "$(git -C "$inference_root" rev-parse HEAD)" = 0b084cbf46b5b4f4f561305ef116268b57eecf7f

      # The scaffold suite reads real inference source at both the current pin
      # and the packaged anchor revisions, just as check.yml's parity-scaffold does.
      - name: Fetch the pinned inference source for the anchor-closure suite
        run: |
          set -euo pipefail
          pin="$(node -e 'const fs=require("fs");const m=fs.readFileSync("Cargo.toml","utf8").match(/candle-kernels\s*=\s*\{[^}]*?github\.com\/SceneWorks\/inference[^}]*?rev\s*=\s*"([0-9a-f]+)"/);if(!m)throw new Error("no inference pin");process.stdout.write(m[1])')"
          git init -q "$RUNNER_TEMP/inference"
          git -C "$RUNNER_TEMP/inference" remote add origin https://github.com/SceneWorks/inference
          git -C "$RUNNER_TEMP/inference" fetch -q --depth=1 origin "$pin"
          while read -r rev; do
            [ -n "$rev" ] || continue
            git -C "$RUNNER_TEMP/inference" fetch -q --depth=1 origin "$rev"
          done < <(node scripts/anchor-loader-closure.mjs --anchor-revisions)
          git -C "$RUNNER_TEMP/inference" checkout -q "$pin"

      # Do the cheap repository invariants before spending runner time on nvcc.
      # The Dockerfile itself performs the web + embed-web/backend-candle release
      # builds, so repeating those host compilations here would double the cost.
      - name: Validate scaffold and RunPod publication contracts
        env:
          INFERENCE_REPO: ${{ runner.temp }}/inference
        run: |
          npm run check
          npm run check:runpod:image-contract
          npm run check:ci:runpod-publish
      - name: Fetch the pinned inference release
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Guard against gen-core version skew (candle)
        run: |
          bash scripts/check-gen-core-skew.sh --self-test
          bash scripts/check-gen-core-skew.sh sceneworks-worker --features backend-candle
          bash scripts/check-gen-core-skew.sh sceneworks-rust-api --features embed-web,backend-candle

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Derive OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.publication.outputs.release_tag }},enable=${{ steps.publication.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.publication.outputs.release == 'true' }}
            type=raw,value=${{ steps.publication.outputs.manual_tag }},enable=${{ steps.publication.outputs.release != 'true' }}
      # Push one unique candidate digest, test that exact artifact, then promote
      # its AMD64 manifest to release/manual tags without rebuilding it.
      - name: Build and stage combined RunPod image
        id: build_staging
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/rust.Dockerfile
          target: runpod
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:staging-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=runpod-amd64
          cache-to: type=gha,mode=max,scope=runpod-amd64
      - name: Pull and verify immutable staged RunPod image
        id: verify_staging
        env:
          STAGED_DIGEST: ${{ steps.build_staging.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$STAGED_DIGEST"
          staged_ref="$IMAGE_NAME@$STAGED_DIGEST"
          docker pull --platform linux/amd64 "$staged_ref"
          node scripts/check-runpod-staged-image.mjs --image "$staged_ref" --revision "$GITHUB_SHA"
      - name: Build standalone candle runtime from shared stages
        id: build_candle_runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/rust.Dockerfile
          target: rust-worker-candle
          platforms: linux/amd64
          push: false
          load: true
          tags: sceneworks-candle-smoke:ci
      - name: Check standalone candle identities and bind writes
        id: smoke_candle_runtime
        timeout-minutes: 5
        env:
          SCENEWORKS_CANDLE_SMOKE_API_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build_staging.outputs.digest }}
          SCENEWORKS_CANDLE_SMOKE_WORKER_IMAGE: sceneworks-candle-smoke:ci
          SCENEWORKS_CANDLE_SMOKE_DRIVER_DIR: /usr/local/cuda/compat
        run: bash scripts/check-docker-candle-runtime.sh
      - name: Check staged combined-image Candle worker
        id: smoke_published_runtime
        timeout-minutes: 5
        env:
          SCENEWORKS_CANDLE_SMOKE_API_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build_staging.outputs.digest }}
          SCENEWORKS_CANDLE_SMOKE_WORKER_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build_staging.outputs.digest }}
          SCENEWORKS_CANDLE_SMOKE_DRIVER_DIR: /usr/local/cuda/compat
          SCENEWORKS_CANDLE_SMOKE_WORKER_ENTRYPOINT: /usr/local/bin/sceneworks-rust-worker
          SCENEWORKS_CANDLE_SMOKE_WORKER_USER: 1000:1000
        run: bash scripts/check-docker-candle-runtime.sh
      - name: Promote tested RunPod image without rebuilding
        id: promote
        if: success()
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          STAGED_DIGEST: ${{ steps.build_staging.outputs.digest }}
          PUBLISH_TAGS: ${{ steps.metadata.outputs.tags }}
          STANDALONE_SMOKE_RESULT: ${{ steps.smoke_candle_runtime.outcome }}
          PUBLISHED_SMOKE_RESULT: ${{ steps.smoke_published_runtime.outcome }}
        run: node scripts/promote-runpod-image.mjs
