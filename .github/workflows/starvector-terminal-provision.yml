name: StarVector terminal host provisioning

on:
  workflow_dispatch:
    inputs:
      inference_revision:
        description: Exact merged inference commit that produced the preflight bundle.
        required: true
        type: string
      inference_preflight_run_id:
        description: Completed SceneWorks/inference workflow run containing the full preflight bundle.
        required: true
        type: string
      inference_preflight_artifact:
        description: Artifact name containing the two inventories, four hooks, and preflight index.
        required: true
        default: starvector-terminal-preflight
        type: string
      mac_app_data_source:
        description: Absolute macOS source for existing SceneWorks-produced install receipts/app data.
        required: true
        type: string
      mac_hf_home_source:
        description: Absolute macOS source for the complete offline HF cache.
        required: true
        type: string
      windows_app_data_source:
        description: Absolute Windows source for existing SceneWorks-produced install receipts/app data.
        required: true
        type: string
      windows_hf_home_source:
        description: Absolute Windows source for the complete offline HF cache.
        required: true
        type: string
  workflow_call:
    inputs:
      inference_revision:
        required: true
        type: string
      inference_preflight_run_id:
        required: true
        type: string
      inference_preflight_artifact:
        required: true
        type: string
      mac_app_data_source:
        required: true
        type: string
      mac_hf_home_source:
        required: true
        type: string
      windows_app_data_source:
        required: true
        type: string
      windows_hf_home_source:
        required: true
        type: string
    secrets:
      INFERENCE_READ_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

env:
  # The prompt suite runs only in the Candle/CUDA tuple. Seal the provider
  # label written by that product route, not the catalog's asset adapter.
  STARVECTOR_PROMPT_PROVIDER: candle_flux
  STARVECTOR_PROMPT_MODEL: flux_schnell
  STARVECTOR_PROMPT_REVISION: bba3ae01dfd94089f173c05edd4e1a4c551f2599
  STARVECTOR_CLIP_REVISION: 1a25a446712ba5ee05982a381eed697ef9b435cf

jobs:
  provision-macos:
    runs-on: [self-hosted, macOS, ARM64, rw-starvector]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ${{ github.workspace }}/sceneworks
    env:
      STARVECTOR_TERMINAL_ROOT: /Users/Shared/SceneWorks/starvector-terminal
      STARVECTOR_TERMINAL_INFERENCE_PREFLIGHT: /Users/Shared/SceneWorks/starvector-terminal/inference-preflight/starvector-terminal-preflight.json
      STARVECTOR_INFERENCE_REVISION: ${{ inputs.inference_revision }}
      STARVECTOR_APP_DATA_SOURCE: ${{ inputs.mac_app_data_source }}
      STARVECTOR_HF_HOME_SOURCE: ${{ inputs.mac_hf_home_source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sceneworks
      - name: Check out the exact inference source input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_revision }}
          token: ${{ secrets.INFERENCE_READ_TOKEN }}
          path: inference-source
      - name: Download the complete inference preflight artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: SceneWorks/inference
          run-id: ${{ inputs.inference_preflight_run_id }}
          github-token: ${{ secrets.INFERENCE_READ_TOKEN }}
          name: ${{ inputs.inference_preflight_artifact }}
          path: ${{ runner.temp }}/starvector-preflight
      - name: Publish exact inference and preflight inputs
        run: |
          node scripts/starvector-terminal-provision.mjs checkout "$GITHUB_WORKSPACE/inference-source" "$STARVECTOR_TERMINAL_ROOT/inference" "$STARVECTOR_INFERENCE_REVISION"
          node scripts/starvector-terminal-provision.mjs preflight "$RUNNER_TEMP/starvector-preflight" "$STARVECTOR_TERMINAL_ROOT/inference-preflight" "$STARVECTOR_INFERENCE_REVISION"
      - name: Assemble durable model and product-service closure
        run: |
          node scripts/starvector-terminal-provision.mjs weights "$STARVECTOR_TERMINAL_ROOT" "$STARVECTOR_APP_DATA_SOURCE" "$STARVECTOR_HF_HOME_SOURCE" "$STARVECTOR_PROMPT_PROVIDER" "$STARVECTOR_PROMPT_MODEL" "$STARVECTOR_PROMPT_REVISION"
      - name: Select supported existing CPython 3.12 arm64 for terminal metrics
        id: metrics-python
        run: |
          bootstrap_python="$(node scripts/select-starvector-macos-python.mjs select /opt/homebrew/bin/python3.12 /usr/local/bin/python3.12)"
          printf 'python-path=%s\n' "$bootstrap_python" >> "$GITHUB_OUTPUT"
      - name: Provision pinned metric runtime and official checkpoints
        env:
          STARVECTOR_METRICS_BOOTSTRAP_PYTHON: ${{ steps.metrics-python.outputs.python-path }}
        run: |
          if ! node scripts/select-starvector-macos-python.mjs verify-venv "$STARVECTOR_METRICS_BOOTSTRAP_PYTHON" "$STARVECTOR_TERMINAL_ROOT/metrics/bin/python"; then
            node scripts/select-starvector-macos-python.mjs remove-metrics-tree "$STARVECTOR_TERMINAL_ROOT/metrics" /Users/Shared/SceneWorks/starvector-terminal/metrics
            "$STARVECTOR_METRICS_BOOTSTRAP_PYTHON" -m venv "$STARVECTOR_TERMINAL_ROOT/metrics"
          fi
          node scripts/select-starvector-macos-python.mjs verify-venv "$STARVECTOR_METRICS_BOOTSTRAP_PYTHON" "$STARVECTOR_TERMINAL_ROOT/metrics/bin/python"
          "$STARVECTOR_TERMINAL_ROOT/metrics/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --retries 5 --timeout 60 numpy==2.2.6 scikit-image==0.25.2 lpips==0.1.4 torch==2.7.0 torchvision==0.22.0 Pillow==11.3.0 open-clip-torch==3.1.0
          node scripts/starvector-terminal-provision.mjs download https://raw.githubusercontent.com/richzhang/PerceptualSimilarity/master/lpips/weights/v0.1/alex.pth "$STARVECTOR_TERMINAL_ROOT/metrics/checkpoints/lpips-v0.1-alex.pth" df73285e35b22355a2df87cdb6b70b343713b667eddbda73e1977e0c860835c0
          node scripts/starvector-terminal-provision.mjs download https://download.pytorch.org/models/alexnet-owt-7be5be79.pth "$STARVECTOR_TERMINAL_ROOT/metrics/checkpoints/alexnet-owt-7be5be79.pth" 7be5be791159472b1fbf3c69796f7cb30dca7ad8466c2df70058c37116cdee02
          node scripts/starvector-terminal-provision.mjs download https://huggingface.co/laion/CLIP-ViT-B-32-laion2B-s34B-b79K/resolve/1a25a446712ba5ee05982a381eed697ef9b435cf/open_clip_pytorch_model.bin "$STARVECTOR_TERMINAL_ROOT/metrics/checkpoints/open_clip_pytorch_model.bin" 1bd3c7172de5b207ceac554f5ab5266166f3b9baccc9af5989bc801016d080ad
          node scripts/starvector-terminal-provision.mjs metrics "$GITHUB_WORKSPACE/sceneworks" "$STARVECTOR_TERMINAL_ROOT/metrics" "$STARVECTOR_TERMINAL_ROOT/metrics/bin/python" "$STARVECTOR_CLIP_REVISION"
      - name: Materialize the exact pinned 120-row corpus
        run: |
          mkdir -p "$RUNNER_TEMP/starvector-parquet"
          node scripts/starvector-terminal-provision.mjs download https://huggingface.co/datasets/starvector/svg-stack-simple/resolve/1d2a96a17cc0c4c1f337b7631adc8c5885bc72ea/data/test-00000-of-00001.parquet "$RUNNER_TEMP/starvector-parquet/source-0.parquet" ed6b73f3c92277e81b244c6ab3071d0831c4820178aed072182246bab402b004
          node scripts/starvector-terminal-provision.mjs download https://huggingface.co/datasets/starvector/svg-icons-simple/resolve/e1918a27ba6649e856e5db0710d8a6c7046762c1/data/test-00000-of-00001.parquet "$RUNNER_TEMP/starvector-parquet/source-1.parquet" 02cd88a8b8f5234975024a948c80a19f7a83092247685b1bef63c3db0b957227
          node scripts/starvector-terminal-provision.mjs download https://huggingface.co/datasets/starvector/svg-emoji-simple/resolve/fa75b3617872ae57e6f3cb450aee65dbccbd69e0/data/test-00000-of-00001.parquet "$RUNNER_TEMP/starvector-parquet/source-2.parquet" be192dfce16b45605df62eebffeb00db2f0b80e6f4919e10cea68c311af97807
          node scripts/starvector-terminal-provision.mjs download https://huggingface.co/datasets/starvector/svg-fonts-simple/resolve/453c739ea13ad2685127f721c333f14d99485299/data/test-00000-of-00001.parquet "$RUNNER_TEMP/starvector-parquet/source-3.parquet" 86db32ae45896a18b938baba088b69d797ae2d5f6d3d79742753a0e2ea89d86d
          if [ ! -e "$STARVECTOR_TERMINAL_ROOT/corpora/starvector-terminal-v1" ]; then
            cargo run --release --locked -p sceneworks-worker --bin starvector_terminal_corpus -- "$STARVECTOR_TERMINAL_ROOT/inference/release/starvector-terminal-corpus-v1.json" "$RUNNER_TEMP/starvector-parquet" "$STARVECTOR_TERMINAL_ROOT/corpora/starvector-terminal-v1" "$STARVECTOR_INFERENCE_REVISION" "$STARVECTOR_PROMPT_PROVIDER" "$STARVECTOR_PROMPT_MODEL" "$STARVECTOR_PROMPT_REVISION" "$(shasum -a 256 "$STARVECTOR_TERMINAL_ROOT/weights/inventories/prompt-raster-inventory-v1.json" | cut -d ' ' -f 1)"
          fi
      - name: Read-only readiness validation
        if: ${{ always() }}
        run: node scripts/starvector-terminal-readiness.mjs "$GITHUB_WORKSPACE/sceneworks" release/starvector-terminal-campaign-v1.json "$STARVECTOR_TERMINAL_ROOT/inference" "$STARVECTOR_TERMINAL_ROOT/weights" "$STARVECTOR_TERMINAL_ROOT/metrics" "$STARVECTOR_TERMINAL_ROOT/metrics/bin/python" "$STARVECTOR_TERMINAL_ROOT/corpora/starvector-terminal-v1" "$RUNNER_TEMP/starvector-terminal-provision/macos.json"
      - name: Upload macOS provisioning readiness even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starvector-terminal-provision-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/starvector-terminal-provision/macos.json
          if-no-files-found: warn

  provision-windows:
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ${{ github.workspace }}\sceneworks
    env:
      STARVECTOR_TERMINAL_ROOT: D:\sceneworks-terminal
      STARVECTOR_TERMINAL_INFERENCE_PREFLIGHT: D:\sceneworks-terminal\inference-preflight\starvector-terminal-preflight.json
      STARVECTOR_INFERENCE_REVISION: ${{ inputs.inference_revision }}
      STARVECTOR_APP_DATA_SOURCE: ${{ inputs.windows_app_data_source }}
      STARVECTOR_HF_HOME_SOURCE: ${{ inputs.windows_hf_home_source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sceneworks
      - name: Check out the exact inference source input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ inputs.inference_revision }}
          token: ${{ secrets.INFERENCE_READ_TOKEN }}
          path: inference-source
      - name: Download the complete inference preflight artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: SceneWorks/inference
          run-id: ${{ inputs.inference_preflight_run_id }}
          github-token: ${{ secrets.INFERENCE_READ_TOKEN }}
          name: ${{ inputs.inference_preflight_artifact }}
          path: ${{ runner.temp }}\starvector-preflight
      - name: Publish exact inference, preflight, and model closure
        shell: powershell
        run: |
          node scripts/starvector-terminal-provision.mjs checkout "$env:GITHUB_WORKSPACE\inference-source" "$env:STARVECTOR_TERMINAL_ROOT\inference" $env:STARVECTOR_INFERENCE_REVISION
          node scripts/starvector-terminal-provision.mjs preflight "$env:RUNNER_TEMP\starvector-preflight" "$env:STARVECTOR_TERMINAL_ROOT\inference-preflight" $env:STARVECTOR_INFERENCE_REVISION
          node scripts/starvector-terminal-provision.mjs weights $env:STARVECTOR_TERMINAL_ROOT $env:STARVECTOR_APP_DATA_SOURCE $env:STARVECTOR_HF_HOME_SOURCE $env:STARVECTOR_PROMPT_PROVIDER $env:STARVECTOR_PROMPT_MODEL $env:STARVECTOR_PROMPT_REVISION
      - name: Set up supported CPython 3.12 x64 for terminal metrics
        id: metrics-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64
          check-latest: false
          update-environment: false
      - name: Provision pinned metric runtime and official checkpoints
        shell: powershell
        env:
          STARVECTOR_METRICS_BOOTSTRAP_PYTHON: ${{ steps.metrics-python.outputs.python-path }}
        run: |
          . (Join-Path $PWD 'scripts\select-starvector-windows-python.ps1')
          $bootstrap = Select-StarVectorBootstrapPython -CandidatePaths @($env:STARVECTOR_METRICS_BOOTSTRAP_PYTHON)
          $bootstrapPython = $bootstrap.Executable
          $bootstrapIdentity = $bootstrap.Identity
          $metricsRoot = Join-Path $env:STARVECTOR_TERMINAL_ROOT 'metrics'
          $metricsPython = Join-Path $metricsRoot 'Scripts\python.exe'
          $rebuildMetricsVenv = -not (Test-Path $metricsPython -PathType Leaf)
          if (-not $rebuildMetricsVenv) {
            $existingProbe = Invoke-StarVectorPythonIdentityProbe -Executable $metricsPython -IncludeBaseExecutable
            try { $existingIdentity = $existingProbe.StdOut | ConvertFrom-Json -ErrorAction Stop } catch { $existingIdentity = $null }
            $existingBasePython = if ($existingIdentity) { Resolve-StarVectorWindowsExecutable $existingIdentity.base_executable } else { $null }
            $rebuildMetricsVenv = $existingProbe.ExitCode -ne 0 -or -not $existingIdentity -or -not $existingBasePython -or -not [StringComparer]::OrdinalIgnoreCase.Equals($bootstrapPython, $existingBasePython) -or $existingIdentity.version.Count -ne 3 -or [int]$existingIdentity.version[0] -ne [int]$bootstrapIdentity.version[0] -or [int]$existingIdentity.version[1] -ne [int]$bootstrapIdentity.version[1] -or [int]$existingIdentity.version[2] -ne [int]$bootstrapIdentity.version[2] -or [string]$existingIdentity.implementation -cne 'CPython' -or [string]$existingIdentity.architecture -cne 'AMD64' -or [int]$existingIdentity.pointer_bits -ne 64
          }
          if ($rebuildMetricsVenv) {
            Remove-StarVectorWindowsDirectoryTree -TargetRoot $metricsRoot -AllowedRoot 'D:\sceneworks-terminal\metrics'
            & $bootstrapPython -m venv $metricsRoot
            if ($LASTEXITCODE -ne 0) { throw 'failed to create the terminal metrics venv with the selected Python interpreter' }
          }
          if (-not (Test-Path $metricsPython -PathType Leaf)) { throw 'terminal metrics venv did not publish Scripts\python.exe' }
          $venvProbe = Invoke-StarVectorPythonIdentityProbe -Executable $metricsPython -IncludeBaseExecutable
          if ($venvProbe.ExitCode -ne 0) { throw 'terminal metrics venv Python identity probe failed' }
          try { $venvIdentity = $venvProbe.StdOut | ConvertFrom-Json -ErrorAction Stop } catch { throw 'terminal metrics venv Python identity is not valid JSON' }
          $expectedMetricsPython = Resolve-StarVectorWindowsExecutable $metricsPython
          $observedMetricsPython = Resolve-StarVectorWindowsExecutable $venvIdentity.executable
          $observedBasePython = Resolve-StarVectorWindowsExecutable $venvIdentity.base_executable
          if (-not $expectedMetricsPython -or -not $observedMetricsPython -or -not $observedBasePython -or -not [StringComparer]::OrdinalIgnoreCase.Equals($expectedMetricsPython, $observedMetricsPython) -or -not [StringComparer]::OrdinalIgnoreCase.Equals($bootstrapPython, $observedBasePython) -or $venvIdentity.version.Count -ne 3 -or [int]$venvIdentity.version[0] -ne [int]$bootstrapIdentity.version[0] -or [int]$venvIdentity.version[1] -ne [int]$bootstrapIdentity.version[1] -or [int]$venvIdentity.version[2] -ne [int]$bootstrapIdentity.version[2] -or [string]$venvIdentity.implementation -cne 'CPython' -or [string]$venvIdentity.architecture -cne 'AMD64' -or [int]$venvIdentity.pointer_bits -ne 64) { throw 'terminal metrics venv is not bound to the selected exact CPython 3.12 x64 interpreter' }
          & $metricsPython -m pip install --disable-pip-version-check --only-binary=:all: --retries 5 --timeout 60 numpy==2.2.6 scikit-image==0.25.2 lpips==0.1.4 torch==2.7.0 torchvision==0.22.0 Pillow==11.3.0 open-clip-torch==3.1.0
          if ($LASTEXITCODE -ne 0) { throw 'failed to install the pinned terminal metrics package closure' }
          node scripts/starvector-terminal-provision.mjs download https://raw.githubusercontent.com/richzhang/PerceptualSimilarity/master/lpips/weights/v0.1/alex.pth "$env:STARVECTOR_TERMINAL_ROOT\metrics\checkpoints\lpips-v0.1-alex.pth" df73285e35b22355a2df87cdb6b70b343713b667eddbda73e1977e0c860835c0
          node scripts/starvector-terminal-provision.mjs download https://download.pytorch.org/models/alexnet-owt-7be5be79.pth "$env:STARVECTOR_TERMINAL_ROOT\metrics\checkpoints\alexnet-owt-7be5be79.pth" 7be5be791159472b1fbf3c69796f7cb30dca7ad8466c2df70058c37116cdee02
          node scripts/starvector-terminal-provision.mjs download https://huggingface.co/laion/CLIP-ViT-B-32-laion2B-s34B-b79K/resolve/1a25a446712ba5ee05982a381eed697ef9b435cf/open_clip_pytorch_model.bin "$env:STARVECTOR_TERMINAL_ROOT\metrics\checkpoints\open_clip_pytorch_model.bin" 1bd3c7172de5b207ceac554f5ab5266166f3b9baccc9af5989bc801016d080ad
          node scripts/starvector-terminal-provision.mjs metrics "$env:GITHUB_WORKSPACE\sceneworks" $metricsRoot $metricsPython $env:STARVECTOR_CLIP_REVISION
      - name: Materialize the exact pinned 120-row corpus
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\starvector-parquet" | Out-Null
          node scripts/starvector-terminal-provision.mjs download https://huggingface.co/datasets/starvector/svg-stack-simple/resolve/1d2a96a17cc0c4c1f337b7631adc8c5885bc72ea/data/test-00000-of-00001.parquet "$env:RUNNER_TEMP\starvector-parquet\source-0.parquet" ed6b73f3c92277e81b244c6ab3071d0831c4820178aed072182246bab402b004
          node scripts/starvector-terminal-provision.mjs download https://huggingface.co/datasets/starvector/svg-icons-simple/resolve/e1918a27ba6649e856e5db0710d8a6c7046762c1/data/test-00000-of-00001.parquet "$env:RUNNER_TEMP\starvector-parquet\source-1.parquet" 02cd88a8b8f5234975024a948c80a19f7a83092247685b1bef63c3db0b957227
          node scripts/starvector-terminal-provision.mjs download https://huggingface.co/datasets/starvector/svg-emoji-simple/resolve/fa75b3617872ae57e6f3cb450aee65dbccbd69e0/data/test-00000-of-00001.parquet "$env:RUNNER_TEMP\starvector-parquet\source-2.parquet" be192dfce16b45605df62eebffeb00db2f0b80e6f4919e10cea68c311af97807
          node scripts/starvector-terminal-provision.mjs download https://huggingface.co/datasets/starvector/svg-fonts-simple/resolve/453c739ea13ad2685127f721c333f14d99485299/data/test-00000-of-00001.parquet "$env:RUNNER_TEMP\starvector-parquet\source-3.parquet" 86db32ae45896a18b938baba088b69d797ae2d5f6d3d79742753a0e2ea89d86d
          if (-not (Test-Path "$env:STARVECTOR_TERMINAL_ROOT\corpora\starvector-terminal-v1")) {
            $inventory = (Get-FileHash -Algorithm SHA256 "$env:STARVECTOR_TERMINAL_ROOT\weights\inventories\prompt-raster-inventory-v1.json").Hash.ToLowerInvariant()
            # The persistent runner exports sccache through RUSTC_WRAPPER. Compile this
            # deterministic provisioning artifact directly so stale daemon state cannot abort it.
            Remove-Item Env:RUSTC_WRAPPER -ErrorAction SilentlyContinue
            cargo run --release --locked -p sceneworks-worker --bin starvector_terminal_corpus -- "$env:STARVECTOR_TERMINAL_ROOT\inference\release\starvector-terminal-corpus-v1.json" "$env:RUNNER_TEMP\starvector-parquet" "$env:STARVECTOR_TERMINAL_ROOT\corpora\starvector-terminal-v1" $env:STARVECTOR_INFERENCE_REVISION $env:STARVECTOR_PROMPT_PROVIDER $env:STARVECTOR_PROMPT_MODEL $env:STARVECTOR_PROMPT_REVISION $inventory
          }
      - name: Read-only readiness validation
        if: ${{ always() }}
        shell: powershell
        run: node scripts/starvector-terminal-readiness.mjs "$env:GITHUB_WORKSPACE\sceneworks" release/starvector-terminal-campaign-v1.json "$env:STARVECTOR_TERMINAL_ROOT\inference" "$env:STARVECTOR_TERMINAL_ROOT\weights" "$env:STARVECTOR_TERMINAL_ROOT\metrics" "$env:STARVECTOR_TERMINAL_ROOT\metrics\Scripts\python.exe" "$env:STARVECTOR_TERMINAL_ROOT\corpora\starvector-terminal-v1" "$env:RUNNER_TEMP\starvector-terminal-provision\windows.json"
      - name: Upload Windows provisioning readiness even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starvector-terminal-provision-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\starvector-terminal-provision\windows.json
          if-no-files-found: warn
