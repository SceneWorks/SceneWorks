name: Mac runner storage maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, macOS, ARM64, rw-krea]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect storage prerequisites without model execution
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          def command(args):
              try:
                  p=subprocess.run(args,capture_output=True,text=True,timeout=8)
                  return {'code':p.returncode,'stdout':p.stdout.strip(),'stderr':p.stderr.strip()}
              except Exception as e:return {'error':str(e)}
          home=pathlib.Path.home() # dev-host: allow-path inspect installed tools/config only; no scratch on the system volume
          runner=pathlib.Path(os.environ['RUNNER_WORKSPACE']).parent.parent
          config={}
          if (runner/'.env').is_file():
              for line in (runner/'.env').read_text().splitlines():
                  k,sep,v=line.partition('=')
                  if k in ('DEV_HOST_ROOT','DEV_HOST_BIN','ACTIONS_RUNNER_HOOK_JOB_STARTED'):config[k]=v
          mounts=command(['/sbin/mount'])
          mount_points=[]
          for line in mounts.get('stdout','').splitlines():
              match=re.search(r' on (.+) \(([^,)]+)',line)
              if match:mount_points.append({'path':match[1],'type':match[2]})
          tools={}
          for tool in (home/'.local/bin/dev-host',home/'.local/share/dev-host/job-started.sh'):
              tools[str(tool)]={'exists':tool.exists()}
              if tool.name=='dev-host' and tool.is_file():tools[str(tool)]['version']=command([str(tool),'--version'])
          print(json.dumps({'runner':os.environ['RUNNER_NAME'],'runner_root':str(runner),'process_config':{k:os.environ.get(k) for k in ('DEV_HOST_ROOT','DEV_HOST_BIN','ACTIONS_RUNNER_HOOK_JOB_STARTED')},'saved_config':config,'mounts':mount_points,'tools':tools},indent=2))
          PY
      - name: Install and persist verified managed storage
        run: python3 scripts/ci/repair-mac-runner-storage.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-storage-repair
          path: storage-repair.json
          if-no-files-found: error
