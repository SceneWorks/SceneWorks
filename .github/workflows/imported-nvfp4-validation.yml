name: Mac runner storage maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: inspect
        options: [inspect, repair, filesystem]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, macOS, ARM64, rw-krea]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect storage prerequisites without model execution
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          def command(args):
              try:
                  p=subprocess.run(args,capture_output=True,text=True,timeout=8)
                  return {'code':p.returncode,'stdout':p.stdout.strip(),'stderr':p.stderr.strip()}
              except Exception as e:return {'error':str(e)}
          home=pathlib.Path.home() # dev-host: allow-path inspect installed tools/config only; no scratch on the system volume
          runner=pathlib.Path(os.environ['RUNNER_WORKSPACE']).parent.parent
          config={}
          if (runner/'.env').is_file():
              for line in (runner/'.env').read_text().splitlines():
                  k,sep,v=line.partition('=')
                  if k in ('DEV_HOST_ROOT','DEV_HOST_BIN','ACTIONS_RUNNER_HOOK_JOB_STARTED'):config[k]=v
          mounts=command(['/sbin/mount'])
          mount_points=[]
          for line in mounts.get('stdout','').splitlines():
              match=re.search(r' on (.+) \(([^,)]+)',line)
              if match:mount_points.append({'path':match[1],'type':match[2]})
          tools={}
          for tool in (home/'.local/bin/dev-host',home/'.local/share/dev-host/job-started.sh'):
              tools[str(tool)]={'exists':tool.exists()}
              if tool.name=='dev-host' and tool.is_file():tools[str(tool)]['version']=command([str(tool),'--version'])
          print(json.dumps({'runner':os.environ['RUNNER_NAME'],'runner_root':str(runner),'process_config':{k:os.environ.get(k) for k in ('DEV_HOST_ROOT','DEV_HOST_BIN','ACTIONS_RUNNER_HOOK_JOB_STARTED')},'saved_config':config,'mounts':mount_points,'tools':tools},indent=2))
          for task in ('d09e5df2',):
              folder=pathlib.Path('/Volumes/Work/dev-host/hosts/Michael-MBP/t')/task # dev-host: allow-path this task's verified repair receipt
              for leaf in ('storage-repair.json','restart.log'):
                  path=folder/leaf
                  if path.is_file():print(leaf,path.read_text()[-8000:])
          print('RUNNER PROCESSES')
          p=command(['/bin/ps','-axo','pid=,ppid=,lstart=,comm='])
          for line in p.get('stdout','').splitlines():
              if 'Runner.Listener' in line or 'Runner.Worker' in line or 'runsvc.sh' in line:print(line)
          print('SERVICE STATUS')
          p=command(['/bin/launchctl','print',f'gui/{os.getuid()}/actions.runner.SceneWorks.nax-macos-2'])
          print('exit',p.get('code'))
          for line in p.get('stdout','').splitlines():
              if any(line.strip().startswith(k) for k in ('pid =','state =','program =','path =','working directory =')):print(line)
          PY
      - name: Verify file and directory flush semantics in owned managed storage
        if: ${{ inputs.mode == 'filesystem' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import fcntl,json,os,pathlib,subprocess,tempfile
          binary=pathlib.Path.home()/'.local/bin/dev-host' # dev-host: allow-path installed allocator
          text=subprocess.check_output([str(binary),'env','--format','github','--project','SceneWorks','--worktree',os.environ['GITHUB_WORKSPACE'],'--session','fsync-'+os.environ['GITHUB_RUN_ID']],text=True)
          assigned=dict(line.split('=',1) for line in text.splitlines() if '=' in line)
          with tempfile.TemporaryDirectory(dir=assigned['TMPDIR']) as folder:
              path=pathlib.Path(folder)/'file'
              path.write_bytes(b'flush probe')
              for kind,target in [('file',path),('directory',path.parent)]:
                  fd=os.open(target,os.O_RDONLY)
                  try:
                      for operation,call in [('fsync',lambda:os.fsync(fd)),('fullfsync',lambda:fcntl.fcntl(fd,getattr(fcntl,'F_FULLFSYNC',51)))]:
                          try:call();result='success'
                          except OSError as e:result={'errno':e.errno,'error':e.strerror}
                          print(json.dumps({'kind':kind,'operation':operation,'result':result}))
                  finally:os.close(fd)
          PY
      - name: Install and persist verified managed storage
        if: ${{ inputs.mode == 'repair' }}
        run: python3 scripts/ci/repair-mac-runner-storage.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ inputs.mode == 'repair' }}
        with:
          name: mac-storage-repair
          path: storage-repair.json
          if-no-files-found: error
