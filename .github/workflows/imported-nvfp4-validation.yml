name: Imported checkpoint native validation

# Real model inference is opt-in, never ordinary PR/main CI.
on:
  workflow_dispatch:
    inputs:
      format:
        description: Imported checkpoint formats to execute
        type: choice
        default: nvfp4
        options: [nvfp4, fp8, convrot, all]

permissions:
  contents: read

jobs:
  imported-checkpoint-worker-smoke:
    # Preserve every dispatched request; the physical UUID guard owns exclusion.
    concurrency:
      group: imported-nvfp4-proof-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: 300
    defaults:
      run:
        working-directory: sceneworks
    env:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: "GPU-b1a31911-c7b4-2901-3d8b-9a62e228bfc0"
      SCENEWORKS_GPU_ID: "0"
      CUDA_COMPUTE_CAP: "120"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      HF_HUB_CACHE: 'E:\huggingface\hub'
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SHARED_FORMAT_PROFILE: ${{ inputs.format }}
      SHARED_FORMAT_INFERENCE_ROOT: ${{ github.workspace }}/inference
      SCENEWORKS_SCALAR_FP8_CHECKPOINT: 'C:\Users\Michael\AppData\Roaming\SceneWorks\data\models\imports\muse_fp8\Muse__By__Stable__Yogi__Krea2__V4.0__Extended__CIV__fp8-scaled__C86.safetensors'
      SCENEWORKS_CONVROT_CHECKPOINT: 'C:\Users\Michael\AppData\Roaming\SceneWorks\data\models\imports\muse_int8\Muse__By__Stable__Yogi__Krea2__V4.0__Extended__CIV__INT8-ConvRot__C86.safetensors'
      SCENEWORKS_NVFP4_CHECKPOINT: 'E:\huggingface\hub\models--Comfy-Org--Krea-2\snapshots\952f49d49653cb42e7d6cf7cbfad74738073ec7d\diffusion_models\krea2_turbo_nvfp4.safetensors'
      SCENEWORKS_IMPORTED_FP8_ADAPTER: 'C:\Users\Michael\AppData\Roaming\SceneWorks\data\projects\training-tests.sceneworks\loras\imports\krea_2_mova\nova_lora-step003500.safetensors'
      SCENEWORKS_IMPORTED_SDXL_FP8_CHECKPOINT: 'E:\huggingface\hub\models--icefog72--IceBlubery-SDXL-FP8\snapshots\2c477db63dc95a8b93cfb6197b7596495f6593e1\IceBlubery-SDXL-FP8.safetensors'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sceneworks
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check proof refusal and receipt parsing without model execution
        run: node --test scripts/ci/imported-shared-format-proof.test.mjs scripts/ci/imported-shared-format-h3-proof.test.mjs
      - uses: ./sceneworks/.github/actions/prepare-rust-runner
        with:
          workspace-directory: sceneworks
      - name: Prepare the supported persistent Cargo cache
        shell: powershell
        run: |
          node scripts/prepare-windows-flash-prebuilt.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Cargo cache selection failed' }
          Add-Content -Path $env:GITHUB_ENV -Value 'RUSTC_WRAPPER='
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "MODEL_PROOF_OUTPUT_DIR=$env:RUNNER_TEMP\shared-format-proof-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Add-Content -Path $env:GITHUB_ENV -Value "SCENEWORKS_IMPORTED_FP8_CHECKPOINT=$env:SCENEWORKS_SCALAR_FP8_CHECKPOINT"
          Add-Content -Path $env:GITHUB_ENV -Value "SCENEWORKS_IMPORTED_CONVROT_CHECKPOINT=$env:SCENEWORKS_CONVROT_CHECKPOINT"
      - name: Fetch the exact pinned dependencies
        run: cargo fetch --locked
      - name: Read the paired inference revision
        id: paired
        shell: powershell
        run: |
          $pin = node --input-type=module -e "import {readFileSync} from 'node:fs'; import {lockedInferenceRevision} from './scripts/select-windows-cargo-cache.mjs'; console.log(lockedInferenceRevision(readFileSync('Cargo.lock','utf8')));"
          if ($LASTEXITCODE -ne 0) { throw 'cannot read the locked inference revision' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "revision=$pin"
      - name: Check out the paired inference source for the H3 product proof
        if: ${{ inputs.format == 'convrot' || inputs.format == 'all' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SceneWorks/inference
          ref: ${{ steps.paired.outputs.revision }}
          token: ${{ secrets.INFERENCE_READ_TOKEN || secrets.SCENEWORKS_INFERENCE_READ_TOKEN || github.token }}
          path: inference
          fetch-depth: 0
          persist-credentials: false
      - name: Classify actual headers and plans before native compilation
        run: cargo test --locked -p sceneworks-core --lib base_weights::tests::real_fixed_source_precision_headers -- --exact --ignored --nocapture
      - name: Compile the native worker validation binary without execution
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          cargo test --locked -p sceneworks-worker --lib --features backend-candle --release --no-run --message-format=json > "%RUNNER_TEMP%\shared-format-build.jsonl"
          if errorlevel 1 exit /b 1
      - name: Select the actual compiled libtest binary
        shell: powershell
        run: |
          $artifacts = Get-Content "$env:RUNNER_TEMP\shared-format-build.jsonl" | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'sceneworks_worker' -and $_.profile.test -and $_.executable }
          if (@($artifacts).Count -ne 1) { throw 'expected one compiled native worker test binary' }
          $listing = & $artifacts.executable --list
          foreach ($test in @('imported_scalar_fp8_worker_gpu_smoke', 'imported_sdxl_fp8_worker_gpu_smoke', 'imported_convrot_worker_gpu_smoke', 'imported_native_nvfp4_worker_gpu_smoke')) {
            if (@($listing | Where-Object { $_ -eq "imported_comfy_quant_gpu_smoke::${test}: test" }).Count -ne 1) { throw "missing exact compiled case $test" }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "SHARED_FORMAT_TEST_BINARY=$($artifacts.executable)"
      - name: Execute completed native requests under the existing physical GPU0 guard
        shell: powershell
        run: python -I scripts/ci/windows_cuda_execution.py --actor imported-shared-format --budget-minutes 120 --physical-indices 0 --require-physical-index 0 --min-free-mib 49152 -- node scripts/ci/imported-shared-format-proof.mjs
      - name: Execute the second ConvRot architecture through normal import and completed AV
        if: ${{ inputs.format == 'convrot' || inputs.format == 'all' }}
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set NVCC_CCBIN=%VCToolsInstallDir%bin\Hostx64\x64
          python -I scripts/ci/windows_cuda_execution.py --actor imported-shared-format-h3 --budget-minutes 150 --physical-indices 0 --require-physical-index 0 --min-free-mib 49152 -- node scripts/ci/imported-shared-format-h3-proof.mjs
      - name: Retain bounded generated outputs, receipts and physical resource evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imported-shared-format-${{ inputs.format }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MODEL_PROOF_OUTPUT_DIR }}
            ${{ env.MODEL_PROOF_OUTPUT_DIR }}-h3/cuda.reduced.real-independent-fl2va
            ${{ env.MODEL_PROOF_OUTPUT_DIR }}-h3/plan.json
            ${{ env.MODEL_PROOF_OUTPUT_DIR }}-h3/native-materialization.json
            ${{ runner.temp }}/sceneworks-cuda-execution-${{ github.run_id }}-${{ github.run_attempt }}-imported-shared-format/resource-receipt.json
            ${{ runner.temp }}/sceneworks-cuda-execution-${{ github.run_id }}-${{ github.run_attempt }}-imported-shared-format-h3/resource-receipt.json
          if-no-files-found: error
