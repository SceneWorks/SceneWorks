[package]
name = "sceneworks-rust-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
# A second binary (`film-harness`, sc-22710) lives beside the API; keep `cargo run -p
# sceneworks-rust-api` resolving to the API itself.
default-run = "sceneworks-rust-api"

[dependencies]
axum = { workspace = true, features = ["multipart"] }
base64 = { workspace = true }
fs2 = { workspace = true }
futures-util = { workspace = true, default-features = true }
glob = { workspace = true }
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
image = { workspace = true }
parking_lot = { workspace = true }
mime_guess = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"] }
rust-embed = { version = "8", features = ["debug-embed"], optional = true }
sceneworks-core = { path = "../../crates/sceneworks-core" }
# Tier-0 dataset-quality pixel extraction for the readiness endpoint (sc-6533). GPU-free
# (image/imageproc/image_hasher), so it does not add to the worker/MLX build surface.
sceneworks-image-quality = { path = "../../crates/sceneworks-image-quality" }
# MCP server (epic 10231, sc-10233): the streamable-HTTP tower service nested at
# `/mcp` inside create_app_with_state, behind the same access_control middleware
# as the /api/v1 routes.
sceneworks-mcp = { path = "../../crates/sceneworks-mcp" }
sceneworks-worker = { path = "../../crates/sceneworks-worker" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
# Catalog result materialization owns a temporary staging directory until publication.
# Tests reuse the same RAII directory dependency.
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"], default-features = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = { workspace = true }
# Move deleted LoRA/model artifacts to the OS trash (recoverable) rather than unlinking them.
trash = { workspace = true }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "cors"] }
tower = { workspace = true, features = ["limit"] }
uuid = { workspace = true }

# Embed the built apps/web/dist bundle into the binary and serve it with SPA
# fallback. Off by default (server/test builds need no web build); the desktop
# release pipeline runs `npm --prefix apps/web run build` then enables this.
[features]
embed-web = ["dep:rust-embed", "dep:mime_guess"]
# Opt-in passthrough to sceneworks-worker's candle (Windows/CUDA) backend so the
# desktop sidecar (this binary) can be built candle-enabled — `--features
# embed-web,backend-candle`. Off by default: the plain desktop/server build (no
# CUDA toolkit, windows-latest CI, macOS) resolves WITHOUT candle/cudarc/nvcc,
# exactly as sceneworks-worker keeps it out of its default set. Linking does NOT
# enable candle at runtime — that is the `backend_candle_enabled` setting (sc-5561).
# See crates/sceneworks-worker/Cargo.toml's `backend-candle` for the providers it
# pulls. (sc-5559)
backend-candle = ["sceneworks-worker/backend-candle"]
# CPU aesthetic fixture only; no backend activation, and the test is also ignored.
aesthetic-inference-proof = []
# Manual bounded product acceptance only; never enabled by ordinary builds.
model-inference-proof = ["backend-candle", "sceneworks-worker/model-inference-proof"]

[dev-dependencies]
# CPU-native dataset/train/save/API/library/generation witness, never a runtime feature.
sceneworks-worker = { path = "../../crates/sceneworks-worker", features = ["test-support"] }
sceneworks-core = { path = "../../crates/sceneworks-core", features = ["test-support"] }
# Advance only a fixture runtime clock at verified job boundaries in cancellation tests.
tokio = { workspace = true, features = ["test-util"], default-features = true }
# Construct SQLite BUSY errors directly in the API error-contract test without
# adding rusqlite to the production API dependency surface.
rusqlite = { workspace = true }
parquet = { workspace = true }
# Real MCP streamable-HTTP client for the /mcp round-trip test (sc-10233); same
# pinned version as crates/sceneworks-mcp — client features are additive.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
[lints]
workspace = true
