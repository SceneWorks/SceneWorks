<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="teal">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px; }
  .row { display: flex; gap: 16px; align-items: stretch; }
  .panel { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 20px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-lg); }
  .marks { display: flex; align-items: center; gap: 22px; }
  .cap { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Logo, Wordmark } = window.SceneWorksDesignSystem_b6febf;
function Panel({ theme, accent }) {
  return (
    <div className="panel" data-theme={theme} data-accent={accent}>
      <span className="cap">{theme}{accent ? " · " + accent : ""}</span>
      <div className="marks">
        <Logo size={52} />
        <Wordmark size={34} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(
  <div className="row">
    <Panel theme="light" accent="teal" />
    <Panel theme="dark" accent="teal" />
    <Panel theme="dark" accent="violet" />
  </div>
);
</script>
</body>
</html>
