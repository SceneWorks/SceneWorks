<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="teal">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="./styles.css" />
<style>
  html, body { margin: 0; height: 100%; }
  .tile { display: grid; grid-template-columns: 1fr 150px; width: 1280px; height: 854px; }
  .main { background: var(--teal); display: grid; place-items: center; }
  .mark { width: 360px; height: 360px; background: var(--paper); border-radius: 68px; display: grid; place-items: center; box-shadow: 0 30px 80px rgba(15,23,42,0.28); }
  .mark img { width: 300px; height: 300px; display: block; }
  .strip { display: grid; grid-template-rows: repeat(4, 1fr); }
  .strip > div { width: 100%; height: 100%; }
</style></head>
<body>
<div class="tile">
  <div class="main"><div class="mark"><img src="./assets/logo.svg" alt="SceneWorks" /></div></div>
  <div class="strip">
    <div style="background:oklch(0.72 0.13 80)"></div>
    <div style="background:oklch(0.64 0.16 28)"></div>
    <div style="background:oklch(0.55 0.16 274)"></div>
    <div style="background:#0f1622"></div>
  </div>
</div>
</body></html>
