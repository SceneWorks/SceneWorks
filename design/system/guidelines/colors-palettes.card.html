<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="teal">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--bg); font-family: var(--font-ui); }
  .row { display: flex; gap: 14px; }
  .item { display: grid; gap: 6px; justify-items: center; }
  .dot { width: 44px; height: 44px; border-radius: var(--r-md); border: 1px solid var(--border); }
  .lbl { font-size: 11px; font-weight: 600; color: var(--text); }
</style></head>
<body>
<div class="row">
  <div class="item"><div class="dot" style="background:oklch(0.60 0.13 178)"></div><div class="lbl">Teal</div></div>
  <div class="item"><div class="dot" style="background:oklch(0.55 0.16 274)"></div><div class="lbl">Indigo</div></div>
  <div class="item"><div class="dot" style="background:oklch(0.55 0.16 252)"></div><div class="lbl">Cobalt</div></div>
  <div class="item"><div class="dot" style="background:oklch(0.55 0.18 305)"></div><div class="lbl">Violet</div></div>
  <div class="item"><div class="dot" style="background:oklch(0.64 0.16 28)"></div><div class="lbl">Coral</div></div>
  <div class="item"><div class="dot" style="background:oklch(0.72 0.13 80)"></div><div class="lbl">Amber</div></div>
  <div class="item"><div class="dot" style="background:oklch(0.58 0.14 152)"></div><div class="lbl">Emerald</div></div>
</div>
</body></html>
