<!-- @dsCard group="Brand" viewport="700x260" name="Work Panel (signature card)" subtitle="Accent top-rule · one elevated card per page" -->
<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="teal">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg); }
</style></head>
<body>
<div class="work-panel">
  <div class="work-panel-rule"></div>
  <div class="work-panel-head">
    <div class="work-panel-head-text">
      <p class="eyebrow work-panel-eyebrow">Text to image</p>
      <div class="section-heading"><h2>Image Studio</h2></div>
      <p class="work-panel-hint">Describe a scene, pick a model, render variations side by side.</p>
    </div>
    <div class="work-panel-actions">
      <button class="secondary-action">Presets</button>
      <button class="primary-action">Generate</button>
    </div>
  </div>
  <div class="stat-strip">
    <div class="stat-chip"><span class="stat-chip-label">Model</span><span class="stat-chip-value">Z-Image-Turbo</span></div>
    <div class="stat-chip"><span class="stat-chip-label">Aspect</span><span class="stat-chip-value">1:1</span></div>
    <div class="stat-chip"><span class="stat-chip-label">Variations</span><span class="stat-chip-value">4</span></div>
    <div class="stat-chip"><span class="stat-chip-label">Quality</span><span class="stat-chip-value">Q8</span></div>
  </div>
</div>
</body></html>
