<!-- @dsCard group="Type" viewport="700x180" name="Plus Jakarta Sans (UI)" subtitle="--font-ui · 400/500/600/700 · ss01, cv11" -->
<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="teal">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg); font-family: var(--font-ui); font-feature-settings: "ss01","cv11"; color: var(--text); }
  .big { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .row { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 14px; }
  .w { display: grid; gap: 2px; }
  .w b { font-size: 22px; }
  .w span { font-size: 10.5px; font-family: var(--font-mono); color: var(--text-muted); }
</style></head>
<body>
<p class="big">Local AI generation, on your machine.</p>
<div class="row">
  <div class="w"><b style="font-weight:400">Regular</b><span>400</span></div>
  <div class="w"><b style="font-weight:500">Medium</b><span>500</span></div>
  <div class="w"><b style="font-weight:600">Semibold</b><span>600</span></div>
  <div class="w"><b style="font-weight:700">Bold</b><span>700</span></div>
</div>
</body></html>
